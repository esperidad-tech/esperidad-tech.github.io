<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Salles sans combat</title>
<style>
:root{--fond:#0b0810;--texte:#fff4e0;--or:#ffe3a3;--bouton:#2a2036;--bord:#4a3a2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 4px}
h1{font:600 22px Georgia,serif;color:var(--or);margin:0 0 4px}
header p{margin:0;font-size:13px;opacity:.75;line-height:1.4}
#ips{position:fixed;right:10px;top:10px;z-index:100;background:rgba(0,0,0,.75);border:2px solid #5a4630;border-radius:10px;padding:6px 10px;font:700 15px ui-monospace,monospace;color:#9effa0;min-width:92px;text-align:center}
#ips.lent{color:#ff8a7a}
section{padding:14px 16px 10px}
section h2{font:600 18px Georgia,serif;color:var(--or);margin:0 0 2px}
section .q{font-size:12.5px;opacity:.7;margin:0 0 8px}
.cadre{position:relative;width:100%;max-width:960px;overflow:hidden;border-radius:10px;box-shadow:0 0 0 2px #2a2030}
.scene{position:absolute;left:0;top:0;width:960px;height:372px;transform-origin:0 0;overflow:hidden;background:#000}
.scene>img.fond{position:absolute;left:0;top:0;width:960px;height:372px;display:block}
.scene>img.heros{position:absolute;top:64px;width:280px;height:320px;pointer-events:none;z-index:2}
.sac{position:absolute;left:18px;top:14px;width:52px;height:52px;border-radius:14px;background:rgba(20,14,28,.8);border:2px solid #8a6a3a;display:grid;place-items:center;font-size:28px;z-index:40;pointer-events:none}
.boutons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.boutons button{min-height:44px;padding:6px 12px;border-radius:12px;border:2px solid var(--bord);background:var(--bouton);color:var(--texte);font:600 14px system-ui,sans-serif;cursor:pointer}
.boutons button.go{background:#ffd23f;color:#1a1208;border-color:#8a6a1a}
.boutons button:active{transform:translateY(1px)}
.mot{position:absolute;z-index:60;left:50%;top:18px;transform:translateX(-50%);background:rgba(243,231,203,.95);color:#35281b;border:3px solid #24182e;border-radius:14px;padding:6px 14px;font:700 15px system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s}
.mot.vu{opacity:1}
body.une section{display:none}
body.une section.vue{display:block}
</style>
</head>
<body>
<div id="ips">— ips</div>
<header>
  <h1>Les salles sans combat</h1>
  <p>Les fonds sont des images toutes faites (png/) ; les objets, Moustache, Léo, le feu et les détails sont posés par-dessus (objets.js). Touchez ce qui brille. Les boutons jaunes lancent la scène entière.</p>
</header>
<div id="salles"></div>
<script src="scenes.js"></script>
<script src="objets.js"></script>
<script>
(function(){
'use strict';
var PARAMS = new URLSearchParams(location.search);
var HER = {sage: 0, alchimiste: 138, pisteur: 276};
var SAC = {x: 44, y: 40};
var DEMO = window.DEMO = {salles: {}};

function el(tag, cls, parent, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; if(parent) parent.appendChild(e); return e; }
function mot(scene, t){ var m = scene.querySelector('.mot'); m.textContent = t; m.classList.add('vu'); clearTimeout(m._t); m._t = setTimeout(function(){ m.classList.remove('vu'); }, 1800); }

/* une salle : le fond, les héros, ses éléments ; et ce que chaque toucher fait */
function construire(id){
  var D = DEMO.salles[id], s = SCENES.salle(id), sc = D.scene;
  sc.innerHTML = '';
  var f = el('img', 'fond', sc); f.src = s.png; f.alt = '';
  Object.keys(HER).forEach(function(h){ var i = el('img', 'heros', sc); i.src = '../essai/img/heros-' + h + '.png'; i.alt = ''; i.style.left = (HER[h] - 40) + 'px'; i.onerror = function(){ i.remove(); }; });
  el('div', 'sac', sc, '🎒');
  el('div', 'mot', sc);
  D.o = OBJETS.poser(sc, s);
  D.salle = s;
  var o = D.o;
  Object.keys(o).forEach(function(k){
    var x = o[k], d = x.def;
    if(d.type === 'objet') x.surToucher(function(){ prendre(sc, x); });
    if(d.type === 'choix'){
      if(x.zone) x.surToucher(function(){ x.ouvrir().then(function(){ x.guider(true); }); });
      x.options.forEach(function(op, i){ op.surToucher(function(){ x.choisir(i, SAC, {onArrivee: function(){ mot(sc, op.def.nom + ' → ' + (op.def.pour || 'le sac')); }}); }); });
    }
    if(d.type === 'tas') x.surToucher(function(){ x.fouiller({trouve: D.morsure ? 'morsure' : 'page', onMorsure: function(){ mot(sc, 'Aïe ! Une morsure !'); }}).then(function(t){ D.morsure = !D.morsure; if(t){ t.guider(true); t.surToucher(function(){ prendre(sc, t); }); } }); });
    if(d.type === 'crane') x.surToucher(function(){ if(!x.revele) x.reveler().then(function(){ x.guider(true); mot(sc, 'Un crâne… à l\'encre invisible !'); }); else x.ouvrir().then(function(){ mot(sc, 'Un passage secret !'); }); });
    if(d.type === 'dalle') x.surToucher(function(){ if(d.clair) x.marcher(); else x.pieger({onPiege: function(){ mot(sc, 'Des pointes ! −15 à toute l\'équipe'); }}); });
    if(d.type === 'porte') x.surToucher(function(){ x.ouvrir().then(function(){ mot(sc, d.nom + ' s\'ouvre'); }); });
    if(d.type === 'sarcophage') x.surToucher(function(){ x.ouvrir().then(function(a){ a.guider(true); a.surToucher(function(){ prendre(sc, a); }); }); });
    if(d.type === 'feu') x.surToucher(function(){ x.attiser(); mot(sc, 'On se repose…'); });
    if(d.type === 'chat') x.surToucher(function(){ x.scene(); setTimeout(function(){ mot(sc, '« Moustache ? Mon gros gris, c\'est toi ? »'); }, 2700); });
    if(d.type === 'leo') x.surToucher(function(){ D.peur = !D.peur; (D.peur ? x.lever() : x.recroqueviller()); });
  });
  return o;
}
function prendre(sc, x){ return x.prendre(SAC, {onArrivee: function(){ mot(sc, x.def.nom + (x.def.pour ? ' → ' + x.def.pour : ' → le sac') + (x.def.code ? ' (code)' : '')); }}); }

/* les boutons de chaque salle (le premier, jaune, lance la scène entière) */
var ACTIONS = {
  puits: [['Guider vers l\'est', function(D){ mot(D.scene, 'Trois couloirs : ouest, nord, est'); }]],
  galerie: [['Prendre la bourse', function(D){ return prendre(D.scene, D.o.bourse); }], ['Guider', function(D){ D.o.bourse.guider(true); }]],
  aeration: [['Prendre les deux', function(D){ return prendre(D.scene, D.o.herbes).then(function(){ return prendre(D.scene, D.o.sacoche); }); }], ['Guider', function(D){ D.o.herbes.guider(true); D.o.sacoche.guider(true); }]],
  reserve: [['Ouvrir, puis les flèches d\'argent', function(D){ return D.o.coffre.ouvrir().then(function(){ return D.o.coffre.choisir(0, SAC); }); }], ['Ouvrir, puis les flèches lourdes', function(D){ return D.o.coffre.ouvrir().then(function(){ return D.o.coffre.choisir(1, SAC); }); }], ['Guider', function(D){ D.o.coffre.guider(true); }]],
  givre: [['Prendre la fleur', function(D){ return prendre(D.scene, D.o['fleur-givre']); }], ['Guider', function(D){ D.o['fleur-givre'].guider(true); }]],
  bibliotheque: [['Les pages, puis le cristal', function(D){ return prendre(D.scene, D.o['page-dechiree']).then(function(){ return prendre(D.scene, D.o['page-blanche']); }).then(function(){ return D.o.lutrin.choisir(0, SAC); }); }], ['Le bâton de chêne', function(D){ return D.o.lutrin.choisir(1, SAC); }], ['Guider', function(D){ D.o.lutrin.guider(true); }]],
  eboulis: [['Fouiller, révéler, ouvrir', function(D){ var t = D.o['tas-os']; return t.fouiller({trouve: 'page'}).then(function(p){ return p ? prendre(D.scene, p) : null; }).then(function(){ return D.o.crane.reveler(); }).then(function(){ return D.o.crane.ouvrir(); }); }],
    ['Fouiller (morsure)', function(D){ return D.o['tas-os'].fouiller({trouve: 'morsure', onMorsure: function(){ mot(D.scene, 'Aïe !'); }}); }], ['Révéler le crâne', function(D){ return D.o.crane.reveler(); }], ['Ouvrir le passage', function(D){ return D.o.crane.ouvrir(); }]],
  dalles: [['Traverser (clair, clair…)', function(D){ var l = [], p = Promise.resolve(); for(var c = 6; c < 12; c++){ var r = (c % 2 === 0) ? 0 : 1; l.push(D.o['dalle-' + c + '-' + r]); }
      l.forEach(function(x){ p = p.then(function(){ return x.marcher(); }).then(function(){ return new Promise(function(ok){ setTimeout(ok, 120); }); }); }); return p; }],
    ['Une dalle sombre !', function(D){ return D.o['dalle-7-0'].pieger({onPiege: function(){ mot(D.scene, '−15 à toute l\'équipe'); }}); }], ['Une autre', function(D){ return D.o['dalle-10-1'].pieger(); }], ['Guider', function(D){ D.o['dalle-6-0'].guider(true); }]],
  portes: [['Ouvrir l\'œil', function(D){ return D.o['porte-oeil'].ouvrir(); }], ['La gueule', function(D){ return D.o['porte-gueule'].ouvrir(); }], ['La lune', function(D){ return D.o['porte-lune'].ouvrir(); }], ['Guider', function(D){ ['oeil', 'gueule', 'lune'].forEach(function(k){ D.o['porte-' + k].guider(true); }); }]],
  'crypte-sarco': [['Ouvrir, prendre l\'amulette', function(D){ return D.o.sarcophage.ouvrir().then(function(a){ return prendre(D.scene, a); }); }], ['Guider', function(D){ D.o.sarcophage.guider(true); }]],
  camp: [['Attiser le feu', function(D){ return D.o.feu.attiser(); }]],
  porte4: [['La scène (gratte, se retourne, miaule)', function(D){ setTimeout(function(){ mot(D.scene, '« Moustache ? Mon gros gris, c\'est toi ? »'); }, 2700); return D.o.moustache.scene(); }], ['Gratter', function(D){ return D.o.moustache.gratter(4); }], ['Se retourner', function(D){ return D.o.moustache.seRetourner(); }], ['Miauler', function(D){ return D.o.moustache.miauler(); }], ['Revenir', function(D){ return D.o.moustache.revenir(); }]],
  leo: [['Il lève sa lanterne', function(D){ return D.o.leo.lever(); }], ['Il se recroqueville', function(D){ return D.o.leo.recroqueviller(); }], ['Recroquevillé (reste)', function(D){ return D.o.leo.recroqueviller({rester: true}); }], ['Il se redresse', function(D){ return D.o.leo.redresser(); }], ['Guider', function(D){ D.o.leo.guider(true); }]]
};
DEMO.action = function(id, n){ var D = DEMO.salles[id], a = ACTIONS[id][n || 0]; return Promise.resolve(a[1](D)); };
DEMO.refaire = function(id){ var D = DEMO.salles[id]; Object.keys(D.o).forEach(function(k){ D.o[k].detruire(); }); construire(id); };

var racine = document.getElementById('salles');
SCENES.ordre.forEach(function(id){
  var s = SCENES.salle(id);
  var sec = el('section', '', racine); sec.id = 's-' + id;
  el('h2', '', sec, s.nom);
  el('p', 'q', sec, s.ambiance);
  var cadre = el('div', 'cadre', sec), sc = el('div', 'scene', cadre);
  var D = DEMO.salles[id] = {scene: sc, cadre: cadre, sec: sec};
  construire(id);
  var b = el('div', 'boutons', sec);
  (ACTIONS[id] || []).forEach(function(a, i){ var bt = el('button', i === 0 ? 'go' : '', b, a[0]); bt.onclick = function(){ a[1](D); }; });
  var r = el('button', '', b, '↺ Recommencer'); r.onclick = function(){ DEMO.refaire(id); };
});
/* la scène s'adapte à la largeur (960 × 372, réduite si l'écran est plus étroit) */
function ajuster(){ [].forEach.call(document.querySelectorAll('.cadre'), function(c){ var k = Math.min(1, c.clientWidth / 960); c.style.height = (372 * k) + 'px'; c.firstChild.style.transform = 'scale(' + k + ')'; }); }
addEventListener('resize', ajuster); ajuster();
/* une salle cachée ne coûte rien : ses animations s'arrêtent */
if('IntersectionObserver' in window){
  var io = new IntersectionObserver(function(l){ l.forEach(function(e){ OBJETS.pause(e.target.querySelector('.scene'), !e.isIntersecting); }); }, {rootMargin: '40px'});
  [].forEach.call(document.querySelectorAll('.cadre'), function(c){ io.observe(c); });
}
/* ?salle=<id> : une seule salle (pour mesurer) */
DEMO.montrer = function(id){
  document.body.classList.add('une');
  SCENES.ordre.forEach(function(k){ var D = DEMO.salles[k], vu = k === id; D.sec.classList.toggle('vue', vu); OBJETS.pause(D.scene, !vu); });
  ajuster(); scrollTo(0, 0);
};
if(PARAMS.get('salle')) DEMO.montrer(PARAMS.get('salle'));
/* le compteur d'images par seconde */
var ips = document.getElementById('ips'), n = 0, t0 = performance.now();
(function tic(t){ n++; if(t - t0 >= 1000){ var v = Math.round(n * 1000 / (t - t0)); ips.textContent = v + ' ips'; ips.classList.toggle('lent', v < 50); n = 0; t0 = t; } requestAnimationFrame(tic); })(t0);
})();
</script>
</body>
</html>
