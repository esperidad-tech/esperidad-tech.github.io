<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petite araignée animée</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#06040a;color:#e8dcc0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #cadre{width:960px;margin:0 auto}
  #scene{position:relative;width:960px;height:540px;overflow:hidden;
    background:
      radial-gradient(ellipse 50% 60% at 70% 30%, rgba(90,76,130,.5), rgba(0,0,0,0) 70%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 3px, rgba(0,0,0,0) 3px 34px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 3px, rgba(0,0,0,0) 3px 64px),
      linear-gradient(#2a2238, #120e1a 70%);}
  #sol{position:absolute;left:0;right:0;top:340px;bottom:0;background:linear-gradient(#1c1628,#0c0912 40%);border-top:3px solid #2c2440}
  #lumiere{position:absolute;left:600px;top:0;width:260px;height:340px;background:linear-gradient(rgba(207,232,255,.14),rgba(207,232,255,0));clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);pointer-events:none}
  .heros{position:absolute;top:220px;width:70px;height:120px;border-radius:30px 30px 8px 8px;background:linear-gradient(#3a5a7a,#1a2a3a);opacity:.55}
  .heros span{position:absolute;left:0;right:0;top:48px;text-align:center;font-size:12px;color:#bcd}
  #bete{position:absolute;z-index:2}
  #etiquette{position:absolute;left:0;right:0;top:400px;text-align:center;font-size:28px;font-weight:700;letter-spacing:.03em;color:#ffe3a3;text-shadow:0 3px 0 #24182e,0 0 18px rgba(255,190,90,.35);z-index:10;pointer-events:none}
  #etiquette small{display:block;font-size:16px;font-weight:500;color:#bfa77a;letter-spacing:.06em;margin-top:6px}
  #boutons{padding:10px 0 30px}
  #boutons h3{margin:12px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#bfa77a}
  #boutons div{display:flex;flex-wrap:wrap;gap:6px}
  #boutons button{background:#2a2238;color:#f3e7cb;border:1px solid #4e3f66;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
  #boutons button:hover{background:#3a3050}
  #boutons button.go{background:#ffd23a;color:#111;border-color:#ffd23a;font-weight:700}
  #boutons button.on{background:#5a4a20;border-color:#ffd23a}
  .film #boutons{display:none}
  #ips{position:absolute;right:8px;top:6px;z-index:20;font:600 12px/1 ui-monospace,monospace;color:#9fe0a0;background:rgba(0,0,0,.45);padding:4px 7px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<div id="cadre">
  <div id="scene"><div id="sol"></div><div id="lumiere"></div>
    <div class="heros" style="left:60px"><span>Pisteur</span></div><div class="heros" style="left:170px"><span>Sage</span></div><div class="heros" style="left:280px"><span>Alchimiste</span></div>
    <div id="bete"></div><div id="etiquette"></div><div id="ips">— ips</div></div>
  <div id="boutons"></div>
</div>
<script src="petitearaignee-anime.js"></script>
<script>
var Q = new URLSearchParams(location.search);
if(Q.get('film')) document.body.classList.add('film');
var scene = document.getElementById('scene'), boite = document.getElementById('bete'), r;
var INFO = BETES.petitearaignee.info;
/* la place du milieu des monstres (x 620, 210 px), le sol de la scène à y = 340 */
function placer(){
  var w = INFO.cadre.w, h = INFO.cadre.h;
  boite.style.width = w + 'px'; boite.style.height = h + 'px';
  boite.style.left = (620 + 105 - w / 2) + 'px';
  boite.style.top = (340 - h * INFO.sol) + 'px';
}
function nouveau(){ if(r) r.arreter(); boite.innerHTML = ''; placer(); r = BETES.petitearaignee.creer(boite); window.r = r; return r; }
nouveau();
function etiquette(t, s){ document.getElementById('etiquette').innerHTML = t ? t + (s ? '<small>' + s + '</small>' : '') : ''; }
function secouer(){ scene.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:240}); var h = document.querySelectorAll('.heros')[0]; h.animate([{filter:'brightness(1)'},{filter:'brightness(2.5)'},{filter:'brightness(1)'}],{duration:300}); }
var ETAPES = {
  'entrer': function(){ return r.entrer(); },
  'attendre': function(){ return r.attendre(); },
  'morsure': function(){ return r.attaquer('morsure', {onImpact: secouer}); },
  'entrer en trottinant': function(){ return r.entrer({oeuf: false}); },
  'tousser': function(){ return r.tousser(); },
  'fuir': function(){ return r.fuir(); },
  'exploser': function(){ return r.exploser(scene); },
  'arrêter': function(){ r.arreter(); },
  'nouvelle petite': function(){ nouveau(); },
  'nouvelle + entrer': function(){ nouveau(); return r.entrer(); }
};
['coup', 'fleche', 'fleche-argent', 'fleche-lourde', 'dague', 'feu', 'brulure', 'lumiere', 'louche', 'colle', 'huile', 'nuage', 'givre', 'acide', 'bruit', 'bouclier', 'rebond'].forEach(function(t){
  ETAPES['touche ' + t] = function(){ return r.touche(t); };
});
INFO.etats.forEach(function(e){
  ETAPES[e + ' on'] = function(){ return r.etat(e, true); };
  ETAPES[e + ' off'] = function(){ return r.etat(e, false); };
});
window.CADRAGE = [560, 150, 300, 220];
/* le compteur d'images par seconde (moyenne sur une demi-seconde, et la pire image) */
(function(){ var el = document.getElementById('ips'), n = 0, t0 = performance.now(), dern = t0, pire = 0;
  function f(t){ n++; pire = Math.max(pire, t - dern); dern = t; if(t - t0 >= 500){ el.textContent = Math.round(n * 1000 / (t - t0)) + ' ips · pire ' + Math.round(pire) + ' ms'; n = 0; t0 = t; pire = 0; } requestAnimationFrame(f); }
  requestAnimationFrame(f); })();
/* la mesure ralentie (perf.py) : [nom, étapes mesurées, durée de la mesure en ms, préparation non mesurée] */
window.PERF = [
  ['attente', ['attendre'], 3000],
  ['morsure', ['morsure'], 1200],
  ['sortie de l’œuf', ['entrer'], 2500, ['nouvelle petite']],
  ['huile (sur le dos)', ['touche huile'], 2000],
  ['brûlée', ['brule on'], 2000, ['dos off']],
  ['explosion', ['exploser'], 2500, ['nouvelle + entrer']]
];
window.etape = function(nom){ return Promise.resolve(ETAPES[nom]()); };
window.etiquette = etiquette;
/* le film : [étiquette, sous-titre, étapes, durée de la prise (ms), attendre la fin ?, pose pour la planche (fraction de la prise) ou null] */
window.PLAN = [
  ['entrer', 'elle sort d’un œuf qui se fend, puis éclate', ['entrer'], 2600, true, .34],
  ['attendre', 'elle piétine, claque des crochets, sautille', ['attendre'], 4500, false, .5],
  ['morsure', 'elle bondit et mord', ['morsure'], 1400, true, .4],
  ['flèche', '', ['touche fleche'], 900, true, .12],
  ['louche', '', ['touche louche'], 900, true, .15],
  ['bruit', '', ['touche bruit'], 900, true, null],
  ['rebond', 'immunisée : elle sautille, narquoise', ['touche rebond'], 1300, true, .3],
  ['nuage', 'elle tousse trois fois', ['touche nuage'], 2300, true, .25],
  ['feu', 'les flammes restent', ['touche feu'], 2500, false, .7],
  ['feu : fin', '', ['brule off'], 600, false, null],
  ['lumière', 'éblouie : la patte devant les yeux', ['touche lumiere'], 2500, false, .7],
  ['éblouie : fin', '', ['ebloui off'], 700, false, null],
  ['colle', 'elle se débat', ['touche colle'], 3200, false, .65],
  ['colle : fin', '', ['colle off'], 600, false, null],
  ['huile', 'elle patine et se retourne sur le dos', ['touche huile', 'ouvert on'], 3000, false, .75],
  ['sur le dos : fin', '', ['ouvert off', 'dos off'], 1100, true, null],
  ['givre', 'elle gèle', ['touche givre'], 2200, false, .7],
  ['gel : fin', '', ['gele off'], 1000, false, null],
  ['enragée', '', ['enrage on'], 2200, false, .6],
  ['enragée : fin', '', ['enrage off'], 500, false, null],
  ['fuir', 'demi-tour, elle détale', ['fuir'], 1800, true, .25],
  ['en trottinant', 'l’autre façon d’arriver', ['nouvelle petite', 'entrer en trottinant'], 2000, true, .35],
  ['exploser', 'le coup critique', ['exploser'], 3800, true, .24],
  ['ce qui reste', 'un petit corps recroquevillé', [], 1200, false, .5]
];
window.toutJouer = function(){
  return PLAN.reduce(function(p, e){ return p.then(function(){ etiquette(e[0], e[1]); var f = e[2].reduce(function(q, n){ return q.then(function(){ return etape(n); }); }, Promise.resolve()); return Promise.all([e[4] ? f : null, new Promise(function(ok){ setTimeout(ok, e[3]); })]); }); }, Promise.resolve(nouveau())).then(function(){ etiquette('', ''); });
};
var zone = document.getElementById('boutons');
function groupe(titre, noms){
  var h = document.createElement('h3'); h.textContent = titre; zone.appendChild(h);
  var d = document.createElement('div'); zone.appendChild(d);
  noms.forEach(function(nom){
    var b = document.createElement('button');
    b.textContent = nom.replace(/^touche |^special /, '');
    if(nom === 'entrer' || nom === 'exploser' || nom === 'Tout jouer') b.className = 'go';
    b.onclick = function(){ if(nom === 'Tout jouer') return toutJouer(); etape(nom); };
    d.appendChild(b);
  });
}
groupe('Actions', ['Tout jouer', 'entrer', 'entrer en trottinant', 'attendre', 'morsure', 'tousser', 'fuir', 'exploser', 'arrêter', 'nouvelle petite']);
groupe('touche(type)', Object.keys(ETAPES).filter(function(n){ return /^touche /.test(n); }));
groupe('etat(nom, on / off)', Object.keys(ETAPES).filter(function(n){ return / (on|off)$/.test(n); }));
</script>
</body>
</html>
