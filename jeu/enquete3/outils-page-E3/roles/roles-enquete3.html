<style>

  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:24px 48px}

.titre-chaine{font-family:var(--display); font-weight:700; font-size:1.1rem; margin:4px 0 6px}
.tab-wrap{overflow-x:auto}

th, td{text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.role-intro{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.role-intro p{margin:0}
@media (prefers-reduced-motion: reduce){ .fleche{transition:none} }

<script>
const ROLES = {pisteur:'Pisteur', alchimiste:'Alchimiste', sage:'Sage', barde:'Barde', tous:'Tout le monde'};
const MOMENTS = {matin:'Le matin', aprem:'L\'après-midi', nuit:'La nuit'};
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const role = (r) => `<span class="chip r-${r}">${ROLES[r]}</span>`;
const fleche = `<span class="fleche" aria-hidden="true">›</span>`;

/* ---------- Les actions des trois rôles ----------
   besoin : les codes qu'il faut avoir (de qui) ; donne : les codes donnés (pour qui) ; ecran : ce que voit le joueur. */
const ACTIONS = [
 /* ===== LE PISTEUR ===== */
 {role:'pisteur', moment:'matin', titre:'Les banderoles de la fête', lieu:'La place', mj:'Tir à l\'arc, décor de fête',
  fait:'À chaque tir, une banderole de petits drapeaux part avec la flèche. Il vise les cibles en haut du mât et des lampadaires.',
  ecran:'Bravo ! Les banderoles flottent au-dessus de la place. Basile, du haut de son échelle : « Ça, c\'est de la décoration ! »',
  donne:[{code:'Mission de fête (1 sur 2)', pour:['tous'], note:'rendue au maire l\'après-midi'}]},
 {role:'pisteur', moment:'matin', titre:'L\'oie du festin', lieu:'Chez Gaspard, puis les rues', mj:'Course-poursuite en ville (une oie vue de dos)',
  fait:'L\'oie de Gaspard s\'est échappée. Même mini-jeu que dans la forêt, mais dans les rues du village.',
  ecran:'COUAC ! Tu sautes les tonneaux, tu passes sous les lampions… et tu la rattrapes. Gaspard : « Sans elle, pas de festin ! Merci ! »',
  donne:[{code:'Mission de fête (2 sur 2)', pour:['tous'], note:'rendue au maire l\'après-midi'}]},
 {role:'pisteur', moment:'matin', titre:'Un coup d\'œil au clocher', lieu:'Le clocher', propose:true,
  besoin:[{code:'Le capuchon vers le clocher', de:'barde', note:'Tim, démasqué'}],
  fait:'Facultatif. Il va voir là où le capuchon est parti. Rien à transmettre : ça prépare l\'après-midi.',
  ecran:'Sous le clocher, la porte de la crypte est fermée à clé. Sur la grille, des runes, comme sur la porte du Vieux Chêne. Et tout au fond… un miaulement.'},
 {role:'pisteur', moment:'aprem', titre:'La lettre, en se cachant', lieu:'La mairie', mj:'Se cacher',
  fait:'Seulement si le Barde rate le grand dialogue du maire. Les deux chemins donnent le même code, qui ne compte qu\'une fois.',
  ecran:'Tu te glisses derrière le grand rideau. Le maire ouvre son coffre, compte ses papiers un par un… puis il sort. La lettre est là, sur le dessus.',
  donne:[{code:'La lettre d\'Odette', pour:['sage', 'alchimiste']}]},
 {role:'pisteur', moment:'aprem', titre:'Les traces de Moustache', lieu:'Chez Odette, puis tout le village', mj:'Suivre la piste, version traces de chats',
  besoin:[{code:'Les traces de Moustache', de:'barde', note:'Moustache file de chez Odette'}, {code:'Moustache a six doigts', de:'sage', note:'sans ce code, la piste est bien plus dure : toutes les traces se ressemblent'}],
  fait:'Des traces de chats partout, les sept chats d\'Odette traînent dans tout le village. Seules les traces à six doigts sont celles de Moustache.',
  ecran:'Les traces à six doigts font des allers-retours. Une partie file vers le clocher et s\'arrête sous la porte de la crypte, fermée à clé. L\'autre part dans la forêt, jusqu\'au vieux puits : Moustache s\'est glissé entre les barreaux rouillés.',
  donne:[{code:'La crypte est fermée', pour:['barde'], note:'il faut la clé d\'Anselme'}, {code:'La grille du puits', pour:['alchimiste', 'sage'], note:'une potion pour la rouille, et les archives des souterrains'}]},
 {role:'pisteur', moment:'aprem', titre:'Rendre sa mission', lieu:'La mairie',
  fait:'Les banderoles et l\'oie. Le maire le récompense en or.',
  ecran:'Le maire : « Des banderoles, une oie… Parfait ! Et ce soir, tout le monde sur la place jusqu\'à minuit, hein ! »'},
 {role:'pisteur', moment:'nuit', titre:'Recevoir le sac de l\'Alchimiste', lieu:'Pendant le grand dialogue d\'Anselme',
  besoin:[{code:'Le sac (6 symboles)', de:'alchimiste'}],
  fait:'Pendant que le Barde parle à Anselme, il ouvre l\'écran « Descendre » : le jeu demande le code du sac, ou « Descendre sans potions ». L\'écran montre ensuite le sac reçu, et l\'Alchimiste vérifie que c\'est le bon. Comme ça, personne n\'attend : le donjon commence dès que le chemin s\'ouvre.',
  ecran:'Tu reçois : 2 💡, 1 ❤️, 2 💨, 1 👻. C\'est bien ça ?'},
 {role:'pisteur', moment:'nuit', titre:'La clé d\'Anselme', lieu:'Le clocher · chemin court', mj:'Se cacher',
  besoin:[{code:'La clé est au clou', de:'barde', note:'si le Barde a réussi le grand dialogue d\'Anselme'}],
  fait:'Pendant que le Barde et Anselme sonnent l\'ouverture de la fête, il décroche la clé sans être vu.',
  ecran:'DONG ! DONG ! Tu te faufiles derrière les grosses cordes. Anselme a les yeux fermés, il compte les coups. La clé est là, au clou… Tu la décroches.',

 {role:'pisteur', moment:'nuit', titre:'La grille du puits', lieu:'Le vieux puits · chemin long',

  fait:'Si le Barde a raté Anselme, ou si l\'équipe préfère ce chemin.',
  ecran:'Tu verses la potion verte. Pssshhh ! Les barreaux fondent comme du sucre. Une vieille échelle descend dans le noir.',
  donne:[{code:'Le puits s\'ouvre', pour:['pisteur'], note:'donjon long, 6 salles, en labyrinthe'}]},
 {role:'pisteur', moment:'nuit', titre:'Le donjon', lieu:'Sous le clocher', mj:'Le donjon (nouveau, façon Darkest Dungeon)', propose:true,
  fait:'Tout se joue sur sa tablette, avec les trois héros en file : Pisteur, Alchimiste, Sage. Chacun touche l\'écran à son tour. Lui : la dague, la flèche (touche l\'ennemi du fond), « inspecter » pour voir un piège. Aux embranchements, c\'est le Sage qui connaît le chemin.',
  ecran:'La torche crépite. Trois portes. Derrière l\'une d\'elles, quelque chose gratte… « Sage, on prend laquelle ? »',
  note:'Le court dure 8 à 10 minutes, le long environ 15. Personne ne meurt : un héros tombé est « sonné ». Si les trois le sont, ils remontent à l\'entrée et recommencent. La fiche complète du donjon reste à écrire.'},
 {role:'pisteur', moment:'nuit', titre:'La porte aux quatre signes', lieu:'L\'avant-dernière salle du donjon',
  fait:'Moustache est là. Une voix répond derrière la porte, mais la porte ne s\'ouvre pas.',
  ecran:'Une immense porte de pierre, avec quatre signes gravés. Moustache gratte le bas de la porte et miaule. Derrière, une voix étouffée : « Moustache ? Mon gros gris, c\'est toi ? »',
  donne:[{code:'Odette est derrière la porte', pour:['sage'], note:'pour OÙ est Odette, à l\'accusation'}]},
 {role:'pisteur', moment:'nuit', titre:'Léo !', lieu:'La dernière salle du donjon',
  fait:'Pas de poursuite : Léo est coincé. L\'équipe le remonte dans la crypte (de l\'intérieur, la porte s\'ouvre sans clé), et son grand dialogue commence tout de suite, chez le Barde.',
  ecran:'Une lanterne toute blanche de farine. Léo, un panier au bras, lâche tout et se colle au mur : « Laissez-moi partir ! »',
  donne:[{code:'Léo attrapé', pour:['barde'], note:'ouvre le grand dialogue de Léo'}]},

 /* ===== L'ALCHIMISTE ===== */
 {role:'alchimiste', moment:'matin', titre:'Le gâteau de la fête', lieu:'La boulangerie de Gaspard', mj:'Assembler selon une commande (nouveau moteur)',
  fait:'La fiche de Gaspard : sept étages, un pour chaque chat d\'Odette. Il faut choisir et empiler les bons étages et les bonnes décorations. La note est en étoiles.',
  ecran:'Gaspard : « Sept étages ! Et les sept chats en pâte d\'amande ! Le maire va être ravi. »',
  donne:[{code:'Mission de fête', pour:['tous'], note:'rendue au maire l\'après-midi'}]},
 {role:'alchimiste', moment:'matin', titre:'Les cueillettes pour la nuit', lieu:'La forêt, le lavoir, les jardins', propose:true,
  fait:'Elle sait où trouver ses ingrédients. Certains ne se cueillent que le matin, d\'autres que l\'après-midi. Plus elle cueille, plus elle pourra préparer de potions pour le donjon.',
  ecran:'La rosée sur les pensées sauvages, la menthe au soleil, l\'eau claire du lavoir… Ton panier se remplit.',
  note:'Les ingrédients exacts seront fixés avec la fiche du donjon.'},
 {role:'alchimiste', moment:'aprem', titre:'L\'odeur de la lettre', lieu:'L\'atelier', mj:'Les bulles magiques',
  besoin:[{code:'La lettre d\'Odette', de:'barde', note:'ou du Pisteur'}],
  fait:'Une fausse piste : ça ne prouve rien tout seul.',
  ecran:'De la lavande ! Toute la lettre sent la lavande… Mais Iris dit que tout le village a ses sachets dans les tiroirs.'},
 {role:'alchimiste', moment:'aprem', titre:'Qui a écrit la lettre ?', lieu:'L\'atelier', mj:'Les ressemblances (variante des 7 différences)',
  besoin:[{code:'La lettre d\'Odette', de:'barde'}, {code:'Le carnet d\'Odette', de:'barde'}, {code:'Les écritures du village', de:'sage', note:'le Livre d\'or de la fête'}],

  donne:[{code:'L\'écriture de Mélusine', pour:['barde', 'sage'], note:'chez Mélusine, le Barde peut lui dire « C\'est votre écriture »'}]},
 {role:'alchimiste', moment:'aprem', titre:'La potion qui ronge la rouille', lieu:'L\'atelier', mj:'Le chaudron',
  besoin:[{code:'La grille du puits', de:'pisteur'}, {code:'La recette qui ronge la rouille', de:'sage', propose:true}],
  fait:'Pour le chemin du puits. À préparer l\'après-midi, sans savoir encore si on en aura besoin.',
  ecran:'Une potion verte qui fait des bulles et sent le vinaigre. Une goutte sur un vieux clou : il fond en un instant.',
  donne:[{code:'La potion qui ronge la rouille', pour:['pisteur'], note:'à donner la nuit, au puits'}]},
 {role:'alchimiste', moment:'aprem', titre:'Les potions du donjon', lieu:'L\'atelier', mj:'Le chaudron',
  fait:'Lumière, Élixir du Cœur vaillant, fumigène, poudre éclairante, rapidité, invisibilité. Tout ce qu\'elle prépare pourra entrer dans son sac, cette nuit. Plus elle en prépare, plus le donjon sera facile.',
  ecran:'Les fioles s\'alignent sur l\'étagère. Mimi les renifle une par une… et éternue sur la poudre éclairante.'},
 {role:'alchimiste', moment:'aprem', titre:'Rendre le gâteau', lieu:'La mairie',
  fait:'Le maire le récompense en or, selon les étoiles.',
  ecran:'Le maire : « Un gâteau à sept étages ! On le coupera à minuit pile. Pas une minute avant ! »'},
 {role:'alchimiste', moment:'nuit', titre:'Composer le sac', lieu:'Pendant le grand dialogue d\'Anselme',
  fait:'Elle choisit dans ses potions ce qu\'elle emporte : jusqu\'à 19 potions, de 8 sortes au plus. Son écran affiche un code de 6 symboles.',
  ecran:'Ton sac : 2 lumières, 1 Cœur vaillant, 2 rapidités, 1 invisibilité. Code du sac : 🌙 🔑 🐟 · 🔔 ❤️ 🐱',
  donne:[{code:'Le sac (6 symboles)', pour:['pisteur'], note:'tapé pendant le grand dialogue d\'Anselme, puis vérifié'}]},
 {role:'alchimiste', moment:'nuit', titre:'Dans le donjon', lieu:'Sur la tablette du Pisteur', mj:'Le donjon',
  fait:'Quand c\'est son tour, elle touche l\'écran du Pisteur. Ses actions : lancer une fiole, soigner (relève un héros sonné), fumigène (l\'ennemi rate son coup), rallumer la torche. Les potions sont celles de son sac.',
  ecran:'« À toi, Alchimiste ! » Un rat géant montre les dents. Tu sors ta poudre éclairante…'},

/* Les codes du Barde, pour que les schémas soient complets (le détail est dans la page du Barde). */

 {moment:'matin', code:'Le capuchon vers le clocher', pour:['pisteur', 'sage'], note:'Tim, démasqué'},

 {moment:'aprem', code:'Les traces de Moustache', pour:['pisteur'], note:'chez Odette'},
 {moment:'aprem', code:'L\'aveu de Mélusine', pour:['sage']},
 {moment:'nuit', code:'La clé est au clou', pour:['pisteur'], note:'le grand dialogue d\'Anselme'},

/* ---------- Les schémas ---------- */
const boite = (qui, t, cle) => `<li><div class="boite${cle ? ' cle' : ''}"><span class="qui">${qui.map(role).join('')}</span><p>${esc(t)}</p></div></li>`;

const chaine = (etapes) => `<ol class="chaine">${etapes.map(e => boite(e[0], e[1], e[2])).join('')}</ol>`;

function echanges(moment){
  const lignes = [];
  BARDE.filter(b => b.moment === moment).forEach(b => lignes.push({de:'barde', code:b.code, pour:b.pour, note:b.note}));
  ACTIONS.filter(a => a.moment === moment && a.donne).forEach(a => a.donne.filter(d => !d.pour.includes('tous') || d.code.startsWith('Le code')).forEach(d => {
    if(d.pour.length === 1 && d.pour[0] === a.role) return;
    lignes.push({de:a.role, code:d.code, pour:d.pour, note:d.note});
  }));
  return `<ul class="echanges">${lignes.map(l => `<li><span class="de">${role(l.de)}</span><span class="code">${esc(l.code)}</span><span class="vers">→ ${l.pour.map(role).join('')}${l.note ? ' · ' + esc(l.note) : ''}</span></li>`).join('')}</ul>`;
}
function tiroir(nom, lieu, corps, ouvert){
  return `<details class="perso"${ouvert ? ' open' : ''}><summary><span class="nom">${nom}</span>${fleche}<span class="lieu">${lieu}</span></summary><div class="corps">${corps}</div></details>`;
}
const RESUME = {matin:'Les jeux de la fête, et les premiers doutes', aprem:'L\'enquête sur la lettre, et les deux pistes pour la nuit', nuit:'Le clocher ou le puits, le donjon, Léo, et la fin'};

function ensemble(){
  const qui = ['pisteur', 'alchimiste', 'sage'];
  const grille = `<div class="tab-wrap"><table><thead><tr><th>Rôle</th>${Object.values(MOMENTS).map(m => `<th>${m}</th>`).join('')}</tr></thead><tbody>${qui.map(r => `<tr><td>${role(r)}</td>${Object.keys(MOMENTS).map(m => `<td>${ACTIONS.filter(a => a.role === r && a.moment === m).map(a => esc(a.titre)).join('<br>')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const matin = CHAINES.matin.map(c => chaine(c.etapes)).join('') + `<p class="titre-chaine">Les codes du matin</p>` + echanges('matin');
  const aprem = CHAINES.aprem.map(c => `<p class="titre-chaine">${esc(c.titre)}</p>` + chaine(c.etapes)).join('')
    + `<p class="titre-chaine">On prépare les deux chemins de la nuit</p><div class="fourche"><div><h4>Par le clocher</h4>${chaine(CHAINES.fourche.clocher)}</div><div><h4>Par le puits</h4>${chaine(CHAINES.fourche.puits)}</div></div>`
    + `<p class="titre-chaine">Les codes de l'après-midi</p>` + echanges('aprem');
  const N = CHAINES.nuit;
  const nuit = chaine(N.avant) + `<div class="fourche"><div><h4>Par le clocher</h4>${chaine(N.clocher)}</div><div><h4>Par le puits</h4>${chaine(N.puits)}</div></div><p class="reunion">↓ les deux chemins arrivent au même endroit ↓</p>` + chaine(N.apres)
    + `<p class="titre-chaine">Les codes de la nuit</p>` + echanges('nuit');
  return `
  <p class="groupe-intro" style="margin:0">Trois moments. Le matin, on s'amuse avec la fête. L'après-midi, on enquête et la tension monte. La nuit, c'est l'aventure : tout va se jouer à minuit, quand la Grosse Marie sonnera.</p>
  <div class="liste">
   ${tiroir('Qui fait quoi', 'Les actions des trois rôles, moment par moment', grille, true)}
   ${tiroir('Le matin', RESUME.matin, matin)}
   ${tiroir('L\'après-midi', RESUME.aprem, aprem)}
   ${tiroir('La nuit', RESUME.nuit, nuit)}
  </div>`;
}

/* ---------- Les tiroirs des actions ---------- */
function codeLigne(c, sens){
  const qui = sens === 'besoin' ? `de ${role(c.de)}` : `pour ${c.pour.map(role).join('')}`;
  return `<li><b>${esc(c.code)}</b> ${qui}${c.propose ? '<span class="chip c-propose">Proposé</span>' : ''}${c.note ? `<span class="note">· ${esc(c.note)}</span>` : ''}</li>`;
}
function action(a){
  const resume = [a.mj ? `<span class="chip c-mj">🎮 ${esc(a.mj)}</span>` : '', a.besoin ? `<span class="chip r-tous">${a.besoin.length} code${a.besoin.length > 1 ? 's' : ''} à recevoir</span>` : '', a.donne ? `<span class="chip r-tous">${a.donne.length} à donner</span>` : '', a.propose ? '<span class="chip c-propose">Proposé</span>' : ''].join('');
  const corps = [
    a.besoin ? `<div class="bloc"><span class="etiq">Il lui faut</span><ul class="codes">${a.besoin.map(c => codeLigne(c, 'besoin')).join('')}</ul></div>` : '',
    `<div class="bloc"><span class="etiq">Ce qu'il fait</span><p>${esc(a.fait)}</p></div>`,
    a.ecran ? `<div class="bloc"><span class="etiq">Ce que voit le joueur</span><p class="ecran">${esc(a.ecran)}</p></div>` : '',
    a.donne ? `<div class="bloc"><span class="etiq">Ce que ça donne</span><ul class="codes">${a.donne.map(c => codeLigne(c, 'donne')).join('')}</ul></div>` : '',
    a.note ? `<p class="note">${esc(a.note)}</p>` : ''
  ].join('');
  return `<details class="perso"><summary><span class="nom">${esc(a.titre)}</span>${fleche}<span class="lieu">${esc(a.lieu)}</span><span class="resume">${resume}</span></summary><div class="corps">${corps}</div></details>`;
}
const INTRO = {
  pisteur:'Le rôle de l\'action. Le matin, les deux jeux de la fête. L\'après-midi, les traces de Moustache, qui donnent les deux chemins de la nuit. La nuit, il mène le donjon sur sa tablette et coince Léo dans la dernière salle.',
  alchimiste:'Le rôle des preuves et des potions. L\'après-midi, c\'est elle qui trouve qui a écrit la lettre. Tout ce qu\'elle prépare l\'après-midi part dans son sac pour le donjon.',
  sage:'Le rôle des livres et du chemin. Il lit le carnet d\'Odette, déchiffre les archives, guide le donjon avec le plan, puis accuse. C\'est aussi lui qui donne les codes des moments.'
};
function pageRole(r){
  return `<div class="role-intro">${role(r)}<p>${esc(INTRO[r])}</p></div>` + Object.keys(MOMENTS).map(m => {
    const liste = ACTIONS.filter(a => a.role === r && a.moment === m);
    return `<h2 class="groupe">${MOMENTS[m]}<span class="quand">${liste.length} action${liste.length > 1 ? 's' : ''}</span></h2><div class="liste">${liste.map(action).join('')}</div>`;
  }).join('');
}

document.getElementById('p-ensemble').innerHTML = ensemble();
['pisteur', 'alchimiste', 'sage'].forEach(r => { document.getElementById('p-' + r).innerHTML = pageRole(r); });

const ONGLETS = ['ensemble', 'pisteur', 'alchimiste', 'sage'];
function montrer(id){
  ONGLETS.forEach(k => {
    document.getElementById('p-' + k).hidden = k !== id;
    document.getElementById('o-' + k).setAttribute('aria-selected', k === id ? 'true' : 'false');
  });
  try { localStorage.setItem('onglet-roles', id); } catch(e) {}
}
document.querySelectorAll('.onglets button').forEach(b => b.addEventListener('click', () => montrer(b.dataset.p)));
try { const o = localStorage.getItem('onglet-roles'); if (ONGLETS.includes(o)) montrer(o); } catch(e) {}
const tous = () => document.querySelectorAll('[role=tabpanel]:not([hidden]) details');
document.getElementById('tout-ouvrir').addEventListener('click', () => tous().forEach(d => d.open = true));
document.getElementById('tout-fermer').addEventListener('click', () => tous().forEach(d => d.open = false));
</script>
