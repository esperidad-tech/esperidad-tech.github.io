<!doctype html><meta charset="utf-8">
<!-- Les films des mouvements du donjon (premières propositions) : film-donjon.html#course | garde | tir | coup | chute | joie
     python3 filmer.py sortie/donjon-tir.mp4 --page "film-donjon.html#tir". Une image après l'autre : window.image().
     Au donjon, les ennemis sont à droite. L'arc est dans SA main droite (Romain, 23 novembre, 15 h 54) : tournée vers la droite de
     trois quarts, c'est la main de notre côté ; pour tirer, elle se met de profil (le dos un peu vers nous). -->

<style>html,body{margin:0;background:#131932;overflow:hidden}
#plateau{position:relative;width:900px;height:900px;overflow:hidden;background:linear-gradient(#1a1630 0%,#2a2340 52%,#3a3048 66%,#2b2436 100%)}
#sol{position:absolute;left:0;right:0;top:690px;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 120px),linear-gradient(#4a3e52,#2e2638);border-top:3px solid #1c1626}
#mur{position:absolute;left:0;right:0;top:0;height:690px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 3px,transparent 3px 70px),repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,transparent 3px 140px);opacity:.6}
#heros{position:absolute;left:0;top:0;width:900px;height:900px}
#heros svg{display:block;width:900px;height:900px}
#fx{position:absolute;left:0;top:0;width:900px;height:900px;pointer-events:none}
#titre{position:absolute;left:0;right:0;top:12px;text-align:center;font:800 38px system-ui,sans-serif;color:#ffd23f;text-shadow:0 2px 0 #24182e,0 0 14px rgba(0,0,0,.5)}</style>
<script src="../src/hv-base.js"></script><script src="../src/hv-tete.js"></script><script src="../src/hv-cheveux.js"></script><script src="../src/hv-corps.js"></script><script src="../src/hv-pantin.js"></script><script src="../src/hv-poses.js"></script><script src="../src/hv-positions.js"></script><script src="../src/hv-donjon.js"></script>
<body><div id="plateau"><div id="mur"></div><div id="sol"></div><div id="heros"></div><svg id="fx" viewBox="0 0 900 900"></svg><div id="titre"></div></div>
<script>
var HV = HerosVues, U = HV.outils, h = {role:'pisteur', sexe:'f', peau:'p1', cheveux:'roux', yeux:'vert'};
var graine = 5; Math.random = function(){ graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
window.requestAnimationFrame = function(){ return 0; };
/* (le cadre : ses pieds à 1/5 du bas de l'image, sur le sol du décor) */
var CAD = [-130, -64, 560, 560], K = 900 / CAD[2];
var hd = document.getElementById('heros'), p = HV.monter(hd, h, {cadre:CAD.join(' ')}), fx = document.getElementById('fx'), titre = document.getElementById('titre');
p.sansHasard = true;
function vers(a, net){ p.vers(a, net); }
/* (le film commence directement en garde) */
function pret(a){ vers(a, true); p.position('donjon'); p.A = p.B; p.tw = 1; }
HV.POSITIONS.donjon = {titre:'En garde', base:'dGarde', attente:[99, 99], gestes:HV.DONJON};
var nomS = decodeURIComponent(location.hash.slice(1)) || 'tir', T = 0, fin = 6, X = 0, Y = 0, fleches = [], courir = null;
/* un point du héros (ses mesures) → où il est sur l'image (pixels) */
function ecran(q){
  var V = U.vue(HV.capDe(p.F)), x = q[0] * V.c + q[2] * V.s, xs = 150 + x;
  return [(xs - CAD[0]) * K + X, (q[1] - CAD[1]) * K + Y];
}
/* les scénarios : une liste de [quand, que faire] */
var S = {
  /* (un seul angle par film : c'est elle qui bouge, pas la caméra qui tourne autour d'elle) */
  /* (elle court deux foulées, puis freine au moment où SON pied droit va se poser : elle s'arrête net en dérapant, en garde) */
  course:{fin:4.2, pas:[[0, function(){ titre.textContent = HV.NOMS_DONJON.course; vers(62, true); var ts = 1.93 * HV.COURSE.cycle; courir = {t0:0, de:30 - (VX() * ts + HV.ARRET.glisse(9) * PX()), jusqu:ts}; }]]},
  garde:{fin:8.2, pas:[[0, function(){ titre.textContent = HV.NOMS_DONJON.regard; pret(55); }], [0.8, function(){ p.joue('regard'); }]]},
  tir:{fin:6.8, pas:[[0, function(){ titre.textContent = HV.NOMS_DONJON.tir; pret(55); }], [0.6, function(){ p.joue('tir'); }], [3.8, function(){ p.joue('tir'); }]]},
  coup:{fin:4.6, pas:[[0, function(){ titre.textContent = HV.NOMS_DONJON.coup; pret(55); }], [0.6, function(){ p.joue('coup'); eclair(); }], [2.6, function(){ p.joue('coup'); eclair(); }]]},
  /* (elle tombe en arrière, vers la gauche de l'image : on la place un peu plus à droite pour qu'elle reste entière au sol) */
  chute:{fin:6.9, pas:[[0, function(){ titre.textContent = HV.NOMS_DONJON.chute; pret(50); X = 150; }], [0.6, function(){ p.joue('chute'); eclair(); }]]},
  joie:{fin:3.8, pas:[[0, function(){ titre.textContent = HV.NOMS_DONJON.joie; pret(45); }], [0.6, function(){ p.joue('joie'); }]]}
};
var SC = S[nomS] || S.tir, k = 0;
/* un éclair blanc là où le coup arrive (sur sa poitrine) */
var eclairs = [], nuages = [];
function eclair(){ eclairs.push({t0:T + 0.08}); }
/* (sa vitesse à l'écran quand elle court, en pixels par seconde ; PX : une de ses mesures vers l'avant, en pixels) */
function PX(){ return Math.sin(62 * Math.PI / 180) * K; }
function VX(){ return HV.COURSE.avance / HV.COURSE.cycle * PX(); }
window.image = function(){
  while(k < SC.pas.length && SC.pas[k][0] <= T + 1e-6) SC.pas[k++][1]();
  /* la course : la pose vient de HV.course, et elle avance à la vitesse de ses pieds */
  if(courir && T < courir.jusqu){
    var c = HV.course(T - courir.t0); p.A = p.B = c; p.tw = 1; p.posi = null; p.nom = 'course';
    X = courir.de + VX() * (T - courir.t0);
  } else if(courir){
    /* elle freine : les images clés de HV.arret, à partir de la dernière pose de course ; elle glisse encore un peu */
    if(!courir.dep){ courir.dep = HV.course(courir.jusqu - courir.t0); courir.cles = HV.arret(); }
    var u = T - courir.jusqu;
    if(u < HV.ARRET.duree){ var c2 = HV.gesteImage(courir.dep, courir.cles, u); p.A = p.B = c2; p.tw = 1; p.posi = null; p.nom = 'arret'; }
    else { courir = null; pret(62); }
    if(courir){
      X = courir.de + VX() * courir.jusqu + HV.ARRET.glisse(u) * PX();
      /* (la poussière sous le pied qui dérape) */
      if(u > HV.ARRET.poussiere[0] && u < HV.ARRET.poussiere[1]){ var os0 = HV.os(h, p.F), a0 = ecran(os0.chevilleG); nuages.push({x:a0[0] + 30, y:a0[1] + 34, t0:T, d:(Math.random() - 0.5) * 40}); }
    }
  }
  /* (la joie : un petit saut) */
  Y = 0;
  /* (le saut de la victoire est dans la pose : leve) */
  hd.style.transform = 'translate(' + X.toFixed(1) + 'px,' + Y.toFixed(1) + 'px)';
  /* la flèche qui part, au moment du lâcher */
  if(p.gest && p.gest.nom === 'tir'){ var u2 = p.t - p.gest.t0; if(u2 >= 1.37 && !p.gest.parti){ p.gest.parti = true; var os = HV.os(h, p.F), a = ecran(os.poignetG); fleches.push({x:a[0], y:a[1], t0:T}); } }
  p.dessiner(1 / 30);
  var s = '';
  fleches.forEach(function(f){ var d = (T - f.t0) * 2600, x = f.x + d; if(x < 1000) s += '<g transform="translate(' + x.toFixed(0) + ' ' + f.y.toFixed(0) + ')"><path d="M-110 0 H0" stroke="#24182e" stroke-width="8"/><path d="M-110 0 H0" stroke="#e6d8b8" stroke-width="4"/><path d="M14 0 L-6 -9 L-6 9 Z" fill="#b8bcc8" stroke="#24182e" stroke-width="3"/><path d="M-112 0 l-14 -10 h12 l12 10 l-12 10 h-12 Z" fill="#c0392b" stroke="#24182e" stroke-width="2.5"/></g>'; });
  nuages.forEach(function(n){ var u = (T - n.t0) / 0.7; if(u >= 0 && u < 1){ s += '<circle cx="' + (n.x - 50 * u + n.d * u).toFixed(0) + '" cy="' + (n.y - 30 * u).toFixed(0) + '" r="' + (12 + 34 * u).toFixed(0) + '" fill="#b8a9c0" opacity="' + (0.45 * (1 - u)).toFixed(2) + '"/>'; } });
  eclairs.forEach(function(e){ var u = (T - e.t0) / 0.25; if(u >= 0 && u < 1){ var os = HV.os(h, p.F), a = ecran(os.cou), r = 40 + 90 * u; s += '<circle cx="' + (a[0] + 60) + '" cy="' + (a[1] + 70) + '" r="' + r + '" fill="#fff" opacity="' + (0.8 * (1 - u)).toFixed(2) + '"/>'; } });
  fx.innerHTML = s;
  T += 1 / 30;
  return T < SC.fin;
};
</script>
