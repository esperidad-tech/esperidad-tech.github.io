<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#131932;overflow:hidden}
#plateau{position:relative;width:720px;height:960px;background:radial-gradient(120% 90% at 50% 36%,#34407e 0%,#1d2550 55%,#141a3a 100%)}
#heros svg{display:block;width:720px;height:960px}
#titre{position:absolute;left:0;right:0;top:20px;text-align:center;font:800 44px system-ui,sans-serif;color:#ffd23f;text-shadow:0 2px 0 #24182e,0 0 14px rgba(0,0,0,.5)}</style>
<script src="../src/hv-base.js"></script><script src="../src/hv-tete.js"></script><script src="../src/hv-cheveux.js"></script><script src="../src/hv-corps.js"></script><script src="../src/hv-pantin.js"></script>
<body><div id="plateau"><div id="heros"></div><div id="titre"></div></div>
<script>
var HV = HerosVues, h = {role:'pisteur', sexe:'f', peau:'p1', cheveux:'roux', yeux:'vert'};
/* (un hasard qui se répète : le film est le même à chaque fois) */
var graine = 7; Math.random = function(){ graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
window.requestAnimationFrame = function(){ return 0; };
var p = HV.monter(document.getElementById('heros'), h, {cadre:'-14 -30 328 437.3'}), titre = document.getElementById('titre');
function eio(u){ return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
var PERSO = !!window.FILM, FILM = window.FILM || [
  [0, function(){ titre.textContent = 'De face'; }],
  [1.3, function(){ p.vers(45); titre.textContent = 'De trois quarts'; }],
  [2.6, function(){ p.vers(90); titre.textContent = 'De profil'; }],
  [4.1, function(){ p.vers(0); titre.textContent = 'De face'; }],
  [5.3, function(){ p.vers(-90); titre.textContent = 'De l\'autre côté'; }],
  [6.9, function(){ p.vers(0); titre.textContent = ''; }],
  [8.0, function(){ titre.textContent = 'Un tour complet'; }],
  [11.7, function(){ titre.textContent = ''; }],
  [12.2, function(){ p.pose('hanche'); p.vers(385); titre.textContent = 'La main sur la hanche'; }],
  [14.2, function(){ p.pose('coucou'); p.vers(340); titre.textContent = 'Coucou !'; }],
  [16.8, function(){ p.pose('tir', 0.6); p.vers(360); titre.textContent = 'Elle vise'; }],
  [19.6, function(){ p.pose('repos'); titre.textContent = ''; }]
];
var DUREE = window.DUREE || 20.8, fait = 0, T = 0;
/* avancer d'une image (1/30 s) */
window.image = function(){
  while(fait < FILM.length && FILM[fait][0] <= T + 1e-6){ FILM[fait][1](); fait++; }
  if(!PERSO && T >= 8.0 && T <= 11.8){ p.vers(360 * eio(Math.min(1, (T - 8.0) / 3.6))); }
  p.dessiner(1 / 30);
  T += 1 / 30;
  return T < DUREE;
};
</script>
