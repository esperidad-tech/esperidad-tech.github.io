<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phase 2 — l'armure (maquette v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* IDEA : la maquette v2 de la phase 2 — l'interface du combat du Pisteur, en formes simples, pour juger le jeu et pas les images
   PICTURE : la salle vue d'en haut en biais, l'armure au fond ; pouce gauche pour courir, quatre boutons sous le pouce droit
   COLOUR : nuit bleue, acier ; l'or des fissures et de la bulle ; le feu, la glace ; jaune réservé aux boutons « lancer »
   LAYOUT : téléphone couché ; sur tablette, la salle au centre et les pouces sur les côtés */
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070912;overflow:hidden;color:#eef0f8;font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
.jaune{background:#ffd23a;color:#111;font-weight:900;font-size:1.15rem;border:0;border-radius:.6em;padding:.6em 1.6em;min-height:2.9em;box-shadow:0 .22em 0 #9c770c}
.jaune:active{transform:translateY(.15em);box-shadow:0 .07em 0 #9c770c}
.gris{background:#22304b;color:#eef0f8;font-weight:800;font-size:.95rem;border:1px solid #3d5078;border-radius:.6em;padding:.5em 1em;min-height:2.6em}
/* les quatre boutons, à la place de ceux du Pisteur */
.bt{position:fixed;border-radius:50%;background:rgba(10,16,30,.6);border:2px solid rgba(243,212,138,.55);display:none;align-items:center;justify-content:center;padding:0;z-index:2;overflow:hidden}
.bt.on{display:flex}
.bt b{font-size:2.1em;line-height:1;font-weight:400;pointer-events:none}
.bt .rc{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(3,5,12,.74) calc(var(--r,0)*360deg),transparent 0)}
.bt .lc{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(var(--c,#fff) calc(var(--p,0)*360deg),transparent 0);opacity:.45}
.bt.appui{background:rgba(255,210,58,.3)}
.bt.eteint{filter:grayscale(1);opacity:.42}
.bt.non{animation:non .3s linear}
@keyframes non{0%,100%{translate:0}25%{translate:-.3em}60%{translate:.3em}}
#bGlace{width:min(23vh,9rem);height:min(23vh,9rem);right:calc(4vh + env(safe-area-inset-right));bottom:calc(6vh + env(safe-area-inset-bottom));border-color:#9fe3ff;font-size:1.25rem}
#bFeu{width:min(17vh,6.6rem);height:min(17vh,6.6rem);right:calc(min(29vh,11.4rem) + env(safe-area-inset-right));bottom:calc(4vh + env(safe-area-inset-bottom));border-color:#ff7a2a}
#bSaut{width:min(17vh,6.6rem);height:min(17vh,6.6rem);right:calc(min(7vh,2.8rem) + env(safe-area-inset-right));bottom:calc(min(32vh,12.5rem) + env(safe-area-inset-bottom))}
#bSoin{width:min(17vh,6.6rem);height:min(17vh,6.6rem);right:calc(min(27vh,10.6rem) + env(safe-area-inset-right));bottom:calc(min(24vh,9.4rem) + env(safe-area-inset-bottom));border-color:#5fe07a}
#bFeu b,#bSaut b,#bSoin b{font-size:1.7em}
#bSoin b{color:#5fe07a;font-weight:900}
#bSaut b{color:#f3d48a;font-weight:900}
.appel{animation:appel 1s ease-out infinite}
@keyframes appel{0%{box-shadow:0 0 0 .1em rgba(255,210,58,1)}70%{box-shadow:0 0 0 .9em rgba(255,210,58,0)}100%{box-shadow:0 0 0 0 rgba(255,210,58,0)}}
#bCode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(3vh + env(safe-area-inset-bottom));width:min(30vh,10rem);height:min(15vh,5rem);border-radius:1em;background:#ffd23a;border:2px solid #fff3b0;display:none;align-items:center;justify-content:center;z-index:3;padding:0}
#bCode.on{display:flex}
#bCode .cases{display:flex;gap:.3em;pointer-events:none}
#bCode .cases i{display:block;width:1.1em;height:1.1em;border-radius:.25em;background:#111}
#bPisteur{position:fixed;right:calc(1.2vh + env(safe-area-inset-right));top:calc(10vh + 2.6rem);width:3rem;height:3rem;border-radius:50%;border:2px solid #5fcf86;background:rgba(18,50,30,.9);display:none;align-items:center;justify-content:center;font-size:1.4rem;z-index:3;padding:0}
#bPisteur.on{display:flex}
#bPause{position:fixed;right:calc(1.2vh + env(safe-area-inset-right));top:calc(1.2vh + env(safe-area-inset-top));width:2.6rem;height:2.6rem;border-radius:.6rem;background:rgba(10,16,30,.7);border:1px solid rgba(255,255,255,.25);display:none;align-items:center;justify-content:center;padding:0;z-index:4}
#bPause.on{display:flex}
/* la fenêtre du code : transparente, le combat se voit derrière */
#fen{position:fixed;left:50%;top:calc(2vh + env(safe-area-inset-top));transform:translateX(-50%);width:min(92vw,28rem);display:none;flex-direction:column;align-items:center;gap:.4em;background:rgba(8,10,22,.6);border:2px solid rgba(255,214,90,.7);border-radius:1em;padding:.5em .6em .6em;z-index:5}
#fen.on{display:flex}
#fen .lent{width:100%;height:.4em;border-radius:1em;background:rgba(255,255,255,.12);overflow:hidden}
#fen .lent i{display:block;height:100%;background:#7fa8ff}
#fen .haut{display:flex;align-items:center;gap:.5em}
#fen .case{width:2.6em;height:2.6em;border-radius:.5em;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:1.3em}
#fen .clavier{display:grid;grid-template-columns:repeat(6,1fr);gap:.3em;width:100%}
#fen .clavier button{height:2.3em;border-radius:.5em;border:1px solid rgba(255,255,255,.25);background:rgba(30,38,62,.85);font-size:1.2em;padding:0}
#fen .petitbt{width:2.3em;height:2.3em;border-radius:.5em;border:1px solid rgba(255,255,255,.3);background:rgba(30,38,62,.85);font-size:1.1em;padding:0}
#fen.faux{animation:non .3s linear 2}
/* les écrans */
.voile{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,6,14,.94);padding:max(.8em,env(safe-area-inset-top)) 1em max(.8em,env(safe-area-inset-bottom));overflow-y:auto;z-index:8}
.voile.on{display:flex}
.carte{width:100%;max-width:34em;margin:auto;text-align:center}
#debut{background:#04050b}
.roles{display:flex;gap:1.1em;justify-content:center;margin:0 0 1.4em}
.roles button{width:4.2em;height:4.2em;border-radius:50%;border:4px solid transparent;font-size:1.6em;padding:0;opacity:.45;filter:grayscale(.6)}
.roles button.choisi{opacity:1;filter:none;border-color:#fff;box-shadow:0 0 0 .2em rgba(255,255,255,.2)}
.ligne{display:flex;flex-direction:column;align-items:stretch;gap:.25em;margin:.45em 0;text-align:left}
.ligne > span{font-size:.82rem;font-weight:800;opacity:.75;padding-left:.2em}
.choix{display:flex;gap:.3em;flex-wrap:wrap}
.choix button{flex:1;min-width:4em;background:#1a2440;border:1px solid #33456e;border-radius:.55em;padding:.45em .4em;font-weight:800;font-size:.88rem;min-height:2.5em}
.choix button.choisi{background:#ffd23a;color:#111;border-color:#ffd23a}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:0 1em}
@media (max-width:600px){.deux{grid-template-columns:1fr}}
.menu{display:flex;gap:.55em;justify-content:center;margin-top:.7em}
.stats{display:grid;grid-template-columns:auto auto;gap:.3em 1.2em;justify-content:center;font-size:1.2rem;font-weight:900;margin:.8em 0 1.2em}
.stats span{text-align:right}
.mesures{font-size:.72rem;opacity:.55;margin-top:.8em}
#tourner{display:none;position:fixed;inset:0;z-index:20;background:#05060c;align-items:center;justify-content:center;font-size:4rem}
@media (orientation:portrait){#tourner{display:flex}}
</style>
</head>
<body>
<div id="tourner">📱↻</div>
<canvas id="c"></canvas>
<button class="bt" id="bGlace" aria-label="Javelot de glace"><i class="lc"></i><b>❄️</b></button>
<button class="bt" id="bFeu" aria-label="Boule de feu"><i class="lc"></i><b>🔥</b></button>
<button class="bt" id="bSaut" aria-label="Saut"><i class="rc"></i><b>⤴</b></button>
<button class="bt" id="bSoin" aria-label="Soin"><i class="lc"></i><b>✚</b></button>
<button id="bCode" aria-label="Taper le code du Pisteur"><span class="cases"><i></i><i></i><i></i></span></button>
<button id="bPisteur" aria-label="Essai : le Pisteur crie son code">🏹</button>
<button id="bPause" aria-label="Pause"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
<div id="fen">
  <div class="lent"><i></i></div>
  <div class="haut">
    <button class="petitbt" id="fFerme" aria-label="Fermer">✕</button>
    <div class="case"></div><div class="case"></div><div class="case"></div>
    <button class="petitbt" id="fEfface" aria-label="Effacer">⌫</button>
  </div>
  <div class="clavier"></div>
</div>

<!-- avant de jouer : le héros, et le bouton jaune ; rien à lire -->
<section id="debut" class="voile on">
  <div class="carte">
    <div class="roles" id="roles"></div>
    <button class="jaune" id="bGo">Démarrer</button>
    <div style="margin-top:1.2em"><button class="gris" id="bReglages" aria-label="Réglages">⚙️</button></div>
  </div>
</section>

<section id="pause" class="voile">
  <div class="carte">
    <button class="jaune" id="bReprendre">Reprendre</button>
    <div class="deux">
      <div class="ligne"><span>Le saut revient après</span><div class="choix" data-r="saut"><button data-v="0.5">0,5 s</button><button data-v="1.5">1,5 s</button><button data-v="3">3 s</button></div></div>
      <div class="ligne"><span>Sous la bulle, de 4 s à 2 s en</span><div class="choix" data-r="accel"><button data-v="2">2 min</button><button data-v="4">4 min</button></div></div>
      <div class="ligne"><span>Le Pisteur crie son code</span><div class="choix" data-r="pisteur"><button data-v="0">Au bouton 🏹</button><button data-v="15">15 s</button><button data-v="30">30 s</button><button data-v="60">60 s</button></div></div>
      <div class="ligne"><span>La vie de chaque tiers</span><div class="choix" data-r="vie"><button data-v="400">400 (essai)</button><button data-v="1000">1000</button></div></div>
      <div class="ligne"><span>Le ralenti pour taper le code</span><div class="choix" data-r="ralenti"><button data-v="3">3 s</button><button data-v="5">5 s</button><button data-v="8">8 s</button></div></div>
      <div class="ligne"><span>Les boutons qui clignotent</span><div class="choix" data-r="aides"><button data-v="true">Oui</button><button data-v="false">Non</button></div></div>
    </div>
    <div class="ligne"><span>Essais</span><div class="choix" id="essais"><button data-f="1">Tiers 1</button><button data-f="2">Tiers 2</button><button data-f="3">Tiers 3</button><button data-f="s">Le symbole</button></div></div>
    <div class="menu"><button class="gris" id="bRecommencer">Recommencer</button><button class="gris" id="bSalle" hidden>← La salle des jeux</button></div>
    <p class="mesures" id="mesures"></p>
  </div>
</section>

<section id="fin" class="voile">
  <div class="carte">
    <canvas id="finImg" width="160" height="110" style="width:160px;height:110px"></canvas>
    <div class="stats" id="stats"></div>
    <button class="jaune" id="bRejouer">Rejouer</button>
    <div style="margin-top:.8em"><button class="gris" id="bFinReglages" aria-label="Réglages">⚙️</button></div>
  </div>
</section>
<script>
/* ==========================================================
   Phase 2 de l'enquête 10 — les trois de devant contre l'armure de Grosbec
   MAQUETTE RAPIDE, VERSION 2 (Bible § 18.14) : l'interface du combat du Pisteur, en formes simples.
   Les règles seules, sans dessin : ce fichier tourne aussi dans node (tests/).
   Les distances sont en pas, les durées en secondes, comme dans le moteur du Pisteur.
   (R) = décidé par Romain (§ 18.14) ; (C) = point de départ de Claude, à régler en jouant.
   ========================================================== */
(function (G) {
'use strict';

var REG = {
  salle: {L: 14, P: 10},                     // (C) 14 pas de large, 10 de profondeur ; l'armure au fond (y = 0)
  armure: {x: 7, y: 0.9, r: 1.5},            // son pied ; on ne peut pas marcher dessus
  heros: {pv: 100, r: 0.35, vit: 3.6, x: 7, y: 8.2},   // (R) la course du Pisteur : 3,6 pas par seconde
  glace: {lance: 1.5, degat: 10},            // (R) le javelot de glace : 1,5 s sur place, 10 points
  feu: {lance: 3, degat: 50},                // (R) la boule de feu : 3 s sur place, 50 points
  soin: {lance: 2, rend: 50},                // (R) 2 s sur place, +50
  saut: {L: 3, dur: 0.32},                   // (R) 3 pas, comme le Pisteur ; la recharge est dans les réglages
  tir: {vit: 10},                            // (C) les sorts volent à 10 pas par seconde
  bouge: 0.25,                               // (C) au-delà de ce petit coup de pouce, on bouge (et le sort est coupé)
  gros: 60,                                  // (R) un gros coup : 60 ; rien ne tue d'un coup
  rythme: 4,                                 // (R) une attaque toutes les 4 s
  crepite: {annonce: 3},                     // (R) une moitié de la salle crépite 3 s, puis explose
  colonnes: {n: [6, 7], ombre: 2, r: 0.65, maxi: 14, ecart: 2.1},   // (R) 6 ou 7, ombre 2 s, 14 au plus ; (C) taille, écart (un chemin libre)
  vague: {annonce: 2, traverse: 1.5, flammes: 3, tic: 30},          // (R)
  rep: {vit: 1.35, portes: [[0.45, 6.2], [13.55, 6.2]], rend: 50, arrive: 1.95},   // (R) ~5 s jusqu'à l'armure ; un sort rapide le casse
  main: {leve: 1, givre: 10, braise: 6, ralenti: 0.4, braiseParSec: 5},  // (R) givre : 10 s, 60 % plus lent ; pierre brûlante : 6 s, 5 par seconde
  orbe: {zone: [3, 11, 2.4, 4.2], chute: 0.6, meche: 10, degat: 20, prise: 0.75, depot: 1.15, fois: 2, bonus: 15},  // (R)
  lanternes: {or: [0.75, 5.6], rouge: [13.25, 5.6]},                // (R) la dorée à gauche, la rouge à droite, jamais changées
  doigts: {n: 5, ecart: 30, annonce: 2, demi: 0.45},               // (R) cinq lignes, 2 s ; (C) 30° entre deux lignes, 0,9 pas de large
  rayon: {tous: 15, grace: 3, dure: 8, brule: 15, soigne: 10, demi: 0.5},   // (R) 15 par seconde dedans, +10 par seconde à Grosbec ; (C) dure 8 s
  coque: {tous: [15, 20], pv: 50, dure: 8},                          // (R) 50 points en 8 s ; (C) toutes les 15 à 20 s
  danse: {tous: 60, dure: 20, n: 5, r0: 1.75, w: 1.45, alerte: 0.6, degat: 30, premiere: 40},   // (R) 1 par minute, 20 s, 30 par anneau ; (C) 5 anneaux
  crevasse: {tous: 30, maxi: 3, large: 1.4, long: [4, 6], annonce: 1.5, premiere: 8, entreLanternes: 2},   // (R) 3 au plus ; (C) toutes les 30 s
  mort: {attente: 10, intouchable: 4},       // (R)
  bulle: {de: 4, a: 2},                      // (R) sous la bulle : de 4 s à 2 s entre deux attaques
  ralentiForce: 0.3,                         // (R) le ralenti pour taper le code, devant
  transfo: 2.2, explose: 3.2
};

var SYMS = ['🌙', '⭐', '☀️', '🔑', '🍄', '🐟', '🌳', '🔔', '🎩', '❤️', '🔥', '🐱'];

var DEFAUT = {
  saut: 1.5,      // (R : « mouais ») la recharge du saut : 0,5 | 1,5 | 3 s
  accel: 4,       // (R) minutes pour passer de 4 s à 2 s sous la bulle : 2 | 4
  pisteur: 30,    // le faux Pisteur crie son code N s après le symbole ; 0 = au bouton seulement
  ralenti: 5,     // secondes de ralenti pour taper le code : 3 | 5 | 8
  vie: 1000,      // (R) la vie de chaque tiers ; 400 pour essayer vite
  aides: true,
  role: 'barde'
};

function hasard(graine) {
  var s = (graine >>> 0) || 1;
  return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return (s % 1000000) / 1000000; };
}
function d2(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function distSeg(px, py, ax, ay, bx, by) {
  var vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy, u = l ? ((px - ax) * vx + (py - ay) * vy) / l : 0;
  u = Math.max(0, Math.min(1, u));
  return Math.hypot(px - (ax + u * vx), py - (ay + u * vy));
}

function nouvelle(reglages, graine) {
  var reg = {};
  for (var k in DEFAUT) reg[k] = (reglages && reglages[k] !== undefined) ? reglages[k] : DEFAUT[k];
  var H = REG.heros;
  var S = {
    reg: reg, rnd: hasard(graine || 777),
    t: 0, reel: 0, tiers: 1, phase: 'combat',
    vie: reg.vie, vieMax: reg.vie, reserve: 0,
    h: {x: H.x, y: H.y, pv: H.pv, dx: 0, dy: -1, lance: null, saut: null, sautT: 0, mort: 0, intouchable: 0, coupe: 0,
        bonus: 0, orbe: null, flammeT: 0, lent: false, bouge: false},
    cible: null,
    prochaine: 2.5, derniers: [], forcer: null,
    colonnes: [], ombres: [], crepite: null, vague: null, main: null, orbe: null,
    doigts: [], rayon: null, coque: null, danse: null, crevasses: [], fentes: [],
    t3: {rayon: 13, coque: 17, danse: REG.danse.premiere, crev: REG.crevasse.premiere},
    reps: [], tirs: [], taches: [],
    bulleT: 0, symbole: null, cri: null, pisteurT: 0,
    code: {ouvert: false, saisie: [], ralenti: 0},
    transfoT: 0, lent: 1, debutTiers: 0,
    stats: {tiers: [], morts: 0, soins: 0, glaces: 0, feux: 0, coupes: 0, coups: {}, reparesPV: 0, orbesBonnes: 0, orbesRatees: 0, contres: 0, mauvaisCodes: 0},
    evts: []
  };
  return S;
}
function evt(S, type, o) { o = o || {}; o.type = type; o.t = S.reel; S.evts.push(o); if (S.evts.length > 80) S.evts.shift(); }
function dernier(S, type, depuis) { for (var i = S.evts.length - 1; i >= 0; i--) { var e = S.evts[i]; if (S.reel - e.t > depuis) return null; if (e.type === type) return e; } return null; }

/* ============ le héros prend des coups ============ */
function vivant(S) { return S.h.mort <= 0; }
function blesser(S, n, source, gros) {
  var h = S.h;
  if (h.mort > 0 || h.intouchable > 0 || S.phase === 'explose' || S.phase === 'fini' || S.phase === 'transfo') return false;
  h.pv -= n; h.coupe = gros ? 0.45 : Math.max(h.coupe, 0.18);
  S.stats.coups[source] = (S.stats.coups[source] || 0) + n;
  if (gros && h.lance) { h.lance = null; S.stats.coupes++; evt(S, 'sortCoupe', {par: source}); }   // (R) un gros coup interrompt ; les dégâts continus, non
  evt(S, gros ? 'aie' : 'brule', {n: n, source: source});
  if (h.pv <= 0) mourir(S);
  return true;
}
function mourir(S) {
  var h = S.h;
  h.pv = 0; h.mort = REG.mort.attente; h.lance = null; h.saut = null;
  if (h.orbe) { var o = h.orbe; o.porte = false; o.x = h.x; o.y = h.y; h.orbe = null; }
  S.stats.morts++;
  if (S.code.ouvert) fermerCode(S);
  evt(S, 'mort', {x: h.x, y: h.y});
}
function relever(S) {
  var h = S.h, p = placeLibre(S, REG.heros.x, REG.heros.y);
  h.x = p[0]; h.y = p[1]; h.pv = REG.heros.pv; h.intouchable = REG.mort.intouchable;
  evt(S, 'releve');
}
function placeLibre(S, x, y) {
  for (var r = 0; r < 6; r += 0.4) for (var a = 0; a < 12; a++) {
    var px = x + Math.cos(a / 12 * Math.PI * 2) * r, py = y + Math.sin(a / 12 * Math.PI * 2) * r;
    if (libreEn(S, px, py, REG.heros.r)) return [px, py];
  }
  return [x, y];
}

/* ============ les obstacles ============ */
function dansSalle(x, y, r) { var L = REG.salle; return x >= r && x <= L.L - r && y >= r && y <= L.P - r; }
function libreEn(S, x, y, r) {
  if (!dansSalle(x, y, r)) return false;
  var A = REG.armure;

});

$('fEfface').addEventListener('pointerdown', function (e) { e.preventDefault(); if (S) P2.effacer(S); majFenetre(); });
function secouer(saisie) {
  var f = $('fen'), cases = f.querySelectorAll('.case');
  f.classList.add('on', 'faux'); for (var i = 0; i < 3; i++) cases[i].textContent = saisie[i] || '';
  setTimeout(function () { f.classList.remove('faux'); majFenetre(); }, 650);
}
function majFenetre() {
  var f = $('fen'), on = S && S.code.ouvert; f.classList.toggle('on', !!on);
  var cases = f.querySelectorAll('.case'); for (var i = 0; i < 3; i++) cases[i].textContent = on ? (S.code.saisie[i] || '') : '';
}

/* chaque image : qui est montré, qui est grisé, qui clignote */
function cls(el, c, v) { if (el.classList.contains(c) !== !!v) el.classList.toggle(c, !!v); }
function majBoutons() {
  var en = S && !debut && S.phase !== 'fini', h = S && S.h, aides = S && S.reg.aides;
  ['bGlace', 'bFeu', 'bSoin', 'bSaut'].forEach(function (id) { cls($(id), 'on', en); });
  cls($('bPause'), 'on', !debut && !finMontree);
  if (!S) return;
  var bulle = en && S.phase === 'bulle';
  cls($('bCode'), 'on', bulle && !S.code.ouvert); cls($('bPisteur'), 'on', bulle && !S.cri);
  var mort = h.mort > 0 || S.code.ouvert;
  ['bGlace', 'bFeu', 'bSoin'].forEach(function (id) {
    var el = $(id), q = id === 'bGlace' ? 'glace' : id === 'bFeu' ? 'feu' : 'soin';
    cls(el, 'eteint', mort);
    el.style.setProperty('--p', h.lance && h.lance.quoi === q ? (h.lance.t / h.lance.dur).toFixed(3) : 0);
    el.style.setProperty('--c', q === 'glace' ? '#9fe3ff' : q === 'feu' ? '#ff7a2a' : '#5fe07a');
  });
  $('bSaut').style.setProperty('--r', h.sautT > 0 ? (h.sautT / S.reg.saut).toFixed(3) : 0);
  cls($('bSaut'), 'eteint', mort);
  cls($('bSoin'), 'appel', aides && h.pv <= 60 && h.mort <= 0 && !h.lance);
  cls($('bCode'), 'appel', aides && bulle && S.cri);
  var f = $('fen');
  if (!f.classList.contains('faux') && f.classList.contains('on') !== S.code.ouvert) majFenetre();
  if (S.code.ouvert) f.querySelector('.lent i').style.width = (100 * S.code.ralenti / S.reg.ralenti).toFixed(1) + '%';
}

/* ---------- la pause, les réglages ---------- */
function basculerPause() { if (debut) return; pause = !pause; $('pause').classList.toggle('on', pause); if (pause) majMenu(); joy.id = null; joy.mx = joy.my = 0; }
$('bPause').addEventListener('click', basculerPause);
$('bReprendre').addEventListener('click', function () {
  if (debut) { $('pause').classList.remove('on'); $('debut').classList.add('on'); return; }
  if (finMontree) { $('pause').classList.remove('on'); $('fin').classList.add('on'); return; }
  basculerPause();
});
document.querySelectorAll('.choix[data-r]').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var r = g.dataset.r, v = b.dataset.v;
    reglages[r] = r === 'aides' ? v === 'true' : +v;
    if (S) { S.reg[r] = reglages[r]; if (r === 'vie' && S.phase === 'combat') { S.vieMax = reglages.vie; S.vie = Math.min(S.vie, S.vieMax); } }
    garder(); majMenu();
  });
});
$('essais').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || !S || debut) return;
  if (b.dataset.f === 's') P2.symboleTout(S); else P2.aller(S, +b.dataset.f);
  $('fin').classList.remove('on'); finMontree = false; basculerPause();
});
$('bRecommencer').addEventListener('click', function () { nouvelle(); $('fin').classList.remove('on'); if (pause) basculerPause(); });
function majMenu() {
  document.querySelectorAll('.choix[data-r]').forEach(function (g) {
    var r = g.dataset.r; g.querySelectorAll('button').forEach(function (b) { b.classList.toggle('choisi', String(reglages[r]) === b.dataset.v); });
  });
  $('essais').style.opacity = debut ? 0.35 : 1;
  $('mesures').textContent = 'Maquette rapide de la phase 2, ' + VERSION + ' · ' + ips + ' images par seconde';
}
if (/depuis=salle/.test(location.search)) { var bs = $('bSalle'); bs.hidden = false; bs.addEventListener('click', function () { location.href = 'salle.html'; }); }

/* ---------- avant de jouer ---------- */
var roles = $('roles');
['barde', 'sage', 'alchimiste'].forEach(function (r) {
  var b = document.createElement('button'), R = Dessin.ROLES[r];
  b.style.background = R.c; b.textContent = R.ic; b.dataset.r = r; b.setAttribute('aria-label', r);
  b.addEventListener('click', function () { reglages.role = r; garder(); majRoles(); });
  roles.appendChild(b);
});
function majRoles() { roles.querySelectorAll('button').forEach(function (b) { b.classList.toggle('choisi', b.dataset.r === reglages.role); }); }
majRoles();
$('bGo').addEventListener('click', function () { debut = false; $('debut').classList.remove('on'); nouvelle(); });
$('bReglages').addEventListener('click', function () { $('debut').classList.remove('on'); $('pause').classList.add('on'); majMenu(); });
$('bFinReglages').addEventListener('click', function () { $('fin').classList.remove('on'); $('pause').classList.add('on'); majMenu(); });
$('bRejouer').addEventListener('click', function () { $('fin').classList.remove('on'); nouvelle(); });

/* ---------- la fin : sans un mot ---------- */
function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function montrerFin() {
  finMontree = true;
  var st = S.stats, h = '<span>⏱</span><b>' + mmss(S.t) + '</b>';
  st.tiers.forEach(function (x, i) { h += '<span>' + ['①', '②', '③'][i] + '</span><b>' + mmss(x.code || x.symbole) + '</b>'; });
  h += '<span>💀</span><b>' + st.morts + '</b><span>✚</span><b>' + st.soins + '</b>';
  $('stats').innerHTML = h;
  var fc = $('finImg').getContext('2d'); fc.clearRect(0, 0, 160, 110); Dessin.grosbec(fc, 80, 58, 32);
  $('fin').classList.add('on');
}

/* ---------- la boucle ---------- */
var avant = performance.now(), ips = 60, nImg = 0, t0 = avant;
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  var dt = Math.min(0.05, (maintenant - avant) / 1000); avant = maintenant;
  nImg++; if (maintenant - t0 > 1000) { ips = Math.round(nImg * 1000 / (maintenant - t0)); nImg = 0; t0 = maintenant; }
  if (S && !pause && !debut && !fige) {
    var kb = entreeClavier(), e = kb || {mx: joy.mx, my: joy.my};
    if (window.__pilote) e = window.__pilote(S, dt) || e;   // pour les essais : un robot peut tenir la manette
    P2.pas(S, dt, e);
    if (S.phase === 'fini' && !finMontree) montrerFin();
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S) Dessin.tout(ctx, S, vue, W, H, joy); else { ctx.fillStyle = '#070912'; ctx.fillRect(0, 0, W, H); }
  majBoutons();
}
document.addEventListener('visibilitychange', function () { if (document.hidden && S && !pause && !debut && !finMontree) basculerPause(); });
taille();
requestAnimationFrame(boucle);

window.__p2 = {get S() { return S; }, set fige(v) { fige = v; }, P2: P2, nouvelle: nouvelle, geste: geste, vue: vue, majBoutons: majBoutons,
  demarrer: function () { $('bGo').click(); }, get ips() { return ips; }, VERSION: VERSION,
  dessiner: function () { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); Dessin.tout(ctx, S, vue, W, H, joy); }};
})();

</script>
</body>
