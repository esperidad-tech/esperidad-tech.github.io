<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phase 2 — l'armure (maquette rapide)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* IDEA : une maquette pour juger le jeu, pas les images — des ronds, des rectangles, des couleurs franches
   PICTURE : l'armure en haut, la salle en bas, le héros au doigt ; chaque attaque s'annonce sur le sol
   COLOUR : nuit bleue, acier, rouge du danger, or de la bulle ; jaune réservé aux boutons « lancer »
   LAYOUT : téléphone debout ; sur tablette, le jeu au centre de l'écran */
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060c;overflow:hidden;color:#eef0f8;font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#cadre{position:absolute;top:0;height:100%;overflow:hidden;background:#0b0d18}
#c{position:absolute;left:0;top:0;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
.jaune{background:#ffd23a;color:#111;font-weight:900;font-size:1.15rem;border:0;border-radius:.6em;padding:.6em 1.6em;min-height:2.9em;box-shadow:0 .22em 0 #9c770c}
.jaune:active{transform:translateY(.15em);box-shadow:0 .07em 0 #9c770c}
.gris{background:#22304b;color:#eef0f8;font-weight:800;font-size:.95rem;border:1px solid #3d5078;border-radius:.6em;padding:.5em 1em;min-height:2.6em}
/* les boutons du combat */
.bt{position:absolute;border-radius:22%;border:3px solid rgba(255,255,255,.22);background:rgba(20,26,44,.86);display:none;align-items:center;justify-content:center;padding:0;overflow:hidden;box-shadow:0 .25em 0 rgba(0,0,0,.45);z-index:3}
.bt.on{display:flex}
.bt b{font-size:2.1em;line-height:1;pointer-events:none;font-weight:400}
.bt .rc{position:absolute;inset:0;pointer-events:none;background:conic-gradient(rgba(3,5,12,.78) calc(var(--r,0)*360deg),transparent 0)}
.bt .nb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:1.6em;font-weight:900;color:#fff;text-shadow:0 0 .3em #000;pointer-events:none}
.bt.bloque .nb{display:flex}
.bt.bloque b,.bt.bloque .cases{opacity:0}
#bCode .nb{font-size:2.2em}
#bCode.bloque{background:#5a5f6e;border-color:#8a8f9e}
.bt.eteint{filter:grayscale(1);opacity:.45}
.bt.appui{transform:translateY(.15em);box-shadow:0 .08em 0 rgba(0,0,0,.45);background:rgba(255,210,58,.3)}
#bPotion{border-color:#5fe07a}
#bCouper{border-color:#fff1a0}
#bFeu{border-color:#ff7a2a;background:rgba(80,24,8,.88)}
#bGlace{border-color:#9fe3ff;background:rgba(10,40,70,.88)}
#bTape{border-color:#ffd23a;border-radius:50%}
#bCode{background:#ffd23a;border-color:#fff3b0;color:#111;border-radius:1em}
#bCode .cases{display:flex;gap:.18em;pointer-events:none}
#bCode .cases i{display:block;width:.9em;height:.9em;border-radius:.2em;background:#111}
#bPisteur{border-radius:50%;border-color:#5fcf86;background:rgba(18,50,30,.9)}
#bPause{position:absolute;border-radius:.6em;background:rgba(10,16,30,.7);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;padding:0;z-index:4}
.appel{animation:appel 1s ease-out infinite}
@keyframes appel{0%{box-shadow:0 0 0 .1em rgba(255,210,58,1)}70%{box-shadow:0 0 0 .9em rgba(255,210,58,0)}100%{box-shadow:0 0 0 0 rgba(255,210,58,0)}}
.non{animation:non .3s linear}
@keyframes non{0%,100%{translate:0}25%{translate:-.35em}60%{translate:.35em}}
/* la fenêtre du code : transparente, le combat se voit derrière */
#fen{position:absolute;display:none;flex-direction:column;align-items:center;gap:.45em;background:rgba(8,10,22,.62);border:2px solid rgba(255,214,90,.7);border-radius:1em;padding:.55em .6em .65em;z-index:5}
#fen.on{display:flex}
#fen .lent{width:100%;height:.45em;border-radius:1em;background:rgba(255,255,255,.12);overflow:hidden}
#fen .lent i{display:block;height:100%;background:#7fa8ff;border-radius:1em}
#fen .haut{display:flex;align-items:center;gap:.5em}
#fen .case{width:2.7em;height:2.7em;border-radius:.5em;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:1.45em}
#fen .clavier{display:grid;grid-template-columns:repeat(6,1fr);gap:.32em;width:100%}
#fen .clavier button{height:2.55em;border-radius:.5em;border:1px solid rgba(255,255,255,.25);background:rgba(30,38,62,.85);font-size:1.25em;padding:0}
#fen .clavier button:active{background:rgba(255,210,58,.4)}
#fen .petitbt{width:2.4em;height:2.4em;border-radius:.5em;border:1px solid rgba(255,255,255,.3);background:rgba(30,38,62,.85);font-size:1.15em;padding:0}
#fen.faux{animation:non .3s linear 2}
/* les écrans */
.voile{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,6,14,.94);padding:max(.8em,env(safe-area-inset-top)) 1em max(.8em,env(safe-area-inset-bottom));overflow-y:auto;z-index:8}
.voile.on{display:flex}
.carte{width:100%;max-width:30em;margin:auto;text-align:center}
#debut{background:#04050b}
.roles{display:flex;gap:1.1em;justify-content:center;margin:0 0 1.6em}
.roles button{width:4.4em;height:4.4em;border-radius:50%;border:4px solid transparent;font-size:1.7em;padding:0;opacity:.45;filter:grayscale(.6)}
.roles button.choisi{filter:none}
.roles button.choisi{opacity:1;border-color:#fff;box-shadow:0 0 0 .2em rgba(255,255,255,.2)}
.ligne{display:flex;flex-direction:column;align-items:stretch;gap:.3em;margin:.55em 0;text-align:left}
.ligne > span{font-size:.85rem;font-weight:800;opacity:.75;padding-left:.2em}
.choix{display:flex;gap:.3em;flex-wrap:wrap}
.choix button{flex:1;min-width:4.2em;background:#1a2440;border:1px solid #33456e;border-radius:.55em;padding:.5em .4em;font-weight:800;font-size:.9rem;min-height:2.6em}
.choix button.choisi{background:#ffd23a;color:#111;border-color:#ffd23a}
.menu{display:flex;flex-direction:column;gap:.55em;margin-top:.8em}
.stats{display:grid;grid-template-columns:auto auto;gap:.35em 1.2em;justify-content:center;font-size:1.25rem;font-weight:900;margin:1em 0 1.4em}
.stats span{text-align:right}
.mesures{font-size:.72rem;opacity:.55;margin-top:.9em}
#tourner{display:none;position:fixed;inset:0;z-index:20;background:#05060c;align-items:center;justify-content:center;font-size:4rem}
@media (orientation:landscape) and (max-height:500px){#tourner{display:flex}}
</style>
</head>
<body>
<div id="tourner">📱↻</div>
<div id="cadre">
  <canvas id="c"></canvas>
  <button class="bt" id="bPotion" aria-label="Potion"><b>🧪</b><i class="rc"></i></button>
  <button class="bt" id="bCouper" aria-label="Couper le gros coup"><b>✋</b><i class="rc"></i></button>
  <button class="bt" id="bFeu" aria-label="Feu"><b>🔥</b></button>
  <button class="bt" id="bGlace" aria-label="Glace"><b>❄️</b></button>
  <button class="bt" id="bTape" aria-label="Taper"><b>💥</b><i class="rc"></i></button>
  <button class="bt" id="bCode" aria-label="Taper le code du Pisteur"><span class="cases"><i></i><i></i><i></i></span><span class="nb"></span></button>
  <button class="bt" id="bPisteur" aria-label="Essai : le Pisteur crie son code"><b>🏹</b></button>
  <button id="bPause" aria-label="Pause"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
  <div id="fen">
    <div class="lent"><i></i></div>
    <div class="haut">
      <button class="petitbt" id="fFerme" aria-label="Fermer">✕</button>
      <div class="case"></div><div class="case"></div><div class="case"></div>
      <button class="petitbt" id="fEfface" aria-label="Effacer">⌫</button>
    </div>
    <div class="clavier"></div>
  </div>
</div>

<!-- avant de jouer : le héros, et le bouton jaune ; rien à lire -->
<section id="debut" class="voile on">
  <div class="carte">
    <div class="roles" id="roles"></div>
    <button class="jaune" id="bGo">Démarrer</button>
    <div style="margin-top:1.4em"><button class="gris" id="bReglages" aria-label="Réglages">⚙️</button></div>
  </div>
</section>

<section id="pause" class="voile">
  <div class="carte">
    <button class="jaune" id="bReprendre">Reprendre</button>
    <div class="ligne"><span>Comment on fait mal à l'armure</span><div class="choix" data-r="facon"><button data-v="immobile">Immobile</button><button data-v="bouton">Bouton</button><button data-v="faible">Point faible</button></div></div>
    <div class="ligne"><span>Le Pisteur crie son code</span><div class="choix" data-r="pisteur"><button data-v="0">Au bouton 🏹</button><button data-v="10">10 s</button><button data-v="25">25 s</button><button data-v="45">45 s</button></div></div>
    <div class="ligne"><span>Vitesse des attaques</span><div class="choix" data-r="vitesse"><button data-v="0.8">Lente</button><button data-v="1">Normale</button><button data-v="1.25">Rapide</button></div></div>
    <div class="ligne"><span>Le symbole, après…</span><div class="choix" data-r="symbole"><button data-v="0.15">15 %</button><button data-v="0.25">25 %</button><button data-v="0.333">33 %</button></div></div>
    <div class="ligne"><span>Durée du ralenti (le code)</span><div class="choix" data-r="ralenti"><button data-v="3">3 s</button><button data-v="5">5 s</button><button data-v="8">8 s</button></div></div>
    <div class="ligne"><span>Les boutons qui clignotent</span><div class="choix" data-r="aides"><button data-v="true">Oui</button><button data-v="false">Non</button></div></div>
    <div class="ligne"><span>Essais</span><div class="choix" id="essais"><button data-f="1">Forme 1</button><button data-f="2">Forme 2</button><button data-f="3">Forme 3</button><button data-f="s">Le symbole</button></div></div>
    <div class="menu">
      <button class="gris" id="bRecommencer">Recommencer</button>
      <button class="gris" id="bSalle" hidden>← La salle des jeux</button>
    </div>
    <p class="mesures" id="mesures"></p>
  </div>
</section>

<section id="fin" class="voile">
  <div class="carte">
    <canvas id="finImg" width="160" height="120" style="width:160px;height:120px"></canvas>
    <div class="stats" id="stats"></div>
    <button class="jaune" id="bRejouer">Rejouer</button>
    <div style="margin-top:1em"><button class="gris" id="bFinReglages" aria-label="Réglages">⚙️</button></div>
  </div>
</section>
<script>
/* ==========================================================
   Phase 2 de l'enquête 10 — les trois de devant contre l'armure de Grosbec
   MAQUETTE RAPIDE EN FORMES SIMPLES (chantier 3 du § 18.11 de la Bible)
   Les règles seules, sans dessin : ce fichier tourne aussi dans node (tests/).
   (R) = décidé par Romain (§ 18.4) ; (C) = point de départ de Claude, à régler.
   ========================================================== */
(function (G) {
'use strict';

var REG = {
  vie: 3000,                       // (C) la vie de l'armure : trois tiers de 1000 (R : trois formes)
  heros: {pv: 100, vitesse: 640, rayon: 20},
  tir: {cadence: 0.45, degat: 13, vitesse: 900},          // (C) un coup toutes les 0,45 s
  immobileApres: 0.3,              // façon « immobile » : il tape tout seul après 0,3 s sans bouger
  faible: {ouvert: 5, ferme: 1.8, vitesse: 48, largeur: 38, bonus: 1.5}, // façon « point faible »
  potion: {duree: 2.5, bouge: 7},  // (R) rester immobile deux ou trois secondes ; un coup le coupe
  couper: {recharge: 12},          // (R) le bouton pour couper le gros coup « ne revient pas vite » ; (C) 12 s, et 17 s au moins entre deux gros coups
  ralentiForce: 0.3,               // (R) « pas mal ralenti » : le combat à 30 %
  mortBloque: 10,                  // (R) mort sous la bulle : bouton du code grisé ; (C) 10 s
  mortDuree: 2,                    // (C) le temps de se relever
  degats: {                        // en points de vie du héros (il en a 100)
    poing: 45, souffle: 35, grosCoup: 85, bande: 70, chaud: 50, froid: 20,
    mauvaisRemede: 50, charge: 40, renvoi: 7, mauvaisCode: 20
  },
  remedeBon: 200,                  // (C) le bon remède : l'armure sonnée, gros dégâts
  sonnee: 3,
  reparateur: {vitesse: 70, soin: 30, rayon: 11},         // soin : points de vie de l'armure par seconde
  bonusCharge: {duree: 6, fois: 2},                        // (C) la bonne couleur : coups deux fois plus forts
  // les attaques : durées en secondes à la vitesse « normale »
  att: {
    poing: {prep: 1.7, coup: 0.55},
    souffle: {prep: 1.8, balaie: 0.7, brule: 0.6, part: 0.68},   // part : la part du sol brûlée (on recule au fond)
    grosCoup: {prep: 3.5},
    reparateurs: {prep: 0.8},
    chaud: {monte: 1.2, fenetre: 4.5},
    froid: {monte: 1.2, fenetre: 4.5, gel: 2.5},
    charge: {eclair: 0.8, attente: 3.2}
  },
  // le programme de chaque forme : on tourne en boucle (R : les attaques de § 18.4 ; C : l'ordre)
  formes: {
    1: {prog: ['poing', 'souffle', 'poing', 'reparateurs', 'grosCoup', 'souffle', 'poing', 'reparateurs', 'poing', 'grosCoup'], pause: 1.4, vite: 1},
    2: {prog: ['charge', 'poing', 'remede', 'charge', 'poing', 'remede'], pause: 1.3, vite: 1},
    3: {prog: ['poing', 'souffle', 'poing', 'grosCoup', 'poing', 'souffle'], pause: 0.9, vite: 1 / 0.72}
  },
  bouclier: {premier: 5, monte: 0.8, actif: 4.5, entre: 9},  // forme 3 : le bouclier qui renvoie
  // la danse des bandes sous la bulle (R : de plus en plus rapide, plus dure à chaque forme)
  bandes: {
    1: {n: 4, t0: 2.4, tmin: 1.0, pas: 0.06},
    2: {n: 5, t0: 2.1, tmin: 0.9, pas: 0.06},
    3: {n: 6, t0: 1.9, tmin: 0.8, pas: 0.06}
  },
  alerte: 0.6,                     // la part du pas où les bandes s'allument avant d'exploser
  danseAttente: 1.8,               // après le symbole, avant la première bande
  transfo: 2.6,                    // la pièce qui tombe, l'armure qui change
  explose: 3.2                     // la fin
};

var SYMS = ['🌙', '⭐', '☀️', '🔑', '🍄', '🐟', '🌳', '🔔', '🎩', '❤️', '🔥', '🐱'];

// les réglages du menu (C) : ce que Romain compare en jouant
var REGLAGES_DEFAUT = {
  facon: 'immobile',   // 'immobile' | 'bouton' | 'faible'  (§ 18.10, point 5 : pas tranché)
  pisteur: 25,         // secondes après le symbole ; 0 = seulement au bouton
  vitesse: 1,          // 0.8 | 1 | 1.25
  symbole: 0.25,       // la part de la vie de l'armure à enlever à chaque forme : 0.15 | 0.25 | 0.333
  ralenti: 5,          // secondes : 3 | 5 | 8
  aides: true,         // les boutons qui clignotent quand c'est le moment
  role: 'barde'        // 'barde' | 'sage' | 'alchimiste'
};

// un hasard qu'on peut rejouer (les tests)
function hasard(graine) {
  var s = (graine >>> 0) || 1;
  return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return (s % 1000000) / 1000000; };
}

function hautTier(forme) { return REG.vie * (4 - forme) / 3; }   // 3000, 2000, 1000
function seuil(S) { return Math.max(hautTier(S.forme) - S.reg.symbole * REG.vie, hautTier(S.forme + 1) + 1); }

function nouvelle(L, reglages, graine) {
  var reg = {};
  for (var k in REGLAGES_DEFAUT) reg[k] = (reglages && reglages[k] !== undefined) ? reglages[k] : REGLAGES_DEFAUT[k];
  var S = {
    L: L, reg: reg, rnd: hasard(graine || 12345),
    t: 0, reel: 0, forme: 1, phase: 'combat',
    vie: REG.vie,
    h: {x: L.W / 2, y: L.solBas - 70, pv: REG.heros.pv, mort: 0, invul: 0, gel: 0, calme: 0,
        potion: 0, px: 0, py: 0, charge: null, bonus: 0, tirT: 0, coupe: 0},
    cible: {x: L.W / 2, y: L.solBas - 70},
    att: null, idx: 0, attente: 2, dernierCote: [], sonnee: 0,
    reps: [], tirs: [], renvois: [],
    bouc: {avant: REG.bouclier.premier, monte: 0, actif: 0},
    pf: {x: L.W / 2, dir: 1, ouvert: true, t: REG.faible.ouvert},
    couperT: 0,
    symbole: null, cri: null, pisteurT: 0,
    danse: null,
    code: {ouvert: false, saisie: [], ralenti: 0, bloque: 0},
    transfoT: 0, piece: null,
    lent: 1,
    stats: {debutForme: 0, formes: [], morts: 0, potions: 0, coups: {}, coupes: 0, remedes: 0, mauvaisRemedes: 0, mauvaisCodes: 0, reparesPV: 0},
    evts: []
  };
  return S;
}

function evt(S, type, o) { o = o || {}; o.type = type; o.t = S.reel; S.evts.push(o); if (S.evts.length > 60) S.evts.shift(); }

/* ---------- le héros prend un coup ---------- */
function coup(S, n, source) {
  var h = S.h;
  if (h.mort > 0 || h.invul > 0 || S.phase === 'explose' || S.phase === 'fini') return false;
  if (h.potion > 0) { h.potion = 0; evt(S, 'potionCoupee'); }
  h.pv -= n; h.coupe = 0.35;
  S.stats.coups[source] = (S.stats.coups[source] || 0) + n;
  evt(S, 'aie', {n: n, source: source, x: h.x, y: h.y});
  if (h.pv <= 0) mourir(S);
  return true;
}

function mourir(S) {
  var h = S.h;
  h.pv = 0; h.mort = REG.mortDuree; h.potion = 0; h.charge = null; h.gel = 0;
  S.stats.morts++;
  evt(S, 'mort', {x: h.x, y: h.y, phase: S.phase});
  if (S.code.ouvert) fermerCode(S);
  if (S.phase === 'combat') { S.att = null; S.tirs = []; S.renvois = []; }
}

function relever(S) {
  var h = S.h;
  h.pv = REG.heros.pv; h.invul = 1.2;
  if (S.phase === 'combat') {
    // (C, pas validé) mort avant son symbole : on recommence la forme en cours, l'armure remise à neuf pour lui
    S.vie = hautTier(S.forme); S.att = null; S.idx = 0; S.attente = 2; S.reps = []; S.tirs = []; S.renvois = [];
    S.bouc = {avant: REG.bouclier.premier, monte: 0, actif: 0}; S.sonnee = 0;
    evt(S, 'reprise');
  } else if (S.phase === 'bulle') {
    // (R) mort pendant la bulle : il refait la danse ; le bouton du code est grisé, avec un petit chiffre
    S.code.bloque = REG.mortBloque;
  }
  evt(S, 'releve', {x: h.x, y: h.y});
}

/* ---------- les gestes du joueur ---------- */
function libre(S) { var h = S.h; return h.mort <= 0 && h.gel <= 0 && !S.code.ouvert; }

function potion(S) {
  var h = S.h;
  if (!libre(S) || h.potion > 0 || h.pv >= REG.heros.pv || S.phase === 'explose' || S.phase === 'fini') return false;
  h.potion = REG.potion.duree; h.px = h.x; h.py = h.y;
  S.cible.x = h.x; S.cible.y = h.y;   // il s'arrête pour boire
  evt(S, 'potion');
  return true;
}

function couper(S) {
  var a = S.att;
  if (!libre(S) || S.couperT > 0 || !a || a.type !== 'grosCoup' || a.t >= a.prep) return false;
  S.att = null; S.attente = 1.2; S.sonnee = 1.2; S.couperT = REG.couper.recharge;
  S.stats.coupes++;
  evt(S, 'coupe');
  return true;
}

function remede(S, el) {
  var a = S.att;
  if (!libre(S) || S.phase !== 'combat' || !a || (a.type !== 'chaud' && a.type !== 'froid') || a.fait) return false;
  a.fait = true;
  var bon = (a.type === 'chaud' && el === 'glace') || (a.type === 'froid' && el === 'feu');
  if (bon) {
    S.stats.remedes++;
    S.att = null; S.sonnee = REG.sonnee; S.attente = REG.sonnee;
    evt(S, 'remedeBon', {el: el});
    blesser(S, REG.remedeBon, {x: S.L.W / 2, y: S.L.bossY});
  } else {
    S.stats.mauvaisRemedes++;
    S.att = null; S.attente = 1.2;
    evt(S, 'remedeMauvais', {el: el});
    coup(S, REG.degats.mauvaisRemede, 'remede');
  }
  return true;
}

function ouvrirCode(S) {
  if (S.phase !== 'bulle' || S.h.mort > 0 || S.code.bloque > 0 || S.code.ouvert || S.h.gel > 0) return false;

/* ---------- la fin ---------- */
function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function montrerFin() {
  finMontree = true;
  var st = S.stats, h = '';
  h += '<span>⏱</span><b>' + mmss(S.t) + '</b>';
  st.formes.forEach(function (t, i) { h += '<span>' + ['①', '②', '③'][i] + '</span><b>' + mmss(t) + '</b>'; });
  h += '<span>💀</span><b>' + st.morts + '</b><span>🧪</span><b>' + st.potions + '</b>';
  $('stats').innerHTML = h;
  var fc = $('finImg').getContext('2d'); fc.clearRect(0, 0, 160, 120); Dessin.grosbec(fc, 80, 64, 34);
  $('fin').classList.add('on');
}

/* ---------- la boucle ---------- */
var avant = performance.now(), ips = 60, nImg = 0, t0 = avant;
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  var dt = Math.min(0.05, (maintenant - avant) / 1000); avant = maintenant;
  nImg++; if (maintenant - t0 > 1000) { ips = Math.round(nImg * 1000 / (maintenant - t0)); nImg = 0; t0 = maintenant; }
  if (S && !pause && !debut && !fige) {
    clavier(dt);
    P2.pas(S, dt, {tirer: tape || !!touches[' ']});
    if (S.phase === 'fini' && !finMontree) montrerFin();
  }
  if (S) { ctx.setTransform(K, 0, 0, K, 0, 0); Dessin.tout(ctx, S, L); }
  else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, cv.width, cv.height); }
  majBoutons();
}
document.addEventListener('visibilitychange', function () { if (document.hidden && S && !pause && !debut && !finMontree) basculerPause(); });

taille();
