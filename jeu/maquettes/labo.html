<title>Le labo de l'Alchimiste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@500;700&family=Macondo&display=swap">
<style>
/* Mise en page : la paillasse dessinée (comme l'atelier du jeu) avec la fiche d'analyse en parchemin à droite ;
   la loupe, le microscope et les couleurs s'ouvrent par-dessus la paillasse (plein écran sur téléphone).
   Une seule ambiance : la nuit de Brumeval du jeu, contour épais #24182e, dégradés « jouet », boutons jaunes. */
:root{
  --nuit:#131932; --nuit-2:#1c2447; --nuit-3:#28325e; --trait:#3b4679; --brume:#a6aed8; --lune:#eef0ff;
  --parchemin:#f3e7cb; --parchemin-2:#e8d7ae; --encre:#35281b; --encre-2:#6b5434;
  --or:#f5b945; --mousse:#7cc493; --alchi:#b48cff; --tampon:#c0392b; --K:#24182e;
  --f-titre:"Macondo", Georgia, "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-main:"Caveat", "Segoe Script", "Comic Sans MS", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--nuit); color:var(--lune); font-family:var(--f-texte); font-size:17px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 12px}
.app{max-width:1400px; margin:0 auto}
.barre-haut{display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; padding-block:8px}
.barre-haut h1{font-size:22px; color:var(--alchi)}
.barre-haut .maquette{font-size:13px; color:var(--brume); flex:1; min-width:0}
.barre-haut .niveau button{padding:4px 10px; font-size:13px}
.decor{width:min(100%, calc((100svh - 64px) * 1.5625)); aspect-ratio:1000 / 640; margin:0 auto}
.decor #scene{height:100%}
.verre.secoue{animation:secoueV .45s}
@keyframes secoueV{0%,100%{transform:none} 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)}}
.verre .res{position:absolute; left:50%; bottom:13%; transform:translateX(-50%); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:12px; padding:0 12px; font-family:var(--f-main); font-size:28px; font-weight:700; white-space:nowrap; animation:pop .3s ease-out}
.verre .geste{position:absolute; top:50%; left:60%; transform:translateY(-50%); font-size:44px; font-weight:700; color:var(--or); text-shadow:0 0 8px rgba(0,0,0,.6); pointer-events:none; animation:geste 1.2s ease-in-out infinite}
@keyframes geste{0%,100%{opacity:.2; translate:10px 0} 50%{opacity:1; translate:-10px 0}}
.verre canvas{touch-action:none; cursor:grab}
.alerte{font-size:14px; color:var(--or); flex:1; text-align:center}
.secoue-svg{animation:secoueV .45s; transform-box:fill-box}
.ech .ok{position:absolute; top:2px; right:4px; font-size:18px}
.ech{position:relative}
h1,h2,h3{font-family:var(--f-titre); font-weight:400; margin:0; line-height:1.15; text-wrap:balance}
button{font:inherit; color:inherit}
button:focus-visible, select:focus-visible, [data-act]:focus-visible{outline:3px solid var(--or); outline-offset:2px}

header.tete{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end; justify-content:space-between; padding-block:16px 8px}
.tete h1{font-size:clamp(26px, 5.5vw, 38px); color:var(--alchi)}
.tete .sous{color:var(--brume); font-size:15px; margin-top:2px}
.niveau{display:flex; gap:4px; background:var(--nuit-2); border:1px solid var(--trait); border-radius:999px; padding:4px}
.niveau button{border:0; background:transparent; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:14px; color:var(--brume)}
.niveau button[aria-pressed="true"]{background:var(--nuit-3); color:var(--lune)}
.maquette{font-size:14px; color:var(--brume); margin:0 0 10px}

.labo{display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start}
@media (min-width:960px){ .labo{grid-template-columns:minmax(0,1fr) 320px} }
.gauche{display:grid; gap:10px; min-width:0}
.conteur{display:flex; gap:10px; align-items:flex-start; background:var(--nuit-2); border:1px solid var(--trait); border-radius:16px; padding:10px 12px}
.conteur p{margin:0; flex:1; min-width:0}
.hp{flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--trait); background:var(--nuit-3); cursor:pointer; font-size:17px}

/* La paillasse dessinée */
.cadre{position:relative; border:3px solid var(--K); border-radius:20px; overflow:hidden; background:#241b3d; box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cadre.ouvert{min-height:560px}
.decor{position:relative}
#scene{display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none}
#scene [data-act]{cursor:pointer}
#scene [data-act]:hover .survol{opacity:1}
.survol{opacity:0; transition:opacity .2s; pointer-events:all}
.calque{position:absolute; inset:0; pointer-events:none}
.flamme{transform-box:fill-box; transform-origin:50% 100%; animation:flamme .9s ease-in-out infinite alternate}
@keyframes flamme{from{transform:scaleY(1) skewX(-3deg)} to{transform:scaleY(1.12) skewX(4deg)}}
.vapeur{animation:vapeur 2.6s ease-in-out infinite}
.vapeur.v2{animation-delay:-1.3s}
@keyframes vapeur{0%{opacity:0; transform:translateY(6px)} 40%{opacity:.7} 100%{opacity:0; transform:translateY(-14px)}}
.halo-sel{animation:haloSel 1.5s ease-in-out infinite}
@keyframes haloSel{0%,100%{opacity:.45} 50%{opacity:1}}
.indice-touche{animation:touche 1.6s ease-in-out infinite}
@keyframes touche{0%,100%{opacity:0} 50%{opacity:.9}}

/* Bulles posées sur la paillasse */
.bulle-o{position:absolute; transform:translate(-50%, calc(-100% - 12px)); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:14px; padding:6px 10px; font-family:var(--f-main); font-size:clamp(16px, 2.2vw, 21px); font-weight:700; line-height:1.15; max-width:min(300px, 60%); text-align:center; pointer-events:none; animation:pop .25s ease-out; z-index:5}
.bulle-o::after{content:""; position:absolute; left:50%; bottom:-11px; width:16px; height:16px; background:var(--parchemin); border-right:3px solid var(--K); border-bottom:3px solid var(--K); transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{opacity:0; transform:translate(-50%, calc(-100% - 2px)) scale(.8)} to{opacity:1}}

/* Mimi (le dessin du jeu) */
.mimi{position:absolute; width:9.5%; pointer-events:auto; cursor:pointer; transform:translate(-50%, -100%); transition:left 1.8s linear, top 1.8s linear; z-index:4}
.mimi svg{display:block; width:100%; height:auto; overflow:visible}
.cadre.micro-ouvert .mimi{display:none}
.cadre.ouvert:not(.micro-ouvert) .mimi{z-index:7}
.mimi .dit{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--parchemin); color:var(--encre); border:2px solid var(--K); font-family:var(--f-main); font-size:19px; font-weight:700; padding:0 10px; border-radius:12px; white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none}
.mimi .dit.on{opacity:1}
.coeur-v{position:absolute; left:50%; top:10%; font-size:20px; animation:coeurV 1.2s ease-out forwards; pointer-events:none}
@keyframes coeurV{from{opacity:1; transform:translate(-50%,0) scale(.6)} to{opacity:0; transform:translate(-50%,-60px) scale(1.2)}}
.at-t-chat .at-c-g-dort,.at-t-chat .at-c-g-assis,.at-t-chat .at-c-g-debout,.at-t-chat .at-zzz,.at-t-chat .at-c-ferme,.at-t-chat .at-c-moue,.at-t-chat .at-c-paupieres,.at-t-chat .at-c-ventre{display:none}
.at-t-chat.at-c-dort .at-c-g-dort,.at-t-chat.at-c-dort .at-zzz{display:inline}
.at-t-chat.at-c-assis .at-c-g-assis,.at-t-chat.at-c-lave .at-c-g-assis,.at-t-chat.at-c-salut .at-c-g-assis{display:inline}
.at-t-chat.at-c-marche .at-c-g-debout{display:inline}
.at-t-chat.at-c-gauche:not(.at-c-dort) svg{transform:scaleX(-1)}
.at-c-j,.at-c-patte,.at-c-patte-b,.at-c-queue,.at-c-tete,.at-c-corps,.at-respire{transform-box:fill-box}
.at-c-j{transform-origin:50% 0}
.at-c-marche .at-c-j1,.at-c-marche .at-c-j4{animation:at-pas .4s ease-in-out infinite alternate}
.at-c-marche .at-c-j2,.at-c-marche .at-c-j3{animation:at-pas .4s ease-in-out infinite alternate-reverse}
.at-c-marche .at-c-corps{animation:at-trot .2s ease-in-out infinite alternate}
.at-c-queue{transform-origin:100% 100%; animation:at-queue 2.6s ease-in-out infinite}
.at-c-marche .at-c-queue{animation-duration:.8s}
.at-c-patte{transform-origin:50% 6%}
.at-c-lave .at-c-patte{animation:at-lave .6s ease-in-out infinite alternate}
.at-c-lave .at-c-tete{transform-origin:50% 100%; transform:rotate(-7deg)}
.at-c-lave .at-c-yeux{display:none}
.at-c-lave .at-c-ferme{display:inline}
.at-c-salut .at-c-patte{animation:at-salut .42s ease-in-out infinite alternate}
.at-c-assis .at-c-tete{transform-origin:50% 100%; animation:at-regard 5s ease-in-out infinite}
.at-respire{transform-origin:50% 100%; animation:at-respire 3s ease-in-out infinite}
.at-zzz{animation:at-zzz 3s linear infinite}
.at-zzz.z2{animation-delay:-1.5s}
.mimi.saute svg{animation:sursaut .5s ease-out}
@keyframes sursaut{0%,100%{transform:translateY(0)} 40%{transform:translateY(-18%)}}
.at-c-gauche.mimi.saute svg{animation:none}
@keyframes at-pas{from{transform:rotate(-22deg)} to{transform:rotate(22deg)}}
@keyframes at-trot{to{transform:translateY(-2.5px)}}
@keyframes at-queue{0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(9deg)}}
@keyframes at-lave{from{transform:rotate(-158deg)} to{transform:rotate(-170deg)}}
@keyframes at-salut{from{transform:rotate(-96deg)} to{transform:rotate(-142deg)}}
@keyframes at-regard{0%,40%,100%{transform:rotate(0)} 50%,85%{transform:rotate(-6deg)}}
@keyframes at-respire{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.015,1.055)}}
@keyframes at-zzz{0%{opacity:0; transform:translate(0,6px) scale(.6)} 30%{opacity:1} 100%{opacity:0; transform:translate(10px,-16px) scale(1.15)}}

/* Les modes (loupe, microscope, couleurs) */
.mode{position:absolute; inset:0; z-index:6; display:grid; grid-template-columns:minmax(0,1fr); align-content:start; gap:10px; padding:14px; overflow:auto;
  background:radial-gradient(ellipse at 50% 40%, rgba(43,33,72,.9), rgba(16,11,30,.97))}
@media (max-width:700px){ .mode{position:fixed; inset:0; z-index:60; padding:max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px))} }
.mode-tete{display:flex; justify-content:space-between; align-items:center; gap:10px}
.mode-tete h2{font-size:24px; color:var(--or)}
.fermer{width:46px; height:46px; border-radius:50%; border:3px solid var(--K); background:var(--nuit-3); color:var(--lune); font-size:20px; cursor:pointer; flex:none}
.coeurs{font-size:22px; letter-spacing:2px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:10px 22px; border-radius:999px; border:3px solid var(--K);
  background:linear-gradient(180deg,#ffe08a,#e8a93a); color:#111; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #b07a1c, 0 8px 16px rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #b07a1c}
.btn:disabled{filter:grayscale(.7); opacity:.5; cursor:not-allowed; transform:none}
.btn.second{background:rgba(238,240,255,.08); color:var(--lune); border-color:var(--trait); box-shadow:none}
.rond{animation:rond 1.4s ease-in-out infinite}
@keyframes rond{0%,100%{box-shadow:0 0 0 0 rgba(245,185,69,.85), 0 4px 0 #b07a1c} 50%{box-shadow:0 0 0 10px rgba(245,185,69,0), 0 4px 0 #b07a1c}}

/* La loupe */
.loupe-zone{display:grid; justify-items:center; gap:8px}
.verre{position:relative; width:min(100%, 340px); aspect-ratio:1}
.verre canvas{position:absolute; inset:7%; width:86%; height:86%; border-radius:50%; display:block}
.verre svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.verre .etq{position:absolute; bottom:15%; font-family:var(--f-main); font-size:18px; font-weight:700; color:#1a2238; background:rgba(255,255,255,.7); padding:0 8px; border-radius:8px}
.verre .etq.g{left:22%} .verre .etq.d{right:22%}
.retour{min-height:24px; font-family:var(--f-main); font-size:21px; font-weight:700; text-align:center}
.retour.non{color:#ffb4a6} .retour.oui{color:#a8f0be}
.tiroir{background:linear-gradient(180deg,#c98450,#9a5c31); border:4px solid var(--K); border-radius:12px; padding:10px; box-shadow:inset 0 6px 0 rgba(255,255,255,.18), 0 10px 20px rgba(0,0,0,.4); animation:tiroir .45s ease-out}
@keyframes tiroir{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.tiroir-nom{display:flex; justify-content:space-between; font-family:var(--f-main); font-size:21px; font-weight:700; color:#2b1a0c; margin:0 4px 6px}
.rangee{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity}
.ech{flex:none; width:118px; scroll-snap-align:start; border:3px solid var(--K); border-radius:10px; background:#f6efe0; padding:4px; cursor:pointer; display:grid; gap:2px; color:var(--encre)}
.ech canvas{width:100%; height:64px; display:block; border-radius:6px}
.ech .nm{font-family:var(--f-main); font-size:17px; font-weight:700; line-height:1.05}
.ech[aria-pressed="true"]{outline:4px solid var(--or); outline-offset:1px}
.ech.barre{opacity:.4} .ech.barre .nm{text-decoration:line-through}
.ech:disabled{cursor:default}

/* Le microscope */
.micro-zone{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; justify-items:center}
@media (max-width:620px){ .micro-zone{grid-template-columns:1fr} }
.oculaire{position:relative; width:min(100%, 420px); aspect-ratio:1}
.oculaire canvas{position:absolute; inset:9%; width:82%; height:82%; border-radius:50%; display:block; touch-action:none; cursor:grab; transition:filter .2s}
.oculaire canvas.flou{filter:blur(6px)}
.oculaire > svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.oculaire .bulle-l{position:absolute; transform:translate(-50%, calc(-100% - 10px)); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:12px; padding:3px 9px; font-family:var(--f-main); font-size:19px; font-weight:700; white-space:nowrap; pointer-events:none; animation:pop .2s ease-out}
.cote{display:grid; gap:12px; justify-items:center}
.tourelle{display:flex; gap:6px}
@media (min-width:621px){ .tourelle{flex-direction:column} }
.objectif{border:0; background:none; padding:0; cursor:pointer; width:74px}
.objectif svg{display:block; width:100%; height:auto}
.objectif[aria-pressed="true"] svg{filter:drop-shadow(0 0 8px #ffd36a)}
.plateau{display:flex; gap:6px; background:linear-gradient(180deg,#c98450,#9a5c31); border:3px solid var(--K); border-radius:12px; padding:6px 8px}
.plateau .coupe{width:58px}
.plateau .coupe svg{display:block; width:100%; height:auto}
.vol{position:fixed; z-index:80; pointer-events:none; transition:left .7s cubic-bezier(.5,0,.5,1), top .7s cubic-bezier(.5,-.5,.6,1), transform .7s; font-size:22px}

/* Les couleurs */
.couleurs-zone{display:grid; gap:12px; justify-items:center}
.verres{display:flex; gap:clamp(16px, 6vw, 60px); align-items:flex-end; justify-content:center; flex-wrap:wrap}
.verres figure{margin:0; display:grid; justify-items:center; gap:4px; font-family:var(--f-main); font-size:20px; font-weight:700}
.verres svg{width:clamp(110px, 28vw, 160px); height:auto; overflow:visible}
.pots{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.pot{border:0; background:none; cursor:pointer; padding:0; display:grid; justify-items:center; font-family:var(--f-main); font-size:17px; font-weight:700; color:var(--lune); width:72px}
.pot svg{width:56px; height:auto}
.gouttes-mix{font-family:var(--f-main); font-size:19px; color:var(--brume); min-height:26px; text-align:center}
.actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

/* La fiche d'analyse */
.fiche{background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:6px 18px 6px 18px; padding:16px; position:relative; box-shadow:0 10px 30px rgba(0,0,0,.45); min-width:0;
  background-image:repeating-linear-gradient(180deg, transparent 0 31px, rgba(107,84,52,.13) 31px 32px)}
.fiche h2{font-size:24px}
.fiche .ori{font-size:14px; color:var(--encre-2); margin:2px 0 10px}
.fiche h3{font-size:18px; margin:14px 0 4px; color:var(--encre-2)}
.notes{list-style:none; margin:0; padding:0; font-family:var(--f-main); font-size:21px; line-height:1.15; display:grid; gap:5px}
.notes li.rien{color:var(--encre-2); opacity:.7}
.notes li.nouveau{animation:ecrit .6s ease-out}
@keyframes ecrit{from{opacity:0; transform:translateX(-8px)} to{opacity:1; transform:none}}
.barde{background:rgba(255,143,179,.18); border:2px dashed #b4507a; border-radius:10px; padding:6px 8px; font-family:var(--f-main); font-size:20px; line-height:1.15}
.etiquette{display:grid; gap:8px; font-size:15px}
.etiquette label{display:grid; gap:2px}
.etiquette select{font:inherit; font-family:var(--f-main); font-size:21px; font-weight:700; color:var(--encre); background:var(--parchemin-2); border:2px solid var(--encre-2); border-radius:10px; padding:2px 8px; width:100%}
.etiquette select:disabled{opacity:.55}
.verrou{font-size:13px; color:var(--encre-2)}
.fiche .btn{width:100%; margin-top:6px}
.msg-fiche{font-size:15px; color:#9b2d1f; margin:0}
.tampon{position:absolute; top:62px; right:14px; border:4px solid var(--tampon); color:var(--tampon); font-family:var(--f-titre); font-size:30px; padding:2px 12px; border-radius:8px; transform:rotate(-14deg); opacity:0; pointer-events:none; background:rgba(243,231,203,.6)}
.tampon.on{animation:tamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes tamp{from{opacity:0; transform:rotate(-14deg) scale(2.2)} to{opacity:.92; transform:rotate(-14deg) scale(1)}}
.patte{position:absolute; top:122px; right:34px; width:44px; opacity:0; transform:rotate(18deg)}
.patte.on{opacity:.75; transition:opacity .3s .5s}
.resultat{margin-top:12px; background:var(--nuit-2); color:var(--lune); border-radius:14px; padding:12px; display:grid; gap:8px}
.code{display:flex; gap:8px; font-size:34px; justify-content:center}
.code span{background:var(--nuit-3); border:2px solid var(--trait); border-radius:12px; width:58px; height:58px; display:grid; place-items:center}
.petit{font-size:14px; color:var(--brume); margin:0}
@media (prefers-reduced-motion: reduce){ .flamme,.vapeur,.halo-sel,.indice-touche,.rond,.at-c-queue,.at-c-assis .at-c-tete,.at-respire,.at-zzz{animation:none} .mimi{transition:none} .tiroir{animation:none} }
</style>

<div class="app">
  <div class="barre-haut">
    <h1>Le labo de l'Alchimiste</h1>
    <span class="maquette">Maquette · rien n'est construit dans le jeu</span>
    <div class="niveau" role="group" aria-label="Difficulté">
      <button type="button" id="nvF" aria-pressed="true">Enquête 1</button>
      <button type="button" id="nvD" aria-pressed="false">Plus difficile</button>
      <button type="button" id="bRecommencer" aria-label="Recommencer">🔁</button>
    </div>
  </div>
  <div class="cadre" id="cadre">
    <div class="decor">
      <svg id="scene" viewBox="0 0 1000 640" role="img" aria-label="La paillasse de l'Alchimiste"></svg>
      <div class="calque" id="calque"></div>
    </div>
    <div class="mode" id="mode" hidden></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var reduit = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function dire(t){ try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; speechSynthesis.speak(u); }catch(e){} }
function rng(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexRgb(h){ h = String(h).replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgbHex(r){ return '#' + r.map(function(v){ v = Math.round(Math.max(0, Math.min(255, v))); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
function melange(a, b, t){ var x = hexRgb(a), y = hexRgb(b); return rgbHex([0,1,2].map(function(i){ return x[i] + (y[i]-x[i])*t; })); }
function clair(c, t){ return melange(c, '#ffffff', t); }
function sombre(c, t){ return melange(c, '#1c1230', t); }
function ease(p){ return p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2; }
function tween(dur, f, fin){ var t0 = performance.now(); if(reduit) dur = 1; (function pas(now){ var p = Math.min(1, (now - t0)/dur); f(ease(p), p); if(p < 1) requestAnimationFrame(pas); else if(fin) fin(); })(t0); }
function prep(cv){ var dpr = Math.min(window.devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(); var w = Math.max(10, Math.round(r.width)), h = Math.max(10, Math.round(r.height));
  if(cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; } var ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx:ctx, w:w, h:h}; }

function lancerBoucle(){ cancelAnimationFrame(boucle); if(S.mode === 'micro' && (S.zoom === 100 || S.zoom === 10) && !reduit){ var f = function(){ rendLentille(); boucle = requestAnimationFrame(f); }; boucle = requestAnimationFrame(f); } }

}
demarrer('facile');
window.__labo = {etat:function(){ return S; }, rendre:function(){ rendLentille(); }};
})();
