<title>Le labo de l'Alchimiste</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@500;700&family=Macondo&display=swap">
<style>
/* Mise en page : on est penché sur la paillasse de l'atelier, qui remplit tout l'écran. Les gros plans (loupe, tiroirs, microscope,
   bandelette) sont des zooms de cette même image : seul ce que l'œil voit dans l'outil vient se poser par-dessus.
   La paillasse et le mur prennent le style choisi dans l'atelier. Tout se mesure avec --u (un point du dessin, 1200 × 640). */
:root{
  --nuit:#131932; --nuit-2:#1c2447; --nuit-3:#28325e; --trait:#3b4679; --brume:#a6aed8; --lune:#eef0ff;
  --parchemin:#f3e7cb; --parchemin-2:#e8d7ae; --encre:#35281b; --encre-2:#6b5434;
  --or:#f5b945; --mousse:#7cc493; --alchi:#b48cff; --K:#24182e;
  --f-titre:"Macondo", Georgia, "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-main:"Caveat", "Segoe Script", "Comic Sans MS", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0; height:100%; overflow:hidden}
body{background:#1b1430; color:var(--lune); font-family:var(--f-texte); font-size:17px; line-height:1.45; overscroll-behavior:none}
/* La page ne défile pas et ne zoome jamais (comme le jeu : pas de zoom par accident, pas de texte sélectionné en appuyant longtemps) */
html, body, body *{touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
.app{position:fixed; inset:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
button{font:inherit; color:inherit}
button:focus-visible, .mimi:focus-visible{outline:3px solid var(--or); outline-offset:2px}
svg [role="button"]{outline:none}
svg [role="button"]:focus-visible .rond{opacity:1; stroke:#fff}
/* Les réglages de la maquette, rangés derrière un petit bouton */
.barre-haut{position:absolute; z-index:8; top:max(8px, env(safe-area-inset-top, 0px)); right:max(8px, env(safe-area-inset-right, 0px)); display:grid; justify-items:end; gap:6px}
body.ouvert .barre-haut{display:none}
#bReglages{border:1px solid var(--trait); background:rgba(28,36,71,.82); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--brume); cursor:pointer}
.reglages{display:grid; gap:6px; background:rgba(19,25,50,.94); border:1px solid var(--trait); border-radius:14px; padding:10px; max-width:min(330px, 92vw)}
.reglages .ligne{display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:13px; color:var(--brume)}
.reglages .ligne > span{min-width:68px}
.reglages button{border:1px solid var(--trait); background:var(--nuit-2); padding:5px 10px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--lune); min-height:32px}
.reglages button[aria-pressed="true"]{background:var(--nuit-3); border-color:var(--alchi)}

/* Dans le jeu : pas de réglages de maquette ; un bouton rond dans le coin pour revenir à l'atelier (jaune, avec ✔, quand une analyse vient d'être bouclée) */
.coin-jeu{display:none; position:absolute; z-index:8; top:max(8px, env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px))}
body.jeu .barre-haut{display:none}
body.jeu .coin-jeu{display:block}
body.ouvert .coin-jeu{display:none}
/* un téléphone tenu debout (« Tourne ton téléphone ») : le bouton du coin reste par-dessus, pour pouvoir toujours revenir à l'atelier */
@media (orientation:portrait) and (max-width:620px){ body.jeu .coin-jeu{display:block!important; z-index:100} }
#bQuitter.aller{background:linear-gradient(180deg,#ffe08a,#e8a93a); color:#111; font-weight:800; animation:battreQ 1.3s ease-in-out infinite}
@keyframes battreQ{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 0 rgba(255,211,106,.9)} 50%{box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 11px rgba(255,211,106,0)}}
/* Le bouton 🔊 d'un texte de plus de trois mots, et le petit papier « le savais-tu » */
.b-son{flex:none; pointer-events:auto; display:grid; place-items:center; width:max(38px, calc(46*var(--u))); height:max(38px, calc(46*var(--u))); border-radius:50%; border:2px solid var(--K); background:#fff6d8; font-size:max(16px, calc(22*var(--u))); line-height:1; padding:0; cursor:pointer}
.bulle-o.avec-son, .bulle-l.avec-son{display:flex; align-items:center; gap:7px; text-align:left}
.savoir{display:flex; align-items:flex-start; gap:calc(8*var(--u)); background:var(--parchemin); color:var(--encre); border:max(2px, calc(3.5*var(--u))) solid var(--K); border-radius:calc(14*var(--u)); padding:calc(10*var(--u)) calc(12*var(--u)); font-family:var(--f-main); font-weight:700; font-size:max(15px, calc(25*var(--u))); line-height:1.12; box-shadow:0 calc(5*var(--u)) 0 rgba(0,0,0,.35); z-index:7; cursor:pointer; rotate:-1.5deg; animation:pop3 .35s ease-out}
.savoir .sv-ic{flex:none; font-size:1.05em}
.savoir .sv-t{flex:1; min-width:0}
@keyframes pop3{from{opacity:0; scale:.7} to{opacity:1; scale:1}}

/* La paillasse */
.cadre{position:absolute; inset:0; overflow:hidden; background:#1b1430; --u:1px}
.decor, .hud-boite{position:absolute; inset:0; margin:auto; width:calc(1200*var(--u)); height:calc(640*var(--u))}
.decor{transform-origin:50% 50%; transition:transform .55s cubic-bezier(.4,0,.2,1)}
#scene{display:block; position:absolute; inset:0; width:100%; height:100%; overflow:visible; user-select:none; -webkit-user-select:none}
.pose{position:absolute}
#scene [data-act]{cursor:pointer}
.calque{position:absolute; inset:0; pointer-events:none}
/* Le rond jaune : ce qu'on peut toucher maintenant */
.rond{fill:none; stroke:#ffd36a; stroke-width:4; opacity:0; pointer-events:none; filter:drop-shadow(0 0 5px rgba(255,211,106,.95))}
body:not(.choisi) .objet .rond{opacity:.9; animation:rond 1.4s ease-in-out infinite}
.objet.sel .rond{opacity:1; stroke-width:5.5}
/* reconnu : c'est fini pour lui, il ne clignote plus */
body:not(.choisi) .objet.fait .rond, body:not(.choisi) .objet.attend .rond{opacity:0; animation:none}
[data-outil].ok .rond{opacity:1; animation:rond 1.2s ease-in-out infinite}
[data-outil].non{filter:grayscale(1) brightness(.72); opacity:.6; cursor:not-allowed}
/* dans un gros plan, seuls brillent ce qu'on peut toucher là : les tiroirs sous la loupe, la molette du microscope */
body.ouvert .rond{opacity:0!important; animation:none!important}
body.m-loupe:not(.fait) [data-act="tiroir"]:not(.tire) .rond, body.m-loupe .rond-casier, body.m-micro .toujours-micro{opacity:1!important; animation:rond 1.2s ease-in-out infinite!important}
.rond-casier{stroke-width:3}
#gArdoise.pret .rond{opacity:1; animation:rond 1.4s ease-in-out infinite}
#gArdoise:not(.pret){cursor:default}
body.m-micro .toujours-micro{stroke-width:2.5}
body.m-loupe #loupeMobile{opacity:0; transition:opacity .25s .3s}
@keyframes rond{0%,100%{opacity:.3} 50%{opacity:1}}
.flamme{transform-box:fill-box; transform-origin:50% 100%; animation:flamme .9s ease-in-out infinite alternate; transition:transform .3s}
.flamme.verte{filter:hue-rotate(95deg) saturate(1.6)}   /* (enquête 2 : le cuivre colore la flamme en vert) */
.flamme.bleue{filter:hue-rotate(190deg) saturate(1.4) brightness(.9)}   /* (enquête 2 : le soufre brûle avec une petite flamme bleue) */
@keyframes flamme{from{transform:scaleY(1) skewX(-3deg)} to{transform:scaleY(1.14) skewX(4deg)}}
.vapeur{animation:vapeur 2.8s ease-in-out infinite} .vapeur.v2{animation-delay:-1.4s}
@keyframes vapeur{0%{opacity:0; transform:translateY(8px)} 40%{opacity:.75} 100%{opacity:0; transform:translateY(-22px)}}
.secoue-svg{animation:secoueV .45s; transform-box:fill-box}
@keyframes secoueV{0%,100%{transform:none} 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)}}
#ardoise .formes{animation:craie 1.6s ease-in-out infinite alternate}
@keyframes craie{from{opacity:.75} to{opacity:1}}
.obj{opacity:.55; transition:opacity .3s} .obj.actif{opacity:1}
.num.actif text{fill:#b3262f}
#molette{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}

/* Bulles posées sur la paillasse */
.bulle-o{position:absolute; transform:translate(-50%, calc(-100% - 12px)); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:14px; padding:6px 10px; font-family:var(--f-main); font-size:clamp(15px, calc(25*var(--u)), 28px); font-weight:700; line-height:1.15; width:max-content; max-width:min(320px, 46%); text-align:center; pointer-events:none; animation:pop .25s ease-out; z-index:5}
.bulle-o::after{content:""; position:absolute; left:50%; bottom:-11px; width:16px; height:16px; background:var(--parchemin); border-right:3px solid var(--K); border-bottom:3px solid var(--K); transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{opacity:0; transform:translate(-50%, calc(-100% - 2px)) scale(.8)} to{opacity:1}}

/* Mimi (le dessin du jeu) : on ne le voit pas ; parfois il bondit sur la paillasse et s'assoit sur les échantillons (on le chasse ou on le porte), puis il sort de l'écran */
.mimi[hidden]{display:none!important}
.mimi{position:absolute; width:calc(15.5%*var(--taille, 1)); pointer-events:auto; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; transform:translate(-50%, -93%) rotate(var(--tangage, 0deg)); z-index:4}
.mimi.porte{cursor:grabbing; z-index:6; filter:drop-shadow(0 calc(14*var(--u)) calc(8*var(--u)) rgba(0,0,0,.35))}
.mimi svg{display:block; width:100%; height:auto; overflow:visible; transform-origin:50% 100%}
.cadre.ouvert .mimi{display:none}
.mimi.elan svg{scale:1.06 .84}
.mimi .at-ombre{opacity:0}
.mimi .dit{position:absolute; bottom:104%; left:50%; transform:translateX(-50%); background:var(--parchemin); color:var(--encre); border:2px solid var(--K); font-family:var(--f-main); font-size:max(15px, calc(24*var(--u))); font-weight:700; padding:0 10px; border-radius:12px; white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none; z-index:2}
.mimi .dit.on{opacity:1}
.coeur-v{position:absolute; left:50%; top:0; font-size:20px; animation:coeurV 1.2s ease-out forwards; pointer-events:none}
@keyframes coeurV{from{opacity:1; transform:translate(-50%,0) scale(.6)} to{opacity:0; transform:translate(-50%,-60px) scale(1.2)}}
.at-t-chat .at-c-g-dort,.at-t-chat .at-c-g-assis,.at-t-chat .at-c-g-debout,.at-t-chat .at-zzz,.at-t-chat .at-c-ferme{display:none}
.at-t-chat.at-c-dort .at-c-g-dort,.at-t-chat.at-c-dort .at-zzz{display:inline}
.at-t-chat.at-c-assis .at-c-g-assis,.at-t-chat.at-c-lave .at-c-g-assis,.at-t-chat.at-c-salut .at-c-g-assis{display:inline}
.at-t-chat.at-c-marche .at-c-g-debout{display:inline}
.at-t-chat.at-c-gauche:not(.at-c-dort) svg{transform:scaleX(-1)}
.at-c-j,.at-c-patte,.at-c-patte-b,.at-c-queue,.at-c-tete,.at-c-corps,.at-respire{transform-box:fill-box}
.at-c-j{transform-origin:50% 0}
.at-c-marche .at-c-j1,.at-c-marche .at-c-j4{animation:at-pas .32s ease-in-out infinite alternate}
.at-c-marche .at-c-j2,.at-c-marche .at-c-j3{animation:at-pas .32s ease-in-out infinite alternate-reverse}
.at-c-marche .at-c-corps{animation:at-trot .16s ease-in-out infinite alternate}
.saut.at-c-marche .at-c-j1,.saut.at-c-marche .at-c-j2{animation:none; transform:rotate(38deg)}
.saut.at-c-marche .at-c-j3,.saut.at-c-marche .at-c-j4{animation:none; transform:rotate(-38deg)}
.saut.at-c-marche .at-c-corps{animation:none}
.at-c-queue{transform-origin:100% 100%; animation:at-queue 2.6s ease-in-out infinite}
.at-c-marche .at-c-queue{animation-duration:.8s}
.at-c-patte{transform-origin:50% 6%}
.at-c-lave .at-c-patte{animation:at-lave .6s ease-in-out infinite alternate}
.at-c-lave .at-c-tete{transform-origin:50% 100%; transform:rotate(-7deg)}
.at-c-lave .at-c-yeux{display:none}
.at-c-lave .at-c-ferme{display:inline}
.at-c-salut .at-c-patte{animation:at-salut .42s ease-in-out infinite alternate}
.at-c-assis .at-c-tete{transform-origin:50% 100%; animation:at-regard 5s ease-in-out infinite}
.at-respire{transform-origin:50% 100%; animation:at-respire 3s ease-in-out infinite}
.at-zzz{animation:at-zzz 3s linear infinite} .at-zzz.z2{animation-delay:-1.5s}
.sursaut svg{animation:sursaut .5s ease-out}
@keyframes sursaut{0%,100%{translate:0 0} 40%{translate:0 -18%}}
@keyframes at-pas{from{transform:rotate(-24deg)} to{transform:rotate(24deg)}}
@keyframes at-trot{to{transform:translateY(-2.5px)}}
@keyframes at-queue{0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(9deg)}}
@keyframes at-lave{from{transform:rotate(-158deg)} to{transform:rotate(-170deg)}}
@keyframes at-salut{from{transform:rotate(-96deg)} to{transform:rotate(-142deg)}}
@keyframes at-regard{0%,40%,100%{transform:rotate(0)} 50%,85%{transform:rotate(-6deg)}}
@keyframes at-respire{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.015,1.055)}}
@keyframes at-zzz{0%{opacity:0; transform:translate(0,6px) scale(.6)} 30%{opacity:1} 100%{opacity:0; transform:translate(10px,-16px) scale(1.15)}}


/* Ce qui se pose par-dessus dans un gros plan */
#hud{position:absolute; inset:0; z-index:6; pointer-events:none}
.hud-boite > *{pointer-events:auto}
.hud-boite > .verre-hud, .hud-boite > .pince-c, .hud-boite > .bulle-l, .hud-boite > .ruban, .hud-boite > .cone-hud{pointer-events:none}
.mode-haut{position:absolute; z-index:9; top:max(8px, env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); pointer-events:auto}
.fermer{width:50px; height:50px; border-radius:50%; border:3px solid var(--K); background:var(--nuit-3); color:var(--lune); font-size:21px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.35)}
.vol{position:fixed; z-index:80; pointer-events:none; margin:0; transition:left .38s ease-in, top .38s ease-in, transform .38s, opacity .38s}
.tampon{display:grid; place-items:center; font-size:calc(96*var(--u)); line-height:1; opacity:0; pointer-events:none; z-index:5}
.tampon.pop{animation:tampon 1.15s ease-out forwards}
@keyframes tampon{0%{opacity:0; transform:scale(2.3) rotate(-14deg)} 18%{opacity:1; transform:scale(1) rotate(-6deg)} 76%{opacity:1; transform:scale(1) rotate(-6deg)} 100%{opacity:0; transform:scale(1.05) rotate(-6deg)}}
.ruban{position:absolute; transform:translateX(-50%); display:grid; place-items:center; height:calc(52*var(--u)); padding:0 calc(22*var(--u)); background:var(--parchemin); color:var(--encre); border:calc(3.5*var(--u)) solid var(--K); border-radius:calc(13*var(--u)); font-family:var(--f-main); font-weight:700; font-size:calc(34*var(--u)); white-space:nowrap; box-shadow:0 calc(5*var(--u)) 0 rgba(0,0,0,.35), 0 0 calc(18*var(--u)) rgba(127,224,138,.7); z-index:5; animation:pop2 .4s ease-out}
@keyframes pop2{from{opacity:0; transform:translateX(-50%) scale(.6)} to{opacity:1; transform:translateX(-50%)}}

/* Le grand verre de la loupe */
.verre-hud{position:absolute; transition:left .45s, top .45s, width .45s, height .45s; animation:grossit .4s ease-out; filter:drop-shadow(0 calc(8*var(--u)) calc(10*var(--u)) rgba(0,0,0,.45))}
@keyframes grossit{from{scale:.2; opacity:0} to{scale:1; opacity:1}}
.verre-hud canvas{position:absolute; inset:5.5%; width:89%; height:89%; border-radius:50%; display:block}
.verre-hud > svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.verre-hud .tampon{position:absolute; inset:16%}
.anneau{stroke:transparent; transition:stroke .2s}
.verre-hud.bon .anneau{stroke:rgba(127,224,138,.95)}
.verre-hud.faux .anneau{stroke:rgba(240,84,84,.95)}
.verre-hud.faux canvas, .bande-hud.faux canvas{animation:secoueV .45s}
/* Les deux flèches jaunes de la loupe : l'échantillon d'avant, l'échantillon d'après */
.fleche-l{display:grid; place-items:center; padding:0; border-radius:50%; border:calc(3.5*var(--u)) solid var(--K); background:linear-gradient(180deg,#ffe08a,#e8a93a); color:#111; font-size:calc(26*var(--u)); line-height:1; cursor:pointer; box-shadow:0 calc(4*var(--u)) 0 rgba(0,0,0,.35); transition:left .45s, top .45s; z-index:6}
.fleche-l.bat{animation:battre 1.3s ease-in-out infinite}
/* Le cône de lumière du microscope */
.cone-hud{animation:cone .6s ease-out both}
.cone-point{animation:flammeP 1.6s ease-in-out infinite alternate}
@keyframes cone{from{opacity:0} to{opacity:1}}
@keyframes flammeP{from{opacity:.65} to{opacity:1}}
/* Dans le tiroir ouvert : les trois casiers, puis les échantillons */
.onglets{display:flex; gap:calc(10*var(--u)); align-items:stretch; pointer-events:none}
.onglets > *{pointer-events:auto}
.onglet{display:flex; align-items:center; gap:calc(7*var(--u)); padding:0 calc(18*var(--u)); border:calc(3*var(--u)) solid var(--K); border-radius:calc(11*var(--u)); background:#fff6d8; color:var(--encre); font-family:var(--f-main); font-weight:700; font-size:calc(27*var(--u)); line-height:1; cursor:pointer; box-shadow:0 calc(3*var(--u)) 0 rgba(0,0,0,.35)}
.onglet svg{width:calc(38*var(--u)); height:calc(32*var(--u)); flex:none}
.onglet[aria-pressed="true"]{background:var(--or)}
.onglet.refermer{margin-left:auto; background:linear-gradient(180deg,#ecb882,#c98450)}
.poignee-o{width:calc(40*var(--u)); height:calc(14*var(--u)); border-radius:999px; background:linear-gradient(180deg,#fff1b8,#f5b945 50%,#b07a1c); border:calc(2.5*var(--u)) solid var(--K)}
.casiers{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:calc(18*var(--u))}
.casier{position:relative; min-width:0; border:calc(4*var(--u)) solid var(--K); border-radius:calc(12*var(--u)); background:rgba(20,40,34,.45); cursor:pointer; display:grid; justify-items:center; align-content:center; gap:calc(8*var(--u)); box-shadow:inset 0 calc(10*var(--u)) calc(14*var(--u)) rgba(0,0,0,.35)}
.casier svg{width:calc(150*var(--u)); height:calc(126*var(--u))}
.casier .plaque{background:#fff6d8; border:calc(2.5*var(--u)) solid var(--K); border-radius:calc(6*var(--u)); padding:0 calc(16*var(--u)); font-family:var(--f-main); font-weight:700; font-size:calc(32*var(--u)); color:var(--encre); line-height:1.2}
.casier .nb{position:absolute; top:calc(6*var(--u)); right:calc(12*var(--u)); font-family:var(--f-main); font-size:calc(24*var(--u)); color:#cfe6dc}
.rangee{display:grid; gap:calc(9*var(--u)); grid-auto-rows:minmax(0, 1fr)}
.ech{position:relative; min-width:0; min-height:0; border:calc(3*var(--u)) solid var(--K); border-radius:calc(9*var(--u)); background:#f6efe0; padding:calc(4*var(--u)); cursor:pointer; display:grid; grid-template-rows:minmax(0, 1fr) auto; gap:calc(1*var(--u)); color:var(--encre); box-shadow:0 calc(3*var(--u)) 0 rgba(0,0,0,.35)}
.ech canvas{width:100%; height:100%; min-height:0; display:block; border-radius:calc(5*var(--u))}
.ech .nm{font-family:var(--f-main); font-size:calc(20*var(--u)); font-weight:700; line-height:.95; min-height:calc(38*var(--u)); display:grid; place-items:center; text-align:center}
.ech[aria-pressed="true"]{outline:calc(4*var(--u)) solid var(--or)}
.ech.barre, .ech.flair, .temoin.barre, .temoin.flair{opacity:.45} .ech.barre .nm, .temoin.barre .nm{text-decoration:line-through}
.ech.ok, .temoin.ok{outline:calc(5*var(--u)) solid #7fe08a; background:#eaffea}
.ech:disabled, .temoin:disabled{cursor:default}
.marque{position:absolute; top:calc(2*var(--u)); right:calc(5*var(--u)); font-size:calc(24*var(--u))}
/* reconnu : un grand ✅ en plein sur la bonne carte, et les autres s'éteignent : il n'y a plus rien à chercher ici */
.ech.ok .marque, .temoin.ok .marque{top:42%; left:50%; right:auto; transform:translate(-50%,-50%); font-size:calc(60*var(--u)); line-height:1; filter:drop-shadow(0 calc(3*var(--u)) calc(3*var(--u)) rgba(0,0,0,.35))}
.rangee.fini .ech:not(.ok), .temoins.fini .temoin:not(.ok){opacity:1; filter:grayscale(1) brightness(.5) contrast(.8)}

/* ============ Les sons du labo : de petits sons discrets, fabriqués par le programme (comme ceux du jeu) ============
   Mêmes briques que moteur-base.js (note, tendre, bruit) : chaque son se recopie tel quel dans le jeu.
   Rien ne joue avant le premier toucher (les navigateurs l'interdisent), et le bouton 🔈 des réglages coupe tout. */
var SON = {actif:true, ctx:null};
try { if(localStorage.getItem('brumeval-labo-son') === 'non') SON.actif = false; } catch(e){}
function audio(){
  if(!SON.ctx){ try { SON.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ SON.ctx = null; } }
  if(SON.ctx && SON.ctx.state === 'suspended') try { SON.ctx.resume(); } catch(e){}
  return SON.ctx;
}
function note(f, t0, duree, type, vol, glisse){
  var a = audio(); if(!a) return; var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(glisse) o.frequency.exponentialRampToValueAtTime(glisse, t + duree);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + duree + 0.05);
}
/* Une note douce : attaque arrondie, fin en fondu ; un triangle passe par un filtre (son chaud, sans aigus durs) */
function tendre(f, t0, duree, vol, glisse, att, type, filtre){
  var a = audio(); if(!a) return; var t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(glisse) o.frequency.exponentialRampToValueAtTime(glisse, t + duree);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (att || 0.008)); g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
  if(filtre){ var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filtre; lp.Q.value = 0.5; o.connect(lp); lp.connect(g); } else o.connect(g);
  g.connect(a.destination); o.start(t); o.stop(t + duree + 0.03);
}
/* Un souffle : du bruit filtré dont la hauteur glisse de f0 à f1 (un tiroir qui coulisse, une loupe qui passe, une allumette) */
function souffle(t0, duree, vol, f0, f1, q, type){
  var a = audio(); if(!a) return; var t = a.currentTime + t0, n = Math.floor(a.sampleRate*duree), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(var i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf;
  f.type = type || 'bandpass'; f.Q.value = q || 0.8; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1 || f0, t + duree);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.06, duree*.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + duree + .02);
}
/* De tout petits grains secs (la craie, la poudre, le feu qui crépite) */
function grains(t0, duree, vol, nb, passeHaut){
  var a = audio(); if(!a) return; var t = a.currentTime + t0, sr = a.sampleRate, n = Math.floor(sr*duree), buf = a.createBuffer(1, n, sr), d = buf.getChannelData(0);
  for(var k = 0; k < nb; k++){ var c = Math.floor(n*Math.random()*.9), l = Math.floor(sr*(.001 + Math.random()*.004)), v = .4 + Math.random()*.6; for(var j = 0; j < l && c + j < n; j++) d[c + j] += (Math.random()*2 - 1)*v*(1 - j/l); }
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'highpass'; f.frequency.value = passeHaut || 2400; g.gain.value = vol;

}

/* Mimi, dans la vue de près : on ne le voit pas. De temps en temps (rarement), il bondit d'en bas de l'écran sur le plateau
   et s'assoit en plein sur les échantillons : il gêne ! On le touche : il s'en va, et il sort de l'écran pour de bon.
   On peut aussi le prendre avec le doigt et le poser ailleurs. */
var SIEGE = {x:600, y:466}, mimi = {el:null, x:0, y:0, enRoute:false, pose:false, sur:false, porte:false, geste:null, tv:0, tp:0, ditT:0, taille:1};
function tweenLin(dur, f, fin){ var t0 = performance.now(); if(reduit) dur = 1; (function pas(now){ var p = Math.min(1, (now - t0)/dur); f(p); if(p < 1) requestAnimationFrame(pas); else if(fin) fin(); })(t0); }
/* Un point hors de l'écran, sous le bord du bas (quelle que soit la taille de l'écran) */
function horsEcran(x){ var c = $('#cadre').getBoundingClientRect(), d = $('#decor').getBoundingClientRect(), u = d.width/1200 || 1; return {x:x == null ? 560 : x, y:640 + Math.max(0, c.bottom - d.bottom)/u + 230}; }
function mimiPlace(p){ mimi.x = p.x; mimi.y = p.y; var e = mimi.el; e.style.left = (p.x/12) + '%'; e.style.top = (p.y/6.4) + '%'; }
function mimiTaille(k){ mimi.taille = k; mimi.el.style.setProperty('--taille', k.toFixed(3)); }
function mimiPose(p, el){ el = el || mimi.el; ['assis','marche','dort','lave','salut'].forEach(function(c){ el.classList.remove('at-c-' + c); }); el.classList.add('at-c-' + p); }
function mimiSaut(vers, fin, taille, sansElan){
  var de = {x:mimi.x, y:mimi.y}, t0 = mimi.taille, t1 = taille || t0, haut = 40 + Math.abs(vers.y - de.y)*.3, sens = vers.x < de.x ? -1 : 1, e = mimi.el;
  e.classList.toggle('at-c-gauche', sens < 0); mimiPose('assis'); if(!sansElan) e.classList.add('elan');
  attendre(sansElan ? 0 : 200, function(){
    e.classList.remove('elan'); mimiPose('marche'); e.classList.add('saut'); son('saut');
    tweenLin(560, function(q){ mimiPlace({x:de.x + (vers.x - de.x)*q, y:de.y + (vers.y - de.y)*q - Math.sin(Math.PI*q)*haut}); mimiTaille(t0 + (t1 - t0)*q); e.style.setProperty('--tangage', (sens*(q - .5)*44).toFixed(1) + 'deg'); },
      function(){ e.classList.remove('saut'); e.classList.remove('at-c-gauche'); e.style.removeProperty('--tangage'); mimiPose('assis'); if(fin) fin(); });
  });
}
function mimiDit(t, saute){
  var m = mimi.el; if(!m) return; var d = m.querySelector('.dit'); d.textContent = t; d.classList.add('on'); clearTimeout(mimi.ditT); mimi.ditT = setTimeout(function(){ d.classList.remove('on'); }, 2200);
  if(saute && !mimi.enRoute){ m.classList.remove('sursaut'); void m.offsetWidth; m.classList.add('sursaut'); }
}
/* Où est-il ? Sur le plateau ? Assis sur les échantillons ? */
function surPlateau(p){ return p.y > YB + 16 && p.y < YF + 4 && Math.abs(p.x - 600) < (LARG - 14)*kY(Math.min(p.y, YF)); }
function surEchantillon(p){ return Math.abs(p.x - 600) < 196 && p.y > 404 && p.y < 520; }
function versScene(cx, cy){ var r = $('#decor').getBoundingClientRect(); return {x:(cx - r.left)/r.width*1200, y:(cy - r.top)/r.height*640}; }
/* Il vient : un bond depuis le bas de l'écran, et il s'installe sur le carré de cuir en ronronnant */
var SANS_MIMI = false;     /* (dans le jeu : pas de visite si l'Alchimiste n'a pas encore de chat) */
function mimiVisite(ms){ clearTimeout(mimi.tv); if(SANS_MIMI) return; mimi.tv = setTimeout(mimiVient, ms == null ? 15000 + Math.random()*8000 : ms); }
function mimiVient(){
  if(mimi.calme) return;
  /* (pendant l'explication en images et le guide de la première analyse, il laisse l'Alchimiste apprendre tranquille : il reviendra voir après) */
  if(document.querySelector('.intro') || (typeof GUIDE === 'object' && GUIDE && GUIDE.id && !GUIDE.fini)) return mimiVisite(20000);
  if(S.mode || S.occupe || mimi.enRoute || mimi.pose || mimi.porte || document.hidden) return mimiVisite(6000);
  mimi.enRoute = true; mimi.el.hidden = false; mimiTaille(1); mimiPlace(horsEcran(540));
  mimiSaut(SIEGE, function(){ mimi.enRoute = false; mimi.pose = true; mimi.sur = true; son('pose'); mimiDit('Mrrr…'); son('ronron'); majOutils(); }, .84, true);
}
/* Il s'en va : il saute par-dessus le bord de la paillasse et sort de l'écran. On ne le voit plus. */
function mimiSort(depuis){
  mimi.enRoute = true; mimi.sur = false; mimi.pose = false; majOutils();
  mimiSaut(horsEcran(mimi.x + (mimi.x < 600 ? -60 : 60)), function(){ mimi.enRoute = false; mimi.el.hidden = true; majOutils(); mimiVisite(55000 + Math.random()*35000); }, 1, depuis === 'main');
}
function mimiPart(muet){
  if(mimi.enRoute || mimi.porte) return; clearTimeout(mimi.tp);
  if(!muet){ mimiDit('Mraou !'); son('miaou'); }
  mimi.enRoute = true; attendre(muet ? 0 : 260, function(){ mimi.enRoute = false; mimiSort(); });
}
/* Il est assis dessus : tant qu'il n'a pas bougé, on ne peut rien faire des échantillons du cuir */
function mimiGene(){ if(!mimi.sur) return false; mimiDit('Mrrr ?', true); son('ronron'); return true; }
/* On le prend avec le doigt… */
function mimiPrend(){
  clearTimeout(mimi.tp); clearTimeout(mimi.tv); mimi.porte = true; mimi.sur = false; mimi.el.classList.add('porte'); mimiPose('marche'); mimi.el.classList.add('saut'); mimiDit('Mraou ?'); son('miaou'); majOutils();
}
/* … et on le repose : sur le plateau, il s'assoit là (et s'il est encore sur les échantillons, il gêne toujours) ; ailleurs, il sort de l'écran */
function mimiLache(p){
  var e = mimi.el; mimi.porte = false; e.classList.remove('porte'); e.classList.remove('saut'); mimiPose('assis');
  if(surPlateau(p)){ mimi.pose = true; mimi.sur = surEchantillon(p); mimiTaille(.84); son('pose'); majOutils(); if(mimi.sur) mimiDit('Mrrr…'); else mimi.tp = setTimeout(function(){ mimiPart(true); }, 7000); }
  else mimiSort('main');
}
/* Quand on revient d'un gros plan, ou qu'on recommence : il reprend sa petite vie */
function mimiReveil(){ if(mimi.el && !mimi.pose && !mimi.enRoute) mimiVisite(20000 + Math.random()*15000); }
function mimiRetour(){ clearTimeout(mimi.tp); clearTimeout(mimi.tv); mimi.enRoute = false; mimi.pose = false; mimi.sur = false; mimi.porte = false; mimi.geste = null; mimi.el.classList.remove('porte', 'saut', 'elan', 'at-c-gauche'); mimiTaille(1); mimi.el.hidden = true; mimiPose('assis'); mimiVisite(); }
function poserMimi(){
  var e = document.createElement('div'); e.className = 'mimi at-t-chat at-c-assis'; e.innerHTML = '<span class="dit"></span>' + svgChat();
  e.setAttribute('role', 'button'); e.setAttribute('aria-label', 'Mimi, le chat'); e.tabIndex = 0; e.hidden = true; mimi.el = e;
  $('#calque').appendChild(e);
  var touche = function(){ if(mimi.enRoute || mimi.porte) return; if(mimi.pose) mimiPart(); };
  e.addEventListener('pointerdown', function(ev){ if(mimi.enRoute || S.mode || S.occupe) return; mimi.geste = {id:ev.pointerId, x:ev.clientX, y:ev.clientY, bouge:false}; try { e.setPointerCapture(ev.pointerId); } catch(err){} });
  e.addEventListener('pointermove', function(ev){
    var g = mimi.geste; if(!g || g.id !== ev.pointerId) return;
    if(!g.bouge && Math.hypot(ev.clientX - g.x, ev.clientY - g.y) > 12){ g.bouge = true; mimiPrend(); }
    if(g.bouge){ var p = versScene(ev.clientX, ev.clientY); mimiPlace({x:p.x, y:p.y + 62*mimi.taille}); }
  });
  var fin = function(ev){ var g = mimi.geste; mimi.geste = null; if(!g || !g.bouge) return; mimi.avale = true; setTimeout(function(){ mimi.avale = false; }, 60); mimiLache({x:mimi.x, y:mimi.y}); };
  e.addEventListener('pointerup', fin); e.addEventListener('pointercancel', fin);
  e.addEventListener('click', function(){ if(mimi.avale) return; touche(); }); e.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); touche(); } });
  mimiVisite();
}

/* Le test des couleurs, comme dans un vrai labo : une goutte du liquide sur une bandelette de papier buvard, le pied dans un peu d'alcool.

function teinte(k){ return TEINTES.filter(function(t){ return t.k === k; })[0]; }
/* Une teinture est souvent un mélange : la bandelette montre alors les bandes de tous ses ingrédients, et chaque bande doit trouver le sien.

function ciblesLiq(){ var l = liqDe(S.dc); return l ? OBJETS[l].cibles : []; }

function bandesMelange(){ var l = []; ciblesLiq().forEach(function(k){ teinte(k).b.forEach(function(b){ l.push({k:k, y:b.y, h:b.h, c:b.c}); }); }); return l.sort(function(a, b){ return b.y - a.y; }); }

/* Ce qu'on garde d'une fois sur l'autre (le jeu le range dans la sauvegarde) */
/* (le cuir n'a que quatre places : un dossier qui n'y est pas cette fois-ci garde ce qu'on y avait fait, tel quel) */
var DOS_AILLEURS = {};
function exporter(){
  var e = {trouves:S.trouves, barres:S.barres, finis:S.finis, dits:S.dits, dos:JSON.parse(JSON.stringify(DOS_AILLEURS))};
  CUIRS.forEach(function(d){ var x = S.dos[d], pris = []; [10, 40, 100].forEach(function(z){ x.items[z].forEach(function(it, i){ if(it.pris) pris.push(z + ':' + i); }); });

function importer(e){
  if(!e || typeof e !== 'object') return;
  ['trouves', 'barres', 'finis', 'dits'].forEach(function(k){ if(e[k] && typeof e[k] === 'object') S[k] = JSON.parse(JSON.stringify(e[k])); });
  DOS_AILLEURS = {}; Object.keys(e.dos || {}).forEach(function(d){ if(CUIRS.indexOf(d) < 0) DOS_AILLEURS[d] = e.dos[d]; });
  CUIRS.forEach(function(d){ var x = S.dos[d], y = (e.dos || {})[d]; if(!y) return;

/* Le carré de cuir clair où l'on pose les échantillons : le même fond sous la loupe et sur les cartes des tiroirs */

  S.sel = t; son('choisir'); dessinerLame(); dessinerCoupes(); if(change){ majArdoise(); majBandeScene(); } majOutils();
  var p = posCible(); bulle(p.x, p.y - 18, S.trouves[t] ? '✅ ' + nomTrouve(t) : nomObjet(t), 1900);
}

/* ============ Les gouttes et la flamme ============ */
function goutte(k){
  if(S.occupe || S.mode) return; var b = BOCAUX.filter(function(x){ return x.k === k; })[0], cible = posCible(), pip = $('#pipette'), gt = $('#goutte');
  S.occupe = true; son(b.poudre ? 'poudre' : 'pipette'); pip.style.display = ''; $('#pipLiq').setAttribute('fill', b.poudre ? '#f6f6f2' : b.liq);
  var x0 = b.x, y0 = b.y - 96, x1 = cible.x, y1 = cible.y - 52;
  tween(560, function(p){ pip.setAttribute('transform', 'translate(' + f1(x0 + (x1 - x0)*p) + ',' + f1(y0 + (y1 - y0)*p - Math.sin(p*Math.PI)*30) + ')'); }, function(){
    gt.style.display = ''; gt.querySelector('path').setAttribute('fill', TACHE[k].replace(/[\d.]+\)$/, '1)'));
    tween(320, function(p){ gt.setAttribute('transform', 'translate(' + x1 + ',' + f1(y1 + 12 + p*36) + ')'); }, function(){
      gt.style.display = 'none'; son(b.poudre ? 'poudre' : 'goutte'); if(b.vapeur) son('chaud'); effetTache(cible, k); reaction(k, cible);
      tween(440, function(p){ pip.setAttribute('transform', 'translate(' + f1(x1 + (x0 - x1)*p) + ',' + f1(y1 + (y0 - y1)*p - Math.sin(p*Math.PI)*30) + ')'); }, function(){ pip.style.display = 'none'; S.occupe = false; majOutils(); });
    });
  });
}
function reaDe(k){ return (REA[S.sel] || {})[k] || RIEN; }
function effetTache(cible, k){
  var e = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse'); e.setAttribute('cx', cible.x); e.setAttribute('cy', cible.y + 2); e.setAttribute('fill', TACHE[k]); $('#effets').appendChild(e);
  var pali = reaDe(k).fx === 'pali', grand = surCuir(S.sel);
  tween(600, function(p){ e.setAttribute('rx', 5 + p*(grand ? 40 : 28)); e.setAttribute('ry', 2 + p*(grand ? 16 : 10)); });
  setTimeout(function(){ tween(pali ? 1600 : 900, function(p){ e.setAttribute('opacity', 1 - p); if(pali) e.setAttribute('fill', 'rgba(' + Math.round(205 + 40*p) + ',' + Math.round(115 + 110*p) + ',' + Math.round(30 + 170*p) + ',' + (.65*(1 - p*.6)) + ')'); }, function(){ e.remove(); }); }, pali ? 900 : 2600);
}
function petitesBulles(cible){
  var g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); $('#effets').appendChild(g);
  for(var i=0;i<6;i++) g.insertAdjacentHTML('beforeend', '<circle cx="' + (cible.x - 10 + Math.random()*20) + '" cy="' + cible.y + '" r="' + (1.5 + Math.random()*2) + '" fill="none" stroke="#fff" stroke-width="1.5"/>');
  var cs = g.querySelectorAll('circle'); tween(1400, function(p){ cs.forEach(function(c, i){ c.setAttribute('cy', cible.y - p*(18 + i*4)); c.setAttribute('opacity', 1 - p); }); }, function(){ g.remove(); });
}
/* Le petit nuage de couleur qui sort de l'échantillon quand l'eau chaude le fait déteindre */
function nuage(cible, coul, fin){
  var g = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse'); g.setAttribute('cx', cible.x); g.setAttribute('cy', cible.y); g.setAttribute('fill', 'rgba(' + hexRgb(coul).join(',') + ',.75)'); $('#effets').appendChild(g);
  tween(1000, function(p){ g.setAttribute('rx', 10 + p*46); g.setAttribute('ry', 4 + p*18); }, function(){ setTimeout(function(){ g.remove(); fin(); }, 300); });
}
function reaction(k, cible){
  var r = reaDe(k), t = S.sel;
  bulle(cible.x, cible.y - 20, r.t, 5200);
  if(r.cree && !D().coupes.some(function(c){ return c && c.t === r.cree; })) nuage(cible, OBJETS[r.cree].coul || couleurLiq(r.cree), function(){ ajouterCoupe(r.cree); dessinerCoupes(); garder(); });
  if(r.fx === 'delave' && S.dos[t]){ S.dos[t].delave = true; garder(); }
  if(r.fx === 'vire'){ S.teinte = r.c; dessinerCoupes(); dessinerLame(); setTimeout(function(){ S.teinte = null; dessinerCoupes(); dessinerLame(); }, 2600); }
  if(r.fx === 'bulles'){ petitesBulles(cible); son('bulles'); }
  if(r.cree || r.fx === 'vire' || r.fx === 'pali') son('taches');
}
function flamme(){
  if(S.occupe || S.mode) return; var cible = posCible(), pince = $('#pince'), bout = $('#pinceBout'), r = reaDe('flamme'), o = OBJETS[S.sel], cuir = surCuir(S.sel);
  S.occupe = true; son('pince'); pince.style.display = ''; bout.setAttribute('fill', S.sel === 'fil' ? ROUGE : (o.liquide ? couleurLiq(S.sel) : (o.coul || ({poils:'#2a2a2e', plume:'#17171d'})[S.sel] || '#555')));
  var x0 = cible.x, y0 = cible.y, x1 = BOUGIE.x, y1 = BOUGIE.y - 86*BOUGIE.e;
  tween(680, function(p){ pince.setAttribute('transform', 'translate(' + f1(x0 + (x1 - x0)*p) + ',' + f1(y0 + (y1 - y0)*p - Math.sin(p*Math.PI)*46) + ')'); }, function(){
    var f = $('#gLampe .flamme'); f.style.transform = 'scale(1.45)'; son('flamme'); if(r.verte) f.classList.add('verte'); if(r.bleue) f.classList.add('bleue');
    /* (la poudre du pot noir fuse : une grosse fumée rouge ; enquête 2) */
    var fumee = ''; for(var i=0;i<(r.fumeeRouge ? 7 : 4);i++) fumee += '<circle cx="' + (x1 + (r.fumeeRouge ? (i - 3)*7 : i*4)) + '" cy="' + (y1 - 14) + '" r="' + (r.fumeeRouge ? 9 + i*3 : 5 + i*2.5) + '" fill="' + (r.fumeeRouge ? 'rgba(200,40,50,.55)' : 'rgba(120,120,130,.45)') + '"/>';
    $('#effets').insertAdjacentHTML('beforeend', '<g id="fumee">' + fumee + '</g>');
    var cs = document.querySelectorAll('#fumee circle'); tween(1300, function(p){ cs.forEach(function(c, i){ c.setAttribute('cy', y1 - 14 - p*(60 + i*18)); c.setAttribute('opacity', 1 - p); }); });
    if(cuir) bout.setAttribute('fill', '#1a1210'); if(r.braise) bout.setAttribute('fill', '#ff6a2a');
    attendre(1300, function(){ f.style.transform = ''; f.classList.remove('verte', 'bleue'); var g = $('#fumee'); if(g) g.remove(); bulle(x1 + 60, y1 - 6, r.t, 5600);
      if(r.trouve && !S.dits['t:' + r.trouve]){ S.dits['t:' + r.trouve] = 1; dire('trouve', {id:r.trouve}); garder(); }   /* (une trouvaille en plus, dite par la réaction : le cuivre) */
      tween(520, function(p){ pince.setAttribute('transform', 'translate(' + f1(x1 + (x0 - x1)*p) + ',' + f1(y1 + (y0 - y1)*p) + ')'); }, function(){ pince.style.display = 'none'; S.occupe = false; majOutils(); });
    });
  });
}

/* ============ L'ardoise : quand le code est écrit, on la touche pour le voir en grand ============ */
function ouvrirArdoise(){ if(S.occupe || !codePret()) return; ouvrirMode('ardoise', ''); camera(ARD.x + ARD.w/2, ARD.y + ARD.h/2 + 2, 3.4); }

/* ============ Branchements ============
   Un toucher « à côté », dans un gros plan, fait revenir d'un pas : les échantillons se rangent, puis le tiroir se referme,
   puis on quitte le gros plan. (La croix en haut à droite quitte d'un seul coup.) */
var clic = {pris:false, mode:null, occupe:false};
document.addEventListener('click', function(){ clic.pris = false; clic.mode = S.mode; clic.occupe = S.occupe; }, true);
function dansVerre(e){ var v = S.verre, b = $('#hudBoite').getBoundingClientRect(), u = b.width/1200; return !!v && Math.hypot((e.clientX - b.left)/u - v.x, (e.clientY - b.top)/u - v.y) < v.r; }
function reculer(e){
  if(S.occupe) return;
  if(S.mode === 'loupe'){ if(dansVerre(e)) return; if(S.casier) fermerCasier(); else if(S.tiroir) fermerTiroir(); else fermerMode(); }
  else if(S.mode === 'micro'){ if(e.target.closest('#gMicro, [data-act="coupe"]')) return; fermerMode(); }
  else fermerMode();
}
$('#scene').addEventListener('click', function(e){
  var g = e.target.closest('[data-act]'); if(!g || S.occupe) return; var a = g.dataset.act, z, k;
  /* dans un gros plan, l'image reste vivante : les tiroirs et leurs casiers sous la loupe, la molette du microscope */
  if(S.mode === 'loupe'){
    /* un autre échantillon, visible à côté du verre : la loupe y va directement */
    if((a === 'lame' || a === 'coupe') && !dansVerre(e)){ var autre = a === 'lame' ? g.dataset.t : (D().coupes[+g.dataset.i] || {}).t; if(autre && !OBJETS[autre].liquide && autre !== S.sel && !(ATTENTE[autre] && !S.finis[autre])){ clic.pris = true; changerCible(autre); } return; }
    if(a !== 'tiroir') return; clic.pris = true;
    if(S.tiroir !== g.dataset.t) ouvrirTiroir(g.dataset.t); else if((k = e.target.closest('[data-casier]'))) ouvrirCasier(k.dataset.casier); else fermerTiroir();
    return; }
  if(S.mode === 'micro'){ if((z = e.target.closest('[data-zoom]'))){ clic.pris = true; changerZoom(+z.dataset.zoom); } else if(a === 'molette' || a === 'micro'){ clic.pris = true; changerZoom(({10:40, 40:100, 100:10})[S.zoom]); } return; }
  if(S.mode) return;
  clic.pris = true;
  if(a === 'molette') g = $('#gMicro'), a = 'micro';
  if(a === 'ardoise'){ if(codePret()) ouvrirArdoise(); else son('clic'); return; }
  if(a === 'lame') return selectionner(g.dataset.t);
  if(a === 'coupe'){ var c = D().coupes[+g.dataset.i]; if(c) selectionner(c.t); return; }
  /* un outil : il faut d'abord avoir choisi quelque chose à analyser, et que l'outil puisse servir */
  if(!S.sel){ if(a === 'tiroir') secouer(g); else $$('#scene .objet:not(.fait)').forEach(secouer); return; }
  /* les tiroirs ne s'ouvrent pas d'ici : il faut d'abord poser la loupe sur un échantillon (Romain, 10 novembre) */
  if(a === 'tiroir'){ secouer(g); return; }
  if(utilisable(g.dataset.outil) === false){ secouer(g); return; }
  if(surCuir(S.sel) && mimiGene()) return;
  if(a === 'loupe') ouvrirLoupe(); else if(a === 'micro') ouvrirMicro();
  else if(a === 'goutte') goutte(g.dataset.k); else if(a === 'flamme') flamme(); else if(a === 'test') ouvrirTest();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ if(S.mode) return fermerMode(); if(JEU) return quitter(); }
  if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('svg [role="button"]')){ e.preventDefault(); e.target.closest('svg [role="button"]').dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
document.addEventListener('click', function(e){
  var b;
  if(clic.pris) return;
  if(e.target.closest('#bFermer')) return fermerMode();
  if(e.target.closest('#bQuitter')) return quitter();
  if(e.target.closest('#bRefermer')) return fermerTiroir();
  if(e.target.closest('#bPrec')) return cibleVoisine(-1);
  if(e.target.closest('#bSuiv')) return cibleVoisine(1);
  if((b = e.target.closest('[data-ech]'))) return essayer(b.dataset.ech, b);
  if((b = e.target.closest('[data-temoin]'))) return essayerTemoin(b.dataset.temoin, b);
  if((b = e.target.closest('[data-casier]'))) return ouvrirCasier(b.dataset.casier);
  if(e.target.closest('#zoomTxt')) return changerZoom(({10:40, 40:100, 100:10})[S.zoom]);
  if(e.target.closest('#bReglages')){ var pn = $('#reglages'); pn.hidden = !pn.hidden; son('clic'); return; }
  if(e.target.closest('#bRecommencer')) return demarrer(S.niveau);
  if(e.target.closest('#bPlein')) return pleinEcran();
  if(e.target.closest('#bSon')){ SON.actif = !SON.actif; try { localStorage.setItem('brumeval-labo-son', SON.actif ? 'oui' : 'non'); } catch(err){} majStyles(); son('clic'); return; }
  if((b = e.target.closest('[data-style]'))){ var cle = b.dataset.style; ST[cle] = (ST[cle] + 1) % (cle.slice(-1) === 'F' ? 5 : THEMES.length); gardeStyle(); majStyles(); dessinerScene(); majOutils(); son('clic'); return; }
  if((b = e.target.closest('#nvF, #nvD'))) return demarrer(b.id === 'nvF' ? 'facile' : 'difficile');
  /* rien de tout ça : dans un gros plan, c'est un toucher « à côté » */
  if(clic.mode && clic.mode === S.mode && !clic.occupe && !e.target.closest('#hudBoite, #modeHaut, .barre-haut, .coin-jeu, .mimi')) reculer(e);
});
/* Les réglages de la maquette : la paillasse et le mur choisis dans l'atelier (dans le jeu, ils viennent de la sauvegarde) */
function majStyles(){
  $('#bSon').textContent = SON.actif ? '🔈 Sons' : '🔇 Sons'; $('#bSon').setAttribute('aria-pressed', String(SON.actif));
  $('#stPaF').textContent = FORMES_PA[ST.paF]; $('#stPaT').textContent = THEMES[ST.paT].nom; $('#stMurF').textContent = FORMES_MUR[ST.murF]; $('#stMurT').textContent = THEMES[ST.murT].nom;
}
/* Tout se mesure avec la même unité : --u = la taille d'un point du dessin à l'écran */
function mesure(){ var c = $('#cadre'); c.style.setProperty('--u', Math.min(c.clientWidth/1200, c.clientHeight/640) + 'px'); }
var rz; window.addEventListener('resize', function(){ mesure(); clearTimeout(rz); rz = setTimeout(function(){ if(S.mode === 'loupe'){ rendVerre(); majBas(); } else if(S.mode === 'micro') rendLentille(); else if(S.mode === 'test'){ rendBande(); majTemoins(); } }, 150); });

function pleinEcran(){
  var d = document, el = d.documentElement;
  try {
    var p = (d.fullscreenElement || d.webkitFullscreenElement) ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if(p && p.catch) p.catch(function(){});
  } catch(e){}
}
try { if(!JEU && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('#bPlein').hidden = false; } catch(e){}
/* Jamais de zoom par accident (comme dans le jeu, sans-zoom.js) : sur iPhone et iPad, pincer ou toucher deux fois ne zoome pas la page */
(function(){
  var bloquer = function(e){ if(e.cancelable) e.preventDefault(); };
  if('ongesturestart' in window || 'GestureEvent' in window){
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){ document.addEventListener(t, bloquer, {passive:false}); });
    document.addEventListener('touchmove', function(e){ if(e.touches && e.touches.length > 1) bloquer(e); }, {passive:false});
  }
  document.addEventListener('wheel', function(e){ if(e.ctrlKey) bloquer(e); }, {passive:false});
})();

/* La fiche du jeu : ce qu'on a reçu, les codes, la paillasse et le mur de l'atelier, les sons, le chat */
if(CFG){
  if(Array.isArray(CFG.recus)) CUIRS = CFG.recus.filter(function(d){ return OBJETS[d] && !OBJETS[d].de; }).slice(0, 4);
  if(CFG.codes) CODES = CFG.codes;
  if(Array.isArray(CFG.plusTard)) CFG.plusTard.forEach(function(d){ ATTENTE[d] = 1; });
  if(CFG.style) for(var kS in ST) if(typeof CFG.style[kS] === 'number') ST[kS] = CFG.style[kS];
  if(Array.isArray(CFG.chat) && CFG.chat.length === 3) CHAT = CFG.chat;
  if(JEU){ SON.actif = CFG.son !== false; SANS_MIMI = !CFG.mimi; document.body.classList.add('jeu'); }
}
function demarrer(niveau){
  if(S && S.mode){ S.occupe = false; fermerMode(); }
  neuf(niveau); S.aDire = [];
  if(CFG && CFG.etat) importer(CFG.etat);
  /* ce que le jeu sait déjà analysé (une ancienne partie, sans le détail) : le dossier est bouclé */
  if(CFG && Array.isArray(CFG.faits)) CFG.faits.forEach(function(d){ if(S.dos[d] && !S.finis[d]){ (OBJETS[d].requis || [d]).forEach(function(t){ S.trouves[t] = true; var cp = S.dos[d].coupes; if(!surCuir(t) && !cp.some(function(c){ return c && c.t === t; })){ var i = 0; while(cp[i]) i++; cp[i] = {t:t, n:1}; } }); S.finis[d] = true; S.codeEcrit[d] = true; } });
  /* on commence par le premier dossier qui n'est pas bouclé */
  S.dc = CUIRS.filter(function(d){ return !S.finis[d] && !ATTENTE[d]; })[0] || CUIRS.filter(function(d){ return !ATTENTE[d]; }).pop() || CUIRS[CUIRS.length - 1] || null;
  $('#nvF').setAttribute('aria-pressed', String(niveau === 'facile')); $('#nvD').setAttribute('aria-pressed', String(niveau === 'difficile'));
  mesure(); majStyles(); dessinerScene();
  if(!mimi.el) poserMimi(); else mimiRetour();
  majOutils(); majQuitter();
}
demarrer(CFG && CFG.niveau === 'difficile' ? 'difficile' : 'facile');
/* la toute première fois : l'explication en images (86-intro.js) ; au tutoriel, le guide de la première analyse (85-guide.js), après elle */
(function(){
  var g = function(){ if(CFG && CFG.guide) guideDemarrer(CFG.guide); };
  if(CFG && CFG.intro) introOuvrir(g); else g();
})();
window.__labo = {guide:function(){ return GUIDE.id ? {cle:GUIDE.cle, c:GUIDE.c || null, fini:GUIDE.fini, rond:!!(GUIDE.rond && !GUIDE.rond.hidden), t:GUIDE.el ? GUIDE.el.textContent : ''} : null; }, etat:function(){ return S; }, exporter:exporter, finir:finirDossier, attente:function(){ return ATTENTE; }, quitter:quitter, rendre:function(){ rendLentille(); }, mimi:mimi, mimiVient:mimiVient, style:ST, son:SON, sons:SONS, objets:OBJETS, cuirs:function(){ return CUIRS.slice(); }};
dire('pret');
})();
</script>
