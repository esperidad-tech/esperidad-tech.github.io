<title>Le labo de l'Alchimiste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@500;700&family=Macondo&display=swap">
<style>
/* Mise en page : la paillasse dessinée prend tout l'écran ; la loupe, le microscope et le chaudron s'ouvrent par-dessus
   (plein écran sur téléphone). Une seule ambiance : la nuit de Brumeval du jeu, contour épais #24182e, laiton, bois, pierre.
   Vue unique pour tout le décor : de face, un peu d'en haut ; tout ce qui est rond et posé à plat devient une ellipse 1/3. */
:root{
  --nuit:#131932; --nuit-2:#1c2447; --nuit-3:#28325e; --trait:#3b4679; --brume:#a6aed8; --lune:#eef0ff;
  --parchemin:#f3e7cb; --parchemin-2:#e8d7ae; --encre:#35281b; --encre-2:#6b5434;
  --or:#f5b945; --mousse:#7cc493; --alchi:#b48cff; --K:#24182e;
  --f-titre:"Macondo", Georgia, "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-main:"Caveat", "Segoe Script", "Comic Sans MS", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0; height:100%; overflow:hidden}
body{background:#1b1430; color:var(--lune); font-family:var(--f-texte); font-size:17px; line-height:1.45; overscroll-behavior:none}
.app{position:fixed; inset:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
h1,h2{font-family:var(--f-titre); font-weight:400; margin:0; line-height:1.15}
button{font:inherit; color:inherit}
button:focus-visible, [data-act]:focus-visible{outline:3px solid var(--or); outline-offset:2px}
.barre-haut{position:absolute; z-index:8; top:max(8px, env(safe-area-inset-top, 0px)); right:max(8px, env(safe-area-inset-right, 0px)); display:flex; align-items:center; gap:6px}
body.ouvert .barre-haut{display:none}
.barre-haut .maquette{font-size:12px; color:var(--brume); background:rgba(19,25,50,.7); border-radius:999px; padding:2px 10px}
.niveau{display:flex; gap:4px; background:rgba(28,36,71,.82); border:1px solid var(--trait); border-radius:999px; padding:4px}
.niveau button{border:0; background:transparent; padding:4px 10px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--brume)}
.niveau button[aria-pressed="true"]{background:var(--nuit-3); color:var(--lune)}

/* La paillasse */
.cadre{position:absolute; inset:0; overflow:hidden; background:#1b1430}
/* La scène garde ses proportions au centre ; le mur, le plafond et le sol continuent jusqu'aux bords de l'écran */
.decor{position:absolute; inset:0; margin:auto; width:min(100vw, 100vh * 1.5625); height:min(100vh, 100vw * .64)}
@supports (height:100dvh){ .decor{width:min(100vw, 100dvh * 1.5625); height:min(100dvh, 100vw * .64)} }
#scene{display:block; width:100%; height:100%; overflow:visible; user-select:none; -webkit-user-select:none}
#scene [data-act]{cursor:pointer}
#scene [data-act]:hover .survol, #scene [data-act]:focus-visible .survol{opacity:1}
.survol{opacity:0; transition:opacity .2s; pointer-events:all}
.calque{position:absolute; inset:0; pointer-events:none}
.flamme{transform-box:fill-box; transform-origin:50% 100%; animation:flamme .9s ease-in-out infinite alternate}
.flamme.f2{animation-duration:.7s; animation-delay:-.3s} .flamme.f3{animation-duration:1.1s; animation-delay:-.6s}
@keyframes flamme{from{transform:scaleY(1) skewX(-3deg)} to{transform:scaleY(1.14) skewX(4deg)}}
.vapeur{animation:vapeur 2.8s ease-in-out infinite} .vapeur.v2{animation-delay:-1.4s} .vapeur.v3{animation-delay:-.7s}
@keyframes vapeur{0%{opacity:0; transform:translateY(8px)} 40%{opacity:.75} 100%{opacity:0; transform:translateY(-22px)}}
.bul{animation:bul 2.2s ease-in infinite; transform-box:fill-box; transform-origin:50% 50%}
@keyframes bul{0%{transform:scale(.2); opacity:0} 30%{opacity:1} 90%{transform:scale(1); opacity:1} 100%{transform:scale(1.3); opacity:0}}
.braise{animation:braise 1.6s ease-in-out infinite alternate}
@keyframes braise{from{opacity:.55} to{opacity:1}}
.halo-sel{animation:haloSel 1.5s ease-in-out infinite}
@keyframes haloSel{0%,100%{opacity:.4} 50%{opacity:1}}
.secoue-svg{animation:secoueV .45s; transform-box:fill-box}
@keyframes secoueV{0%,100%{transform:none} 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)}}

/* Bulles posées sur la paillasse */
.bulle-o{position:absolute; transform:translate(-50%, calc(-100% - 12px)); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:14px; padding:6px 10px; font-family:var(--f-main); font-size:clamp(16px, 2.2vw, 21px); font-weight:700; line-height:1.15; max-width:min(300px, 60%); text-align:center; pointer-events:none; animation:pop .25s ease-out; z-index:5}
.bulle-o::after{content:""; position:absolute; left:50%; bottom:-11px; width:16px; height:16px; background:var(--parchemin); border-right:3px solid var(--K); border-bottom:3px solid var(--K); transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{opacity:0; transform:translate(-50%, calc(-100% - 2px)) scale(.8)} to{opacity:1}}

/* Mimi (le dessin du jeu) */
.mimi{position:absolute; width:8.5%; pointer-events:auto; cursor:pointer; transform:translate(-50%, -100%); transition:left 1.8s linear, top 1.8s linear; z-index:4}
.mimi svg{display:block; width:100%; height:auto; overflow:visible}
.cadre.ouvert .mimi{display:none}
.mimi .dit, .mimi-mode .dit{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--parchemin); color:var(--encre); border:2px solid var(--K); font-family:var(--f-main); font-size:19px; font-weight:700; padding:0 10px; border-radius:12px; white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none; z-index:2}
.mimi .dit.on, .mimi-mode .dit.on{opacity:1}
.mimi-mode{position:relative; width:84px; margin:0 auto -8px; cursor:pointer}
.mimi-mode svg{display:block; width:100%; height:auto; overflow:visible}
.coeur-v{position:absolute; left:50%; top:10%; font-size:20px; animation:coeurV 1.2s ease-out forwards; pointer-events:none}
@keyframes coeurV{from{opacity:1; transform:translate(-50%,0) scale(.6)} to{opacity:0; transform:translate(-50%,-60px) scale(1.2)}}
.at-t-chat .at-c-g-dort,.at-t-chat .at-c-g-assis,.at-t-chat .at-c-g-debout,.at-t-chat .at-zzz,.at-t-chat .at-c-ferme{display:none}
.at-t-chat.at-c-dort .at-c-g-dort,.at-t-chat.at-c-dort .at-zzz{display:inline}
.at-t-chat.at-c-assis .at-c-g-assis,.at-t-chat.at-c-lave .at-c-g-assis,.at-t-chat.at-c-salut .at-c-g-assis{display:inline}
.at-t-chat.at-c-marche .at-c-g-debout{display:inline}
.at-t-chat.at-c-gauche:not(.at-c-dort) svg{transform:scaleX(-1)}
.at-c-j,.at-c-patte,.at-c-patte-b,.at-c-queue,.at-c-tete,.at-c-corps,.at-respire{transform-box:fill-box}
.at-c-j{transform-origin:50% 0}
.at-c-marche .at-c-j1,.at-c-marche .at-c-j4{animation:at-pas .4s ease-in-out infinite alternate}
.at-c-marche .at-c-j2,.at-c-marche .at-c-j3{animation:at-pas .4s ease-in-out infinite alternate-reverse}
.at-c-marche .at-c-corps{animation:at-trot .2s ease-in-out infinite alternate}
.at-c-queue{transform-origin:100% 100%; animation:at-queue 2.6s ease-in-out infinite}
.at-c-marche .at-c-queue{animation-duration:.8s}
.at-c-patte{transform-origin:50% 6%}
.at-c-lave .at-c-patte{animation:at-lave .6s ease-in-out infinite alternate}
.at-c-lave .at-c-tete{transform-origin:50% 100%; transform:rotate(-7deg)}
.at-c-lave .at-c-yeux{display:none}
.at-c-lave .at-c-ferme{display:inline}
.at-c-salut .at-c-patte{animation:at-salut .42s ease-in-out infinite alternate}
.at-c-assis .at-c-tete{transform-origin:50% 100%; animation:at-regard 5s ease-in-out infinite}
.at-respire{transform-origin:50% 100%; animation:at-respire 3s ease-in-out infinite}
.at-zzz{animation:at-zzz 3s linear infinite} .at-zzz.z2{animation-delay:-1.5s}
.saute svg{animation:sursaut .5s ease-out}
@keyframes sursaut{0%,100%{translate:0 0} 40%{translate:0 -18%}}
@keyframes at-pas{from{transform:rotate(-22deg)} to{transform:rotate(22deg)}}
@keyframes at-trot{to{transform:translateY(-2.5px)}}
@keyframes at-queue{0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(9deg)}}
@keyframes at-lave{from{transform:rotate(-158deg)} to{transform:rotate(-170deg)}}
@keyframes at-salut{from{transform:rotate(-96deg)} to{transform:rotate(-142deg)}}
@keyframes at-regard{0%,40%,100%{transform:rotate(0)} 50%,85%{transform:rotate(-6deg)}}
@keyframes at-respire{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.015,1.055)}}
@keyframes at-zzz{0%{opacity:0; transform:translate(0,6px) scale(.6)} 30%{opacity:1} 100%{opacity:0; transform:translate(10px,-16px) scale(1.15)}}

/* Les vues par-dessus la paillasse */
.mode{position:absolute; inset:0; z-index:6; display:grid; grid-template-columns:minmax(0,1fr); align-content:start; gap:10px; padding:14px; overflow:auto;
  background:radial-gradient(ellipse at 50% 40%, rgba(43,33,72,.94), rgba(16,11,30,.98))}
@media (max-width:700px){ .mode{position:fixed; inset:0; z-index:60; padding:max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px))} }
.mode-tete{display:flex; justify-content:space-between; align-items:center; gap:10px}
.mode-tete h2{font-size:24px; color:var(--or)}
.fermer{width:46px; height:46px; border-radius:50%; border:3px solid var(--K); background:var(--nuit-3); color:var(--lune); font-size:20px; cursor:pointer; flex:none}
.coeurs{font-size:22px; letter-spacing:2px}
.alerte{font-size:14px; color:var(--or); flex:1; text-align:center}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:8px 20px; border-radius:999px; border:3px solid var(--K); cursor:pointer; font-weight:700}
.btn.second{background:rgba(238,240,255,.08); color:var(--lune); border-color:var(--trait)}
.res{position:absolute; left:50%; bottom:10%; transform:translateX(-50%); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:12px; padding:0 14px; font-family:var(--f-main); font-size:28px; font-weight:700; white-space:nowrap; animation:pop2 .35s ease-out; z-index:3}
@keyframes pop2{from{opacity:0; transform:translateX(-50%) scale(.7)} to{opacity:1}}

/* La loupe et le meuble à tiroirs */
.loupe-grille{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:640px){ .loupe-grille{grid-template-columns:minmax(0,1fr)} }
.cote-meuble{display:grid; justify-items:center}
.meuble{display:grid; grid-template-columns:repeat(2, 92px); gap:7px; padding:10px; border:4px solid var(--K); border-radius:10px 10px 6px 6px;
  background:linear-gradient(90deg,#7d4626,#b06f3e 20%,#c98450 50%,#b06f3e 80%,#7d4626); box-shadow:inset 0 0 0 3px rgba(255,255,255,.08), 0 10px 20px rgba(0,0,0,.4)}
@media (max-width:640px){ .meuble{grid-template-columns:repeat(3, minmax(0,1fr)); width:100%} }
.tir{position:relative; border:3px solid var(--K); border-radius:6px; background:linear-gradient(180deg,#ecb882,#c98450 60%,#9a5c31); padding:6px 4px 14px; cursor:pointer; display:grid; justify-items:center; gap:3px; transition:transform .25s, box-shadow .25s; box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tir .hub{width:42px; height:42px; border-radius:50%; background:#fffaf0; border:3px solid var(--K); display:grid; place-items:center; font-size:24px}
.tir .plaque{background:#fff6d8; border:2px solid var(--K); border-radius:4px; padding:0 6px; font-family:var(--f-main); font-size:16px; font-weight:700; color:var(--encre); line-height:1.15; text-align:center}
.tir .poignee{position:absolute; bottom:3px; left:50%; width:22px; height:7px; margin-left:-11px; border-radius:6px; background:linear-gradient(180deg,#fff1b8,#f5b945 50%,#b07a1c); border:2px solid var(--K)}
.tir.ouvert{transform:translateY(-5px) scale(1.04); box-shadow:0 0 0 4px #ffd36a, 0 8px 14px rgba(0,0,0,.45)}
.loupe-centre{display:grid; gap:10px; justify-items:center; min-width:0}
.verre{position:relative; width:min(100%, 330px); aspect-ratio:1}
.verre canvas{position:absolute; inset:7%; width:86%; height:86%; border-radius:50%; display:block; touch-action:none; cursor:grab}
.verre > svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.verre.secoue{animation:secoueV .45s}
.verre .geste{position:absolute; top:50%; left:60%; transform:translateY(-50%); font-size:44px; font-weight:700; color:var(--or); text-shadow:0 0 8px rgba(0,0,0,.6); pointer-events:none; animation:geste 1.2s ease-in-out infinite}
@keyframes geste{0%,100%{opacity:.2; translate:10px 0} 50%{opacity:1; translate:-10px 0}}
.tiroir{width:100%; background:linear-gradient(180deg,#c98450,#9a5c31); border:4px solid var(--K); border-radius:12px; padding:10px; box-shadow:inset 0 6px 0 rgba(255,255,255,.18), 0 10px 20px rgba(0,0,0,.4); animation:tiroir .4s ease-out; min-width:0}
@keyframes tiroir{from{transform:translateY(30px); opacity:0} to{transform:none; opacity:1}}
.tiroir-nom{display:flex; justify-content:space-between; font-family:var(--f-main); font-size:21px; font-weight:700; color:#2b1a0c; margin:0 4px 6px}
.rangee{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity}
.ech{position:relative; flex:none; width:112px; scroll-snap-align:start; border:3px solid var(--K); border-radius:10px; background:#f6efe0; padding:4px; cursor:pointer; display:grid; gap:2px; color:var(--encre)}
.ech canvas{width:100%; height:66px; display:block; border-radius:6px}
.ech .nm{font-family:var(--f-main); font-size:17px; font-weight:700; line-height:1.05}
.ech[aria-pressed="true"]{outline:4px solid var(--or); outline-offset:1px}
.ech.barre{opacity:.4} .ech.barre .nm{text-decoration:line-through}
.ech:disabled{cursor:default}
.ech .ok{position:absolute; top:2px; right:4px; font-size:18px}

/* Le microscope */
.micro-zone{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; justify-items:center}
@media (max-width:620px){ .micro-zone{grid-template-columns:1fr} }
.oculaire{position:relative; width:min(100%, 420px); aspect-ratio:1}
.oculaire canvas{position:absolute; inset:9%; width:82%; height:82%; border-radius:50%; display:block; touch-action:none; cursor:grab; transition:filter .2s}
.oculaire canvas.flou{filter:blur(6px)}
.oculaire > svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.bulle-l{position:absolute; transform:translate(-50%, calc(-100% - 10px)); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:12px; padding:3px 9px; font-family:var(--f-main); font-size:19px; font-weight:700; white-space:nowrap; pointer-events:none; animation:pop .2s ease-out}
.cote{display:grid; gap:12px; justify-items:center}
.tourelle{display:flex; gap:6px}
@media (min-width:621px){ .tourelle{flex-direction:column} }
.objectif{border:0; background:none; padding:0; cursor:pointer; width:74px}
.objectif svg{display:block; width:100%; height:auto}
.objectif[aria-pressed="true"] svg{filter:drop-shadow(0 0 8px #ffd36a)}
.plateau{display:flex; gap:6px; background:linear-gradient(180deg,#c98450,#9a5c31); border:3px solid var(--K); border-radius:12px; padding:6px 8px}
.plateau .coupe{width:58px}
.plateau .coupe svg{display:block; width:100%; height:auto}
.vol{position:fixed; z-index:80; pointer-events:none; transition:left .7s cubic-bezier(.5,0,.5,1), top .7s cubic-bezier(.5,-.5,.6,1), transform .7s}

/* Le chaudron */
.chaudron-zone{display:flex; gap:clamp(12px, 4vw, 40px); align-items:flex-end; justify-content:center; flex-wrap:wrap}
.modele{margin:0; display:grid; justify-items:center; gap:2px; font-family:var(--f-main); font-size:20px; font-weight:700}
.modele svg{width:clamp(80px, 20vw, 120px); height:auto}
.grand-chaudron{position:relative; display:grid; justify-items:center}
.grand-chaudron svg{width:clamp(220px, 52vw, 330px); height:auto; overflow:visible}
.grand-chaudron.plouf svg{animation:plouf .45s ease-out}
@keyframes plouf{0%,100%{transform:none} 30%{transform:translateY(4px) scaleX(1.03)} 60%{transform:translateY(-3px)}}
.grand-chaudron .res{bottom:auto; top:6%}
.ingredients{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.ingr{width:94px; border:3px solid var(--K); border-radius:14px; background:var(--parchemin); color:var(--encre); padding:6px 4px; cursor:pointer; display:grid; justify-items:center; gap:2px; font-family:var(--f-main); font-size:17px; font-weight:700; line-height:1.05; box-shadow:0 4px 0 rgba(0,0,0,.35)}
.ingr svg{width:60px; height:60px}
.ingr:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35)}
.portions{font-family:var(--f-main); font-size:20px; color:var(--brume); text-align:center; min-height:26px}
.actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
@media (prefers-reduced-motion: reduce){ .flamme,.vapeur,.bul,.braise,.halo-sel,.at-c-queue,.at-c-assis .at-c-tete,.at-respire,.at-zzz,.verre .geste{animation:none} .mimi{transition:none} .tiroir{animation:none} }
</style>

<div class="app">
  <div class="barre-haut">
    <h1 class="sr">Le labo de l'Alchimiste</h1>
    <span class="maquette">Maquette</span>
    <div class="niveau" role="group" aria-label="Difficulté">
      <button type="button" id="nvF" aria-pressed="true">Enquête 1</button>
      <button type="button" id="nvD" aria-pressed="false">Plus difficile</button>
      <button type="button" id="bRecommencer" aria-label="Recommencer">🔁</button>
      <button type="button" id="bPlein" aria-label="Plein écran" hidden>⛶</button>
    </div>
  </div>
  <div class="cadre" id="cadre">
    <div class="decor">
      <svg id="scene" viewBox="0 0 1000 640" role="img" aria-label="Le labo de l'Alchimiste"></svg>
      <div class="calque" id="calque"></div>
    </div>
    <div class="mode" id="mode" hidden></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var reduit = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function rng(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexRgb(h){ h = String(h).replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgbHex(r){ return '#' + r.map(function(v){ v = Math.round(Math.max(0, Math.min(255, v))); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
function melange(a, b, t){ var x = hexRgb(a), y = hexRgb(b); return rgbHex([0,1,2].map(function(i){ return x[i] + (y[i]-x[i])*t; })); }
function clair(c, t){ return melange(c, '#ffffff', t); }
function sombre(c, t){ return melange(c, '#1c1230', t); }
function ease(p){ return p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2; }
function tween(dur, f, fin){ var t0 = performance.now(); if(reduit) dur = 1; (function pas(now){ var p = Math.min(1, (now - t0)/dur); f(ease(p), p); if(p < 1) requestAnimationFrame(pas); else if(fin) fin(); })(t0); }
function prep(cv){ var dpr = Math.min(window.devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(); var w = Math.max(10, Math.round(r.width)), h = Math.max(10, Math.round(r.height));
  if(cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; } var ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx:ctx, w:w, h:h}; }

/* ============ Les outils de dessin du jeu (contour épais, dégradés « jouet ») ============ */
var K = '#24182e', SW = 4;
