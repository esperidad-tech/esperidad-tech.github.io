<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Phase 3 — Grosbec de lumière (maquette v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* IDEA : la maquette v4 de la phase 3 — la vue World of Warcraft ; Grosbec de lumière en volume, vivant, et beaucoup d'effets
   PICTURE : la salle vue d'en haut en biais, Grosbec d'énergie rouge au fond ; mon héros, mes trois amis qui me suivent, mon villageois
   COLOUR : nuit bleue ; le rouge et l'or de Grosbec ; la couleur de chaque héros pour son attaque ; jaune réservé aux boutons « lancer »
   TYPE : Nunito ; rien à lire en jouant (seules les bulles des robots, en mode seul, sont écrites)
   LAYOUT : téléphone couché, la salle sur tout l'écran ; pouce gauche : courir, le bouclier juste au-dessus ; pouce droit : l'attaque, le soin, le saut ;
            le groupe en haut à gauche ; une seule bulle à la fois */
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070912;overflow:hidden;color:#eef0f8;font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#c.mort{filter:grayscale(1) brightness(.8)}
button{font-family:inherit;cursor:pointer;touch-action:none;color:inherit}
.jaune{background:#ffd23a;color:#111;font-weight:900;font-size:1.15rem;border:0;border-radius:.6em;padding:.6em 1.6em;min-height:2.9em;box-shadow:0 .22em 0 #9c770c}
.jaune:active{transform:translateY(.15em);box-shadow:0 .07em 0 #9c770c}
.gris{background:#22304b;color:#eef0f8;font-weight:800;font-size:.95rem;border:1px solid #3d5078;border-radius:.6em;padding:.5em 1em;min-height:2.6em}
/* les six boutons (placés par le script) */
.bt{position:fixed;border-radius:50%;background:rgba(10,16,30,.62);border:2px solid rgba(243,212,138,.55);display:none;align-items:center;justify-content:center;padding:0;z-index:2;overflow:hidden}
.bt.on{display:flex}
.bt b{line-height:1;font-weight:400;pointer-events:none;position:relative}
.bt .rc{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(3,5,12,.78) calc(var(--r,0)*360deg),transparent 0)}
.bt .lc{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(var(--c,#fff) calc(var(--p,0)*360deg),transparent 0);opacity:.5}
.bt.appui{background:rgba(255,210,58,.3)}
.bt.eteint{filter:grayscale(1);opacity:.4}
.bt.leve{background:rgba(95,180,255,.55)}
.bt.non{animation:non .3s linear}
@keyframes non{0%,100%{translate:0}25%{translate:-.3em}60%{translate:.3em}}
#bBouclier{border-color:#7fc4ff;border-width:3px}
#bAttaque{border-width:3px}#bAttaque b{font-size:1.25em}#bSoin{border-color:#5fe07a}
#bSoin b{color:#5fe07a;font-weight:900}#bSaut b{color:#f3d48a;font-weight:900}
.appel{animation:appel 1s ease-out infinite}
@keyframes appel{0%{box-shadow:0 0 0 .1em rgba(255,210,58,1)}70%{box-shadow:0 0 0 .9em rgba(255,210,58,0)}100%{box-shadow:0 0 0 0 rgba(255,210,58,0)}}
/* le groupe, en haut à gauche (comme les cadres d'équipe de World of Warcraft) : le portrait, la case du symbole */
#groupe{position:fixed;left:calc(.6vh + env(safe-area-inset-left));top:calc(.6vh + env(safe-area-inset-top));display:none;flex-direction:column;align-items:flex-start;gap:.3rem;z-index:3}
@media (max-height:480px){#groupe{font-size:12px;gap:.2rem}#groupe .cadre{min-height:1.9rem;padding:.12rem .3rem .12rem .12rem}#groupe .tete{width:1.6rem;height:1.6rem;font-size:.85rem}#groupe .sym{width:1.6rem;height:1.6rem;font-size:.95rem}#groupe .vie{width:min(18vw,6.5rem);height:.85rem}}
#groupe.on{display:flex}
.cadre{display:flex;align-items:center;gap:.35rem;background:rgba(10,14,26,.72);border:1.5px solid rgba(255,255,255,.18);border-radius:1.6rem;padding:.18rem .45rem .18rem .18rem;min-height:2.3rem}
.cadre .tete{width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;border:2px solid #11141d;flex:none}
.cadre .sym{width:1.9rem;height:1.9rem;border-radius:.45rem;background:rgba(0,0,0,.5);border:1.5px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex:none}
.cadre .sym.plein{border-style:solid;border-color:#ffd23a;background:rgba(80,60,0,.45)}
.cadre .vie{width:min(22vw,8.5rem);height:1rem;border-radius:1rem;background:rgba(0,0,0,.6);overflow:hidden;position:relative}
.cadre .vie i{display:block;height:100%;background:#5fe07a;border-radius:1rem}
.cadre .vie span{position:absolute;left:.45rem;top:50%;transform:translateY(-50%);font-size:.68rem;font-weight:900;line-height:1}
.cadre.mort{filter:grayscale(1);opacity:.45}
.cadre.crie{border-color:#ffd23a;box-shadow:0 0 0 .2rem rgba(255,210,58,.35);animation:battre .7s ease-in-out infinite}
.cadre.fait{border-color:#5fe07a}
@keyframes battre{50%{transform:scale(1.06)}}
.cadre.non{animation:non .3s linear 2}
/* la petite fenêtre des symboles */
#symboles{position:fixed;display:none;grid-template-columns:repeat(6,auto);gap:.3rem;background:rgba(8,10,22,.9);border:2px solid rgba(255,214,90,.7);border-radius:.8rem;padding:.4rem;z-index:6}
#symboles.on{display:grid}
#symboles button{width:2.6rem;height:2.6rem;border-radius:.5rem;border:1px solid rgba(255,255,255,.25);background:rgba(30,38,62,.9);font-size:1.35rem;padding:0}
/* en haut à droite : la pause, « On reprend » */
.coin{position:fixed;top:calc(1.2vh + env(safe-area-inset-top));width:2.6rem;height:2.6rem;border-radius:.6rem;background:rgba(10,16,30,.7);border:1px solid rgba(255,255,255,.25);display:none;align-items:center;justify-content:center;padding:0;z-index:4;font-size:1.25rem;font-weight:900}
.coin.on{display:flex}
#bPause{right:calc(1.2vh + env(safe-area-inset-right))}
#bReprise{right:calc(1.2vh + 3.1rem + env(safe-area-inset-right))}
#bReprise.appel{background:#ffd23a;color:#111}
/* les écrans */
.voile{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,6,14,.94);padding:max(.8em,env(safe-area-inset-top)) 1em max(.8em,env(safe-area-inset-bottom));overflow-y:auto;z-index:8}
.voile.on{display:flex}
.voile.clair{background:rgba(4,6,14,.55)}
.carte{width:100%;max-width:36em;margin:auto;text-align:center}
.roles{display:flex;gap:1em;justify-content:center;margin:0 0 1.1em;flex-wrap:wrap}
.roles button{width:3.9em;height:3.9em;border-radius:50%;border:4px solid transparent;font-size:1.6em;padding:0;opacity:.45;filter:grayscale(.6)}
.roles button.choisi{opacity:1;filter:none;border-color:#fff;box-shadow:0 0 0 .2em rgba(255,255,255,.2)}
.modes{display:flex;gap:.8em;justify-content:center;margin:0 0 1em}
.modes button{background:#1a2440;border:2px solid #33456e;border-radius:.8em;padding:.4em .9em;font-size:1.5rem;min-width:4.2em}
.modes button.choisi{border-color:#ffd23a;background:#2d3550}
.numero{display:none;flex-direction:column;align-items:center;gap:.5em;margin:0 0 1em}
.numero.on{display:flex}
.numero .val{font-size:2.2rem;font-weight:900;min-width:3em;background:#1a2440;border:2px solid #33456e;border-radius:.6em;padding:0 .4em}
.pave{display:grid;grid-template-columns:repeat(6,auto);gap:.35em}
.pave button{width:2.6em;height:2.6em;border-radius:.5em;background:#22304b;border:1px solid #3d5078;font-size:1.15rem;font-weight:900;padding:0}
.go{font-size:3rem;padding:.25em 1.6em}
.compte{font-size:1.4rem;font-weight:900;opacity:.6;letter-spacing:.3em;margin:.6em 0}
.ligne{display:flex;flex-direction:column;align-items:stretch;gap:.25em;margin:.45em 0;text-align:left}
.ligne > span{font-size:.82rem;font-weight:800;opacity:.75;padding-left:.2em}
.choix{display:flex;gap:.3em;flex-wrap:wrap}
.choix button{flex:1;min-width:4em;background:#1a2440;border:1px solid #33456e;border-radius:.55em;padding:.45em .4em;font-weight:800;font-size:.86rem;min-height:2.5em}
.choix button.choisi{background:#ffd23a;color:#111;border-color:#ffd23a}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:0 1em}
@media (max-width:600px){.deux{grid-template-columns:1fr}}
.menu{display:flex;gap:.55em;justify-content:center;margin-top:.7em;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:auto auto;gap:.3em 1.2em;justify-content:center;font-size:1.2rem;font-weight:900;margin:.8em 0 1.2em}
.stats span{text-align:right}
.fin4{display:flex;gap:.6em;justify-content:center;margin:.6em 0}
.fin4 div{display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:1.8rem}
.fin4 i{width:2.2rem;height:2.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-style:normal}
.mesures{font-size:.72rem;opacity:.55;margin-top:.8em}
.note{font-size:.78rem;opacity:.65;margin:.3em 0 0}
#jaune{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:7;background:rgba(4,6,14,.35)}
#jaune.on{display:flex}
#jaune .ferme{position:absolute;right:1rem;top:1rem}
#tourner{display:none;position:fixed;inset:0;z-index:20;background:#05060c;align-items:center;justify-content:center;font-size:4rem}
@media (orientation:portrait){#tourner{display:flex}}
</style>
</head>
<body>
<div id="tourner">📱↻</div>
<canvas id="c"></canvas>
<button class="bt" id="bBouclier" aria-label="Bouclier"><i class="rc"></i><b>🛡️</b></button>
<button class="bt" id="bAttaque" aria-label="Attaque"><i class="lc"></i><b>⚔️</b></button>
<button class="bt" id="bSoin" aria-label="Soin"><i class="lc"></i><b>✚</b></button>
<button class="bt" id="bSaut" aria-label="Saut"><i class="rc"></i><b>⤴</b></button>
<div id="groupe"></div>
<div id="symboles"></div>
<button class="coin" id="bReprise" aria-label="On reprend">↺</button>
<button class="coin" id="bPause" aria-label="Pause"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
<!-- le gros bouton jaune pour repartir tous ensemble (« 3, 2, 1 ») : au départ, après le film d'Odette, et pour « On reprend » -->
<div id="jaune"><button class="jaune go" id="bJaune">GO</button><button class="gris ferme" id="bJauneFerme" aria-label="Fermer">✕</button></div>

<!-- avant de jouer : son héros, seul ou à quatre, le bouton jaune ; rien à lire -->
<section id="debut" class="voile on">
  <div class="carte">
    <div class="roles" id="roles"></div>
    <div class="modes" id="modes"><button data-m="seul" aria-label="Seul, avec trois robots">👤🤖🤖🤖</button><button data-m="quatre" aria-label="Quatre tablettes">📱📱📱📱</button></div>
    <div class="numero" id="numero"><div class="val" id="numVal">—</div><div class="pave" id="pave"></div></div>
    <button class="jaune" id="bGo">▶</button>
    <div style="margin-top:1.1em"><button class="gris" id="bReglages" aria-label="Réglages">⚙️</button></div>
  </div>
</section>

<section id="pause" class="voile">
  <div class="carte">
    <button class="jaune" id="bReprendre">Reprendre</button>
    <p class="note" id="noteQuatre">À quatre tablettes, le combat continue pendant ce menu.</p>
    <div class="deux">
      <div class="ligne"><span>Les éclairs, deuxième combat (dégâts toutes les 2 s)</span><div class="choix" data-r="eclairs2"><button data-v="0">0</button><button data-v="5">5</button><button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button></div></div>
      <div class="ligne"><span>Les éclairs, premier combat</span><div class="choix" data-r="eclairs1"><button data-v="20">20</button><button data-v="30">30</button><button data-v="40">40</button></div></div>
      <div class="ligne"><span>Le bouclier revient après</span><div class="choix" data-r="recharge"><button data-v="10">10 s</button><button data-v="15">15 s</button><button data-v="20">20 s</button></div></div>
      <div class="ligne"><span>La vie de Grosbec</span><div class="choix" data-r="vie"><button data-v="court">≈ 3 min</button><button data-v="normal">≈ 6 min</button><button data-v="long">≈ 9 min</button></div></div>
      <div class="ligne"><span>Mes trois robots (mode seul)</span><div class="choix" data-r="robots"><button data-v="0.95">attentifs</button><button data-v="0.9">un peu distraits</button><button data-v="0.75">distraits</button><button data-v="0.6">dans la lune</button></div></div>
      <div class="ligne"><span>Commencer par</span><div class="choix" data-r="debut"><button data-v="1">le 1er combat</button><button data-v="2">le 2e combat</button><button data-v="3">le 2e, au plus dur</button></div></div>
      <div class="ligne"><span>Les sons</span><div class="choix" data-r="sons"><button data-v="true">Oui</button><button data-v="false">Non</button></div></div>
    </div>
    <div class="menu"><button class="gris" id="bRecommencer">Recommencer</button><button class="gris" id="bAccueil">← Le héros</button></div>
    <p class="mesures" id="mesures"></p>
  </div>
</section>

<section id="fin" class="voile">
  <div class="carte">
    <div style="font-size:3.5rem">✨</div>
    <div class="fin4" id="fin4"></div>
    <div class="stats" id="stats"></div>
    <button class="jaune" id="bRejouer">Rejouer</button>
  </div>
</section>
<script>/* ===== regles.js ===== */
/* ==========================================================
   Phase 3 de l'enquête 10 — contre Grosbec de lumière
   MAQUETTE, VERSION 4 (Bible § 18.19) : la vue World of Warcraft ; une seule faiblesse pour toute l'équipe (une partie
   de Grosbec, montrée sur une seule tablette), une seule attaque par héros, le sort qui rebondit revient sur celui qui l'a lancé.
   Les règles seules, sans dessin : ce fichier tourne aussi dans node (tests/).
   Distances en pas, durées en secondes (comme la phase 2 et le combat du Pisteur).
   (R) = décidé par Romain (§ 18.16) ; (C) = point de départ de Claude, à régler en jouant.

   Les quatre tablettes ne sont pas reliées. Chacune calcule LA MÊME suite des coups de Grosbec
   à partir du numéro de partie (aucun Math.random dans la suite), et ne simule que SON héros.
   En mode seul, la tablette simule aussi trois robots (les amis), pour essayer sans quatre tablettes.
   ========================================================== */
(function (G) {
'use strict';

var ROLES = ['pisteur', 'alchimiste', 'barde', 'sage'];
var REG = {
  salle: {L: 16, P: 6.5},                     // (C, v3) plus large que profonde, pour remplir l'écran d'un téléphone couché ; Grosbec au fond (y = 0)
  grosbec: {x: 8, y: 0.7, r: 1.5},            // (C) son pied ; on ne marche pas dessus
  heros: {pv: 100, r: 0.35, vit: 3.6, x: 8, y: 4.1},   // (R) la course de la phase 2 : 3,6 pas par seconde
  sort: {lance: 3, vol: 0.5, retour: 0.55, rebond: 15},   // (R, v4) une seule attaque, lente (3 s sur place) ; sur la mauvaise partie, elle revient sur moi : 15
  soin: {lance: 2, rend: 50},                 // (R) le soin de la phase 2
  saut: {L: 3, dur: 0.32, recharge: 1.5},     // (R) le saut de la phase 2
  bouclier: {dure: 3},                        // (R) 3 s ; la recharge est dans les réglages (10 s de base)
  bouge: 0.25,                                // (C) au-delà de ce petit coup de pouce, on bouge (et le sort est coupé)
  mort: {attente: 10, intouchable: 3},        // (R) on revient tout seul après 10 s ; (C) 3 s intouchable
  eclair: {tous: 2, montre: 0.55, tambour: 0.45},   // (R) des éclairs en permanence ; (C) un toutes les 2 s, 0,45 s pendant le tambour
  combat1: {tenir: 60, tambour: 10},          // (R) une minute, puis 10 s de tambour, et tout le monde tombe
  film: 8,                                    // (C) le film d'Odette, avant le bouton jaune
  lancement: 2,                               // (C) après le bouton jaune : deux secondes de calme
  // les trois endroits sûrs (R : la fontaine, la lanterne, la statue cassée) ; (C) leur place et leur taille
  lieux: [{n: 'lanterne', x: 3.6, y: 2.6}, {n: 'statue', x: 12.4, y: 2.6}, {n: 'fontaine', x: 8, y: 5.2}],
  lieuR: 0.45, surR: 1.4,                    // l'objet (on ne marche pas dessus) ; l'endroit sûr autour de lui
  zone: {annonce: 6},                         // (R, v4) 6 s entre l'annonce et la frappe (4 s : « carrément trop court »)
  mega: {annonce: 2.8},                       // (R) moins de 3 s
  infoMontree: 6,                             // (C) la partie faible bouge sur Grosbec pendant 6 s, sur la tablette qui doit la crier
  // la montée (R) : tranquille au début, puis ça se resserre en 3 ou 4 minutes, puis ça accélère doucement
  montee: {fin: 210, ajoutZones: 30, ajoutMega: 60,
    faible: {de: [22, 27], a: [15, 20]},      // (R) 15 à 20 s ; (C) 22 à 27 s au départ
    zones: {de: [9, 12], a: [6, 9], mini: 7},     // (R) ; (C, v4) jamais moins de 7 s : avec 6 s d'annonce, un seul endroit sûr à la fois
    mega: {de: [18, 22], a: [13, 17], mini: 8},   // (R) 13 à 17 s ; (C) 18 à 22 s au départ
    apres: 0.065, plancher: 0.6},             // (C) ensuite, 6,5 % plus serré chaque minute, jusqu'à 60 %
  reprise: 30,                                // (R) un point de reprise toutes les 30 s environ
  coups: {court: 22, normal: 45, long: 65}    // (C, v4) la vie de Grosbec, en attaques justes (environ 6 min pour « normal », d'après les robots)
};
var DEFAUT = {
  mode: 'seul',       // 'seul' (trois robots) | 'quatre' (quatre tablettes)
  eclairs2: 10,       // (R : à régler en jouant) dégâts d'un éclair, deuxième combat : 0 | 5 | 10 | 15 | 20
  eclairs1: 30,       // (R : « 30 points toutes les deux secondes ») premier combat : 20 | 30 | 40
  recharge: 10,       // (R) la recharge du bouclier : 10 | 15 | 20 s
  vie: 'normal',      // court | normal | long
  robots: 0.95,       // en mode seul, la chance qu'un robot voie et crie une info : 0,95 | 0,9 | 0,75 | 0,6
  debut: 1,           // 1 : le premier combat ; 2 : le deuxième ; 3 : le deuxième, au plus dur (3 min 30)
  sons: true,
  role: 'barde',
  partie: 1
};
var PARTIES = ['tete', 'torse', 'brasG', 'brasD', 'jambeG', 'jambeD'];   // (R) six parties ; gauche et droite vues de l'écran
var MOTS = {tete: 'La tête !', torse: 'Le torse !', brasG: 'Bras gauche !', brasD: 'Bras droit !',
  jambeG: 'Jambe gauche !', jambeD: 'Jambe droite !', lanterne: 'La lanterne !', statue: 'La statue !', fontaine: 'La fontaine !', mega: 'Bouclier, vite !'};
var SYMS = ['🌙', '⭐', '☀️', '🔑', '🍄', '🐟', '🌳', '🔔', '🎩', '❤️', '🐱'];   // les symboles du jeu

/* ---------- le hasard partagé (le même sur les quatre tablettes) ---------- */
function hash(s) { var h = 2166136261 >>> 0; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function rngDe(s) {
  var a = hash(String(s));
  return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function entre(r, a, b) { return a + (b - a) * r(); }
function entier(r, n) { return Math.floor(r() * n); }
function arr(x) { return Math.round(x * 100) / 100; }
function lerp(a, b, k) { return a + (b - a) * k; }
function cl(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* l'écart entre deux coups d'une même sorte, au temps T du deuxième combat */
function ecart(r, sorte, T) {
  var M = REG.montee, s = M[sorte], t0 = sorte === 'zones' ? M.ajoutZones : sorte === 'mega' ? M.ajoutMega : 0;
  var k = cl((T - t0) / (M.fin - t0), 0, 1);
  var a = lerp(s.de[0], s.a[0], k), b = lerp(s.de[1], s.a[1], k);
  var f = T <= M.fin ? 1 : Math.max(M.plancher, 1 - M.apres * (T - M.fin) / 60);
  return Math.max(s.mini || 0, entre(r, a, b) * f);
}

/* ---------- la suite des coups du deuxième combat (20 minutes, calculée une fois) ----------
   infos : {k:'info', quoi:'part'|'zone'|'mega', donneur, cible (null pour la partie et la zone : c'est pour tous), tA, tFin, val, ref}
   coups : {k:'faible', t, part, id} (v4 : la même pour toute l'équipe) ; {k:'zone', id, tA, tI, lieu, donneur} ; {k:'mega', id, cible, tA, tI, donneur} */
var CACHE = {};
function suite(partie) {
  if (CACHE[partie]) return CACHE[partie];
  var r = rngDe('phase3-v4|' + partie), FIN = 20 * 60, id = 0;
  var faibles = [], zones = [], megas = [], infos = [], cris = {pisteur: 0, alchimiste: 0, barde: 0, sage: 0};
  // (R, v4) la faiblesse : UNE partie de Grosbec, la même pour toute l'équipe ; elle change toutes les 15 à 20 s (22 à 27 au début)
  (function () {
    var t = 2, av = null;
    while (t < FIN) {
      var p;
      do { p = entier(r, 6); } while (av && av.part === p);
      av = {k: 'faible', id: ++id, t: arr(t), part: p};
      faibles.push(av);
      t += ecart(r, 'faible', t);
    }
  })();
  // les grosses zones (R : un seul endroit sûr pour toute l'équipe)
  var t = REG.montee.ajoutZones;
  while (t < FIN) { zones.push({k: 'zone', id: ++id, tA: arr(t), tI: arr(t + REG.zone.annonce), lieu: entier(r, 3)}); t += ecart(r, 'zones', t); }
  // les méga attaques (R : jamais deux fois de suite sur le même ; pas en même temps qu'une zone)
  t = REG.montee.ajoutMega; var avant = null;
  while (t < FIN) {
    var tI = t + REG.mega.annonce;
    for (var z = 0; z < zones.length; z++) if (Math.abs(zones[z].tI - tI) < 0.9) { t += 1; tI += 1; z = -1; }
    var cand = ROLES.filter(function (x) { return x !== avant; }), c = cand[entier(r, cand.length)];
    megas.push({k: 'mega', id: ++id, tA: arr(t), tI: arr(tI), cible: c}); avant = c;
    t += ecart(r, 'mega', t);
  }
  // qui montre quoi : au hasard, jamais à soi-même, en équilibrant (R : pas de rôle fixe ; chacun crie à peu près autant)
  var tout = [];
  faibles.forEach(function (f) { tout.push({quoi: 'part', ref: f, t: f.t}); });
  zones.forEach(function (z) { tout.push({quoi: 'zone', ref: z, t: z.tA}); });
  megas.forEach(function (m) { tout.push({quoi: 'mega', ref: m, t: m.tA}); });
  tout.sort(function (a, b) { return a.t - b.t || a.ref.id - b.ref.id || (a.quoi < b.quoi ? -1 : 1); });
  tout.forEach(function (x) {
    var cible = x.quoi === 'mega' ? x.ref.cible : null;
    var ok = ROLES.filter(function (g) { return g !== cible; });
    var mini = Math.min.apply(null, ok.map(function (g) { return cris[g]; }));
    ok = ok.filter(function (g) { return cris[g] === mini; });
    var g = ok[entier(r, ok.length)];
    cris[g]++;
    var inf = {k: 'info', quoi: x.quoi, donneur: g, cible: cible, ref: x.ref.id, tA: x.t};
    if (x.quoi === 'part') { inf.val = x.ref.part; inf.tFin = arr(x.t + REG.infoMontree); x.ref.donneur = g; }
    else if (x.quoi === 'zone') { inf.val = x.ref.lieu; inf.tFin = x.ref.tI; x.ref.donneur = g; }
    else { inf.val = null; inf.tFin = x.ref.tI; x.ref.donneur = g; }
    infos.push(inf);
  });
  var S = {partie: partie, faibles: faibles, zones: zones, megas: megas, infos: infos, cris: cris};
  CACHE[partie] = S;
  return S;
}
/* la faiblesse (la même pour tous) au temps T */
function faibleA(su, T) {
  var f = null;
  for (var i = 0; i < su.faibles.length; i++) { var x = su.faibles[i]; if (x.t <= T) f = x; else break; }
  return f;
}
/* les symboles de victoire (quatre différents) */
function symboles(partie) {
  var r = rngDe('symboles3|' + partie), l = SYMS.slice(), o = {};
  for (var i = l.length - 1; i > 0; i--) { var j = entier(r, i + 1), x = l[i]; l[i] = l[j]; l[j] = x; }
  ROLES.forEach(function (ro, i) { o[ro] = l[i]; });
  return o;
}

/* ---------- une partie sur une tablette ---------- */
function nouvelle(reglages, graine) {
  var reg = {};
  for (var k in DEFAUT) reg[k] = (reglages && reglages[k] !== undefined) ? reglages[k] : DEFAUT[k];
  var H = REG.heros, moi = reg.role;
  var S = {
    reg: reg, moi: moi, seul: reg.mode === 'seul',
    partie: reg.mode === 'seul' ? (graine || 1) : reg.partie,
    rnd: rngDe('local|' + (graine || 1) + '|' + Date.now()),   // le hasard local (les éclairs, les robots) : pas besoin d'être partagé
    combat: 1, etat: 'combat', T: 0, reel: 0, attente: 0,
    h: {x: H.x, y: H.y, pv: H.pv, dx: 0, dy: -1, lance: null, saut: null, sautT: 0, mort: 0, intouchable: 0, coupe: 0,
        bouclierFin: -1, bouclierPret: 0, bouge: false},
    cible: 1,                                    // la partie visée : le torse au départ
    boss: 0, bossMax: 0, faible: null,
    vus: {}, tirs: [], prochainEclair: 1.5, eclairs: [],
    code: {}, symboles: null, symboleT: -1,
    amis: {}, cris: [], relais: {},              // mode seul : les robots, leurs cris pour moi, ce que j'ai crié
    villageois: {x: H.x - 0.85, y: H.y + 1.0, court: null}, bulle: null, dit: {},
    stats: {morts: 0, sorts: 0, justes: 0, rebonds: 0, soins: 0, zones: 0, zonesRatees: 0, megas: 0, megasRatees: 0, reprises: 0, relaisFaits: 0, relaisRates: 0, symboleT: null},
    evts: []
  };
  S.symboles = symboles(S.partie);
  S.su = suite(S.partie);
  S.bossMax = REG.coups[reg.vie] || REG.coups.normal; S.boss = S.bossMax;   // (au premier combat, la barre ne bouge presque pas : on ne sait rien)
  ROLES.forEach(function (ro) {
    if (ro === moi) return;
    S.amis[ro] = {role: ro, x: H.x, y: H.y + 0.8, hist: [], delai: ro === 'pisteur' ? 0.15 : 0.3 + 0.25 * S.rnd(), prochainSort: 1 + 3 * S.rnd(),
      // le robot (mode seul)
      mort: 0, bouclierFin: -1, bouclierPret: 0, boss: 0, sait: {}, prochainCoup: 0, voix: 0, symboleCrie: -99, symbole: S.symboles[ro]};
  });
  if (reg.debut >= 2) allerC2(S, reg.debut === 3 ? REG.montee.fin : 0);
  return S;
}
function evt(S, type, o) { o = o || {}; o.type = type; o.t = S.reel; S.evts.push(o); if (S.evts.length > 120) S.evts.shift(); if (S.surEvt) S.surEvt(o); }
function dernier(S, type, depuis) { for (var i = S.evts.length - 1; i >= 0; i--) { var e = S.evts[i]; if (S.reel - e.t > depuis) return null; if (e.type === type) return e; } return null; }
function vivant(S) { return S.h.mort <= 0; }
function protege(S) { return S.h.bouclierFin > S.T || S.h.intouchable > 0; }

/* le deuxième combat (après le film d'Odette, ou tout de suite pour les essais) */
function allerC2(S, T0) {
  var H = REG.heros, h = S.h;
  S.combat = 2; S.etat = 'combat'; S.T = T0 || 0; S.attente = REG.lancement;
  S.bossMax = REG.coups[S.reg.vie] || REG.coups.normal; S.boss = S.bossMax;
  h.pv = H.pv; h.mort = 0; h.intouchable = 0; h.lance = null; h.saut = null; h.x = H.x; h.y = H.y; h.bouclierFin = -1; h.bouclierPret = 0;
  S.vus = {}; marquerPasse(S); S.prochainEclair = S.T + 1.5;
  for (var ro in S.amis) { var a = S.amis[ro]; a.boss = S.bossMax; a.mort = 0; a.sait = {}; a.bouclierFin = -1; a.bouclierPret = 0; a.prochainCoup = 0; a.voix = 0; }
  S.cris = [];
  evt(S, 'combat2');
}
function marquerPasse(S) {   // tout ce qui a commencé avant S.T est considéré comme passé (après « On reprend »)
  var su = S.su;
  su.infos.forEach(function (x) { if (x.tA < S.T) S.vus['i' + x.ref + x.quoi] = 1; });
  su.zones.forEach(function (z) { if (z.tA < S.T) { S.vus['z' + z.id] = 1; S.vus['zi' + z.id] = 1; } });
  su.megas.forEach(function (m) { if (m.tA < S.T) { S.vus['m' + m.id] = 1; S.vus['mi' + m.id] = 1; } });
  su.faibles.forEach(function (f) { if (f.t < S.T) S.vus['f' + f.id] = 1; });
  S.faible = faibleA(su, S.T);
}

/* ---------- le héros prend des coups ---------- */
function blesser(S, n, source) {
  var h = S.h;
  if (!vivant(S) || protege(S) || S.etat !== 'combat') return false;
  h.pv -= n; h.coupe = 0.35;
  evt(S, 'aie', {n: n, source: source});
  if (h.pv <= 0) mourir(S, source);
  return true;
}
function mourir(S, source) {
  var h = S.h;
  if (h.mort > 0) return;
  h.pv = 0; h.mort = REG.mort.attente; h.lance = null; h.saut = null; S.bulle = null;
  S.stats.morts++;
  evt(S, 'mort', {source: source, x: h.x, y: h.y});
}

/* ---------- les obstacles ---------- */
function libreEn(x, y, r) {
  var L = REG.salle, B = REG.grosbec;
  if (x < r || x > L.L - r || y < r || y > L.P - r) return false;
  if (Math.hypot(x - B.x, y - B.y) < B.r + r) return false;
  for (var i = 0; i < REG.lieux.length; i++) if (Math.hypot(x - REG.lieux[i].x, y - REG.lieux[i].y) < REG.lieuR + r) return false;
  return true;
}
function pousser(o, r) {
  var L = REG.salle, B = REG.grosbec;
  for (var pass = 0; pass < 3; pass++) {
    o.x = cl(o.x, r, L.L - r); o.y = cl(o.y, r, L.P - r);
    [{x: B.x, y: B.y, m: B.r + r}].concat(REG.lieux.map(function (l) { return {x: l.x, y: l.y, m: REG.lieuR + r}; })).forEach(function (c) {
      var dx = o.x - c.x, dy = o.y - c.y, d = Math.hypot(dx, dy);
      if (d < c.m) { if (d < 1e-6) { dx = 0; dy = 1; d = 1; } o.x = c.x + dx / d * c.m; o.y = c.y + dy / d * c.m; }
    });
  }
}
function aLAbri(x, y, lieu) { var l = REG.lieux[lieu]; return Math.hypot(x - l.x, y - l.y) <= REG.surR; }

/* ---------- les gestes ---------- */
function lancer(S, quoi) {
  var h = S.h;
  if (S.etat !== 'combat' || S.attente > 0 || !vivant(S) || h.lance || h.saut) return false;
  if (h.bouge) return false;                                         // (R) on ne lance pas en courant
  if (quoi !== 'soin' && quoi !== 'sort') return false;
  if (quoi === 'sort' && S.boss <= 0 && S.combat === 2) return false;   // (R) en soutien, l'attaque est grise
  if (quoi === 'soin' && h.pv >= REG.heros.pv) return false;
  h.lance = {quoi: quoi, t: 0, dur: quoi === 'soin' ? REG.soin.lance : REG.sort.lance};
  evt(S, 'lance', {quoi: quoi});
  return true;
}
function sauter(S, mx, my) {
  var h = S.h;
  if (S.etat !== 'combat' || S.attente > 0 || !vivant(S) || h.saut || h.sautT > 0) return false;
  var n = Math.hypot(mx || 0, my || 0), dx = n > 0.2 ? mx / n : h.dx, dy = n > 0.2 ? my / n : h.dy;
  h.saut = {t: 0, dx: dx, dy: dy}; h.sautT = REG.saut.recharge;
  if (h.lance) { h.lance = null; evt(S, 'sortCoupe', {par: 'saut'}); }
  evt(S, 'saut');
  return true;
}
function bouclier(S) {
  var h = S.h;
  if (S.etat !== 'combat' || S.combat !== 2 || !vivant(S) || S.T < h.bouclierPret) return false;
  h.bouclierFin = S.T + REG.bouclier.dure; h.bouclierPret = S.T + S.reg.recharge;   // (R) 3 s, puis la recharge (10 s)
  evt(S, 'bouclier');
  return true;
}
function viser(S, p) {
  if (!(p >= 0 && p < 6)) return false;
  S.cible = p; evt(S, 'vise', {p: p});
  var x = partMontree(S); if (x && x.val === p) relayerPart(S);   // (v4, mode seul) toucher la partie qui bouge, c'est aussi la crier à tous
  return true;
}

/* ---------- le code de la fin ---------- */
function taper(S, ami, sym) {
  if (!vivant(S) || S.combat !== 2 || ami === S.moi) return false;   // (R) on ne tape pas le code quand on est mort
  if (S.symboles[ami] !== sym) { evt(S, 'codeFaux', {ami: ami}); return false; }
  S.code[ami] = sym; evt(S, 'codeBon', {ami: ami});
  if (victoire(S)) { S.etat = 'fini'; evt(S, 'victoire'); }
  return true;
}
function victoire(S) {
  return S.combat === 2 && S.boss <= 0 && ROLES.every(function (ro) { return ro === S.moi || S.code[ro] === S.symboles[ro]; });
}

/* ---------- « On reprend » : le dernier point de reprise (toutes les 30 s), sans rien afficher ---------- */
function pointDeReprise(T) { return Math.floor(T / REG.reprise) * REG.reprise; }
function reprendre(S) {
  if (S.combat !== 2) return false;
  var h = S.h, H = REG.heros;
  S.T = pointDeReprise(S.T); S.attente = REG.lancement;
  h.pv = H.pv; h.mort = 0; h.intouchable = 0; h.lance = null; h.saut = null; h.bouclierFin = -1; h.bouclierPret = 0;   // (R) chacun garde la vie de Grosbec
  S.vus = {}; marquerPasse(S); S.prochainEclair = S.T + 1.5; S.tirs = []; S.cris = []; S.bulle = null;
  for (var ro in S.amis) { var a = S.amis[ro]; a.mort = 0; a.bouclierFin = -1; a.bouclierPret = 0; a.voix = 0; a.prochainCoup = S.T + 2 + 2 * S.rnd(); }
  S.stats.reprises++;
  evt(S, 'reprise');
  return true;
}

/* ---------- mode seul : je « crie » une info en touchant le portrait d'un ami (ou la bulle du villageois pour l'endroit sûr) ---------- */
function mesInfos(S) {   // les bulles de mon villageois : les infos dont MA tablette est le donneur, en ce moment
  if (S.combat !== 2 || !vivant(S) || S.etat !== 'combat') return [];
  return S.su.infos.filter(function (x) { return x.donneur === S.moi && x.tA <= S.T && S.T < x.tFin; });
}
function relayer(S, ami) {
  if (!S.seul) return false;
  var bu = S.bulle;
  if (!bu || bu.type !== 'villageois' || bu.x.cible !== ami || S.relais[bu.x.ref + bu.x.quoi]) return false;   // (v3) seulement ce que montre la bulle
  S.relais[bu.x.ref + bu.x.quoi] = 1; entendre(S, S.amis[ami], bu.x, S.T + 0.2); S.stats.relaisFaits++;
  evt(S, 'relais', {ami: ami});
  return true;
}
function relayerZone(S) {
  if (!S.seul) return false;
  var bu = S.bulle;
  if (!bu || bu.type !== 'villageois' || bu.x.quoi !== 'zone' || S.relais[bu.x.ref + 'zone']) return false;
  S.relais[bu.x.ref + 'zone'] = 1; for (var ro in S.amis) entendre(S, S.amis[ro], bu.x, S.T + 0.2); S.stats.relaisFaits++;
  evt(S, 'relais', {ami: 'tous'});
  return true;
}
/* (v4) la partie faible que MA tablette montre en ce moment (sur Grosbec), ou null */
function partMontree(S) { var l = mesInfos(S).filter(function (x) { return x.quoi === 'part'; }); return l.length ? l[l.length - 1] : null; }
function relayerPart(S) {
  if (!S.seul) return false;
  var x = partMontree(S);
  if (!x || S.relais[x.ref + 'part']) return false;
  S.relais[x.ref + 'part'] = 1; for (var ro in S.amis) entendre(S, S.amis[ro], x, S.T + 0.2); S.stats.relaisFaits++;
  evt(S, 'relais', {ami: 'tous', part: x.val});
  return true;
}
function aRelayer(S, ami) { var bu = S.bulle; return !!(S.seul && bu && bu.type === 'villageois' && bu.x.cible === ami && !S.relais[bu.x.ref + bu.x.quoi]); }

/* ---------- (v3, Romain : « une seule bulle à la fois ») : ce que montre l'écran, une chose à la fois ----------
   Les candidats : ce que montre mon villageois (à crier aux autres), et, en mode seul, ce que mes robots me crient.
   L'endroit sûr passe avant tout (il coupe la bulle en cours), puis le bouclier, puis le reste, du plus ancien au plus récent.
   Une bulle reste au moins 1,8 s (2,2 s pour un cri), puis laisse la place s'il y a autre chose à montrer ;
   l'endroit sûr et le bouclier disparaissent à la frappe ; en mode seul, une info relayée disparaît. */
function prioBulle(c) { var q = c.x ? c.x.quoi : 'sym'; return q === 'zone' ? 0 : q === 'mega' ? 1 : c.type === 'villageois' ? 2 : q === 'sym' ? 4 : 3; }
function candidatsBulle(S) {
  var l = [], T = S.T;
  mesInfos(S).forEach(function (x) {
    if (x.quoi === 'part') return;                                   // (v4) la partie faible ne passe pas par une bulle : elle bouge sur Grosbec
    var cle = 'v' + x.ref + x.quoi;
    if (S.dit[cle] || (S.seul && S.relais[x.ref + x.quoi])) return;
    l.push({cle: cle, type: 'villageois', x: x, age: x.tA, fin: x.tFin, mini: 1.8});
  });
  S.cris.forEach(function (c, i) {
    var cle = 'c' + (c.x ? c.x.ref + c.x.quoi : 's' + c.de + Math.round(c.t));
    if (T < c.t || T >= c.fin || S.dit[cle]) return;
    l.push({cle: cle, type: 'ami', de: c.de, x: c.x || null, sym: c.sym || null, age: c.t, fin: c.fin, mini: 2.2});
  });
  l.forEach(function (c) { c.prio = prioBulle(c); });
  l.sort(function (a, b) { return a.prio - b.prio || a.age - b.age; });
  return l;
}
function choisirBulle(S) {
  if (!vivant(S) || S.combat !== 2 || S.etat !== 'combat') { S.bulle = null; return; }
  var T = S.T, cur = S.bulle, l = candidatsBulle(S);
  if (cur) {
    var fini = T >= cur.fin || (cur.type === 'villageois' && S.seul && S.relais[cur.x.ref + cur.x.quoi]);
    if (!fini && !l.some(function (c) { return c.cle === cur.cle; })) fini = true;
    if (fini) { S.dit[cur.cle] = 1; cur = S.bulle = null; }
  }
  var autres = l.filter(function (c) { return !cur || c.cle !== cur.cle; });
  if (cur && autres.length) {
    var mieux = autres[0];
    if (mieux.prio <= 1 && mieux.prio < cur.prio) cur = S.bulle = null;                        // l'endroit sûr ou le bouclier coupe la bulle (elle reviendra)
    else if (T - cur.debut >= cur.mini) { S.dit[cur.cle] = 1; cur = S.bulle = null; }          // assez montrée : au suivant
  }
  if (!cur && l.length) {
    var n = l.filter(function (c) { return !S.dit[c.cle]; })[0];
    if (n) { n.debut = T; S.bulle = n; if (n.type === 'villageois') evt(S, 'bulle', {x: n.x}); }
  }
}

/* ---------- les robots (mode seul) ---------- */
function entendre(S, a, x, quand) {
  if (!a) return;
  a.sait[x.ref + x.quoi] = quand;
}
// un robot crie ce que son villageois lui montre (s'il est vivant), un cri à la fois ; on l'entend avec la chance « robots »
function finFaiblesse(su, x, debut) {   // (v3) un cri de partie reste valable jusqu'à la faiblesse suivante (12 s au plus)
  var f = null; su.faibles.forEach(function (y) { if (y.t > x.tA && (!f || y.t < f.t)) f = y; });
  return Math.min(f ? f.t : debut + 12, debut + 12);
}
function robotsCrient(S) {
  var su = S.su, T = S.T;
  su.infos.forEach(function (x) {
    if (x.donneur === S.moi || x.tA > T || S.vus['c' + x.ref + x.quoi]) return;
    var g = S.amis[x.donneur];
    if (T < x.tA + 0.3) return;
    S.vus['c' + x.ref + x.quoi] = 1;
    if (g.mort > 0) return;                                          // sa tablette ne montre plus rien
    if (x.quoi === 'zone') entendre(S, g, x, x.tA + 0.3);            // son villageois court : lui, il sait
    if (S.rnd() > S.reg.robots) return;                              // il ne l'a pas vue, ou pas criée
    var urgent = x.quoi === 'zone' || x.quoi === 'mega';            // l'endroit sûr et le bouclier : on les crie tout de suite, avant le reste
    var debut = urgent ? T + 0.2 + 0.5 * S.rnd() : Math.max(T + 0.3 + 0.7 * S.rnd(), g.voix), fin = debut + (x.quoi === 'mega' ? 0.6 : 1.0);
    g.voix = fin;
    var pour = x.quoi === 'mega' ? [x.cible] : ROLES.filter(function (ro) { return ro !== x.donneur; });   // (v4) la partie et l'endroit sûr : à tout le monde
    if (x.quoi === 'part') entendre(S, g, x, x.tA + 0.3);            // celui qui la voit bouger, lui, il sait
    pour.forEach(function (ro) {

(function (G) {

var FLAMMES = [];

  for (var i = 0; i < su.zones.length; i++) { var zz = su.zones[i]; if (zz.tA > T) break; if (T < zz.tI) z = zz; }

    var gf = c.createRadialGradient(X(B.x), Y(B.y), 0, X(B.x), Y(B.y), T * 12 * Math.min(1, u * 3 + 0.2));
    gf.addColorStop(0, 'rgba(255,230,180,' + 0.8 * (1 - u) + ')'); gf.addColorStop(0.5, 'rgba(255,80,40,' + 0.6 * (1 - u) + ')'); gf.addColorStop(1, 'rgba(255,40,20,' + 0.25 * (1 - u) + ')');

/* ---------- les éclairs de Grosbec : de sa main jusqu'au héros, en zigzag, avec des branches ---------- */
function zigzag(c, x0, y0, x1, y1, n, amp, graine) {

    c.strokeStyle = 'rgba(255,120,110,' + 0.6 * f + ')'; c.lineWidth = 5; c.stroke();
    c.strokeStyle = 'rgba(255,248,245,' + f + ')'; c.lineWidth = 2; c.stroke();
    [3, 7].forEach(function (k2, ib) { var p0 = pts[k2]; if (!p0) return; var ang = Math.atan2(cible[1] - main[1], cible[0] - main[0]) + (ib ? 0.7 : -0.7), L2 = V.T * (0.8 + bruit(g + ib) * 0.8);

/* ---------- les attaques des héros : chacun la sienne ---------- */

  else { a = depart || [X(s.x), Y(s.y, 0.8)]; b = arrivee; k = cl(s.t / REG.sort.vol, 0, 1); haut = role === 'pisteur' ? V.T * 0.3 : role === 'alchimiste' ? V.T * 1.6 : V.T * 0.8; }
  var kk = role === 'pisteur' && !s.retour ? 1 - Math.pow(1 - k, 1.6) : k;
  var x = a[0] + (b[0] - a[0]) * kk, y = a[1] + (b[1] - a[1]) * kk - Math.sin(kk * Math.PI) * haut;
  var k2 = Math.min(1, kk + 0.03), x2 = a[0] + (b[0] - a[0]) * k2, y2 = a[1] + (b[1] - a[1]) * k2 - Math.sin(k2 * Math.PI) * haut;

function attaque(c, S, role, s, p, gris) {

    c.strokeStyle = gr; c.lineWidth = T * 0.22; c.lineCap = 'round'; c.beginPath(); c.moveTo(p.x - dx * L * 1.6, p.y - dy * L * 1.6); c.lineTo(p.x, p.y); c.stroke();

  var R = joy.R, dx = e.clientX - joy.bx, dy = e.clientY - joy.by, d = Math.hypot(dx, dy);
  if (d > R * 1.2) { joy.bx += dx / d * (d - R * 1.2); joy.by += dy / d * (d - R * 1.2); dx = e.clientX - joy.bx; dy = e.clientY - joy.by; d = Math.hypot(dx, dy); }
  var m = Math.min(1, d / R); joy.vx = d > 0 ? dx / d * m : 0; joy.vy = d > 0 ? dy / d * m : 0;
  var wx = dx, wy = dy / Dessin.K, n = Math.hypot(wx, wy) || 1; joy.mx = wx / n * m; joy.my = wy / n * m;
}, {passive: false});
function finDoigt(e) { if (e.pointerId === joy.id) { joy.id = null; joy.vx = joy.vy = joy.mx = joy.my = 0; } }
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { cv.addEventListener(n, finDoigt); });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- le clavier (sur ordinateur) ---------- */
var touches = {};
addEventListener('keydown', function (e) {
  var kk = e.key.toLowerCase(); touches[kk] = true;
  if (!S || !enJeu) return;
  if (kk === 'escape') { basculerPause(); return; }
  if (pause) return;
  if (kk === '1' || kk === 'a') geste('bAttaque'); else if (kk === '2' || kk === 'h') geste('bSoin');
  else if (kk === ' ') { e.preventDefault(); geste('bSaut'); } else if (kk === 'b' || kk === 'enter') geste('bBouclier');
});
addEventListener('keyup', function (e) { touches[e.key.toLowerCase()] = false; });
function entreeClavier() {
  var x = (touches.arrowright || touches.d ? 1 : 0) - (touches.arrowleft || touches.q || touches.a ? 1 : 0);
  var y = (touches.arrowdown || touches.s ? 1 : 0) - (touches.arrowup || touches.z || touches.w ? 1 : 0);
  var n = Math.hypot(x, y); return n ? {mx: x / n, my: y / n} : null;
}

/* ---------- les quatre boutons ---------- */
function refus(el) { el.classList.remove('non'); void el.offsetWidth; el.classList.add('non'); }
function geste(id) {
  if (!S || pause || !enJeu) return;
  var el = $(id), ok = false;
  if (id === 'bAttaque') ok = P3.lancer(S, 'sort');
  else if (id === 'bSoin') ok = P3.lancer(S, 'soin');
  else if (id === 'bSaut') { var kb = entreeClavier(); ok = P3.sauter(S, kb ? kb.mx : joy.mx, kb ? kb.my : joy.my); }
  else if (id === 'bBouclier') ok = P3.bouclier(S);
  if (!ok) refus(el); else { el.classList.add('appui'); setTimeout(function () { el.classList.remove('appui'); }, 120); }
}
BOUTONS.forEach(function (id) { $(id).addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); audio(); geste(id); }); });

/* ---------- le groupe, en haut à gauche : les portraits, la case du symbole à côté (le code de la fin) ---------- */
var cadres = {};
function construireGroupe() {
  var g = $('groupe'); g.innerHTML = ''; cadres = {};
  [S.moi].concat(P3.ROLES.filter(function (r) { return r !== S.moi; })).forEach(function (ro) {
    var R = Dessin.ROLES[ro], b = document.createElement('button');
    b.className = 'cadre'; b.dataset.r = ro; b.setAttribute('aria-label', ro);
    b.innerHTML = '<span class="tete" style="background:' + R.c + '">' + R.ic + '</span>' + (ro === S.moi ? '<span class="vie"><i></i><span></span></span>' : '') + '<span class="sym"></span>';
    if (ro !== S.moi) b.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); toucherAmi(ro, b); });
    g.appendChild(b); cadres[ro] = b;
  });
}
function toucherAmi(ro, b) {
  if (!S || pause || S.etat !== 'combat') return;
  if (S.seul && P3.aRelayer(S, ro)) { P3.relayer(S, ro); b.classList.add('fait'); setTimeout(function () { b.classList.remove('fait'); }, 400); return; }   // mode seul : « crier » à cet ami
  if (S.combat !== 2 || !P3.vivant(S) || S.code[ro]) { refus(b); return; }
  ouvrirSymboles(ro, b);
}
var symAmi = null;
(function () {
  var f = $('symboles');
  P3.SYMS.forEach(function (s) {
    var b = document.createElement('button'); b.textContent = s; b.setAttribute('aria-label', s);
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); e.stopPropagation(); if (!S || !symAmi) return;
      var ro = symAmi; fermerSymboles();
      if (!P3.taper(S, ro, s)) refus(cadres[ro]);
    });
    f.appendChild(b);
  });
  var x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label', 'Fermer');
  x.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); fermerSymboles(); }); f.appendChild(x);
})();
function ouvrirSymboles(ro, b) {
  symAmi = ro; var f = $('symboles'), r = b.getBoundingClientRect();
  f.classList.add('on'); f.style.left = (r.right + 8) + 'px'; f.style.top = Math.max(6, Math.min(H - f.offsetHeight - 6, r.top - 10)) + 'px';
}
function fermerSymboles() { symAmi = null; $('symboles').classList.remove('on'); }

/* ---------- le gros bouton jaune (« 3, 2, 1 », tous ensemble) ---------- */
var apresJaune = null;
function montrerJaune(txt, ferme, fn) { $('bJaune').textContent = txt; $('bJauneFerme').hidden = !ferme; $('jaune').classList.add('on'); apresJaune = fn; }
function cacherJaune() { $('jaune').classList.remove('on'); apresJaune = null; }
$('bJaune').addEventListener('pointerdown', function (e) { e.preventDefault(); audio(); var fn = apresJaune; cacherJaune(); fige = false; if (fn) fn(); });
$('bJauneFerme').addEventListener('pointerdown', function (e) { e.preventDefault(); var depart = fige; cacherJaune(); if (depart && S && S.T === 0 && !S.seul) { enJeu = false; fige = false; $('debut').classList.add('on'); } });
$('bReprise').addEventListener('pointerdown', function (e) {
  e.preventDefault(); if (!S || S.combat !== 2 || S.etat !== 'combat') { refus($('bReprise')); return; }
  // (R) quand les quatre sont à terre : chacun touche ↺, puis tous ensemble le gros bouton jaune ; la tablette revient toute seule au dernier point de reprise
  montrerJaune('↺', true, function () { P3.reprendre(S); caler(); });
});

/* ---------- chaque image : les boutons, le groupe ---------- */
function cls(el, c, v) { if (el.classList.contains(c) !== !!v) el.classList.toggle(c, !!v); }
function majInterface() {
  var en = S && enJeu && S.etat === 'combat', h = S && S.h, viv = S && P3.vivant(S);
  BOUTONS.forEach(function (id) { cls($(id), 'on', en && viv); });
  cls($('groupe'), 'on', en && viv);   // (R) mort : plus aucune info
  cls($('bPause'), 'on', enJeu && !finMontree); cls($('bReprise'), 'on', en && S.combat === 2);
  cls(cv, 'mort', en && !viv);
  if (!S || !en) return;
  var c1 = S.combat === 1, sout = S.combat === 2 && S.boss <= 0;
  cls($('bBouclier'), 'on', en && viv && !c1);   // (R) au premier combat : pas de pierre de protection
  [['bAttaque', 'sort'], ['bSoin', 'soin']].forEach(function (b) {
    var el = $(b[0]); cls(el, 'eteint', b[1] !== 'soin' && sout);
    el.style.setProperty('--p', h.lance && h.lance.quoi === b[1] ? (h.lance.t / h.lance.dur).toFixed(3) : 0);
    el.style.setProperty('--c', b[1] === 'soin' ? '#5fe07a' : Dessin.ROLES[S.moi].c);
  });
  $('bSaut').style.setProperty('--r', h.sautT > 0 ? (h.sautT / REG.saut.recharge).toFixed(3) : 0);
  var bq = $('bBouclier'), att = Math.max(0, h.bouclierPret - S.T);
  cls(bq, 'leve', h.bouclierFin > S.T); bq.style.setProperty('--r', h.bouclierFin > S.T ? 0 : (att / S.reg.recharge).toFixed(3));
  cls($('bSoin'), 'appel', h.pv <= 40 && !h.lance);
  // le groupe
  var mc = cadres[S.moi];
  if (mc) { var pv = Math.max(0, Math.round(h.pv)), vi = mc.querySelector('.vie i'); vi.style.width = pv + '%'; vi.style.background = pv > 70 ? '#5fe07a' : pv > 40 ? '#ffa23a' : '#ff4a3a'; mc.querySelector('.vie span').textContent = pv;
    var ms = mc.querySelector('.sym'), t1 = sout ? S.symboles[S.moi] : ''; if (ms.textContent !== t1) { ms.textContent = t1; cls(ms, 'plein', !!t1); } cls(mc, 'crie', sout && S.reel - (S.symboleT || 0) < 6); }
  for (var ro in cadres) {
    if (ro === S.moi) continue;
    var cd = cadres[ro], s2 = cd.querySelector('.sym'), t2 = S.code[ro] || '';
    if (s2.textContent !== t2) { s2.textContent = t2; cls(s2, 'plein', !!t2); }
    cls(cd, 'mort', S.seul && S.amis[ro].mort > 0);
    cls(cd, 'crie', S.seul && P3.aRelayer(S, ro));   // mode seul : il y a quelque chose à lui crier
  }
  cls($('bReprise'), 'appel', !viv && S.seul && Object.keys(S.amis).every(function (r) { return S.amis[r].mort > 0; }));
}

/* ---------- la pause, les réglages ---------- */
function basculerPause() {
  if (!enJeu) return;
  pause = !pause; $('pause').classList.toggle('on', pause);
  if (pause) { majMenu(); horloge.pauseT = performance.now(); fermerSymboles(); }
  else if (S && S.seul) horloge.zero += performance.now() - horloge.pauseT;   // en mode seul, le temps s'arrête ; à quatre, non
  joy.id = null; joy.mx = joy.my = 0;
}
$('bPause').addEventListener('click', basculerPause);
$('bReprendre').addEventListener('click', function () { if (!enJeu) { $('pause').classList.remove('on'); $('debut').classList.add('on'); return; } basculerPause(); });
document.querySelectorAll('.choix[data-r]').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var r = g.dataset.r, v = b.dataset.v;
    reglages[r] = r === 'sons' ? v === 'true' : (r === 'vie' ? v : +v);
    if (S && r !== 'debut' && r !== 'vie') S.reg[r] = reglages[r];
    garder(); majMenu();
  });
});
$('bRecommencer').addEventListener('click', function () { pause = false; $('pause').classList.remove('on'); demarrer(); });
$('bAccueil').addEventListener('click', function () { pause = false; enJeu = false; S = null; $('pause').classList.remove('on'); cacherJaune(); $('debut').classList.add('on'); });
function majMenu() {
  document.querySelectorAll('.choix[data-r]').forEach(function (g) {
    var r = g.dataset.r; g.querySelectorAll('button').forEach(function (b) { b.classList.toggle('choisi', String(reglages[r]) === b.dataset.v); });
  });
  $('noteQuatre').hidden = !(S && !S.seul && enJeu);
  $('mesures').textContent = 'Maquette rapide de la phase 3, ' + VERSION + ' · ' + ips + ' images par seconde' + (S ? ' · partie ' + S.partie : '');
}

/* ---------- avant de jouer : son héros, seul ou à quatre ---------- */
var roles = $('roles');
P3.ROLES.forEach(function (r) {
  var b = document.createElement('button'), R = Dessin.ROLES[r];
  b.style.background = R.c; b.textContent = R.ic; b.dataset.r = r; b.setAttribute('aria-label', r);
  b.addEventListener('click', function () { reglages.role = r; garder(); majDebut(); });
  roles.appendChild(b);
});
$('modes').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; reglages.mode = b.dataset.m; garder(); majDebut(); });
'1234567890'.split('').forEach(function (d) { var b = document.createElement('button'); b.textContent = d; b.addEventListener('click', function () { if (numero.length < 3) numero += d; majDebut(); }); $('pave').appendChild(b); });
(function () { var b = document.createElement('button'); b.textContent = '⌫'; b.setAttribute('aria-label', 'Effacer'); b.addEventListener('click', function () { numero = numero.slice(0, -1); majDebut(); }); $('pave').appendChild(b); })();
function majDebut() {
  roles.querySelectorAll('button').forEach(function (b) { b.classList.toggle('choisi', b.dataset.r === reglages.role); });
  $('modes').querySelectorAll('button').forEach(function (b) { b.classList.toggle('choisi', b.dataset.m === reglages.mode); });
  cls($('numero'), 'on', reglages.mode === 'quatre'); $('numVal').textContent = numero || '—';
  $('bGo').disabled = reglages.mode === 'quatre' && !numero; $('bGo').style.opacity = $('bGo').disabled ? 0.35 : 1;
}
majDebut();
$('bGo').addEventListener('click', function () { if (!$('bGo').disabled) demarrer(); });
$('bReglages').addEventListener('click', function () { $('debut').classList.remove('on'); $('pause').classList.add('on'); majMenu(); });

/* ---------- la fin : sans un mot ---------- */
function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function montrerFin() {
  finMontree = true;
  $('fin4').innerHTML = P3.ROLES.map(function (ro) { var R = Dessin.ROLES[ro]; return '<div><i style="background:' + R.c + '">' + R.ic + '</i>' + S.symboles[ro] + '</div>'; }).join('');
  $('stats').innerHTML = '<span>⏱</span><b>' + mmss(S.T) + '</b><span>💀</span><b>' + S.stats.morts + '</b><span>↺</span><b>' + S.stats.reprises + '</b>';
  $('fin').classList.add('on');
}
$('bRejouer').addEventListener('click', function () { $('fin').classList.remove('on'); enJeu = false; S = null; $('debut').classList.add('on'); });

/* ---------- la boucle : le temps suit l'horloge (les quatre tablettes restent calées), pas le nombre d'images ---------- */
var avant = performance.now(), ips = 60, nImg = 0, t0 = avant;
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  nImg++; if (maintenant - t0 > 1000) { ips = Math.round(nImg * 1000 / (maintenant - t0)); nImg = 0; t0 = maintenant;
    // (v4) l'appareil n'arrive pas à suivre ? on dessine un peu moins fin (jamais pendant une pause ou un écran)
    if (S && enJeu && !pause && !document.hidden && S.etat === 'combat') { if (ips < 42 && QUAL > 0) { if (++qualT >= 2) { QUAL--; qualT = 0; taille(); } } else qualT = 0; } }
  if (S && enJeu && !fige && !(pause && S.seul)) {
    var cible = horloge.reel0 + (maintenant - horloge.zero) / 1000, n = 0;
    while (S.reel < cible - 1e-6 && n++ < 600) {
      var dt = Math.min(0.05, cible - S.reel), kb = entreeClavier(), e = kb || {mx: joy.mx, my: joy.my};
      if (window.__pilote) e = window.__pilote(S, dt) || e;   // pour les essais : un robot peut tenir la manette
      P3.pas(S, dt, pause ? null : e);
    }
    if (S.etat === 'go' && !$('jaune').classList.contains('on')) montrerJaune('GO', false, function () { P3.demarrerC2(S); caler(); });
    if (S.etat === 'fini' && !finMontree) { var ev = P3.dernier(S, 'victoire', 99); if (!ev || S.reel - ev.t > 2.2) montrerFin(); }   // (v4) d'abord, il tombe
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S && enJeu) Dessin.tout(ctx, S, vue, W, H, joy, dctx); else { ctx.fillStyle = '#070912'; ctx.fillRect(0, 0, W, H); }
  majInterface();
}
document.addEventListener('visibilitychange', function () { if (document.hidden && S && S.seul && enJeu && !pause && !finMontree) basculerPause(); });
taille();
requestAnimationFrame(boucle);

window.__p3 = {get S() { return S; }, set fige(v) { fige = v; }, P3: P3, geste: geste, vue: vue, dctx: dctx, demarrer: demarrer, reglages: reglages,
  get ips() { return ips; }, get qualite() { return QUAL; }, VERSION: VERSION, toucherAmi: function (ro) { toucherAmi(ro, cadres[ro]); }, caler: caler,
  jaune: function () { $('bJaune').dispatchEvent(new PointerEvent('pointerdown')); }};
})();

</script>
</body>
