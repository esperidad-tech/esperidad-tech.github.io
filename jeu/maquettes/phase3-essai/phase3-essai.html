<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phase 3 — essai à quatre tablettes</title>
<style>
:root{
  --fond:#0f1320; --panneau:#1a2134; --panneau2:#222b42; --texte:#eef1f8; --doux:#9aa6c2;
  --jaune:#ffd23f; --rouge:#ff5548; --vert:#5fd38a; --bleu:#5fb4ff;
  --pisteur:#5fcf86; --alchimiste:#b48cff; --barde:#ff8fb3; --sage:#6cb6ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--fond); color:var(--texte); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation}
.cache{display:none !important}
/* l'habillage autour du jeu : un fond doux, le jeu au centre */
body{background:radial-gradient(ellipse at 50% 30%, #1c2440 0%, #0f1320 60%, #090c15 100%)}
#app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- les écrans d'avant ---------- */
.page{width:min(100%, 760px); max-height:100%; overflow:auto; padding:2.2vmin 3vmin; display:flex; flex-direction:column; gap:2.4vmin; align-items:center}
.titre{font-size:clamp(18px,4.2vmin,34px); font-weight:800; letter-spacing:.04em; opacity:.9; text-align:center}
.titre small{display:block; font-size:.5em; font-weight:600; color:var(--doux); letter-spacing:.1em}
.ligne{display:flex; gap:2vmin; flex-wrap:wrap; justify-content:center; align-items:center}
.lbl{font-size:clamp(12px,2.6vmin,18px); color:var(--doux); font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.heros-choix{display:flex; flex-direction:column; align-items:center; gap:.8vmin; padding:1.4vmin; border-radius:18px; background:var(--panneau); border:3px solid transparent; min-width:clamp(70px,17vmin,130px)}
.heros-choix.choisi{border-color:var(--jaune); background:var(--panneau2); transform:scale(1.04)}
.tete{display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--c); color:#111; font-size:1em; width:1.9em; height:1.9em; box-shadow:0 0 0 3px rgba(0,0,0,.35) inset}
.heros-choix .tete{font-size:clamp(26px,6.5vmin,48px)}
.heros-choix b{font-size:clamp(11px,2.3vmin,16px); letter-spacing:.06em}
.numero{font-size:clamp(34px,9vmin,70px); font-weight:800; min-width:3.2em; text-align:center; background:var(--panneau); border-radius:14px; padding:.05em .3em; letter-spacing:.08em; border:3px solid #33405f}
.numero.vide{color:#56617d}
.pave{display:grid; grid-template-columns:repeat(5, auto); gap:1.2vmin}
.pave button{width:clamp(42px,9vmin,68px); height:clamp(42px,9vmin,68px); border-radius:12px; background:var(--panneau2); font-size:clamp(20px,4.6vmin,32px); font-weight:800}
.pave button:active{background:#33405f}
.choix{display:flex; background:var(--panneau); border-radius:12px; padding:4px; gap:4px}
.choix button{padding:.5em .8em; border-radius:9px; font-size:clamp(13px,2.7vmin,19px); font-weight:700; color:var(--doux)}
.choix button.oui{background:#3a4769; color:var(--texte)}
.jaune{background:var(--jaune) !important; color:#111 !important; font-weight:900; border-radius:16px; padding:.55em 1.4em; font-size:clamp(20px,5vmin,36px);
  box-shadow:0 5px 0 #b38c00, 0 0 24px rgba(255,210,63,.35); letter-spacing:.04em}
.jaune:active{transform:translateY(3px); box-shadow:0 2px 0 #b38c00}
.jaune[disabled]{opacity:.35; box-shadow:none}
.gris{background:var(--panneau2); color:var(--doux); border-radius:12px; padding:.5em 1em; font-weight:700; font-size:clamp(13px,2.7vmin,18px)}
.go{font-size:clamp(46px,16vmin,130px); padding:.2em 1.1em; border-radius:28px}
.compte{font-size:clamp(20px,5vmin,40px); color:var(--doux); font-weight:800; letter-spacing:.3em}
.equipe{display:flex; gap:1.6vmin}
.equipe .tete{font-size:clamp(18px,4.5vmin,34px)}
.equipe .moi .tete{box-shadow:0 0 0 4px var(--jaune)}
.reperes{font-size:clamp(14px,3vmin,22px); font-weight:700; color:var(--doux); background:var(--panneau); border-radius:12px; padding:.4em .9em; text-align:center}
.reperes b{color:var(--texte)}

/* ---------- le jeu ---------- */
.jeu{position:relative; width:100%; height:100%; display:grid; gap:1vmin; padding:1vmin;
  grid-template-columns:1fr; grid-template-rows:auto auto minmax(0,1fr) auto; grid-template-areas:"haut" "cartes" "arene" "commandes"}
@media (min-aspect-ratio: 5/4){
  .jeu{grid-template-columns:minmax(0,30fr) minmax(0,47fr) minmax(0,23fr); grid-template-rows:auto minmax(0,1fr); grid-template-areas:"haut haut haut" "cartes arene commandes"}
}
.haut{grid-area:haut; display:flex; align-items:center; gap:1.4vmin; background:rgba(26,33,52,.85); border-radius:14px; padding:.6vmin 1.2vmin; min-height:44px}
.reprendre{font-size:clamp(14px,2.8vmin,20px); font-weight:800; background:var(--panneau2); border-radius:10px; padding:.35em .7em; white-space:nowrap}
.reprendre.appel{background:var(--jaune); color:#111; animation:battre 1s infinite}
@keyframes battre{50%{transform:scale(1.08)}}
.ou{flex:1; min-width:0; text-align:center; font-size:clamp(11px,2.3vmin,16px); color:var(--doux); font-weight:700}
.ou b{color:var(--texte); font-size:1.2em}
.prog-manche{height:5px; background:#2b3550; border-radius:3px; margin-top:3px; overflow:hidden}
.prog-manche i{display:block; height:100%; width:0; background:#7b8bb5}
.code{display:flex; gap:.8vmin}
.case{position:relative; width:clamp(34px,6.6vmin,52px); height:clamp(34px,6.6vmin,52px); border-radius:12px; background:var(--panneau2); border:3px solid var(--c);
  display:flex; align-items:center; justify-content:center; font-size:clamp(17px,3.6vmin,28px)}
.case .mini{position:absolute; left:-6px; top:-8px; font-size:.5em; width:1.6em; height:1.6em}
.case.moi{border-style:dashed}
.case.bon{background:#24402f}
.case.faux{animation:secouer .4s}
@keyframes secouer{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.case.crie{box-shadow:0 0 0 3px var(--jaune); animation:battre 1s infinite}

.cartes{grid-area:cartes; display:flex; flex-direction:column; gap:1vmin; min-height:calc(2 * clamp(62px, 11vmin, 96px) + 1vmin); justify-content:flex-start}
@media (min-aspect-ratio: 5/4){ .cartes{justify-content:center} }
.carte{position:relative; display:flex; align-items:center; gap:1.4vmin; background:var(--panneau); border-radius:14px; border:3px solid var(--c);
  padding:.8vmin 1.2vmin 14px; min-height:clamp(62px,11vmin,96px); animation:arrive .25s ease-out}
@keyframes arrive{from{transform:scale(.85); opacity:0}}
.carte .qui{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:4.2em}
.carte .qui .tete{font-size:clamp(20px,4.4vmin,34px)}
.carte .qui b{font-size:clamp(10px,1.9vmin,14px); letter-spacing:.05em; color:var(--c)}
.carte .infos{display:flex; gap:1.4vmin; flex-wrap:wrap; align-items:center}
.info{display:flex; flex-direction:column; align-items:center; gap:2px}
.info b{font-size:clamp(13px,2.9vmin,22px); letter-spacing:.04em}
.info svg{width:clamp(34px,6.5vmin,52px); height:clamp(24px,4.6vmin,36px)}
.pastille{display:inline-flex; align-items:center; justify-content:center; width:clamp(26px,5vmin,40px); height:clamp(26px,5vmin,40px); border-radius:50%; font-size:clamp(15px,3vmin,24px)}
.carte.mega{background:#3a1820}
.carte.mega .info b{color:#ffb3ad}
.minuteur{position:absolute; left:10px; right:10px; bottom:5px; height:5px; border-radius:3px; background:#2b3550; overflow:hidden}
.minuteur i{display:block; height:100%; background:var(--c)}
.carte.mega .minuteur i{background:var(--rouge)}
.carte .porte{position:absolute; right:8px; top:6px; font-size:clamp(12px,2.4vmin,18px)}

.arene-boite{grid-area:arene; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; min-width:0}
/* l'arène remplit sa case ; le dessin garde ses proportions au centre (preserveAspectRatio par défaut) */
.arene{display:block; position:absolute; inset:0; width:100%; height:100%; touch-action:none}

.commandes{grid-area:commandes; display:flex; gap:1.4vmin; align-items:center; justify-content:center; flex-wrap:wrap}
@media (min-aspect-ratio: 5/4){ .commandes{flex-wrap:nowrap} .commandes .elems,.commandes .actions{flex-direction:column} }
.elems,.actions{display:flex; gap:1.4vmin}
.elem{width:clamp(54px,11vmin,92px); height:clamp(54px,11vmin,92px); border-radius:50%; background:var(--c); color:#111; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:clamp(20px,4.4vmin,34px); box-shadow:0 4px 0 rgba(0,0,0,.4); border:4px solid transparent; line-height:1}
.elem b{font-size:clamp(9px,1.8vmin,13px); letter-spacing:.05em; margin-top:3px}
.elem.oui{border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.25), 0 4px 0 rgba(0,0,0,.4)}
.elem[disabled]{filter:grayscale(1) brightness(.5)}
.act{position:relative; width:clamp(64px,12.5vmin,104px); height:clamp(54px,11vmin,92px); border-radius:18px; background:var(--panneau2); display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:clamp(20px,4.4vmin,34px); line-height:1; overflow:hidden}
.act b{font-size:clamp(9px,1.8vmin,13px); letter-spacing:.05em; margin-top:3px; position:relative}
.act.bouclier{background:#1d3a66}
.act.bouclier.leve{background:var(--bleu); color:#111}
.act.bouclier.attend{filter:grayscale(1) brightness(.55)}
.act .attente{position:absolute; right:6px; top:4px; font-size:clamp(11px,2.2vmin,16px); font-weight:900; color:#ffb3ad}
.act.soin{background:#1f4630}
.act .prog{position:absolute; left:0; bottom:0; height:100%; width:0; background:rgba(95,211,138,.55)}
.act[disabled]{filter:grayscale(1) brightness(.5)}

/* les fenêtres par-dessus le jeu */
.voile{position:absolute; inset:0; background:rgba(8,10,18,.72); display:flex; align-items:center; justify-content:center; z-index:5}
.fenetre{background:var(--panneau); border-radius:22px; padding:3vmin; display:flex; flex-direction:column; gap:2.4vmin; align-items:center; box-shadow:0 10px 40px rgba(0,0,0,.6); max-width:94vw; max-height:94vh; overflow:auto; position:relative}
.ferme{position:absolute; right:10px; top:8px; font-size:clamp(18px,3.6vmin,26px); color:var(--doux); padding:.2em .4em}
.pas{display:flex; align-items:center; gap:1.6vmin}
.pas button{width:clamp(44px,9vmin,64px); height:clamp(44px,9vmin,64px); border-radius:12px; background:var(--panneau2); font-size:clamp(20px,4.6vmin,30px); font-weight:900}
.pas .val{font-size:clamp(30px,8vmin,60px); font-weight:900; min-width:1.6em; text-align:center}
.symboles{display:grid; grid-template-columns:repeat(5, auto); gap:1.4vmin}
.symboles button{width:clamp(52px,11vmin,84px); height:clamp(52px,11vmin,84px); border-radius:14px; background:var(--panneau2); font-size:clamp(28px,6vmin,46px)}
.victoire{font-size:clamp(60px,18vmin,140px)}

/* les robots : quatre petites tablettes */
.demo{width:100%; height:100%; display:flex; flex-direction:column; gap:1vmin; padding:1vmin}
.demo-haut{display:flex; align-items:center; gap:1.4vmin; justify-content:center; flex-wrap:wrap}
.demo-grille{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1vmin}
.mini{position:relative; background:rgba(26,33,52,.6); border-radius:14px; border:2px solid var(--c); display:grid; grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); min-height:0; overflow:hidden; padding:.6vmin; gap:.6vmin}
@media (min-aspect-ratio: 5/4){ .mini{grid-template-columns:minmax(0,40fr) minmax(0,60fr); grid-template-rows:minmax(0,1fr)} }
.mini .cartes{justify-content:center}
.mini .cartes,.mini .arene-boite{grid-area:auto}
@media (max-aspect-ratio: 5/4){ .mini{padding-top:calc(clamp(16px,4vmin,30px) + 10px)} }
.mini .cartes{min-height:0; gap:.5vmin}
.mini .carte{min-height:0; padding:.4vmin .6vmin 9px; border-width:2px; gap:.8vmin}
.mini .carte .qui{min-width:3em}
.mini .carte .qui .tete{font-size:clamp(12px,2.6vmin,20px)}
.mini .carte .qui b,.mini .info b{font-size:clamp(8px,1.5vmin,12px)}
.mini .info svg{width:clamp(20px,3.6vmin,30px); height:clamp(14px,2.6vmin,22px)}
.mini .pastille{width:clamp(16px,2.8vmin,24px); height:clamp(16px,2.8vmin,24px); font-size:clamp(9px,1.7vmin,14px)}
.mini .arene-boite{min-height:0}
.mini .nomini{position:absolute; left:6px; top:4px; z-index:2; font-size:clamp(11px,2.6vmin,18px)}
.bandeau{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); background:var(--jaune); color:#111; font-weight:900; font-size:clamp(22px,6vmin,46px); padding:.3em 1em; border-radius:18px; z-index:6; box-shadow:0 8px 30px rgba(0,0,0,.6); pointer-events:none}

/* le dessin de l'arène (formes simples) */
.zone{fill:#1b2236; stroke:#2e3a58; stroke-width:1.5}
.zone-txt{fill:#56627f; font-size:10px; font-weight:800; letter-spacing:.08em; text-anchor:middle}
.zone.feu{fill:#7a1f1a}
.alerte{fill:none; stroke:var(--jaune); stroke-width:3; stroke-dasharray:8 5}
.gb{fill:#4a1820; stroke:#ff6a55; stroke-width:2.5; stroke-linejoin:round}
.gb-bras{stroke:#ff6a55; stroke-width:12; stroke-linecap:round}
.gb-bras2{stroke:#4a1820; stroke-width:7; stroke-linecap:round}
.gb.flash,.gb-bras.flash{stroke:#fff}
.part-zone{fill:transparent; cursor:pointer}
.viseur{fill:none; stroke:#fff; stroke-width:2.5; stroke-dasharray:5 4}
.bb-fond{fill:#2a3049}
.bb-vie{fill:#ff5548}
.vie-fond{fill:#2a3049}
.vie{fill:var(--vert)}
.txt{font-weight:900; text-anchor:middle; dominant-baseline:central}
</style>
</head>
<body>
<div id="app"></div>
<script>/* ===== moteur.js ===== */
/* =====================================================================
   Phase 3, maquette rapide (chantier 4 du § 18.11) — LE MOTEUR
   Aucun dessin ici : les règles, le hasard partagé, la suite des coups,
   la simulation d'UN joueur (sa tablette), et un robot pour les essais.
   Marche dans la page et dans node (tests/robot.js).

   Le principe (Bible § 18.5) : les quatre tablettes ne sont pas reliées.
   Chacune calcule LA MÊME suite de coups à partir du numéro de partie,
   du numéro de l'essai et du numéro de la manche (aucun Math.random ici).
   Chaque tablette ne simule que SON héros ; elle affiche les cartes
   « à crier » dont elle est le donneur (jamais celles qui la concernent).
   ===================================================================== */
(function (G) {
'use strict';

var ROLES = ['pisteur', 'alchimiste', 'barde', 'sage'];
var R = {
  pisteur:    { nom: 'PISTEUR',    ic: '🏹', c: '#5fcf86' },
  alchimiste: { nom: 'ALCHIMISTE', ic: '⚗️', c: '#b48cff' },
  barde:      { nom: 'BARDE',      ic: '🎻', c: '#ff8fb3' },
  sage:       { nom: 'SAGE',       ic: '📜', c: '#6cb6ff' }
};
/* L'anneau du début (Bible § 18.5, « la montée ») : le Barde donne au Sage, le Sage à l'Alchimiste,
   l'Alchimiste au Pisteur, le Pisteur au Barde. [donneur, receveur] */
var ANNEAU = [['barde', 'sage'], ['sage', 'alchimiste'], ['alchimiste', 'pisteur'], ['pisteur', 'barde']];
var ZONES = ['GAUCHE', 'MILIEU', 'DROITE'];
var ELEMS = [{ n: 'FEU', ic: '🔥', c: '#ff7a2f' }, { n: 'ACIDE', ic: '🧪', c: '#8fe03a' }, { n: 'GEL', ic: '❄️', c: '#8fdcff' }];
/* les parties du corps se nomment par ce qu'on voit (Bible § 18.5, point 3) */
var PARTIES = ['LANTERNE', 'CORBEAU', 'CŒUR', 'TÊTE'];
/* Les symboles de victoire : ceux du jeu (DONNEES.SYM), sans 🔥 (c'est le feu) ni ❤️ (c'est le cœur de Grosbec). */
var SYMB = [['lune', '🌙', 'LUNE'], ['etoile', '⭐', 'ÉTOILE'], ['soleil', '☀️', 'SOLEIL'], ['cle', '🔑', 'CLÉ'],
  ['champi', '🍄', 'CHAMPIGNON'], ['poisson', '🐟', 'POISSON'], ['arbre', '🌳', 'ARBRE'], ['cloche', '🔔', 'CLOCHE'],
  ['chapeau', '🎩', 'CHAPEAU'], ['chat', '🐱', 'CHAT']];

/* ---------- Les réglages qui comptent pour le jeu (tous les chiffres sont ici) ---------- */
var REG = {
  vie: 100,            // la vie d'un héros
  degZone: 60,         // une frappe de zone qui tombe sur toi
  degMega: 100,        // la méga attaque sans bouclier : tu tombes
  soin: 35,            // ce que rend un soin
  soinDuree: 2.5,      // le soin : rester sans bouger, sans taper ; un coup reçu le coupe
  tir: 0.65,           // le héros tape tout seul toutes les 0,65 s, sur la partie choisie, avec l'élément choisi
  deplacement: 0.28,   // aller d'une zone à l'autre (pendant ce temps, on ne tape pas)
  bouclierDuree: 5,    // le bouclier tient 5 s (ou jusqu'à la méga attaque qu'il arrête)
  bouclierAttente: 2,  // une fois levé, il revient après DEUX méga attaques (celle qu'il arrête ou qu'il rate, puis la suivante) :
                       // on ne peut donc pas le lever à chaque fois « au cas où » ; et on n'est jamais visé deux fois de suite
  bossVie: { court: 200, normal: 330, long: 480 },
  lancement: 2         // après « GO » : deux secondes de calme
};
/* La vitesse (la même sur les quatre tablettes) : un facteur sur toutes les durées des manches. */
var VITESSES = { lente: 1.25, normale: 1, rapide: 0.85 };

/* ---------- Le hasard partagé ---------- */
function hash(s) { var h = 2166136261 >>> 0; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function rngDe(s) {
  var a = hash(s);
  return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function entier(r, n) { return Math.floor(r() * n); }
function melanger(r, a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = entier(r, i + 1), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function arrondi(x) { return Math.round(x * 100) / 100; }
/* chacun donne une fois et reçoit une fois, jamais à soi-même */
function derangement(r) {
  for (;;) {
    var p = melanger(r, ROLES), ok = true;
    for (var i = 0; i < 4; i++) if (p[i] === ROLES[i]) { ok = false; break; }
    if (ok) return ROLES.map(function (g, i) { return [g, p[i]]; });
  }
}
/* coupe un tour (4 échanges) en deux temps de deux échanges qui ne se touchent pas (deux paires qui parlent en même temps) */
function enPaires(r, arcs) {
  for (var j = 1; j < 4; j++) {
    var a = arcs[0], b = arcs[j];
    if (a[0] !== b[0] && a[0] !== b[1] && a[1] !== b[0] && a[1] !== b[1]) {
      var reste = arcs.filter(function (x, k) { return k !== 0 && k !== j; });
      var p1 = [a, b], p2 = reste;
      return r() < 0.5 ? [p1, p2] : [p2, p1];
    }
  }
  throw new Error('enPaires');
}
/* Les symboles de victoire de la partie : quatre différents, un par rôle (ne changent pas d'un essai à l'autre). */
function symboles(partie) {
  var r = rngDe('symboles|' + partie), l = melanger(r, SYMB.map(function (s, i) { return i; })), o = {};
  ROLES.forEach(function (ro, i) { o[ro] = l[i]; });
  return o;
}

/* ---------- La montée, manche par manche (Bible § 18.5 : un cycle simple, puis ça s'enchaîne, ça se mélange,
   ça accélère, des informations en même temps) ---------- */
function niveau(m) {
  var n;
  if (m === 1) n = { ordre: 'anneau', parTemps: [1], items: ['zone'], gap: 5.0, warn: 4.0, tours: 2, mega: false };
  else if (m === 2) n = { ordre: 'anneau', parTemps: [1], items: ['zone', 'elem'], gap: 4.6, warn: 3.8, tours: 2, mega: false };
  else if (m === 3) n = { ordre: 'anneau', parTemps: [1], items: ['zone', 'elem', 'part'], gap: 4.6, warn: 3.8, tours: 2, mega: false };
  else if (m === 4) n = { ordre: 'anneau', parTemps: [1], items: ['zone', 'elem', 'part'], gap: 3.7, warn: 3.4, tours: 2, mega: true };
  else if (m === 5) n = { ordre: 'melange', parTemps: [1], items: ['zone', 'elem', 'part'], gap: 3.5, warn: 3.2, tours: 2, mega: true };
  else if (m === 6) n = { ordre: 'melange', parTemps: [2], items: ['zone', 'elem', 'part'], gap: 4.3, warn: 3.3, tours: 3, mega: true };
  else if (m === 7) n = { ordre: 'melange', parTemps: [2], items: ['zone', 'elem', 'part'], gap: 3.9, warn: 3.1, tours: 3, mega: true };
  else if (m === 8) n = { ordre: 'melange', parTemps: [2, 4], items: ['zone', 'elem', 'part'], gap: 3.7, warn: 3.0, tours: 4, mega: true };
  else {
    var k = m - 8;
    n = { ordre: 'melange', parTemps: [4, 2], items: ['zone', 'elem', 'part'], gap: Math.max(2.7, 3.7 * Math.pow(0.95, k)),
      warn: Math.max(2.3, 3.0 * Math.pow(0.96, k)), tours: 4, mega: true };
  }
  n.warn = Math.min(n.warn, n.gap - 0.4);   // un même héros ne reçoit jamais deux frappes de zone qui se chevauchent
  n.megaWarn = m <= 5 ? 3.6 : (m <= 8 ? 3.2 : 2.8);
  return n;
}

/* ---------- Une manche : la liste de tous les coups, pour les quatre héros ---------- */
var CACHE = {};
function manche(partie, essai, m, vitesse) {
  var cle = [partie, essai, m, vitesse].join('|');
  if (!CACHE[cle]) CACHE[cle] = fabriquerManche(partie, essai, m, vitesse);
  return JSON.parse(CACHE[cle]);
}
function fabriquerManche(partie, essai, m, vitesse) {
  var f = VITESSES[vitesse] || 1, n = niveau(m), r = rngDe(['manche', partie, essai, m, vitesse].join('|'));
  var gap = n.gap * f, warn = n.warn * f, megaWarn = n.megaWarn * f;
  var ev = [], t = 1.5 * f, id = 0, derniere = {}, megaAvant = null, donnes = { pisteur: 0, alchimiste: 0, barde: 0, sage: 0 };
  var megaDons = { pisteur: 0, alchimiste: 0, barde: 0, sage: 0 };   // les cartes sont équilibrées par construction ; on équilibre les méga attaques
  var impacts = { pisteur: [], alchimiste: [], barde: [], sage: [] };
  /* jamais deux méga attaques de suite sur le même héros, même d'une manche à l'autre */
  if (m > 1) { var mp = manche(partie, essai, m - 1, vitesse).ev.filter(function (e) { return e.k === 'mega'; }); if (mp.length) megaAvant = mp[mp.length - 1].cible; }
  for (var tour = 0; tour < n.tours; tour++) {
    var arcs = n.ordre === 'anneau' ? ANNEAU.slice() : derangement(r);
    var pt = n.parTemps[tour % n.parTemps.length], temps;
    if (pt === 1) temps = arcs.map(function (a) { return [a]; });
    else if (pt === 2) temps = enPaires(r, arcs);
    else temps = [arcs];
    var megaApres = n.mega ? entier(r, temps.length) : -1;
    for (var b = 0; b < temps.length; b++) {
      temps[b].forEach(function (a) {
        var c = { k: 'carte', id: ++id, donneur: a[0], cible: a[1], tA: arrondi(t), tI: arrondi(t + warn), zone: entier(r, 3), elem: null, part: null };
        var av = derniere[a[1]];
        if (n.items.indexOf('elem') >= 0) {
          do {
            c.elem = entier(r, 3);
            c.part = n.items.indexOf('part') >= 0 ? entier(r, 4) : null;
          } while (av && av.elem === c.elem && av.part === c.part);
        }
        derniere[a[1]] = c; donnes[a[0]]++; impacts[a[1]].push(c.tI);
        ev.push(c);
      });
      t += gap;
      if (b === megaApres) {
        /* la méga attaque : sur toutes les tablettes, un seul héros visé ; l'information est chez un autre */
        var tA = t - gap * 0.45, tI = tA + megaWarn;
        var cand = ROLES.filter(function (ro) {
          return ro !== megaAvant && impacts[ro].every(function (x) { return Math.abs(x - tI) > 0.9 * f; });
        });
        if (!cand.length) cand = ROLES.filter(function (ro) { return ro !== megaAvant; });
        /* le donneur d'abord (celui qui a le moins crié, et pas déjà en train de crier), puis le visé */
        var mini = Math.min.apply(null, ROLES.map(function (ro) { return megaDons[ro]; }));
        var dons = ROLES.filter(function (ro) { return megaDons[ro] === mini && cand.some(function (c) { return c !== ro; }); });
        if (!dons.length) dons = ROLES.filter(function (ro) { return cand.some(function (c) { return c !== ro; }); });
        var libres = dons.filter(function (ro) { return !ev.some(function (c) { return c.donneur === ro && Math.abs(c.tA - tA) < 1.3 * f; }); });
        if (libres.length) dons = libres;
        var donneur = dons[entier(r, dons.length)];
        var vises = cand.filter(function (c) { return c !== donneur; });
        var cible = vises[entier(r, vises.length)];
        donnes[donneur]++; megaDons[donneur]++; megaAvant = cible;
        ev.push({ k: 'mega', id: ++id, donneur: donneur, cible: cible, tA: arrondi(tA), tI: arrondi(tI) });
        t = Math.max(t, tI + 0.4 * f);
      }
    }
  }
  var fin = Math.max.apply(null, ev.map(function (e) { return e.tI; }));
  ev.sort(function (a, b) { return a.tA - b.tA || a.id - b.id; });
  return JSON.stringify({ partie: partie, essai: essai, m: m, vitesse: vitesse, n: n, D: arrondi(fin + 1.2 * f), ev: ev, donnes: donnes });
}

/* ---------- UN héros sur SA tablette ----------
   Le temps t est celui de la manche (secondes depuis son début). */
function Joueur(role, o) {
  o = o || {};
  this.role = role;
  this.bossMax = REG.bossVie[o.bossVie || 'normal'] || REG.bossVie.normal;
  this.reset(o.snap);
}
Joueur.prototype.reset = function (snap) {
  this.vie = REG.vie; this.mort = false;
  this.boss = snap ? snap.boss : this.bossMax;
  this.faible = snap ? { elem: snap.faible.elem, part: snap.faible.part } : { elem: 'tout', part: 'tout' };
  this.zone = 1; this.versZone = 1; this.arrivee = 0;
  this.elemSel = snap ? snap.elemSel : null; this.partSel = snap ? snap.partSel : null;
  this.bouclierFin = -1; this.bouclierAttente = 0;
  this.soinDebut = -1;
  this.prochainTir = 0;
  this.zoneEnCours = null;     // la frappe de zone qui arrive sur moi (je vois qu'elle arrive, pas où)
  this.megaEnCours = null;
  this.journal = [];           // ce qui s'est passé (pour l'écran et pour les essais)
  this.vus = {};               // les coups déjà traités
  this.t = 0;
};
Joueur.prototype.instantane = function () {
  return { boss: this.boss, faible: { elem: this.faible.elem, part: this.faible.part }, elemSel: this.elemSel, partSel: this.partSel };
};
Joueur.prototype.ev = function (type, d) { d = d || {}; d.type = type; d.t = this.t; this.journal.push(d); if (this.surEv) this.surEv(d); };
Joueur.prototype.soutien = function () { return this.boss <= 0; };
Joueur.prototype.immobile = function (t) { return t >= this.arrivee; };

/* les gestes du joueur */
Joueur.prototype.aller = function (z, t) {
  if (this.mort || z === this.versZone) return;
  this.versZone = z; this.arrivee = t + REG.deplacement; this.couperSoin('bouge');
  this.ev('aller', { z: z });
};
Joueur.prototype.choisirElem = function (e) { if (!this.mort) { this.elemSel = e; this.couperSoin('change'); this.ev('elem', { e: e }); } };
Joueur.prototype.choisirPart = function (p) { if (!this.mort) { this.partSel = p; this.couperSoin('change'); this.ev('part', { p: p }); } };
Joueur.prototype.bouclier = function (t) {
  if (this.mort || this.bouclierAttente > 0) return false;
  this.bouclierFin = t + REG.bouclierDuree; this.bouclierAttente = REG.bouclierAttente; this.ev('bouclier');
  return true;
};
Joueur.prototype.soigner = function (t) {
  if (this.mort || this.soinDebut >= 0 || this.vie >= REG.vie) return false;
  this.soinDebut = t; this.ev('soin-debut'); return true;
};
Joueur.prototype.couperSoin = function (pourquoi) { if (this.soinDebut >= 0) { this.soinDebut = -1; this.ev('soin-coupe', { pourquoi: pourquoi }); } };
Joueur.prototype.toucher = function (deg, pourquoi) {
  this.vie = Math.max(0, this.vie - deg); this.couperSoin('coup');
  this.ev('touche', { deg: deg, pourquoi: pourquoi });
  if (this.vie <= 0) { this.mort = true; this.soinDebut = -1; this.ev('mort', { pourquoi: pourquoi }); }
};

/* faire avancer le temps de ma tablette jusqu'à t, avec la manche en cours :
   les annonces (tA) et les frappes (tI) dans l'ordre, et entre elles le tir automatique et le soin */
Joueur.prototype.avancer = function (t, M) {
  var pas = [], vus = this.vus;
  M.ev.forEach(function (e) {
    if (e.tA <= t && !vus[e.id + 'a']) pas.push({ t: e.tA, a: true, e: e });
    if (e.tI <= t && !vus[e.id + 'i']) pas.push({ t: e.tI, a: false, e: e });
  });
  pas.sort(function (x, y) { return x.t - y.t || (x.a === y.a ? x.e.id - y.e.id : (x.a ? 1 : -1)); });
  for (var k = 0; k <= pas.length; k++) {
    this.tirerJusqua(k < pas.length ? pas[k].t : t);
    if (k < pas.length) { if (pas[k].a) this.annonce(pas[k].e); else this.impact(pas[k].e); }
  }
  this.t = t;
};
Joueur.prototype.annonce = function (e) {
  this.vus[e.id + 'a'] = 1; this.t = e.tA;
  if (this.mort) return;
  if (e.k === 'carte' && e.cible === this.role) {
    this.zoneEnCours = e;
    if (e.elem !== null) { this.faible = { elem: e.elem, part: e.part === null ? 'tout' : e.part }; this.ev('garde', { id: e.id }); }
    this.ev('zone-annonce', { id: e.id });
  }
  if (e.k === 'mega') { this.megaEnCours = e; this.ev('mega-annonce', { id: e.id, moi: e.cible === this.role }); }
};
/* passer à la manche suivante : tous les temps reculent de la durée de la manche finie */
Joueur.prototype.decaler = function (D) {
  var self = this;
  ['arrivee', 'prochainTir', 'bouclierFin'].forEach(function (k) { self[k] -= D; });
  if (this.soinDebut >= 0) this.soinDebut -= D;
  this.t -= D; this.vus = {}; this.zoneEnCours = null; this.megaEnCours = null;
};
Joueur.prototype.tirerJusqua = function (t) {
  while (!this.mort) {
    /* le soin */
    if (this.soinDebut >= 0 && this.soinDebut + REG.soinDuree <= t) {
      this.t = this.soinDebut + REG.soinDuree;
      this.vie = Math.min(REG.vie, this.vie + REG.soin); this.soinDebut = -1; this.ev('soin', { vie: this.vie });
      continue;
    }
    if (this.arrivee <= t && this.zone !== this.versZone) { this.zone = this.versZone; }
    /* le tir : seulement immobile, pas en train de se soigner, avec un élément et une partie choisis, et un boss vivant */
    var prochain = Math.max(this.prochainTir, this.arrivee);
    if (this.soinDebut >= 0 || this.boss <= 0 || this.elemSel === null || this.partSel === null || prochain > t) break;
    this.t = prochain; this.prochainTir = prochain + REG.tir;
    var bonElem = this.faible.elem === 'tout' || this.faible.elem === this.elemSel;
    var bonPart = this.faible.part === 'tout' || this.faible.part === this.partSel;
    if (bonElem && bonPart && this.faible.elem !== null) {
      this.boss = Math.max(0, this.boss - 1); this.dernierTirBon = true; this.ev('tir', { bon: true });
      if (this.boss <= 0) this.ev('boss-mort');
    } else { this.dernierTirBon = false; this.ev('tir', { bon: false }); }
  }
  if (this.arrivee <= t) this.zone = this.versZone;
  this.t = Math.max(this.t, t);
};
Joueur.prototype.impact = function (e) {
  this.vus[e.id + 'i'] = 1; this.t = e.tI;
  if (this.mort) return;
  if (e.k === 'carte' && e.cible === this.role) {
    this.zoneEnCours = null;
    var z = this.arrivee <= e.tI ? this.versZone : this.zone;   // en plein déplacement : on compte d'où l'on part
    var ok = z === e.zone;
    this.ev('zone-impact', { id: e.id, ok: ok, sur: e.zone });
    if (!ok) this.toucher(REG.degZone, 'zone');
  }
  if (e.k === 'mega') {
    this.megaEnCours = null;
    if (this.bouclierAttente > 0) this.bouclierAttente--;
    if (e.cible === this.role) {
      var protege = this.bouclierFin >= e.tI;
      this.ev('mega-impact', { id: e.id, moi: true, ok: protege });
      if (protege) this.bouclierFin = -1; else this.toucher(REG.degMega, 'mega');
    } else this.ev('mega-impact', { id: e.id, moi: false, cible: e.cible });
  }
};

/* ---------- Une partie sur une tablette : les manches à la suite, les instantanés, « On reprend » ---------- */
function Partie(o) {
  this.partie = o.partie; this.vitesse = o.vitesse || 'normale'; this.role = o.role;
  this.depart = o.depart || 1; this.bossVie = o.bossVie || 'normal';
  this.essai = 1; this.m = this.depart;
  this.snaps = {};
  this.symboles = symboles(this.partie);
  this.code = {};                       // les symboles tapés (les miens arrivent tout seuls)
  this.debut = 0; this.mortManche = null;
  this.joueur = new Joueur(this.role, { bossVie: this.bossVie });
  this.charger(this.m);
}
Partie.prototype.charger = function (m) {
  this.m = m; this.M = manche(this.partie, this.essai, m, this.vitesse);
  this.snaps[m] = this.joueur.instantane();
};
/* T = secondes depuis le GO (négatif pendant les deux secondes de calme) ; la manche en cours commence à this.debut */
Partie.prototype.temps = function (T) {
  var avant = this.m, t = T - this.debut;
  while (t >= this.M.D) { var D = this.M.D; this.joueur.avancer(D, this.M); this.joueur.decaler(D); this.debut += D; t -= D; this.charger(this.m + 1); if (this.surManche) this.surManche(this.m); }
  this.joueur.avancer(t, this.M);
  if (this.joueur.mort && this.mortManche === null) this.mortManche = this.m;
  return t;
};
/* t = secondes depuis le début de la manche en cours ; rend le temps qui reste dans la manche */
Partie.prototype.avancer = function (t) {
  while (t >= this.M.D) {
    this.joueur.avancer(this.M.D, this.M);
    t -= this.M.D; this.joueur.decaler(this.M.D);
    this.charger(this.m + 1);
    if (this.surManche) this.surManche(this.m);
  }
  this.joueur.avancer(t, this.M);
  return t;
};
/* « On reprend » : on revient au début de la manche k, l'essai change (l'ordre des coups aussi), toute la vie revient */
Partie.prototype.reprendre = function (k, essai) {
  k = Math.max(this.depart, Math.min(k, this.m));
  var s = this.snaps[k] || this.joueur.instantane();
  this.essai = essai; this.debut = 0; this.mortManche = null;
  this.joueur.reset(s);
  for (var x in this.snaps) if (+x > k) delete this.snaps[x];
  this.charger(k);
};
/* les cartes que MA tablette affiche à l'instant t (j'en suis le donneur) */
Partie.prototype.cartes = function (t) {
  var me = this.role, M = this.M;
  if (this.joueur.mort) return [];
  return M.ev.filter(function (e) { return e.donneur === me && e.tA <= t && t < e.tI + (e.k === 'carte' ? 0.6 : 0.3); });
};
Partie.prototype.monSymbole = function () { return this.symboles[this.role]; };
Partie.prototype.taper = function (role, i) {
  if (role === this.role) return false;
  if (this.symboles[role] !== i) return false;
  this.code[role] = i; return true;
};
Partie.prototype.victoire = function () {
  var self = this;
  return this.joueur.boss <= 0 && ROLES.every(function (ro) { return ro === self.role || self.code[ro] === self.symboles[ro]; });
};

/* ---------- Un robot (pour les essais et pour « Voir les robots ») ----------
   Il entend une carte si son donneur est vivant, avec une probabilité p, un peu plus tard (lire, crier, comprendre). */
function Robot(j, r, o) {
  this.j = j; this.r = r; this.p = o.p; this.prochainEssai = 0;
  this.attente = [];     // ce qu'il va entendre : {t, e}
  this.entendus = {}; this.devines = {};
}
/* tCri : le moment où le donneur a fini de crier ; il comprend un peu après (ou pas) */
Robot.prototype.entendre = function (e, tCri) {
  if (this.r() < this.p) this.attente.push({ t: tCri + 0.2 + this.r() * 0.5, e: e });
};
Robot.prototype.jouer = function (t) {
  var j = this.j, self = this;
  if (j.mort) { this.attente = []; return; }
  this.attente = this.attente.filter(function (a) {
    if (a.t > t) return true;
    var e = a.e; self.entendus[e.id] = 1;
    if (e.k === 'carte') {
      j.aller(e.zone, t);
      if (e.elem !== null) {
        if (j.boss > 0) { j.choisirElem(e.elem); j.choisirPart(e.part === null ? (j.partSel === null ? 0 : j.partSel) : e.part); }
        self.prochainEssai = t + 4;
      }
    } else if (e.k === 'mega') j.bouclier(t);
    return false;
  });
  /* une frappe arrive et il ne sait pas où : il tente sa chance */
  var z = j.zoneEnCours;
  if (z && !this.devines[z.id] && !this.entendus[z.id] && t > z.tA + 1.8 && !this.attente.some(function (a) { return a.e.id === z.id; })) {
    this.devines[z.id] = 1; j.aller(entier(this.r, 3), t);
  }
  /* pas d'élément, ou ça ne fait rien : il essaie autre chose */
  if (j.boss > 0 && (j.elemSel === null || j.partSel === null)) { j.choisirElem(entier(this.r, 3)); j.choisirPart(entier(this.r, 4)); }
  if (j.boss > 0 && t > this.prochainEssai && j.dernierTirBon === false) {
    j.choisirElem(entier(this.r, 3)); j.choisirPart(entier(this.r, 4)); this.prochainEssai = t + 1.3; j.dernierTirBon = null;
  }
  /* se soigner quand il est bas et que rien n'arrive sur lui */
  if (j.vie <= 45 && j.soinDebut < 0 && j.immobile(t)) {
    var calme = !j.zoneEnCours || j.zoneEnCours.tI - t > REG.soinDuree + 0.2;
    var megaMoi = j.megaEnCours && j.megaEnCours.cible === j.role;
    if (calme && !megaMoi) j.soigner(t);
  }
};

/* ---------- Une table de quatre robots (les essais, et « Voir les robots ») ----------
   Les quatre tablettes avancent ensemble ; quand une carte s'affiche chez un donneur vivant, il la crie
   (une à la fois : sa voix est occupée environ une seconde par carte), et le receveur l'entend avec la probabilité p. */
function Table(o) {
  var self = this;
  this.o = o; this.t = 0; this.r = rngDe('robots|' + (o.graine || 1));
  this.parties = {}; this.robots = {}; this.voix = {}; this.cries = {};
  ROLES.forEach(function (ro) {
    var P = new Partie({ partie: o.partie, vitesse: o.vitesse, role: ro, depart: o.depart, bossVie: o.bossVie });
    self.parties[ro] = P;
    self.robots[ro] = new Robot(P.joueur, rngDe('robot|' + ro + '|' + (o.graine || 1)), { p: (o.p && o.p[ro] !== undefined) ? o.p[ro] : (o.pTous !== undefined ? o.pTous : 0.95) });
    self.voix[ro] = 0;
  });
}
Table.prototype.M = function () { return this.parties.sage.M; };
Table.prototype.pas = function (dt) {
  var self = this, M = this.M();
  this.t += dt;
  if (this.t >= M.D) {
    ROLES.forEach(function (ro) { self.parties[ro].avancer(self.t); });
    this.t -= M.D; this.cries = {};
    ROLES.forEach(function (ro) { self.voix[ro] = Math.min(0, self.voix[ro] - M.D); });
    if (this.surManche) this.surManche(this.M().m);
  }
  var t = this.t;
  ROLES.forEach(function (ro) {
    var P = self.parties[ro];
    P.avancer(t);
    P.cartes(t).forEach(function (e) {
      if (self.cries[e.id]) return;
      var debut = Math.max(e.tA + 0.4, self.voix[ro]), fin = debut + (e.k === 'mega' ? 0.7 : 1.1);
      self.cries[e.id] = fin; self.voix[ro] = fin;
      if (!self.parties[e.cible].joueur.mort) self.robots[e.cible].entendre(e, fin);
    });
  });
  ROLES.forEach(function (ro) { self.robots[ro].jouer(t); });
};
Table.prototype.morts = function () { var self = this; return ROLES.filter(function (ro) { return self.parties[ro].joueur.mort; }); };
Table.prototype.reprendre = function (k) {
  var self = this, essai = this.parties.sage.essai + 1;
  ROLES.forEach(function (ro) {
    self.parties[ro].reprendre(k, essai);
    self.robots[ro] = new Robot(self.parties[ro].joueur, rngDe('robot|' + ro + '|' + essai + '|' + (self.o.graine || 1)), { p: self.robots[ro].p });
    self.voix[ro] = 0;
  });

    if (e.maj) e.maj(f, e.g); return true;
  });
  this.majCartes(t);
  if (!this.o.mini) this.majHaut(t), this.majCommandes(t);
};
Ecran.prototype.majCartes = function (t) {
  var self = this, l = this.P.cartes(t), vues = {}, T = this.o.table;
  l.forEach(function (e) {
    vues[e.id] = 1;
    var c = self.cartesVues[e.id];
    if (!c) { c = h('div', 'carte' + (e.k === 'mega' ? ' mega' : ''), carteHTML(e), self.cartes); c.style.setProperty('--c', R[e.cible].c); self.cartesVues[e.id] = c; }
    c.querySelector('.minuteur i').style.width = (100 * Math.max(0, Math.min(1, (e.tI - t) / (e.tI - e.tA)))) + '%';
    if (T) c.querySelector('.porte').textContent = T.cries[e.id] && T.cries[e.id] <= t ? '📣' : '';
  });
  for (var id in this.cartesVues) if (!vues[id]) { this.cartesVues[id].remove(); delete this.cartesVues[id]; }
};
Ecran.prototype.majHaut = function (t) {
  var P = this.P, J = P.joueur, self = this;
  this.ou.querySelector('.ou-t').innerHTML = 'Partie <b>' + P.partie + '</b> · Essai <b>' + P.essai + '</b> · Manche <b>' + P.m + '</b> · ' + VIT_IC[P.vitesse];
  this.ou.querySelector('.prog-manche i').style.width = (100 * Math.max(0, Math.min(1, t / P.M.D))) + '%';
  this.bReprendre.classList.toggle('appel', J.mort);
  ROLES.forEach(function (ro) {
    var c = self.cases[ro], s;
    if (ro === P.role) s = J.boss <= 0 ? P.monSymbole() : null;
    else s = P.code[ro] !== undefined ? P.code[ro] : null;
    var txt = s === null ? '?' : sym(s);
    if (c.dataset.txt !== txt) { c.textContent = txt; c.dataset.txt = txt; }
    c.classList.toggle('bon', s !== null);
    c.classList.toggle('crie', ro === P.role && s !== null);
  });
};
Ecran.prototype.majCommandes = function (t) {
  var J = this.P.joueur, sout = J.boss <= 0 || J.mort;
  this.bElems.forEach(function (b, i) { b.classList.toggle('oui', J.elemSel === i && !sout); b.disabled = sout; });
  this.bBouclier.classList.toggle('leve', J.bouclierFin >= t);
  this.bBouclier.classList.toggle('attend', J.bouclierAttente > 0 && J.bouclierFin < t);
  this.bBouclier.querySelector('.attente').textContent = J.bouclierAttente > 0 && J.bouclierFin < t ? '⏳' + J.bouclierAttente : '';
  this.bSoin.querySelector('.prog').style.width = J.soinDebut >= 0 ? (100 * Math.min(1, (t - J.soinDebut) / REG.soinDuree)) + '%' : '0';
  this.bSoin.disabled = J.mort;
  this.bBouclier.disabled = J.mort;
};

/* =====================================================================
   Les écrans
   ===================================================================== */
var E = { role: null, partie: '', vitesse: 'normale', depart: 1, bossVie: 'normal' };
try { var sauve = JSON.parse(localStorage.getItem('p3-essai') || '{}'); for (var k in sauve) if (k in E) E[k] = sauve[k]; } catch (e) {}
function garder() { try { localStorage.setItem('p3-essai', JSON.stringify(E)); } catch (e) {} }
var boucle = null;
function arreter() { if (boucle) cancelAnimationFrame(boucle); boucle = null; }
var verrou = null;
function garderEcranAllume() { try { if (navigator.wakeLock && !verrou) navigator.wakeLock.request('screen').then(function (v) { verrou = v; v.addEventListener('release', function () { verrou = null; }); }).catch(function () {}); } catch (e) {} }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && boucle) garderEcranAllume(); });
function pleinEcran() { var d = document.documentElement; try { (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (e) {} }

function choix(parent, valeurs, actuel, fn) {
  var c = h('div', 'choix', null, parent);
  valeurs.forEach(function (v) {
    var b = h('button', v[0] === actuel ? 'oui' : '', v[1], c);
    toucher(b, function () { Array.prototype.forEach.call(c.children, function (x) { x.classList.remove('oui'); }); b.classList.add('oui'); fn(v[0]); });
  });
  return c;
}

function accueil() {
  arreter(); app.innerHTML = '';
  var p = h('div', 'page', null, app);
  h('div', 'titre', 'Phase 3<small>ESSAI À QUATRE TABLETTES</small>', p);
  var l = h('div', 'ligne', null, p);
  var choixH = {};
  ROLES.forEach(function (ro) {
    var b = h('button', 'heros-choix' + (E.role === ro ? ' choisi' : ''), tete(ro) + '<b>' + R[ro].nom + '</b>', l);
    choixH[ro] = b;
    toucher(b, function () { E.role = ro; garder(); for (var k in choixH) choixH[k].classList.toggle('choisi', k === ro); maj(); });
  });
  var ln = h('div', 'ligne', null, p);
  h('span', 'lbl', 'Partie', ln);
  var num = h('div', 'numero', null, ln);
  var pave = h('div', 'pave', null, p);
  '1234567890'.split('').forEach(function (d) { var b = h('button', '', d, pave); toucher(b, function () { if (E.partie.length < 3) E.partie += d; garder(); maj(); }); });
  var bEff = h('button', '', '⌫', pave); bEff.style.gridColumn = 'span 5'; bEff.style.width = 'auto';
  toucher(bEff, function () { E.partie = E.partie.slice(0, -1); garder(); maj(); });
  var lr = h('div', 'ligne', null, p);
  choix(lr, [['lente', '🐢'], ['normale', '🚶'], ['rapide', '🐇']], E.vitesse, function (v) { E.vitesse = v; garder(); });
  var cd = h('div', 'ligne', null, lr); h('span', 'lbl', 'Manche', cd);
  choix(cd, [[1, '1'], [4, '4'], [7, '7']], E.depart, function (v) { E.depart = v; garder(); });
  var cb = h('div', 'ligne', null, lr); h('span', 'lbl', 'Boss', cb);
  choix(cb, [['court', '▮'], ['normal', '▮▮'], ['long', '▮▮▮']], E.bossVie, function (v) { E.bossVie = v; garder(); });
  var lb = h('div', 'ligne', null, p);
  var pret = h('button', 'jaune', 'Prêt', lb);
  toucher(pret, function () { if (!pret.disabled) depart(); });
  var lg = h('div', 'ligne', null, p);
  toucher(h('button', 'gris', '👀 Robots', lg), function () { demo(); });
  toucher(h('button', 'gris', '⛶', lg), function () { pleinEcran(); });
  function maj() {
    num.textContent = E.partie || '—'; num.classList.toggle('vide', !E.partie);
    pret.disabled = !(E.role && E.partie);
  }
  maj();
}

/* le départ ensemble : on dit « 3, 2, 1 » et on appuie tous en même temps */
function depart() {
  var P = new P3.Partie({ partie: +E.partie, vitesse: E.vitesse, role: E.role, depart: E.depart, bossVie: E.bossVie });
  ecranGo(P, function () { jeu(P); });
}
function ecranGo(P, fn, retour) {
  arreter(); app.innerHTML = '';
  var p = h('div', 'page', null, app);
  p.style.justifyContent = 'center'; p.style.height = '100%';
  var eq = h('div', 'equipe', null, p);
  ROLES.forEach(function (ro) { h('span', ro === P.role ? 'moi' : '', tete(ro), eq); });
  h('div', 'reperes', 'Partie <b>' + P.partie + '</b> · Essai <b>' + P.essai + '</b> · Manche <b>' + P.m + '</b> · ' + VIT_IC[P.vitesse] + ' · Boss <b>' + BOSS_IC[P.bossVie] + '</b>', p);
  h('div', 'compte', '3 · 2 · 1', p);
  var go = h('button', 'jaune go', 'GO', p);
  toucher(go, function () { garderEcranAllume(); fn(maintenant()); });
  toucher(h('button', 'gris', '←', p), function () { (retour || accueil)(); });
}

function jeu(P) {
  arreter(); app.innerHTML = ''; window.__p3.P = P;
  var racine = h('div', 'jeu', null, app);
  var goMur = maintenant() + REG.lancement * 1000;
  var horloge = function () { var T = (maintenant() - goMur) / 1000; P.temps(T); return T - P.debut; };
  var voile = null, bandeauJusqua = 0, bandeauTxt = '', fini = false;
  var bandeau = h('div', 'bandeau cache', '', racine);
  function annoncer(txt, ms) { bandeauTxt = txt; bandeauJusqua = maintenant() + ms; }
  annoncer('Manche ' + P.m, 1800);
  P.surManche = function (m) { annoncer('Manche ' + m, 1500); };
  function fermer() { if (voile) { voile.remove(); voile = null; } }
  var ec = new Ecran(racine, P, {
    interactif: true, horloge: horloge,
    surReprendre: function () {
      fermer();
      voile = h('div', 'voile', null, racine);
      var f = h('div', 'fenetre', null, voile);
      toucher(h('button', 'ferme', '✕', f), fermer);
      h('div', 'titre', '↺', f);
      var k = P.mortManche || P.m, es = P.essai + 1;
      var l1 = h('div', 'pas', null, f); h('span', 'lbl', 'Manche', l1);
      var m1 = h('button', '', '−', l1), v1 = h('span', 'val', '', l1), p1 = h('button', '', '+', l1);
      var l2 = h('div', 'pas', null, f); h('span', 'lbl', 'Essai', l2);
      var m2 = h('button', '', '−', l2), v2 = h('span', 'val', '', l2), p2 = h('button', '', '+', l2);
      function maj() { v1.textContent = k; v2.textContent = es; }
      toucher(m1, function () { k = Math.max(P.depart, k - 1); maj(); }); toucher(p1, function () { k = Math.min(P.m, k + 1); maj(); });
      toucher(m2, function () { es = Math.max(1, es - 1); maj(); }); toucher(p2, function () { es++; maj(); });
      maj();
      h('div', 'compte', '3 · 2 · 1', f);
      var go = h('button', 'jaune go', 'GO', f);
      toucher(go, function () {
        fermer(); P.reprendre(k, es); goMur = maintenant() + REG.lancement * 1000;
        ec.symboleJusqua = 0; annoncer('Manche ' + P.m, 1800);
      });
    },
    surCase: function (ro) {
      fermer();
      voile = h('div', 'voile', null, racine);
      var f = h('div', 'fenetre', null, voile);
      toucher(h('button', 'ferme', '✕', f), fermer);
      h('div', '', tete(ro), f).style.fontSize = 'clamp(30px,8vmin,60px)';
      var g = h('div', 'symboles', null, f);
      P3.SYMB.forEach(function (s, i) {
        var b = h('button', '', s[1], g);
        toucher(b, function () {
          if (P.taper(ro, i)) fermer();
          else { fermer(); var c = ec.cases[ro]; c.classList.remove('faux'); void c.offsetWidth; c.classList.add('faux'); }
        });
      });
    }
  });
  function image() {
    var t = horloge();
    ec.maj(t);
    var b = maintenant() < bandeauJusqua;
    bandeau.classList.toggle('cache', !b); if (b && bandeau.textContent !== bandeauTxt) bandeau.textContent = bandeauTxt;
    if (!fini && P.victoire()) { fini = true; victoire(P); return; }
    boucle = requestAnimationFrame(image);
  }
  image();
}

function victoire(P) {
  arreter(); app.innerHTML = '';
  var p = h('div', 'page', null, app); p.style.justifyContent = 'center'; p.style.height = '100%';
  h('div', 'victoire', '✨', p);
  var eq = h('div', 'equipe', null, p);
  ROLES.forEach(function (ro) { var c = h('div', 'case bon', sym(P.symboles[ro]), eq); c.style.setProperty('--c', R[ro].c); c.insertAdjacentHTML('afterbegin', tete(ro, 'mini')); });
  h('div', 'reperes', 'Manche <b>' + P.m + '</b> · Essai <b>' + P.essai + '</b>', p);
  toucher(h('button', 'jaune', 'Rejouer', p), accueil);
}

/* ---------- les robots : quatre petites tablettes ---------- */
function demo() {
  arreter(); app.innerHTML = '';
  var racine = h('div', 'demo', null, app);
  var haut = h('div', 'demo-haut', null, racine);
  toucher(h('button', 'gris', '✕', haut), accueil);
  var ATT = { a: 1, b: 0.9, c: 0.75 }, att = 'b', vite = 1, graine = 1 + Math.floor(Math.random() * 999);
  choix(haut, [['a', '😀'], ['b', '🙂'], ['c', '😵']], att, function (v) { att = v; for (var ro in T.robots) T.robots[ro].p = ATT[att]; });
  choix(haut, [[1, '×1'], [2, '×2']], vite, function (v) { vite = v; });
  var ou = h('div', 'reperes', '', haut);
  var grille = h('div', 'demo-grille', null, racine);
  var bandeau = h('div', 'bandeau cache', '', racine);
  var T, ecrans, mortA, finA, bandeauJusqua = 0;
  function nouvelle() {
    graine++;
    T = new P3.Table({ partie: graine, graine: graine, vitesse: 'normale', depart: 1, bossVie: 'court', pTous: ATT[att] });
    T.t = -REG.lancement;
    grille.innerHTML = ''; ecrans = {};
    ROLES.forEach(function (ro) {
      var b = h('div', 'mini', null, grille); b.style.setProperty('--c', R[ro].c);
      ecrans[ro] = new Ecran(b, T.parties[ro], { mini: true, table: T });
    });
    mortA = null; finA = null;
  }
  nouvelle();
  var avant = maintenant();
  function image() {
    var now = maintenant(), dt = Math.min(0.1, (now - avant) / 1000) * vite; avant = now;
    if (finA === null) {
      var n = Math.max(1, Math.ceil(dt / 0.05));
      for (var i = 0; i < n; i++) T.pas(dt / n);
      if (T.morts().length && mortA === null) mortA = { t: now, m: T.M().m };
      if (mortA && now - mortA.t > 3000 / vite) { T.reprendre(mortA.m); mortA = null; bandeau.textContent = '↺ On reprend'; bandeauJusqua = now + 1500; ROLES.forEach(function (ro) { ecrans[ro].symboleJusqua = 0; }); }
      if (ROLES.every(function (ro) { return T.parties[ro].joueur.boss <= 0; })) { finA = now; bandeau.textContent = '✨'; bandeauJusqua = now + 3500; }
    } else if (now - finA > 4000) nouvelle();
    ROLES.forEach(function (ro) { ecrans[ro].maj(T.t); });
    var P = T.parties.sage;
    ou.innerHTML = 'Essai <b>' + P.essai + '</b> · Manche <b>' + P.m + '</b>';
    bandeau.classList.toggle('cache', now > bandeauJusqua);
    boucle = requestAnimationFrame(image);
  }
  image();
}

window.__p3 = { E: E, accueil: accueil, depart: depart, demo: demo, P3: P3 };
accueil();
})();
