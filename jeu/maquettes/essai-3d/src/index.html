<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:,">
<title>Essai en vraie 3D — le Barde dans la salle de l'armure</title>
<style>
html,body{margin:0;height:100%;background:#030406;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
#jeu{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bt{position:fixed;border-radius:50%;border:3px solid rgba(255,226,150,.85);background:rgba(10,16,30,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
.bt:active{transform:scale(.93)}
#bFeu{right:calc(18px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:86px;height:86px;border-color:#ff9a4a}
#bGlace{right:calc(116px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:66px;height:66px;border-color:#9fe3ff;font-size:1.5rem}
#bAcide{right:calc(104px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:66px;height:66px;border-color:#c8f53a;font-size:1.5rem}
#bSoin{right:calc(28px + env(safe-area-inset-right));bottom:calc(120px + env(safe-area-inset-bottom));width:66px;height:66px;border-color:#8ff0b0;font-size:1.5rem}
#bSaut{right:calc(194px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:66px;height:66px;border-color:#ffe28a;font-size:1.5rem;--r:0;background:conic-gradient(rgba(0,0,0,.62) calc(var(--r) * 1turn),rgba(10,16,30,.42) 0)}
#zone{position:fixed;left:calc(40px + env(safe-area-inset-left));bottom:calc(36px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:2px solid rgba(243,212,138,.35);pointer-events:none}
#pouce{position:absolute;left:28px;top:28px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3)}
#charge{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04060b;color:#ffd23a;font-size:3rem}
#charge i{display:block;width:60px;height:60px;border-radius:50%;border:5px solid rgba(255,210,58,.25);border-top-color:#ffd23a;animation:t 1s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
#ips{position:fixed;left:8px;top:6px;color:rgba(255,255,255,.35);font-size:11px}
#tourne{display:none;position:fixed;inset:0;background:#04060b;color:#fff;align-items:center;justify-content:center;font-size:4rem}
@media (orientation:portrait){#tourne{display:flex}}
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="zone"><div id="pouce"></div></div>
<button class="bt" id="bSaut" aria-label="Saut">💨</button>
<button class="bt" id="bGlace" aria-label="Note glacée">❄️</button>
<button class="bt" id="bAcide" aria-label="Note d'acide">🧪</button>
<button class="bt" id="bSoin" aria-label="Soin">💚</button>
<button class="bt" id="bFeu" aria-label="Note de feu">🔥</button>
<div id="ips"></div>
<div id="charge"><i></i></div>
<div id="tourne">📱↻</div>
<script>window.ANIMS={marche:'anim-marche.json',course:'anim-charge.json',saut:'anim-saut.json'};</script>
<script src="essai3d.js"></script>
</body>
</html>
