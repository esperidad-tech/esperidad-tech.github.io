<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Le combat du Pisteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
   IDEA: l'arrière-salle du château, vue de haut en biais (Hades), rendue en volume ; l'ombre est un pouvoir : frapper, disparaître, revenir ; on compte sa vie
   PICTURE: deux mondes qu'on ne peut pas confondre — la salle chaude à découvert, bleu-violet dans l'ombre ; les quatre boutons changent de dessin
   COLOUR and TYPE: bleu nuit, bronze et or, violet de l'ombre, rouge des golems ; Cinzel + Nunito
   LAYOUT: téléphone à l'horizontale ; le pouce gauche court, le pouce droit a quatre boutons */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060b;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:#f1e7d0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#jeu{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
.jaune{background:#ffd23a;color:#111;font-weight:900;font-size:1.05rem;border:0;border-radius:.6em;padding:.55em 1.3em;min-height:2.8em;box-shadow:0 .22em 0 #9c770c}
.jaune:active{transform:translateY(.15em);box-shadow:0 .07em 0 #9c770c}
.jaune[disabled]{background:#6b6247;color:#1a1a1a;box-shadow:0 .22em 0 #3d3826}
.gris{background:#22304b;color:#f1e7d0;font-weight:800;font-size:.92rem;border:1px solid #3d5078;border-radius:.6em;padding:.5em 1em;min-height:2.6em}
.voile{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,7,14,.9);padding:max(.8em,env(safe-area-inset-top)) max(1em,env(safe-area-inset-right)) max(.8em,env(safe-area-inset-bottom)) max(1em,env(safe-area-inset-left));overflow-y:auto;z-index:5}
.voile.on{display:flex}
.carte{width:100%;max-width:54em;margin:auto;text-align:center}
h1{font-family:Cinzel,Georgia,serif;font-size:1.3rem;line-height:1.1;margin:.1em 0 .2em;color:#f3d48a}
h2{font-family:Cinzel,Georgia,serif;font-size:1.3rem;margin:.1em 0 .5em;color:#f3d48a}
.bas{margin-top:.5em;display:flex;justify-content:center;gap:.7em;align-items:center;position:sticky;bottom:0;padding:.35em 0 .1em;background:linear-gradient(rgba(4,7,14,0),rgba(4,7,14,.95) 35%)}

/* ---- les quatre boutons : huit visages ---- */
.bt{position:fixed;border-radius:50%;background:rgba(10,16,30,.55);border:2px solid rgba(243,212,138,.55);color:#f3d48a;display:none;flex-direction:column;align-items:center;justify-content:center;font-weight:900;padding:0;z-index:2;overflow:hidden}
.bt.on{display:flex}
.bt svg{width:50%;height:50%;pointer-events:none}
.bt span{font-size:.58rem;margin-top:0;opacity:.95;text-align:center;line-height:1;max-width:94%;pointer-events:none}
.bt .rc{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(3,5,12,.74) calc(var(--r,0)*360deg),transparent 0)}
.bt.appui{background:rgba(255,210,58,.3)}
.bt .o{display:none}
.bt.ombre .d{display:none}
.bt.ombre .o{display:block}
.bt.ombre{border-color:#b48cff;color:#e8dcff;background:rgba(52,26,104,.72);box-shadow:0 0 1.1em rgba(150,110,255,.6)}
.bt.eteint{filter:grayscale(1);opacity:.42}
.bt.vide{filter:grayscale(1);opacity:.3}
.bt.pret{border-color:#b48cff;color:#e8dcff;box-shadow:0 0 1em rgba(150,110,255,.75)}
#b1 .r2,#b1 .r3{display:none}
#b1.rang2 .r1,#b1.rang3 .r1{display:none}
#b1.rang2 .r2{display:block}
#b1.rang3 .r3{display:block}
#b1.rang3:not(.ombre){border-color:#ffd23a;box-shadow:0 0 1em rgba(255,210,58,.7)}
#b1.ombre .r1,#b1.ombre .r2,#b1.ombre .r3{display:none}
#b1{width:min(23vh,9rem);height:min(23vh,9rem);right:calc(4vh + env(safe-area-inset-right));bottom:calc(6vh + env(safe-area-inset-bottom))}
#b2{width:min(17vh,6.6rem);height:min(17vh,6.6rem);right:calc(min(29vh,11.4rem) + env(safe-area-inset-right));bottom:calc(4vh + env(safe-area-inset-bottom))}
#b3{width:min(17vh,6.6rem);height:min(17vh,6.6rem);right:calc(min(7vh,2.8rem) + env(safe-area-inset-right));bottom:calc(min(32vh,12.5rem) + env(safe-area-inset-bottom))}
#b4{width:min(17vh,6.6rem);height:min(17vh,6.6rem);right:calc(min(27vh,10.6rem) + env(safe-area-inset-right));bottom:calc(min(24vh,9.4rem) + env(safe-area-inset-bottom))}
#b1 span{font-size:.72rem}
.bt .nb{display:none;position:absolute;right:10%;top:9%;min-width:1.5em;height:1.5em;line-height:1.5em;border-radius:1em;background:#f4ecd8;color:#2a1460;font-size:.72rem;font-weight:900;text-align:center;pointer-events:none;z-index:1}
.bt.ombre .nb{display:block}
/* ---- les trois cartes dorées : de petites icônes à part, en haut à droite ; une seule fois chacune, dans l'ombre seulement ---- */
.ct{position:fixed;top:calc(1.2vh + env(safe-area-inset-top));width:2.9rem;height:2.9rem;border-radius:.7rem;background:rgba(30,22,6,.72);border:2px solid rgba(255,214,120,.5);color:#ffe08a;display:none;flex-direction:column;align-items:center;justify-content:center;font-weight:900;padding:0;z-index:2;overflow:hidden;opacity:.5}
.ct.on{display:flex}
.ct svg{width:58%;height:58%;pointer-events:none}
.ct span{font-size:.5rem;line-height:1;pointer-events:none}
.ct .rc{position:absolute;inset:0;pointer-events:none;background:conic-gradient(rgba(3,5,12,.7) calc(var(--r,0)*360deg),transparent 0)}
.ct.pret{opacity:1;border-color:#ffd23a;box-shadow:0 0 .9em rgba(255,210,58,.65)}
.ct.attend{opacity:.72;border-color:rgba(255,214,120,.8)}
.ct.active{opacity:1;border-color:#fff3c4;box-shadow:0 0 1.2em rgba(255,236,170,.95)}
.ct.appui{background:rgba(255,210,58,.38)}
.ct.use{opacity:.2;filter:grayscale(1);box-shadow:none}
#cFleche{right:calc(1.2vh + 3.1rem + 6.4rem + env(safe-area-inset-right))}
#cSifflet{right:calc(1.2vh + 3.1rem + 3.2rem + env(safe-area-inset-right))}
#cCape{right:calc(1.2vh + 3.1rem + env(safe-area-inset-right))}
/* ---- à terre : de quelle vague repartir ? ---- */
.tuiles{display:flex;flex-wrap:wrap;justify-content:center;gap:.6em;margin:.5em auto .9em;max-width:38em}
.tuile{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.4em .7em;min-height:3.2em;min-width:7.4em;font-size:.95rem}
#fin .bas{background:none}
.tuile span{font-size:.74rem;font-weight:800;white-space:nowrap}
#bPause{position:fixed;right:calc(1.2vh + env(safe-area-inset-right));top:calc(1.2vh + env(safe-area-inset-top));width:2.4em;height:2.4em;border-radius:.6em;background:rgba(10,16,30,.6);border:1px solid rgba(243,212,138,.3);color:#f3d48a;font-size:1rem;display:none;padding:0;z-index:2}
#bPause.on{display:block}
.anneau{animation:anneau 1s ease-in-out infinite}
/* (25 novembre, 23 h) rien à lire : un bouton refusé tremble, et celui qui débloque la situation clignote */
.bt.non,.ct.non{animation:non .32s linear}
@keyframes non{0%,100%{transform:translateX(0)}20%{transform:translateX(-.38em)}50%{transform:translateX(.38em)}80%{transform:translateX(-.2em)}}
.bt.appel{animation:appel 1.1s ease-out}
@keyframes appel{0%,45%{box-shadow:0 0 0 .1em rgba(255,210,58,1);transform:scale(1.12)}22%,70%{box-shadow:0 0 0 .8em rgba(255,210,58,0);transform:scale(1)}100%{box-shadow:0 0 0 0 rgba(255,210,58,0);transform:scale(1)}}
/* ---- avant de jouer : la salle se prépare (une barre), puis un extrait sans un mot (le jeu se joue tout seul), et le bouton jaune ---- */
#chargement{width:min(16em,60vw);height:.5em;margin:1.1em auto .9em;border-radius:1em;background:rgba(255,255,255,.1);overflow:hidden}
#chargement i{display:block;height:100%;width:0;background:#f3d48a;border-radius:1em;transition:width .25s}
#regles{transition:background .22s}
#regles:not(.extrait){background:#04070e}   /* (version 15) avant de jouer : un fond noir et le bouton, rien d'autre */
#regles.pret #chargement{visibility:hidden}
#regles.extrait{background:rgba(4,7,14,0);overflow:hidden}
#regles.extrait.noir{background:#04070e}
#regles.extrait h1,#regles.extrait #chargement{display:none}
#regles.extrait .carte{position:fixed;left:50%;bottom:calc(5vh + env(safe-area-inset-bottom));transform:translateX(-50%);width:auto;margin:0}
#regles.extrait .bas{position:static;background:none;margin:0;padding:0}
#regles.extrait .jaune{font-size:1.2rem;padding:.6em 1.5em}
#doigt{position:fixed;left:0;top:0;width:3.2rem;height:3.2rem;margin:-1.6rem 0 0 -1.6rem;border-radius:50%;background:rgba(255,255,255,.3);border:.18rem solid rgba(255,255,255,.9);box-shadow:0 0 .8em rgba(255,255,255,.55);pointer-events:none;z-index:7;opacity:0;transform:scale(1.5);transition:opacity .14s,transform .14s}
#doigt.pose{opacity:1;transform:scale(1)}
@keyframes anneau{0%,100%{box-shadow:0 0 0 .15em rgba(255,210,58,.95);transform:scale(1)}50%{box-shadow:0 0 0 .7em rgba(255,210,58,0);transform:scale(1.07)}}
.menu{display:flex;flex-direction:column;gap:.5em;align-items:stretch;max-width:18em;margin:0 auto}
.mesures{font-size:.72rem;opacity:.6;margin-top:.7em}
.code{font-size:2.2rem;letter-spacing:.25em;margin:.2em 0 0}
.petit{font-size:.82rem;opacity:.8;margin:.2em 0 .6em}
.stats{display:grid;grid-template-columns:1fr auto;gap:.12em .8em;text-align:left;font-size:.84rem;background:rgba(255,255,255,.04);border-radius:.6em;padding:.5em .8em;margin:.5em auto;max-width:21em}
.stats b{text-align:right;color:#f3d48a}
#tourne{z-index:9;flex-direction:column;gap:1em;text-align:center}
#tourne svg{width:6em;height:6em}
@media (prefers-reduced-motion:reduce){.anneau{animation:none;box-shadow:0 0 0 .2em #ffd23a}}
</style>
</head>
<body>
<canvas id="jeu"></canvas>

<!-- bouton 1 : la dague (trois rangs) / l'embuscade -->
<button class="bt" id="b1" aria-label="Dague, ou embuscade dans l'ombre"><svg viewBox="0 0 40 40">
  <g class="d r1"><path d="M30 6 L14 22 l4 4 L34 10z" fill="#d8f1f4" stroke="#5be0e6" stroke-width="1.5"/><path d="M12 24 l4 4 l-6 6 l-4 -4z" fill="#8a5a2a"/><path d="M10 20 l10 10" stroke="#c9993f" stroke-width="3" stroke-linecap="round"/></g>
  <g class="d r2"><path d="M8 8 L24 24 l-4 4 L4 12z" fill="#d8f1f4" stroke="#5be0e6" stroke-width="1.5"/><path d="M26 22 l4 4 l-4 6 l-6 -6z" fill="#8a5a2a"/><path d="M30 18 l-12 12" stroke="#c9993f" stroke-width="3" stroke-linecap="round"/><path d="M12 34 Q30 34 36 14" fill="none" stroke="#5be0e6" stroke-width="2.4" stroke-linecap="round"/></g>
  <g class="d r3"><path d="M20 2 l3 10 l10 -5 l-5 10 l10 3 l-10 3 l5 10 l-10 -5 l-3 10 l-3 -10 l-10 5 l5 -10 l-10 -3 l10 -3 l-5 -10 l10 5z" fill="rgba(255,210,58,.35)" stroke="#ffd23a" stroke-width="1.2"/><path d="M29 7 L15 21 l4 4 L33 11z" fill="#fff6d0" stroke="#ffd23a" stroke-width="1.6"/><path d="M13 23 l4 4 l-6 6 l-4 -4z" fill="#8a5a2a"/><path d="M11 19 l10 10" stroke="#ffd23a" stroke-width="3" stroke-linecap="round"/></g>
  <g class="o"><path d="M20 4 C10 4 6 11 6 17 c0 5 3 8 5 9 v5 h18 v-5 c2 -1 5 -4 5 -9 C34 11 30 4 20 4z" fill="#efe6ff" stroke="#7a4fd6" stroke-width="1.5"/><circle cx="14" cy="17" r="4" fill="#2a1460"/><circle cx="26" cy="17" r="4" fill="#2a1460"/><path d="M20 21 l-2 4 h4z" fill="#2a1460"/><path d="M15 31 v-4 M20 31 v-4 M25 31 v-4" stroke="#7a4fd6" stroke-width="1.6"/></g>
</svg><span id="l1">dague</span><i class="rc"></i></button>

<!-- bouton 2 : le coup qui assomme, dans l'ombre seulement (gris à découvert) -->
<button class="bt" id="b2" aria-label="Coup qui assomme, dans l'ombre seulement"><svg viewBox="0 0 40 40">
  <g class="d"><path d="M20 3 l3.4 7.6 l8.2 .9 l-6.1 5.6 l1.7 8.1 L20 21 l-7.2 4.2 l1.7 -8.1 l-6.1 -5.6 l8.2 -.9z" fill="#ffe08a" stroke="#c99a2a" stroke-width="1.2"/><path d="M6 28 l1.4 3 l3.2 .4 l-2.4 2.2 l.7 3.2 L6 35.2 l-2.9 1.6 l.7 -3.2 l-2.4 -2.2 l3.2 -.4z" fill="#ffe08a"/><path d="M33 26 l1.4 3 l3.2 .4 l-2.4 2.2 l.7 3.2 l-2.9 -1.6 l-2.9 1.6 l.7 -3.2 l-2.4 -2.2 l3.2 -.4z" fill="#ffe08a"/></g>
  <g class="o"><path d="M20 3 l3.4 7.6 l8.2 .9 l-6.1 5.6 l1.7 8.1 L20 21 l-7.2 4.2 l1.7 -8.1 l-6.1 -5.6 l8.2 -.9z" fill="#ffe08a" stroke="#c99a2a" stroke-width="1.2"/><path d="M6 28 l1.4 3 l3.2 .4 l-2.4 2.2 l.7 3.2 L6 35.2 l-2.9 1.6 l.7 -3.2 l-2.4 -2.2 l3.2 -.4z" fill="#ffe08a"/><path d="M33 26 l1.4 3 l3.2 .4 l-2.4 2.2 l.7 3.2 l-2.9 -1.6 l-2.9 1.6 l.7 -3.2 l-2.4 -2.2 l3.2 -.4z" fill="#ffe08a"/></g>
</svg><span id="l2">assommer</span><i class="rc"></i></button>

<!-- bouton 3 : le saut / le saut d'ombre -->
<button class="bt" id="b3" aria-label="Saut, ou saut d'ombre"><svg viewBox="0 0 40 40">
  <g class="d"><path d="M5 31 Q20 0 33 24" fill="none" stroke="#f3d48a" stroke-width="3" stroke-dasharray="4 3"/><path d="M33 26 l-6 -3 l5 -5z" fill="#f3d48a"/><rect x="15" y="27" width="10" height="8" rx="1" fill="#5a5f6c" stroke="#8a92a6"/></g>
  <g class="o"><path d="M5 30 Q18 2 28 20" fill="none" stroke="#c8b6ff" stroke-width="3" stroke-dasharray="4 3"/><circle cx="23" cy="26" r="6" fill="#8a92a6" stroke="#cfd8e6"/><path d="M23 26 L11 22 V30z" fill="rgba(255,244,214,.45)"/><circle cx="33" cy="27" r="4.5" fill="#2a1460" stroke="#c8b6ff" stroke-width="1.5"/></g>
</svg><span id="l3">saut</span><i class="rc"></i></button>

<!-- bouton 4 : l'ombre / le bandage -->
<button class="bt" id="b4" aria-label="Ombre, ou bandage dans l'ombre"><svg viewBox="0 0 40 40">
  <g class="d"><path d="M20 3 C10 6 7 16 8 34 h24 C33 16 30 6 20 3z" fill="#3b2a78" stroke="#b48cff" stroke-width="1.6"/><path d="M20 10 c-5 2 -6 8 -5 14 h10 c1 -6 0 -12 -5 -14z" fill="#0c0820"/><circle cx="17.5" cy="18" r="1.4" fill="#c8b6ff"/><circle cx="22.5" cy="18" r="1.4" fill="#c8b6ff"/></g>
  <g class="o"><rect x="5" y="13" width="30" height="15" rx="7.5" fill="#f4ecd8" stroke="#b9a988" stroke-width="1.4" transform="rotate(-28 20 20)"/><path d="M14.5 15.5 l11 9 M19 13 l7 12.5 M11 20 l12 7" stroke="#d8cdb2" stroke-width="1.1" transform="rotate(-28 20 20)"/><path d="M20 14.5 v11 M14.5 20 h11" stroke="#d8473a" stroke-width="3.4" stroke-linecap="round"/></g>
</svg><span id="l4">ombre</span><b class="nb" id="nb4">5</b><i class="rc"></i></button>
<!-- les trois cartes dorées (une seule fois chacune pour tout le combat, dans l'ombre) -->
<button class="ct" id="cFleche" aria-label="Carte dorée : la flèche qui endort"><svg viewBox="0 0 40 40"><path d="M6 33 L27 12" stroke="#ffe08a" stroke-width="3" stroke-linecap="round"/><path d="M33 6 l-11 3 l8 8z" fill="#ffe08a"/><path d="M6 33 l5 -1 M6 33 l1 -5" stroke="#ffe08a" stroke-width="2.4" stroke-linecap="round"/><path d="M23 25 h9 l-9 9 h9" fill="none" stroke="#fff3c4" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg><span>flèche</span><i class="rc"></i></button>
<button class="ct" id="cSifflet" aria-label="Carte dorée : le sifflet"><svg viewBox="0 0 40 40"><circle cx="15" cy="24" r="10" fill="#c99a2a" stroke="#ffe08a" stroke-width="2"/><path d="M15 14 h19 v7 H23" fill="#c99a2a" stroke="#ffe08a" stroke-width="2" stroke-linejoin="round"/><circle cx="15" cy="24" r="3.4" fill="#2a1c04"/><path d="M27 6 v-3 M32 8 l2 -3 M22 7 l-2 -3" stroke="#fff3c4" stroke-width="2.2" stroke-linecap="round"/></svg><span>sifflet</span><i class="rc"></i></button>
<button class="ct" id="cCape" aria-label="Carte dorée : la cape d'ombre, dix secondes"><svg viewBox="0 0 40 40"><path d="M20 3 C10 6 7 16 8 35 h24 C33 16 30 6 20 3z" fill="#7a5a10" stroke="#ffe08a" stroke-width="2"/><path d="M20 10 c-5 2 -6 8 -5 14 h10 c1 -6 0 -12 -5 -14z" fill="#1c1404"/><circle cx="17.5" cy="18" r="1.4" fill="#ffe08a"/><circle cx="22.5" cy="18" r="1.4" fill="#ffe08a"/><path d="M12 35 l3 -6 l3 6 l2 -6 l2 6 l3 -6 l3 6" fill="none" stroke="#ffe08a" stroke-width="1.6" stroke-linejoin="round"/></svg><span>cape</span><i class="rc"></i></button>
<button id="bPause" aria-label="Pause">⏸</button>

<!-- avant de jouer : pas un mot. La salle se prépare (une barre), puis un extrait où le jeu se joue tout seul, et le bouton jaune. -->
<div id="regles" class="voile on"><div class="carte">
  <div id="chargement" role="progressbar" aria-label="Le combat se prépare"><i></i></div>
  <div class="bas"><button class="jaune" id="btnGo" disabled>Démarrer</button></div>
</div></div>
<div id="doigt"></div>

<div id="pause" class="voile"><div class="carte">
  <h2>Pause</h2>
  <div class="menu">
    <button class="jaune" id="pReprendre">Reprendre</button>
    <button class="gris" id="pVague">Repartir d'une vague</button>
    <button class="gris" id="pSuivant">Essai : vague suivante</button>
    <button class="gris" id="pSon">Son : oui</button>
    <button class="gris" id="pRecommencer">Recommencer du début</button>
    <button class="gris" id="pSalle" hidden>← La salle des jeux</button>
  </div>
  <p class="mesures" id="pMesures"></p>
</div></div>

<div id="fin" class="voile"><div class="carte" id="finCarte"></div></div>

<div id="tourne" class="voile"><svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="#f3d48a" stroke-width="3"/><path d="M50 40 A22 22 0 0 1 30 58" fill="none" stroke="#ffd23a" stroke-width="3"/><path d="M30 58 l6 -6 M30 58 l7 3" stroke="#ffd23a" stroke-width="3"/></svg></div>
