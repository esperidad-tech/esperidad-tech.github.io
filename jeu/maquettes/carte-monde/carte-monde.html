<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brumeval — la grande carte (modèle)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Macondo&display=swap">
<style>
:root{
  --nuit:#131932; --nuit-2:#1c2447; --trait:#3b4679; --lune:#eef0ff; --cyan:#8ff3ff; --or:#f5b945; --or-pale:#ffe3a3; --braise:#e8693c;
  --c-pisteur:#5fcf86; --c-alchimiste:#b48cff; --c-barde:#ff8fb3; --c-sage:#6cb6ff;
  --f-titre:"Macondo", "Georgia", "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--nuit);color:var(--lune);font-family:var(--f-texte);-webkit-text-size-adjust:100%}
/* ==========================================================
   Brumeval v2 — carte du village
   ========================================================== */
.ca-carte{display:block;width:100%;height:auto;border-radius:var(--r-3, 24px);background:#4f8c55;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none}
.ca-dessous{background:#120d18}
.ca-t{font-family:var(--f-texte);font-weight:700;letter-spacing:.01em}
.ca-ic{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}

/* Interactions */
.ca-clic{cursor:pointer}
.ca-tap{opacity:0;transition:opacity .12s;pointer-events:none}
.ca-clic:active .ca-tap{opacity:.22}
.ca-etiquette rect{transition:fill .15s}
.ca-etiq-actif rect{fill:#ffe3a3}
.ca-clic:active .ca-etiquette rect{fill:#ffd27a}
.ca-note{cursor:pointer}
.ca-marqueur{--ca-m:#f5b945}
.ca-marqueur.barde{--ca-m:var(--c-barde)}
.ca-marqueur.pisteur{--ca-m:var(--c-pisteur)}
.ca-marqueur.alchimiste{--ca-m:var(--c-alchimiste)}
.ca-marqueur.sage{--ca-m:var(--c-sage)}
.ca-marqueur.magie{--ca-m:var(--cyan)}
.ca-marqueur.alerte{--ca-m:var(--braise)}
/* La présence d'un villageois (dès l'enquête 2) : son petit visage là où il est en ce moment ; un bleu clair (pas le jaune des aides), immobile */
/* la position d'un villageois (Romain, 5 novembre, 8 h 59) : cerclée de jaune comme le rond de sa maison ; seul le petit triangle au-dessus flotte */
.ca-marqueur.presence{--ca-m:#f3d27a}
/* une mission bonus (Romain, 10 novembre) : l'icône de son mini-jeu dans un rond d'or vif, qui flotte, dans toutes les enquêtes */
.ca-marqueur.bonus{--ca-m:#ffc61a}
.ca-marqueur.presence .ca-flotte{animation:none}
.ca-fleche{transform-box:fill-box;transform-origin:center;animation:ca-fleche 1.2s ease-in-out infinite alternate}
@keyframes ca-fleche{from{transform:translateY(-7px)}to{transform:translateY(1px)}}
/* il n'est pas chez lui : le rond de sa maison est grisé */
.ca-habitant.ca-absent{filter:grayscale(1);opacity:.5}

/* Animations (transform / opacity uniquement) */
.ca-fumee,.ca-roue,.ca-onde,.ca-pulse,.ca-tourne,.ca-bat,.ca-flotte,.ca-brume,.ca-follet,.ca-vacille,.ca-drapeau{transform-box:fill-box;transform-origin:center}
.ca-fumee{opacity:0;animation:ca-fumee 4s linear infinite}
@keyframes ca-fumee{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.75}100%{transform:translate(-14px,-46px) scale(2.3);opacity:0}}
.ca-flot{animation:ca-flot 3.2s linear infinite}
@keyframes ca-flot{to{stroke-dashoffset:-88}}
/* la rivière rouge (enquête 2) : sa lueur respire doucement (immobile avec prefers-reduced-motion, plus bas) */
.ca-riv-lueur{animation:ca-riv 3.6s ease-in-out infinite}
@keyframes ca-riv{0%,100%{opacity:.12}50%{opacity:1}}
.ca-riv-coeur{animation:ca-riv-c 3.6s ease-in-out infinite}
@keyframes ca-riv-c{0%,100%{opacity:.55}50%{opacity:1}}
.ca-roue{animation:ca-roue 9s linear infinite}
@keyframes ca-roue{to{transform:rotate(360deg)}}
.ca-onde{animation:ca-onde 2.6s ease-out infinite}
.ca-onde2{animation-delay:-1.3s}
@keyframes ca-onde{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.85);opacity:0}}
.ca-pulse{animation:ca-pulse 1.8s ease-in-out infinite}
@keyframes ca-pulse{0%,100%{transform:scale(.94);opacity:.95}50%{transform:scale(1.07);opacity:.35}}
.ca-tourne{animation:ca-roue 8s linear infinite}
.ca-bat{animation:ca-bat 1.6s ease-in-out infinite}
@keyframes ca-bat{0%,100%{transform:scale(.92);opacity:.55}14%{transform:scale(1.06);opacity:1}28%{transform:scale(.96);opacity:.7}42%{transform:scale(1.03);opacity:.9}}
.ca-flotte{animation:ca-flotte 2.4s ease-in-out infinite}
@keyframes ca-flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ca-brume{animation:ca-brume 34s ease-in-out infinite alternate}
.ca-brume1{animation-duration:46s;animation-direction:alternate-reverse}
@keyframes ca-brume{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.ca-vacille{animation:ca-vacille 2.2s ease-in-out infinite}
@keyframes ca-vacille{0%,100%{opacity:.95}40%{opacity:.6}60%{opacity:.85}80%{opacity:.7}}
.ca-follet{animation:ca-follet 9s ease-in-out infinite}
.ca-follet1{animation-duration:12s}
.ca-follet2{animation-duration:7s;animation-direction:reverse}
@keyframes ca-follet{0%,100%{transform:translate(0,0);opacity:.9}25%{transform:translate(18px,-12px);opacity:.5}50%{transform:translate(4px,-26px);opacity:1}75%{transform:translate(-16px,-8px);opacity:.6}}
.ca-drapeau{animation:ca-drapeau 2.8s ease-in-out infinite;transform-origin:0 50%}
@keyframes ca-drapeau{0%,100%{transform:skewY(0)}50%{transform:skewY(5deg)}}

/* États des lieux sur la carte */
.ca-inactif .ca-etiq-lieu{opacity:.78}
.ca-inactif{pointer-events:none}   /* rien à faire là pour ce rôle : le doigt passe à travers (la maison dessous reste touchable) */
.ca-anneau{opacity:.55}
.ca-calme .ca-etiq-lieu rect{fill:#f6ead0}
.ca-etiq-dessous.ca-etiq-actif rect{fill:#3a2d4c}
.ca-clic:active .ca-etiq-dessous rect{fill:#4a3a60}
.ca-nom rect{fill:#fffaf0}
.ca-apparait,.ca-etincelle,.ca-nouveau{transform-box:fill-box;transform-origin:center}
/* Un lieu qui vient de s'ouvrir : il surgit, des étincelles, une pancarte « Nouveau ! » */
.ca-apparait{animation:ca-apparait .9s cubic-bezier(.3,1.55,.5,1) .35s both}
@keyframes ca-apparait{0%{transform:scale(.1);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
.ca-etincelle{opacity:0;animation:ca-etincelle 1.3s ease-out both}
@keyframes ca-etincelle{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.5);opacity:1}100%{transform:scale(.3) translateY(-24px);opacity:0}}
.ca-nouveau{animation:ca-nouveau 2.4s ease-in-out 1.1s infinite both}
@keyframes ca-nouveau{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ---------- Plein écran (onglet Carte) : toute la place entre le bandeau et les onglets, sans cadre ---------- */
/* autour de la carte (quand on voit toute la carte) : de l'eau bleue, comme un lac autour du village */
.ca-plein{position:relative;width:100%;min-height:220px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%, #3f7fb3 0%, #2b5f8f 55%, #1f4a73 100%)}
.ca-plein.ca-couche-dessous{background:radial-gradient(ellipse at 50% 45%, #2a2036 0%, #140f1c 80%)}
/* les boutons ＋ / − (carte.js) : en bas à droite, toujours au-dessus de la carte */
.ca-zoom{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
.ca-zoom[hidden]{display:none}
.ca-zoom button{width:52px;height:52px;border-radius:50%;border:2px solid var(--trait, #3b4679);background:rgba(19,25,50,.9);color:var(--or-pale, #ffe3a3);font:700 1.7rem/1 var(--f-texte);display:grid;place-items:center;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.45);touch-action:manipulation;cursor:pointer}
.ca-zoom button:active:not(:disabled){transform:scale(.93)}
.ca-zoom button:disabled{opacity:.35;cursor:default}
.ca-murale .ca-zoom{right:6px;bottom:6px;gap:6px}
.ca-murale .ca-zoom button{width:46px;height:46px;font-size:1.5rem}
.ca-etroit .ca-zoom button{width:44px;height:44px;font-size:1.35rem}
.ca-vue{position:absolute;inset:0;display:flex;overflow:auto;overscroll-behavior:contain;touch-action:none;scrollbar-width:none;cursor:grab}   /* glisser et zoomer : carte.js s'en occupe (Carte.monter) */
.ca-vue::-webkit-scrollbar{display:none}
.ca-tire .ca-vue{cursor:grabbing}
.ca-monde{position:relative;flex:none;margin:auto}
.ca-monde > .ca-carte{width:100%;height:100%;border-radius:0}
/* bords qui s'assombrissent : il y a encore de la carte de ce côté-là */
.ca-bord{position:absolute;pointer-events:none;z-index:2;opacity:0;transition:opacity .25s}
.ca-bord.g,.ca-bord.d{top:0;bottom:0;width:26px}
.ca-bord.h,.ca-bord.b{left:0;right:0;height:26px}
.ca-bord.g{left:0;background:linear-gradient(90deg, rgba(10,14,34,.55), transparent)}
.ca-bord.d{right:0;background:linear-gradient(270deg, rgba(10,14,34,.55), transparent)}
.ca-bord.h{top:0;background:linear-gradient(180deg, rgba(10,14,34,.5), transparent)}
.ca-bord.b{bottom:0;background:linear-gradient(0deg, rgba(10,14,34,.5), transparent)}
.ca-plus-g .ca-bord.g,.ca-plus-d .ca-bord.d,.ca-plus-h .ca-bord.h,.ca-plus-b .ca-bord.b{opacity:1}
/* La carte des sous-sols, sur le chevalet de la cabane du Pisteur : un petit titre, et un mot quand elle est encore vide */
.ca-plein.ca-murale{min-height:0}   /* la carte murale prend la taille que la cabane lui donne, rien de plus */
.ca-titre-ss{position:absolute;bottom:8px;left:8px;z-index:4;padding:6px 14px;border-radius:999px;background:rgba(19,25,50,.88);border:2px solid #4a3d66;color:#c9f8ff;font:700 .95rem var(--f-texte);white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ca-vide-ss{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:min(80%, 340px);margin:0;padding:12px 16px;border-radius:16px;background:rgba(19,25,50,.86);border:1px solid #4a3d66;color:#c9f8ff;font-size:.95rem;line-height:1.35;text-align:center;pointer-events:none}
.ca-etroit .ca-titre-ss{bottom:4px;left:4px;padding:4px 10px;font-size:.8rem}
.ca-etroit .ca-vide-ss{font-size:.82rem;padding:8px 10px}
.ca-couche-dessous{background:#120d18}
.ca-couche-dessous .ca-bord.g{background:linear-gradient(90deg, rgba(0,0,0,.6), transparent)}
.ca-couche-dessous .ca-bord.d{background:linear-gradient(270deg, rgba(0,0,0,.6), transparent)}
.ca-passage,.ca-ss-entree{transform-box:fill-box;transform-origin:center}
/* Les chemins secrets en surface (carte.js : cheminsTraces, cheminsInteractifs ; Romain, 5 novembre, 01 h 30). Un chemin neuf se trace
   (1,4 s), puis ses pas, son nom et le rond jaune de son départ apparaissent ; sans animation, tout est là, en entier. */
.ca-chemin-depart,.ca-chemin-nom,.ca-chemin-signe,.ca-chemin-bout{transform-box:fill-box;transform-origin:center}
.ca-chemin-neuf .ca-chemin-trait,.ca-chemin-neuf .ca-chemin-halo,.ca-chemin-neuf .ca-chemin-bord{stroke-dasharray:1 1;animation:ca-trace 1.4s ease-in-out .15s both}
@keyframes ca-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ca-chemin-neuf .ca-chemin-pas,.ca-chemin-neuf .ca-chemin-bout,.ca-chemin-nom.ca-chemin-neuf{animation:ca-fondu .5s ease-out 1.45s both}
@keyframes ca-fondu{from{opacity:0}to{opacity:1}}
.ca-chemin-depart.ca-chemin-neuf{animation:ca-apparait .7s cubic-bezier(.3,1.55,.5,1) 1.5s both}
.ca-chemin-signe.ca-chemin-neuf{animation:ca-fondu .4s ease-out 2s both}
.ca-chemin-depart{cursor:pointer}
.ca-chemin-depart:active .ca-chemin-rond{fill-opacity:.7}
.ca-etiq-chemin rect{stroke:#ffd23f}
.ca-chemin-pion{filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
/* la bulle de la première fois, en bas du tableau (au-dessus du titre, à gauche des boutons ＋ / −) ; 🔊 pour l'entendre */
.ca-chemin-bulle{position:absolute;left:62px;right:62px;bottom:52px;z-index:4;display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto;padding:10px 10px 10px 12px;border-radius:16px;background:#ffe9a8;color:#24182e;border:3px solid #24182e;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.ca-chemin-bulle > span{font-size:1.6rem;line-height:1}
.ca-chemin-bulle p{margin:0;flex:1;font:700 1rem/1.3 var(--f-texte)}
.ca-chemin-bulle .b-lire{flex:none}
.ca-chemin-bulle-neuve{animation:ca-bulle .45s ease-out 2s both}
@keyframes ca-bulle{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* cadre étroit (téléphone debout) : toute la largeur, au-dessus des boutons ＋ / − ; très petit cadre (téléphone couché) : plus serrée */
.ca-serre .ca-chemin-bulle{left:6px;right:6px;bottom:112px;margin:0}
.ca-serre .ca-chemin-bulle p{font-size:.92rem}
.ca-etroit .ca-chemin-bulle{left:4px;right:54px;bottom:40px;margin:0;padding:6px 8px;gap:6px}
.ca-bas .ca-chemin-bulle{display:none}
.ca-etroit .ca-chemin-bulle p{font-size:.85rem}
@media (prefers-reduced-motion: reduce){.ca-chemin-bulle{animation:none!important}}
.ca-etiq-dessous rect{stroke:#8ff3ff;stroke-opacity:.55}
.ca-clic:active .ca-ss-salle > circle,.ca-ss-salle.ca-clic:active > circle:nth-child(2),.ca-ss-mystere.ca-clic:active > circle:nth-child(2){fill:#4a3a60}
/* pastille ✨ sur l'onglet Carte : un nouveau lieu s'est ouvert */
.ca-badge{position:absolute;top:-6px;right:-14px;font-style:normal;font-size:.8rem;line-height:1;padding:3px;border-radius:50%;background:#8ff3ff;box-shadow:0 0 0 2px var(--nuit, #1c2447), 0 0 10px rgba(143,243,255,.85);animation:ca-badge 1.6s ease-in-out infinite}
@keyframes ca-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.ca-fixe *,.ca-fixe{animation:none!important}
@media (prefers-reduced-motion: reduce){.ca-carte *{animation:none!important}.ca-badge{animation:none}}
/* L'Alchimiste : le rond des ingrédients d'un lieu se grise quand elle y a déjà cherché à ce moment (Romain, 5 novembre, 12 h 31) */
.ca-marqueur.ingr-fait{filter:grayscale(1);opacity:.55}
/* Le Barde : un villageois fâché (ou « Encore toi ? ») a son rond et son triangle en rouge (Romain, 5 novembre, 12 h 31) */
.ca-marqueur.presence.ca-fache{--ca-m:#ff5a4a}


/* ---------- la page du modèle ---------- */
.mo-page{position:fixed;inset:0;display:flex;flex-direction:column}
.mo-barre{flex:none;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--nuit);border-bottom:2px solid #2b3566}
.mo-titre{font-family:var(--f-titre);font-size:1.25rem;color:var(--or-pale);white-space:nowrap;margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.mo-titre small{font-family:var(--f-texte);font-size:.8rem;color:#a6aed8;margin-left:8px}
.mo-choix{display:flex;gap:6px;flex:none}
.mo-choix button{font:700 .95rem/1 var(--f-texte);padding:10px 14px;border-radius:999px;border:2px solid var(--trait);background:var(--nuit-2);color:var(--lune);cursor:pointer;touch-action:manipulation;white-space:nowrap}
.mo-choix button[aria-pressed=true]{background:linear-gradient(180deg,#ffe08a,#e8a93a);color:#111;border-color:#24182e}
.mo-choix button:active{transform:scale(.96)}
.mo-cadre{position:relative;flex:1;min-height:0;background:#dfe6f5}
.mo-vue{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab}
.mo-vue::-webkit-scrollbar{display:none}
.mo-tire .mo-vue{cursor:grabbing}
.mo-monde{position:relative}
.mo-monde > .ca-carte{display:block;width:100%;height:100%;border-radius:0;background:#64a15e}
.mo-zoom{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.mo-zoom button{width:52px;height:52px;border-radius:50%;border:2px solid var(--trait);background:rgba(19,25,50,.9);color:var(--or-pale);font:700 1.7rem/1 var(--f-texte);display:grid;place-items:center;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.45);touch-action:manipulation;cursor:pointer}
.mo-zoom button:active:not(:disabled){transform:scale(.93)}
.mo-zoom button:disabled{opacity:.35;cursor:default}
.mo-mot{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 150px);padding:9px 16px;border-radius:999px;background:rgba(19,25,50,.92);border:2px solid var(--trait);color:var(--lune);font-size:.95rem;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);pointer-events:none;transition:opacity .5s ease}
.mo-mot[hidden]{display:block;opacity:0}
.mo-mot b{color:var(--or-pale)}

/* ---------- la brume ---------- */
.bm-zone{transition:opacity 1.5s ease, transform 2.4s ease;cursor:pointer}
.bm-zone.bm-levee{opacity:0;transform:scale(1.07);pointer-events:none}
.bm-zone circle,.bm-zone ellipse,.bm-zone rect:not(.bm-hit){pointer-events:none}
.mo-etiq-zone{opacity:0;transition:opacity .4s ease;pointer-events:none}
.mo-etiq-zone.mo-vu{opacity:1;transition:opacity 1s ease .7s}
.mo-contree{font-family:var(--f-titre);font-weight:400;letter-spacing:.06em}
.mo-cache{display:none}   /* le contenu d'une zone encore sous la brume : pas dessiné du tout */
@media (max-width:640px){
  .mo-titre{font-size:1.05rem}.mo-titre small{display:none}
  .mo-choix button{padding:9px 10px;font-size:.85rem}
  .mo-zoom button{width:44px;height:44px;font-size:1.35rem}
  .mo-mot{font-size:.82rem;max-width:calc(100% - 120px)}
}
@media (max-width:420px){.mo-titre{display:none}.mo-choix{flex:1}.mo-choix button{flex:1}}
</style>
</head>
<body>
<div class="mo-page">
  <div class="mo-barre">
    <div class="mo-titre">Brumeval, la grande carte <small>modèle du 12 novembre</small></div>
    <div class="mo-choix" role="group" aria-label="La brume">
      <button type="button" id="avec" aria-pressed="true">🌫️ Avec la brume</button>
      <button type="button" id="sans" aria-pressed="false">☀️ Sans la brume</button>
    </div>
  </div>

<script>

    vue.scrollTop = c.y * V.k - vue.clientHeight / 2;
    plus.disabled = V.k >= V.kMax - 1e-4; moins.disabled = V.k <= V.kMin + 1e-4;
  }
  function ajuster(depart){
    if(!vue.clientWidth || !vue.clientHeight) return;
    var c = depart || !V.k ? VILLAGE : centre();
    bornes();
    poser(depart || !V.k ? V.kMin : V.k, c);
  }
  function cran(){ return Math.max(1.25, Math.pow(V.kMax / Math.max(1e-4, V.kMin), 1 / 3)); }
  plus.addEventListener('click', function(){ poser(V.k * cran(), centre()); });
  moins.addEventListener('click', function(){ poser(V.k / cran(), centre()); });
  window.addEventListener('resize', function(){ ajuster(false); });
  if(window.ResizeObserver) new ResizeObserver(function(){ ajuster(false); }).observe(vue);

  /* à la souris : on tire la carte (au doigt, le navigateur la fait glisser tout seul) */
  var tire = null, aBouge = false;
  vue.addEventListener('pointerdown', function(e){ aBouge = false; if(e.pointerType !== 'mouse' || e.button !== 0) return; tire = {x: e.clientX, y: e.clientY, l: vue.scrollLeft, t: vue.scrollTop}; });
  window.addEventListener('pointermove', function(e){
    if(!tire) return;
    var dx = e.clientX - tire.x, dy = e.clientY - tire.y;
    if(Math.abs(dx) + Math.abs(dy) > 5){ aBouge = true; cadre.classList.add('mo-tire'); }
    vue.scrollLeft = tire.l - dx; vue.scrollTop = tire.t - dy;
  });
  window.addEventListener('pointerup', function(){ tire = null; cadre.classList.remove('mo-tire'); });
  vue.addEventListener('wheel', function(e){ if(e.ctrlKey){ e.preventDefault(); poser(V.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12), centre()); } }, {passive: false});

  /* ---------- la brume ---------- */
  var levees = {}, avec = document.getElementById('avec'), sans = document.getElementById('sans'), minuteur = 0;
  function dire(html, duree){
    mot.innerHTML = html; mot.hidden = false;
    clearTimeout(minuteur); if(duree) minuteur = setTimeout(function(){ mot.hidden = true; }, duree);
  }
  var attente = {};
  function chaque(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function maj(){
    var n = 0;
    ZONES.forEach(function(z){ if(levees[z.id]) n++; });
    /* le contenu d'une zone : montré juste avant que sa brume se lève, retiré une fois la brume bien revenue */
    chaque('.mo-contenu', function(g){
      var id = g.getAttribute('data-zone');
      clearTimeout(attente[id]);
      if(levees[id]) g.classList.remove('mo-cache');
      else if(!g.classList.contains('mo-cache')) attente[id] = setTimeout(function(){ if(!levees[id]) g.classList.add('mo-cache'); }, 1700);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.bm-zone'), function(g){ g.classList.toggle('bm-levee', !!levees[g.getAttribute('data-zone')]); });
    Array.prototype.forEach.call(document.querySelectorAll('.mo-etiq-zone'), function(g){ g.classList.toggle('mo-vu', !!levees[g.getAttribute('data-zone')]); });
    avec.setAttribute('aria-pressed', n === 0 ? 'true' : 'false');
    sans.setAttribute('aria-pressed', n === ZONES.length ? 'true' : 'false');
  }
  avec.addEventListener('click', function(){ levees = {}; maj(); dire('La brume est revenue partout. Elle se lève là où on la touche.', 5000); });
  sans.addEventListener('click', function(){ ZONES.forEach(function(z){ levees[z.id] = true; }); maj(); dire('Toute la brume est levée. Il ne reste que le mur de brume, au bord de la vallée.', 5000); });
  monde.addEventListener('click', function(e){
    if(aBouge) return;
    var g = e.target.closest ? e.target.closest('.bm-zone') : null;
    if(!g) return;
    var id = g.getAttribute('data-zone'), nom = '';
    ZONES.forEach(function(z){ if(z.id === id) nom = z.nom; });
    levees[id] = true; maj();
    dire('La brume se lève : <b>' + nom + '</b>', 3500);
  });

  ajuster(true);
  maj();
  window.__carte = {V: V, poser: poser, centre: centre, lever: function(l){ levees = {}; (l || []).forEach(function(id){ levees[id] = true; }); maj(); mot.hidden = true; }};
})();
</script>
</body>
</html>
