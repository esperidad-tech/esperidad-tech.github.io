<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc d'essai · expressions des villageois</title>
<link rel="stylesheet" href="../../src/base.css">
<link rel="stylesheet" href="../../src/persos.css">
<style>
body{padding:12px;user-select:auto}
h1{font-size:1.6rem;margin-bottom:8px}
.ligne{display:grid;grid-template-columns:110px repeat(var(--n), var(--w, minmax(0,1fr)));gap:6px;align-items:center;margin-bottom:6px}
.ligne > b{font-size:.8rem;color:var(--or-pale);line-height:1.1}
figure{margin:0;display:flex;flex-direction:column;gap:2px;align-items:center}
figure .cadre{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid var(--trait)}
figure .cadre svg{width:100%;height:100%;display:block}
figcaption{font-size:.62rem;color:var(--brume);text-align:center;line-height:1.1}
.tete{position:sticky;top:0;background:var(--nuit);z-index:2;padding:4px 0}
</style>
</head>
<body>
<h1>Expressions des villageois</h1>
<div id="planche"></div>
<script src="../../src/persos.js"></script>
<script>
(function(){
var P = window.Persos;
var q = new URLSearchParams(location.search);
var ids = q.get('ids') ? q.get('ids').split(',') : Object.keys(P.PNJ);
var cadre = q.get('cadre') || 'visage';
if(q.get('w')) document.documentElement.style.setProperty('--w', q.get('w') + 'px');
/* colonnes : [titre, expression, moment de gel des gestes (ms) ou null] */
var COLS = [
  ['avant (non expressif)', null],
  ['repos', {}],
  ['parle', {bouche:'parle'}],
  ['sourire', {sourire:1}],
  ['yeux de côté + coin', {regard:'cote-d', sourire:'coin', ampleur:.8}],
  ['côté sans sourire', {regard:'cote-g', bouche:'parle'}],
  ['yeux rieurs', {sourire:2, yeuxRieurs:true}],
  ['réfléchit', {regard:'haut-g', sourcils:'un'}],
  ['fronce', {sourcils:'fronces'}],
  ['penche', {penche:1}],
  ['rougeur', {rougeur:.8}],
  ['sueur', {sueur:.8, sueurDuree:2}, 1000],
  ['mord la lèvre', {bouche:'mord'}],
  ['lèvres pincées', {bouche:'pincee'}],
  ['moue', {bouche:'moue'}],
  ['fronce le nez', {nez:true}],
  ['grands yeux', {grandsYeux:true}],
  ['menton levé', {menton:true}],
  ['regarde en bas', {regard:'bas'}],
  ['cligne (gel)', {cligne:'lent'}, 280],
  ['avale (gel)', {avale:true, bouche:'pincee'}, 360]
];
var only = q.get('cols') ? q.get('cols').split(',').map(Number) : null;
var cols = only ? only.map(function(i){ return COLS[i]; }) : COLS;
var out = '<div class="ligne tete" style="--n:' + cols.length + '"><b></b>' + cols.map(function(c){ return '<figcaption>' + c[0] + '</figcaption>'; }).join('') + '</div>';
ids.forEach(function(id){
  out += '<div class="ligne" style="--n:' + cols.length + '"><b>' + P.PNJ[id].nom + '</b>' + cols.map(function(c, i){
    var svg = c[1] === null ? P.pnj(id, {anime:false, id:'av-' + id}) : P.pnj(id, {anime:false, expressif:true, cadre:cadre, id:'x-' + id + '-' + i});
    return '<figure><div class="cadre" data-col="' + i + '">' + svg + '</div></figure>';
  }).join('') + '</div>';
});
document.getElementById('planche').innerHTML = out;
document.querySelectorAll('.cadre').forEach(function(cd){
  var c = cols[+cd.dataset.col]; if(!c[1]) return;
  var svg = cd.querySelector('svg');
  P.expression(svg, Object.assign({vitesse:0, vitesseRougeur:0}, c[1]));
  if(c[2] != null && svg.getAnimations){ svg.getAnimations({subtree:true}).forEach(function(a){ a.pause(); a.currentTime = c[2]; }); }
});
window.__pret = true;
})();
</script>
</body>
</html>
