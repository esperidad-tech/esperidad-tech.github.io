<title>Salle des mini-jeux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@500;700&family=Macondo&display=swap">
<style>/* ==========================================================
   Brumeval v2 — base commune (jetons, typographie, boutons)
   Tous les modules (persos, carte, mini-jeux, moteur) s'appuient
   sur ces variables. Ne pas redéfinir ailleurs.
   ========================================================== */
:root{
  /* Nuit de Brumeval */
  --nuit:#131932;
  --nuit-2:#1c2447;
  --nuit-3:#28325e;
  --nuit-4:#34407a;
  --trait:#3b4679;
  --brume:#a6aed8;
  --lune:#eef0ff;
  --cyan:#8ff3ff;          /* lueurs magiques */
  --cyan-2:#3fd0ff;
  /* Parchemin et encre */
  --parchemin:#f3e7cb;
  --parchemin-2:#e8d7ae;
  --encre:#35281b;
  --encre-2:#6b5434;
  /* Or des lanternes */
  --or:#f5b945;
  --or-pale:#ffe3a3;
  --laiton:#b8862e;
  --braise:#e8693c;
  --braise-sombre:#a8391a;
  --mousse:#7cc493;
  --violet:#9d6ee3;
  --rose:#ef7fa8;
  /* Couleurs des rôles */
  --c-pisteur:#5fcf86;
  --c-alchimiste:#b48cff;
  --c-barde:#ff8fb3;
  --c-sage:#6cb6ff;
  /* Contour du style retenu */
  --contour:#24182e;
  /* Polices */
  --f-titre:"Macondo", "Georgia", "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-main:"Caveat", "Segoe Script", "Comic Sans MS", cursive;
  /* Rayons, ombres */
  --r-1:10px; --r-2:16px; --r-3:24px;
  --ombre:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nuit);color:var(--lune);font-family:var(--f-texte);font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,6.5vw,2.8rem);color:var(--or-pale)}
h2{font-size:1.55rem;color:var(--or-pale)}
h3{font-size:1.2rem;color:var(--lune)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:999px;border:0;
  background:linear-gradient(180deg,#ffd27a,var(--or));color:var(--encre);font-weight:700;font-size:1.05rem;text-align:center;
  box-shadow:0 4px 0 #b07a1c, 0 8px 18px rgba(0,0,0,.35);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a1c, 0 4px 10px rgba(0,0,0,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.second{background:rgba(238,240,255,.06);color:var(--lune);border:2px solid var(--trait);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#ff8c62,var(--braise));color:#fff;box-shadow:0 4px 0 var(--braise-sombre)}
.btn.magie{background:linear-gradient(180deg,#bff9ff,var(--cyan-2));color:#06243a;box-shadow:0 4px 0 #1b86a8, 0 0 22px rgba(143,243,255,.45)}
.btn.petit{min-height:42px;padding:6px 16px;font-size:.95rem}
.btn.grand{font-size:1.2rem;min-height:62px;padding:12px 30px}
.btn.rond{width:52px;height:52px;padding:0;border-radius:50%}

.parchemin{background:var(--parchemin);color:var(--encre);border-radius:6px 12px 8px 14px;padding:20px 18px;
  box-shadow:0 12px 34px rgba(0,0,0,.4), inset 0 0 44px rgba(140,100,40,.22)}
.parchemin h2,.parchemin h3{color:var(--encre)}
.panneau{background:var(--nuit-2);border:1px solid var(--trait);border-radius:var(--r-2);padding:16px}
.doux{color:var(--brume)}
.petit{font-size:.88rem}
.centre{text-align:center}
.sur-titre{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;color:var(--or);font-weight:700}

/* Animations communes */
@keyframes b-apparait{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes b-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes b-lueur{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes b-tremble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Cœur des mini-jeux : cadre commun */
.mj{position:relative;display:flex;flex-direction:column;width:100%;height:100%;min-height:520px;background:radial-gradient(120% 80% at 50% 0%, var(--nuit-3), var(--nuit) 70%);border-radius:var(--r-3);overflow:hidden;border:1px solid var(--trait)}
.mj-role-pisteur{--c-role:var(--c-pisteur)}
.mj-role-alchimiste{--c-role:var(--c-alchimiste)}
.mj-role-barde{--c-role:var(--c-barde)}
.mj-role-sage{--c-role:var(--c-sage)}
.mj-tete{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--trait)}
.mj-ic{font-size:1.8rem;line-height:1;filter:drop-shadow(0 0 8px var(--c-role, var(--cyan)))}
.mj-titres{display:flex;flex-direction:column;min-width:0;flex:1}
.mj-nom{font-family:var(--f-titre);font-weight:400;font-size:1.2rem;color:var(--or-pale);line-height:1.1}
.mj-niv{font-size:.8rem;color:var(--brume)}
.mj-btn-lire,.mj-btn-stop{width:44px;height:44px;border-radius:50%;border:0;background:rgba(238,240,255,.1);font-size:1.2rem;flex:none}
.mj-scene{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.mj-zone{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.mj-intro{display:flex;flex-direction:column;gap:14px;padding:16px;align-items:stretch;animation:b-apparait .35s ease-out}
.mj-demo{position:relative;height:170px;border-radius:var(--r-2);background:rgba(0,0,0,.25);border:1px dashed var(--trait);overflow:hidden}
.mj-consigne{font-size:1.1rem;text-align:center;text-wrap:balance}
.mj-reglages{list-style:none;margin:0;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.mj-reglages li{display:flex;justify-content:space-between;gap:12px}
.mj-reglages b{color:var(--or-pale)}
.mj-aides ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.mj-aides i{color:var(--brume);font-style:normal}
.mj-unique{color:var(--braise);font-weight:700;text-align:center}
.mj-go{align-self:center}
.mj-resultat{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(13,17,38,.86);animation:b-apparait .3s ease-out}
.mj-res-ic{font-size:4.2rem;animation:b-pulse 1.2s ease-in-out infinite}
.mj-resultat.ok h2{color:var(--or-pale)}
.mj-resultat.ko h2{color:var(--brume)}
.mj-etincelle{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:var(--or-pale);box-shadow:0 0 12px var(--or);animation:mj-eclat .9s ease-out forwards}
@keyframes mj-eclat{from{transform:rotate(var(--a)) translateX(0) scale(1);opacity:1}to{transform:rotate(var(--a)) translateX(var(--d)) scale(.2);opacity:0}}
/* L'écran de consigne défile si l'écran est petit, et « C'est parti ! » reste toujours visible en bas */
.mj-intro{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.mj-intro .mj-go{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 18px rgba(8,10,25,.85), 0 4px 0 rgba(0,0,0,.35);flex:none}

/* ==========================================================
   PERSOS — animations des héros et des villageois
   Les animations ne tournent que dans un SVG .pj-anime.
   ========================================================== */
.pj{display:block;width:100%;height:auto;overflow:hidden}


.pj-anime .pj-souffle{transform-box:view-box;transform-origin:150px 414px;animation:pj-souffle 4.2s ease-in-out infinite}
.pj-anime .pj-souffle-pnj{transform-box:view-box;transform-origin:0px 120px;animation:pj-souffle 4.6s ease-in-out infinite}
@keyframes pj-souffle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.012)}}

.pj-anime .pj-yeux{transform-box:fill-box;transform-origin:50% 55%;animation:pj-cligne 5.2s infinite}
@keyframes pj-cligne{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

.pj-anime .pj-pulse{animation:pj-pulse 2.4s ease-in-out infinite}
@keyframes pj-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pj-anime .pj-scintille{animation:pj-scintille 1.9s ease-in-out infinite}
@keyframes pj-scintille{0%,100%{opacity:.2}50%{opacity:1}}

.pj-anime .pj-meche,.pj-anime .pj-meche2,.pj-anime .pj-plume,.pj-anime .pj-aile,.pj-anime .pj-queue,.pj-anime .pj-tete-anim{transform-box:view-box}
.pj-anime .pj-meche{animation:pj-meche 3.4s ease-in-out infinite}
@keyframes pj-meche{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(3deg)}}
.pj-anime .pj-meche2{animation:pj-meche2 3.8s ease-in-out infinite}
@keyframes pj-meche2{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-2deg)}}
.pj-anime .pj-plume{animation:pj-plume 2.8s ease-in-out infinite}
@keyframes pj-plume{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
.pj-anime .pj-barbe{transform-box:view-box;transform-origin:0px 22px;animation:pj-meche2 4.4s ease-in-out infinite}

.pj-anime .pj-cape{transform-box:fill-box;transform-origin:50% 0;animation:pj-cape 4.6s ease-in-out infinite}
@keyframes pj-cape{0%,100%{transform:rotate(-1.2deg) skewX(0deg)}50%{transform:rotate(1.4deg) skewX(-2.2deg)}}

.pj-anime .pj-tourne{transform-box:fill-box;transform-origin:50% 50%;animation:pj-tourne 12s linear infinite}
@keyframes pj-tourne{to{transform:rotate(360deg)}}
.pj-anime .pj-monte{transform-box:fill-box;transform-origin:50% 50%;animation:pj-monte 2.4s linear infinite}
@keyframes pj-monte{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-52px) scale(.3);opacity:0}}
.pj-anime .pj-flotte{animation:pj-flotte 3.2s ease-in-out infinite}
@keyframes pj-flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pj-anime .pj-derive{animation:pj-derive 11s ease-in-out infinite}
@keyframes pj-derive{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.pj-anime .pj-vent{animation:pj-vent 1.6s linear infinite}
@keyframes pj-vent{0%{opacity:0;transform:translateX(6px)}30%{opacity:.9}100%{opacity:0;transform:translateX(-10px)}}
.pj-anime .pj-ailes{animation:pj-ailes 1.8s ease-in-out infinite}
@keyframes pj-ailes{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pj-anime .pj-aile{animation:pj-aile 2.6s ease-in-out infinite}
@keyframes pj-aile{0%,80%,100%{transform:rotate(0deg)}88%{transform:rotate(-22deg)}94%{transform:rotate(6deg)}}
.pj-anime .pj-respire{animation:pj-flotte 2.6s ease-in-out infinite}
.pj-anime .pj-queue{animation:pj-queue 1.4s ease-in-out infinite}
@keyframes pj-queue{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.pj-anime .pj-tete-anim{animation:pj-tete 5s ease-in-out infinite}
@keyframes pj-tete{0%,70%,100%{transform:rotate(0deg)}78%{transform:rotate(-10deg)}88%{transform:rotate(6deg)}}
.pj-anime .pj-onde,.pj-anime .pj-onde2{transform-box:fill-box;transform-origin:50% 50%;animation:pj-onde 2.6s ease-out infinite}
@keyframes pj-onde{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.pj-anime .pj-note{animation:pj-note 3.4s ease-in-out infinite}
@keyframes pj-note{0%{transform:translate(0,6px);opacity:0}20%{opacity:1}100%{transform:translate(8px,-34px);opacity:0}}
.pj-anime .pj-vole{animation:pj-vole 5s ease-in-out infinite}
@keyframes pj-vole{0%,100%{transform:translate(0,0)}25%{transform:translate(-10px,-8px)}50%{transform:translate(-4px,-16px)}75%{transform:translate(6px,-6px)}}
.pj-anime .pj-goutte{animation:pj-goutte 1.6s ease-in infinite}
@keyframes pj-goutte{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}

/* ---------- Villageois expressifs : Persos.pnj(id, {expressif:true}) + Persos.expression() ----------
   Tout est piloté par des variables --pjx-* posées sur la racine du SVG et par data-pjx-b (bouche). */
.pj-expr{--pjx-t:.22s;--pjx-tr:.9s}
.pj-expr .pjx-iris{transform:translate(calc(var(--pjx-rx,0) * 1px), calc(var(--pjx-ry,0) * 1px));transition:transform var(--pjx-t) cubic-bezier(.3,.6,.35,1)}
.pj-expr .pjx-paup,.pj-expr .pjx-liner{transform:translateY(calc(var(--pjx-paup,0) * 5.5px));transition:transform var(--pjx-t) ease}
.pj-expr .pjx-rieur{transform:translateY(calc((1 - var(--pjx-rieurs,0)) * 11px));transition:transform calc(var(--pjx-t) * 1.3) ease}
.pj-expr .pjx-pli{opacity:calc(var(--pjx-rieurs,0) * .7);transition:opacity var(--pjx-t)}
.pj-expr .pjx-cilsb{opacity:calc(1 - var(--pjx-rieurs,0) * 1.8);transition:opacity var(--pjx-t)}
.pj-expr .pjx-oeil-in{transform:scale(var(--pjx-gy,1));transition:transform var(--pjx-t) ease}
.pj-expr .pjx-sc{transition:transform var(--pjx-t) ease}
.pj-expr .pjx-sc-g{transform:translateY(calc(var(--pjx-sgy,0) * 1px)) rotate(calc(var(--pjx-sgr,0) * 1deg))}
.pj-expr .pjx-sc-d{transform:translateY(calc(var(--pjx-sdy,0) * 1px)) rotate(calc(var(--pjx-sdr,0) * 1deg))}
.pj-expr .pjx-tete{transform-origin:0px 30px;transform:translateY(calc(var(--pjx-menton,0) * -3px)) rotate(calc(var(--pjx-penche,0) * 7deg));transition:transform calc(var(--pjx-t) * 2.2) cubic-bezier(.45,0,.3,1)}
.pj-expr .pjx-nez{transform:translateY(calc(var(--pjx-nez,0) * -1.2px));transition:transform var(--pjx-t) ease}
.pj-expr .pjx-nez-plis{opacity:calc(var(--pjx-nez,0) * .9);transition:opacity var(--pjx-t)}
.pj-expr .pjx-rouge{opacity:var(--pjx-rougeur,0);transition:opacity var(--pjx-tr) ease-in-out}
.pj-expr .pjx-joues{transform:translateY(calc(var(--pjx-joue,0) * -1.8px));transition:transform calc(var(--pjx-t) * 1.3) ease}
.pj-expr .pjx-pommettes{opacity:calc(var(--pjx-joue,0) * .75);transition:opacity var(--pjx-t)}
.pj-expr .pjx-gorge,.pj-expr .pjx-sueur-g,.pj-expr .pjx-sueur-trace{opacity:0}
/* bouche : une seule forme visible */
.pj-expr .pjx-b > g{opacity:0;transition:opacity .08s}
.pj-expr[data-pjx-b="repos"] .pjx-b-repos,.pj-expr[data-pjx-b="s0"] .pjx-b-s0,.pj-expr[data-pjx-b="o"] .pjx-b-o,.pj-expr[data-pjx-b="s1"] .pjx-b-s1,.pj-expr[data-pjx-b="s2"] .pjx-b-s2,.pj-expr[data-pjx-b="coin"] .pjx-b-coin,
.pj-expr[data-pjx-b="pince"] .pjx-b-pince,.pj-expr[data-pjx-b="mord"] .pjx-b-mord,.pj-expr[data-pjx-b="moue"] .pjx-b-moue,
.pj-expr[data-pjx-b="parle"] .pjx-b-parle,.pj-expr[data-pjx-b="parles"] .pjx-b-parles,.pj-expr[data-pjx-b="mordille"] .pjx-b-mordille,.pj-expr[data-pjx-b="sforce"] .pjx-b-sforce{opacity:1}
/* mordillement : 3 petits coups rapides de la lèvre rentrée */
.pj-expr .pjx-b-mordille-in{transform-origin:0px 1px}
.pj-anime.pj-expr[data-pjx-b="mordille"] .pjx-b-mordille-in{animation:pjx-mordille .17s ease-in-out 3}
@keyframes pjx-mordille{0%,100%{transform:translate(0,0) scale(1,1)}35%{transform:translate(-.6px,.6px) scale(.93,1.08)}70%{transform:translate(.6px,-.3px) scale(1.04,.9)}}
.pj-expr .pjx-b-coin-in{transform:scaleX(var(--pjx-coin,1))}
.pj-expr .pjx-b-anim{transform-origin:0px -1.5px;transform:scale(1,.55)}
.pj-anime.pj-expr[data-pjx-b="parle"] .pjx-b-parle .pjx-b-anim,.pj-anime.pj-expr[data-pjx-b="parles"] .pjx-b-parles .pjx-b-anim{animation:pjx-parle .84s linear infinite}
@keyframes pjx-parle{0%{transform:scale(1,.22)}13%{transform:scale(1.02,.92)}26%{transform:scale(.97,.42)}39%{transform:scale(1.04,.78)}51%{transform:scale(1,.16)}63%{transform:scale(.95,.66)}76%{transform:scale(1.03,1)}88%{transform:scale(1,.34)}100%{transform:scale(1,.22)}}
/* moustache : suit la bouche */
.pj-expr .pjx-mou{transform-origin:0px 20px;transition:transform var(--pjx-t) ease}
.pj-expr[data-pjx-b="s1"] .pjx-mou,.pj-expr[data-pjx-b="s0"] .pjx-mou,.pj-expr[data-pjx-b="parles"] .pjx-mou{transform:translateY(-.8px) scale(1.05,1)}
.pj-expr[data-pjx-b="s2"] .pjx-mou,.pj-expr[data-pjx-b="sforce"] .pjx-mou{transform:translateY(-1.4px) scale(1.08,1)}
.pj-anime.pj-expr[data-pjx-b="mordille"] .pjx-mou{animation:pjx-mou-mord .17s ease-in-out 3}
@keyframes pjx-mou-mord{0%,100%{transform:translateY(0)}50%{transform:translateY(.7px) scale(.97,1)}}
.pj-expr[data-pjx-b="coin"] .pjx-mou{transform:translateY(-.4px) rotate(calc(var(--pjx-coin,1) * -6deg))}
.pj-expr[data-pjx-b="pince"] .pjx-mou,.pj-expr[data-pjx-b="mord"] .pjx-mou{transform:translateY(.5px) scale(.97,1)}
.pj-expr[data-pjx-b="o"] .pjx-mou{transform:translateY(-.6px) scale(.94,1)}
.pj-expr[data-pjx-b="moue"] .pjx-mou{transform:translateY(.6px) scale(.9,1.05)}
.pj-anime.pj-expr[data-pjx-b="parle"] .pjx-mou{animation:pjx-mou .84s linear infinite}
@keyframes pjx-mou{0%,51%,100%{transform:translateY(0)}13%,76%{transform:translateY(.7px)}39%{transform:translateY(.45px)}}
@media (prefers-reduced-motion: reduce){ .pj-anime *{animation:none!important} }

/* ==========================================================
   Mini-jeux du Pisteur et de l'Alchimiste (préfixe .mja-)
   ========================================================== */
.mja-hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;min-height:46px;background:rgba(0,0,0,.18)}
.mja-vies{display:flex;gap:3px}
.mja-coeur{width:24px;height:22px;display:inline-block}
.mja-coeur svg{width:100%;height:100%;display:block;fill:#ff5b6e;stroke:var(--contour);stroke-width:2;filter:drop-shadow(0 0 4px rgba(255,91,110,.45))}
.mja-coeur.perdu svg{fill:#3a3352;filter:none}
.mja-coeur.casse{animation:mja-casse .5s ease-out}
@keyframes mja-casse{0%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:none}}
.mja-prog{display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex:1;justify-content:center;min-width:50px}
.mja-gemme{width:22px;height:22px;border-radius:7px;transform:rotate(45deg) scale(.8);background:#2b2f55;border:2px solid var(--trait);display:grid;place-items:center;font-size:0}
.mja-gemme.ok{background:linear-gradient(135deg,#bff9ff,var(--cyan-2));border-color:var(--contour);box-shadow:0 0 10px rgba(143,243,255,.6)}
.mja-gemme.neuf{animation:mja-gemme .5s ease-out}
@keyframes mja-gemme{0%{transform:rotate(45deg) scale(1.6)}100%{transform:rotate(45deg) scale(.8)}}
.mja-prog-barre{flex:1;height:12px;border-radius:6px;background:#2b2f55;overflow:hidden}
.mja-prog-barre i{display:block;height:100%;background:var(--cyan-2)}
.mja-sablier{display:flex;align-items:center;gap:6px;min-width:80px;flex:0 1 130px}
@media (max-width:440px){
  .mja-hud{gap:6px;padding:8px 10px}
  .mja-vies{gap:1px}
  .mja-coeur{width:20px;height:18px}
  .mja-gemme{width:18px;height:18px}
  .mja-badge{width:34px;height:34px}
  .mja-badge.large{width:auto}
}
.mja-sablier span{font-size:1.1rem}
.mja-sab-barre{flex:1;height:12px;border-radius:6px;background:#2b2f55;border:2px solid var(--contour);overflow:hidden}
.mja-sab-barre i{display:block;height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,#ffe3a3,var(--or))}
.mja-sablier.presse .mja-sab-barre i{background:linear-gradient(90deg,#ffb38a,var(--braise));animation:b-lueur .5s infinite}
.mja-terrain{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;touch-action:none}
.mja-terrain > svg{flex:1;width:100%;height:100%;min-height:0;display:block}
.mja-actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px 12px 14px}
.mja-flotte{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:1.25rem;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 var(--contour),0 0 10px rgba(0,0,0,.6);animation:mja-monte 1s ease-out forwards;z-index:5}
.mja-flotte.ok{color:#bff9ff}
.mja-flotte.ko{color:#ffb3a3}
@keyframes mja-monte{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}20%{transform:translate(-50%,-70%) scale(1.15)}to{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.mja-annonce{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;font-family:var(--f-titre);font-size:clamp(1.6rem,7vw,2.4rem);color:var(--or-pale);text-shadow:0 3px 0 var(--contour),0 0 18px rgba(245,185,69,.6);animation:mja-annonce 1.3s ease-out forwards;white-space:nowrap}
@keyframes mja-annonce{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.mja-secoue{animation:b-tremble .35s ease-out}

/* Main de démonstration */
.mja-demo-svg{width:100%;height:100%;display:block}
.mja-main .mja-onde{fill:none;stroke:var(--cyan);stroke-width:3;opacity:0}
.mja-main.tape .mja-onde{animation:mja-onde .5s ease-out}
.mja-main.appuie .mja-onde{opacity:.8;stroke-width:5}
@keyframes mja-onde{from{opacity:1;r:6}to{opacity:0;r:26}}
.mja-main > g{transition:transform .12s}
.mja-main.tape > g{animation:mja-tape .3s ease-out}
.mja-main.appuie > g{transform:scale(.56) rotate(-12deg)}
@keyframes mja-tape{50%{transform:scale(.52) rotate(-12deg)}}

/* ---------- Traces (la piste) ---------- */
.mja-traces{background:#4a4330}
.mja-empr .e-f{fill:#2a1d12;stroke:#e4d3a6;stroke-width:.9;stroke-linejoin:round}
.mja-empr .e-c{fill:#efe0b8}
.mja-empr .e-r{fill:none;stroke:#efe0b8;stroke-width:1.3;stroke-linecap:round}
.mja-empr .e-trou{fill:#5b5236}
.mja-empr .e-rebord{fill:none;stroke:#e4d3a6;stroke-width:.9;opacity:.75}
.mja-alerte-perdu{fill:#ff5b6e;pointer-events:none;mix-blend-mode:multiply}
.mja-bruine-g{pointer-events:none}
.mja-empr.boue .e-f{fill:#1b120a;stroke:#6d5238;stroke-width:1.6}
.mja-empr .e-tache{fill:#3b2a1a;opacity:.55}
.e-flou{fill:#2a1d12;fill-opacity:.55;stroke:#e4d3a6;stroke-opacity:.35;stroke-width:4;stroke-linejoin:round}
.mja-empr.revele .e-f{fill:#bff9ff;stroke:var(--contour);filter:drop-shadow(0 0 3px var(--cyan))}
.mja-vision{fill:none;stroke:var(--cyan);stroke-width:1.6;stroke-dasharray:5 5;opacity:.75;pointer-events:none;filter:drop-shadow(0 0 3px var(--cyan))}
.mja-vision-sol{fill:#fff4d6;opacity:.13;pointer-events:none}
.mja-feuille-v{stroke:var(--contour);stroke-width:1;pointer-events:none}
.mja-feuilles-v,.mja-pluie,.mja-nuit-g{pointer-events:none}
.mja-arr-halo{fill:#ffd36a;opacity:0;transition:opacity .3s}
.mja-arrivee.bonne .mja-arr-halo{opacity:.55;filter:drop-shadow(0 0 10px #ffd36a)}
.mja-arrivee.revelee .mja-arr-halo{animation:b-lueur .6s ease-in-out infinite}
.mja-arr-x{font-size:22px;font-weight:700;fill:#ff6b6b;stroke:var(--contour);stroke-width:1.5;opacity:0}
.mja-arrivee.fausse .mja-arr-x{opacity:1}
.mja-arrivee.fausse{opacity:.6}
.mja-empr-carte{display:block;overflow:visible}
.mja-badge{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#5b5236;border:3px solid var(--contour);box-shadow:0 0 0 2px rgba(143,243,255,.35),inset 0 0 10px rgba(0,0,0,.4);flex:none}
.mja-badge-q{font-family:var(--f-titre);font-size:1.5rem;color:var(--or-pale)}
.mja-prog-barre i{transform-origin:left center;width:100%;background:linear-gradient(90deg,#bff9ff,var(--cyan-2));box-shadow:0 0 8px rgba(143,243,255,.6)}
.mja-vaguelettes path{fill:none;stroke:#bfe6ff;stroke-width:2.5;opacity:.55;animation:mja-vague 1.6s linear infinite}
@keyframes mja-vague{to{transform:translateX(-40px)}}
.mja-pluie path{stroke:#c9dcff;stroke-width:2.1;stroke-linecap:round;opacity:.7;animation:mja-pluie .42s linear infinite}
@keyframes mja-pluie{from{transform:translate(0,-40px)}to{transform:translate(-16px,46px)}}
.mja-depart{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:rgba(13,17,38,.55);transition:opacity .4s}
.mja-depart.part{opacity:0}
.mja-depart-in{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:86%;padding:16px 22px 18px;border-radius:22px;background:radial-gradient(circle at 50% 40%,#6b6040,#4a4330);border:4px solid var(--contour);box-shadow:0 0 0 3px rgba(143,243,255,.5),0 0 30px rgba(143,243,255,.35),var(--ombre);animation:b-apparait .35s ease-out;text-align:center}
.mja-depart-in b{font-family:var(--f-titre);font-weight:400;font-size:1.35rem;color:var(--or-pale);text-shadow:0 2px 0 var(--contour)}
.mja-depart-pt{font-size:.9rem;color:var(--brume)}
.mja-depart-in .mja-empr-carte{filter:drop-shadow(0 0 8px rgba(143,243,255,.5))}

/* ---------- Poursuite ---------- */
.mja-poursuite{background:#12261f}
.mja-tiret{stroke:#efe2bf;stroke-linecap:round;opacity:.75}
.mja-obstacle.casse{opacity:.35}
.mja-obstacle.pris{opacity:0;transition:opacity .2s}
.mja-boost{animation:mja-boost .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px var(--cyan))}
.mja-obstacle.tot{filter:drop-shadow(0 0 5px var(--cyan)) drop-shadow(0 0 2px var(--cyan))}
.mja-pas-rangee{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.25);border:2px solid var(--trait);flex:none}
.mja-pas-bout{font-size:1rem;line-height:1}
.mja-pas-pt{width:12px;height:12px;border-radius:50%;background:#2b2f55;border:2px solid var(--trait);transition:transform .3s,background .3s}
.mja-pas-pt.depart{border-color:var(--brume)}
.mja-pas-pt.ici{background:#1d1730;border-color:#ffd36a;transform:scale(1.45);box-shadow:0 0 8px #ffd36a}
.mja-sans-faute{margin-left:auto;font-size:.85rem;color:var(--brume);white-space:nowrap}
.mja-sans-faute b{color:#bff9ff;font-size:1rem}
.mja-sans-faute.pop{animation:b-pulse .35s ease-out}
.mja-hud-course .mja-prog,.mja-hud-course .mja-vies{display:none}
.mja-etoiles-choc{opacity:0}
.mja-coureur-corps.trebuche .mja-etoiles-choc{animation:mja-etoiles .9s ease-out}
@keyframes mja-etoiles{0%,80%{opacity:1}100%{opacity:0}}
.mja-coureur-corps.trebuche{filter:drop-shadow(0 0 6px #ff6b6b)}
.mja-coureur.sprint .mja-coureur-corps{animation:mja-sprint .8s ease-out}
@keyframes mja-sprint{0%{filter:drop-shadow(0 0 0 var(--cyan))}30%{filter:drop-shadow(0 0 14px var(--cyan))}100%{filter:none}}
@keyframes mja-boost{to{opacity:.55}}
.mja-roule{animation:mja-roule .35s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes mja-roule{to{transform:rotate(360deg)}}
.mja-fuyard-corps{animation:mja-fuyard .32s ease-in-out infinite alternate}
@keyframes mja-fuyard{to{transform:translateY(-3px)}}
.mja-fuyard{transition:opacity .25s}
.mja-fuyard-ex{font-family:var(--f-titre);font-size:30px;fill:#ffd36a;stroke:var(--contour);stroke-width:2;opacity:0}
.mja-fuyard.alerte .mja-fuyard-ex{opacity:1;animation:b-pulse .4s infinite}
.mja-fuyard.attrape .mja-fuyard-corps{animation:mja-attrape .6s ease-out forwards}
@keyframes mja-attrape{to{transform:rotate(-12deg) translateY(4px)}}
.mja-coureur.pas2 .mja-jambe.g{transform:translateY(-4px)}
.mja-coureur:not(.pas2) .mja-jambe.d{transform:translateY(-4px)}
.mja-coureur-corps.bute{animation:b-tremble .25s}
.mja-coureur.boost .mja-coureur-corps{filter:drop-shadow(0 0 8px var(--cyan))}
.mja-conseil{filter:drop-shadow(0 0 6px var(--cyan));transition:opacity .15s}
.mja-conseil-t{fill:#8ff3ff;font-size:22px;font-weight:700;font-family:var(--f-texte)}
.mja-pad{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none;z-index:3}
.mja-pb{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:3px solid var(--contour);background:rgba(238,240,255,.16);color:#fff;font-size:1.5rem;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.mja-pb:active{background:rgba(143,243,255,.45);transform:translateY(2px)}
.mja-pb[data-k="h"]{margin-left:auto;margin-right:8px}
.mja-pb[data-k="b"]{margin-right:auto}

/* ---------- Cachette ---------- */
.mja-cachette{background:#1d2240}
.mja-voile-nuit{fill:#0b1030;opacity:.32;pointer-events:none}
.mja-cone{fill:#ffe39a;opacity:.38;transition:fill .2s}
.mja-cone.alerte{fill:#ff6b6b;opacity:.45}
.mja-garde .mja-alerte,.mja-garde .mja-doute{font-family:var(--f-titre);font-size:30px;stroke:var(--contour);stroke-width:2;opacity:0}
.mja-garde .mja-alerte{fill:#ff5b6e}
.mja-garde .mja-doute{fill:#ffd36a}
.mja-garde.alerte .mja-alerte{opacity:1;animation:b-pulse .4s infinite}
.mja-garde.doute:not(.alerte) .mja-doute{opacity:1;animation:b-pulse .5s infinite}
.mja-lanterne{filter:drop-shadow(0 0 6px #ffd36a)}
.mja-demo-anneau{fill:none;stroke:var(--cyan);stroke-width:3;stroke-dasharray:6 5;filter:drop-shadow(0 0 4px var(--cyan))}
.mja-anneau{fill:none;stroke:transparent;stroke-width:4;pointer-events:none}
.mja-anneau.on{stroke:var(--cyan);stroke-dasharray:7 6;animation:mja-tourne 3s linear infinite;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 4px var(--cyan))}
.mja-anneau.on.sur{stroke:#7cf0a8;filter:drop-shadow(0 0 5px #7cf0a8)}
.mja-anneau.on.danger{stroke:#ff8a6a;filter:none}
@keyframes mja-tourne{to{transform:rotate(360deg)}}
.mja-couvert.porte.ouverte{filter:drop-shadow(0 0 10px #ffd36a)}
.mja-couvert.porte{filter:drop-shadow(0 0 6px rgba(255,211,106,.6))}
.mja-joueur{transition:opacity .2s}
.mja-joueur.cache{opacity:.8}
.mja-joueur.invisible{opacity:.25}
.mja-caillou-vol{fill:#a6aed8;stroke:var(--contour);stroke-width:2}
.mja-caillou.actif{background:rgba(143,243,255,.25);border-color:var(--cyan);box-shadow:0 0 14px rgba(143,243,255,.5)}
.mja-cachette.vise-caillou svg{cursor:crosshair}
.mja-cachette.vise-caillou::after{content:"🪨 Touche l'endroit où lancer";position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(13,17,38,.85);border:2px solid var(--cyan);font-weight:700;font-size:.95rem;pointer-events:none;white-space:nowrap}

/* ---------- Tir à l'arc ---------- */
.mja-tir{background:#1b2547}
.mja-cible-art{transform-box:fill-box;transform-origin:center}
.mja-cible-halo{fill:none;stroke:var(--cyan);stroke-width:3;stroke-dasharray:6 6;opacity:0;transition:opacity .15s}
.mja-cible.visee .mja-cible-halo{opacity:1;filter:drop-shadow(0 0 6px var(--cyan))}
.mja-cible.t-lanterne .mja-lant{filter:drop-shadow(0 0 10px rgba(255,211,106,.75))}
.mja-cible.eteinte .mja-lant{filter:none}
.mja-cible.eteinte .mja-lant-feu{opacity:0}
.mja-lant-feu{transform-box:fill-box;transform-origin:bottom center;animation:mja-flamme .4s ease-in-out infinite alternate}
.mja-fil{stroke:#c9c2e0;stroke-width:2.5;stroke-linecap:round}
.mja-fil.corde{stroke:#d9b48a;stroke-width:3.6;stroke-dasharray:5 2}
.mja-fil.corde.coupee{stroke-dasharray:none}
.mja-tige{fill:none;stroke:#5e3a1e;stroke-width:4;stroke-linecap:round}
.mja-butin{animation:b-flotte 1s ease-in-out infinite}
.mja-cible.touchee .mja-butin{opacity:0}
.mja-pt{fill:var(--cyan);filter:drop-shadow(0 0 3px var(--cyan))}
.mja-trainee{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.mja-jauge-arc{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:round;opacity:.75;transform:rotate(-90deg);filter:drop-shadow(0 0 4px var(--cyan))}
.mja-jauge-arc.tremble{stroke:#ffb38a;animation:b-lueur .25s infinite}
.mja-corde-arc.vibre{animation:mja-vibre .25s}
@keyframes mja-vibre{30%{transform:translateX(5px)}60%{transform:translateX(-3px)}}
.mja-feuille{fill:#d79a3c;stroke:var(--contour);stroke-width:1;opacity:.85}
.mja-manche{transform-box:fill-box;transform-origin:left center;animation:mja-manche .5s ease-in-out infinite alternate}
@keyframes mja-manche{to{transform:skewY(5deg)}}
.mja-ailes{transform-box:fill-box;transform-origin:center;animation:mja-ailes .22s ease-in-out infinite alternate}
@keyframes mja-ailes{to{transform:scaleY(-.6)}}
.mja-oiseau .mja-ailes{animation-duration:.12s}
.mja-carquois{font-weight:700;font-size:1rem;white-space:nowrap}
.mja-badge.large{width:auto;padding:0 12px;background:#2b2f55}
.mja-tir.ralenti{filter:hue-rotate(-30deg) saturate(1.3)}
.mja-tir.ralenti svg{animation:mja-ralenti 1s ease-in-out infinite alternate}
@keyframes mja-ralenti{to{filter:drop-shadow(0 0 12px rgba(143,243,255,.5))}}

/* ---------- Chaudron commun ---------- */
.mja-liquide{fill:#7cc4ff;transition:fill .4s}
.mja-liquide.brille{filter:drop-shadow(0 0 10px #fff)}
.mja-liquide.eclabousse{animation:mja-eclabousse .4s}
@keyframes mja-eclabousse{30%{transform:translateY(-6px)}}
.mja-liquide.vide{animation:mja-vide .4s}
@keyframes mja-vide{50%{opacity:.2}}
.mja-tourbillon{transform-box:fill-box;transform-origin:center}
.mja-tourbillon.remue{animation:mja-remue .7s ease-out}
@keyframes mja-remue{to{transform:rotate(360deg) scaleX(1)}}
.mja-bulle-ch{stroke:var(--contour);stroke-width:1.5;opacity:.9;animation:mja-bulle-monte 1.2s ease-out forwards}
@keyframes mja-bulle-monte{to{transform:translateY(-70px);opacity:0}}
.mja-feu .mja-flamme{transform-box:fill-box;transform-origin:bottom center;stroke:var(--contour);stroke-width:3;animation:mja-flamme .5s ease-in-out infinite alternate}
.mja-flamme.f1{fill:#e8693c}
.mja-flamme.f2{fill:#ffb03a;animation-delay:-.2s}
.mja-flamme.f3{fill:#e8693c;animation-delay:-.35s}
.mja-braises{fill:#a8391a;stroke:var(--contour);stroke-width:3}
@keyframes mja-flamme{to{transform:scaleY(.82) scaleX(1.06)}}
.mja-feu .mja-flamme{transition:transform .2s}
.mja-feu.fort .mja-flamme{animation:mja-flamme-fort .18s ease-in-out infinite alternate}
.mja-feu.emballe .mja-flamme{animation:mja-flamme-fort .1s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffb03a)}
.mja-souffle{transition:opacity .3s}
@keyframes mja-flamme-fort{from{transform:scaleY(1.45)}to{transform:scaleY(1.7) scaleX(1.1)}}
.mja-vapeur path{fill:none;stroke:#dfe6ff;stroke-width:6;stroke-linecap:round;opacity:.18;animation:mja-vapeur 3s ease-in-out infinite}
.mja-vapeur path:nth-child(2){animation-delay:-1.5s}
@keyframes mja-vapeur{0%{transform:translateY(10px);opacity:0}50%{opacity:.25}100%{transform:translateY(-30px);opacity:0}}

/* ---------- Rythme (la cuillère qui tourne) ---------- */
.mja-rythme{background:radial-gradient(circle at 50% 50%,#2a2350,#141832 70%)}
.mja-remous{animation:mja-tourne 9s linear infinite;transform-box:view-box;transform-origin:0 0}
.mja-liq-dessus{transition:fill .3s}
.mja-liq-dessus.flash{animation:mja-flash .35s ease-out}
@keyframes mja-flash{30%{fill:#fff4c8}}
.mja-liq-dessus.rouge{animation:mja-rougeL .45s ease-out}
@keyframes mja-rougeL{30%{fill:#ff6b6b}}
.mja-liq-dessus.brille{filter:drop-shadow(0 0 16px #fff)}
.mja-goutte-arc{fill:none;stroke:#ffd36a;stroke-width:24;stroke-linecap:round;opacity:.75;filter:drop-shadow(0 0 6px rgba(255,211,106,.8))}
.mja-goutte-r.poison .mja-goutte-arc{stroke:#7a3aa0;opacity:.7;filter:none}
.mja-goutte-r.maintenant .mja-goutte-arc{stroke:#fff4c8;opacity:1;filter:drop-shadow(0 0 12px #ffd36a)}
.mja-goutte-r.nait{animation:mja-nait .3s ease-out}
@keyframes mja-nait{from{opacity:0}}
.mja-cuillere{filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.mja-giclee{stroke:var(--contour);stroke-width:1.5;animation:mja-giclee .55s ease-out forwards}
@keyframes mja-giclee{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.mja-combo{fill:#ffe3a3;font-family:var(--f-titre);font-size:20px}

/* ---------- Bulles ---------- */
.mja-bulle{cursor:pointer}
.mja-bulle-in{transform-box:fill-box;transform-origin:center;transition:transform .12s;opacity:.55}
.mja-bulle .mja-halo{opacity:0;transition:opacity .12s}
.mja-bulle.allume .mja-bulle-in{transform:scale(1.15);opacity:1}
.mja-bulle.allume .mja-halo{opacity:.45}
.mja-bulles:not(.montre) .mja-bulle-in{opacity:.85}
.mja-bulle.indice .mja-halo{opacity:.25;animation:b-lueur 1s infinite}
.mja-bulle.faux .mja-bulle-in{animation:b-tremble .4s}
.mja-bulle-in{animation:mja-flotte-b 3s ease-in-out infinite}
.mja-bulle:nth-child(odd) .mja-bulle-in{animation-delay:-1.4s}
@keyframes mja-flotte-b{0%,100%{translate:0 0}50%{translate:0 -6px}}
.mja-bulle-demo{transition:transform .12s;opacity:.6}
.mja-bulle-demo.allume{opacity:1;filter:drop-shadow(0 0 8px #fff)}
.mja-etat{font-size:1.6rem;min-width:40px;text-align:center}
.mja-bulles.envers .mja-liquide{fill:#ff8fb3!important}
.mja-bulles.envers .mja-etat{color:#ff8fb3;animation:b-pulse .8s infinite}

/* ---------- Mélange ---------- */
.mja-melange > svg{max-height:60%}
.mja-pigments{display:flex;gap:14px;justify-content:center;padding:4px 10px}
.mja-pig{width:68px;height:68px;border-radius:50%;border:4px solid var(--contour);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--pc) 34%);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--pc) 34%,color-mix(in srgb,var(--pc) 70%,#000) 100%);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s;padding:0}
.mja-pig:active{transform:translateY(3px) scale(.95)}
.mja-pig:disabled{opacity:.35}
.mja-pig.indice{animation:b-pulse .8s infinite;box-shadow:0 0 0 4px var(--cyan),0 0 18px var(--cyan)}
.mja-goutte{animation:mja-goutte .38s ease-in forwards}
@keyframes mja-goutte{from{transform:translateY(0)}to{transform:translateY(118px)}}
.mja-recette{fill:var(--or-pale);font-size:14px;font-weight:700}
.mja-jauge-v{fill:#8a9ac6;transition:width .3s}
.mja-jauge-v.chaud{fill:#7cf0a8}
.mja-jauge-t{fill:var(--brume);font-size:13px;letter-spacing:.05em}
.mja-melange .mja-tourbillon.remue{animation:mja-remue .7s ease-out}

/* ---------- Température ---------- */
.mja-zone-v{fill:#4fbf6a;opacity:.85;transition:y .8s,opacity .3s}
.mja-rouge{fill:#e5484d;opacity:.6}
.mja-colonne{fill:#e8693c}
.mja-aiguille{fill:#eef0ff;stroke:var(--contour);stroke-width:3}
.mja-aiguille.lache{fill:#8ff3ff;animation:b-lueur .3s infinite}
.mja-cercle-v{transition:stroke-dasharray .1s}
.mja-cercle-t{fill:var(--lune);font-size:22px;font-weight:700;font-family:var(--f-texte)}
.mja-temperature[data-etat="chaud"] .mja-vapeur path{opacity:.6;stroke:#ffd0c0}
.mja-temperature[data-etat="bon"] .mja-cercle-v{filter:drop-shadow(0 0 6px #4fbf6a)}
.mja-chauffer{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mja-chauffer.presse{transform:translateY(3px);box-shadow:0 1px 0 var(--braise-sombre),0 0 24px rgba(232,105,60,.7)}

/* ---------- Loupe ---------- */
.mja-images{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;min-height:0}
.mja-images.cote{flex-direction:row}
.mja-image{flex:1;min-height:0;min-width:0;border-radius:14px;overflow:hidden;border:3px solid var(--contour);background:#262050;display:flex}
.mja-image svg{width:100%;height:100%;display:block}
.mja-rond{fill:none;stroke:var(--cyan);stroke-width:4;filter:drop-shadow(0 0 4px var(--cyan));animation:mja-rond .4s ease-out}
.mja-rond.manque{stroke:#ff8a6a;stroke-dasharray:6 5;filter:none}
@keyframes mja-rond{from{r:4;opacity:0}}
.mja-scintille{fill:#fff;opacity:.06;animation:mja-scint 1.6s ease-in-out infinite}
@keyframes mja-scint{0%,100%{opacity:.03}50%{opacity:.16}}
.mja-indice-rond{fill:none;stroke:#ffe3a3;stroke-width:5;stroke-dasharray:8 6;animation:b-lueur .5s infinite}
.mja-croix{fill:#ff8a6a;font-size:26px;font-weight:700;stroke:var(--contour);stroke-width:1.5}
.mja-nuit{fill:#07081a;opacity:.94;pointer-events:none;transition:opacity .4s}
.mja-loupe:not(.de-nuit) .mja-nuit,.mja-loupe:not(.de-nuit) .mja-lentille{opacity:0}
.mja-lentille{stroke:#8ff3ff;stroke-width:3;pointer-events:none;filter:drop-shadow(0 0 6px var(--cyan))}
.mja-loupe.de-nuit .mja-image{cursor:none}
.mja-obj.o-bougie path[fill="#ffb03a"]{transform-box:fill-box;transform-origin:bottom center;animation:mja-flamme .35s ease-in-out infinite alternate}
.mja-obj.o-cristal{animation:mja-cristal 2.4s ease-in-out infinite}
@keyframes mja-cristal{50%{filter:drop-shadow(0 0 5px rgba(143,243,255,.8))}}
.mja-etoile{animation:b-lueur 3s ease-in-out infinite}

/* ==========================================================
   Les bulles magiques, version 2 (préfixe .mjbu-)
   Même allure que les autres jeux de l'Alchimiste (cœurs, chaudron)
   et que l'atelier (briques, poutre, fenêtre de nuit, étagères).
   ========================================================== */
/* Bandeau : vies et manches */
.mjbu-hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;min-height:48px;background:rgba(0,0,0,.18);flex:none}
.mjbu-vies{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mjbu-coeur{width:26px;height:24px;display:inline-block}
.mjbu-coeur svg{width:100%;height:100%;display:block;fill:#ff5b6e;stroke:var(--contour);stroke-width:2;filter:drop-shadow(0 0 4px rgba(255,91,110,.45));transition:fill .3s}
.mjbu-coeur.perdu svg{fill:#3a3352;filter:none}
.mjbu-coeur.casse{animation:mjbu-casse .6s ease-out}
@keyframes mjbu-casse{0%{transform:scale(1.8) rotate(-14deg)}45%{transform:scale(.7) rotate(10deg)}100%{transform:none}}
.mjbu-manches{display:flex;gap:6px;align-items:center}
.mjbu-manche{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;line-height:1;color:var(--brume);background:#2b2f55;border:2px solid var(--trait);transition:background .4s,border-color .4s}
.mjbu-manche.ici{border-color:var(--or-pale);color:var(--or-pale);box-shadow:0 0 10px rgba(255,227,163,.5)}
.mjbu-manche.fait{background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 48%);border-color:var(--contour);color:var(--contour);animation:mjbu-gemme .5s ease-out}
.mjbu-manche.der.fait{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0 12%,rgba(255,255,255,0) 40%),conic-gradient(#ff5b6e,#ffa43a,#ffe14d,#5fdc7a,#4fb6ff,#9d7bff,#ff5b6e)}
@keyframes mjbu-gemme{0%{transform:scale(1.6)}100%{transform:scale(1)}}
@media (max-width:440px){
  .mjbu-hud{padding:8px 10px;gap:6px}
  .mjbu-coeur{width:22px;height:20px}
  .mjbu-manche{width:25px;height:25px;font-size:.8rem}
}

/* Terrain */
.mjbu-terrain{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#2b2148}
.mjbu-decor{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;will-change:transform}
.mjbu-decor-demo{pointer-events:none}
.mjbu-chaleur{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,170,90,.34),rgba(255,122,60,.12) 55%,rgba(255,122,60,0));animation:mjbu-chaleur 2.6s ease-in-out infinite alternate;will-change:opacity}
@keyframes mjbu-chaleur{0%{opacity:.75}35%{opacity:1}60%{opacity:.85}100%{opacity:.95}}
.mjbu-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mjbu-voile{fill:rgba(14,10,32,.58)}
.mjbu-arene{stroke:rgba(143,243,255,.28);stroke-width:2;stroke-dasharray:2 9;stroke-linecap:round}
.mjbu-etoile{fill:#fff;opacity:.15;animation:mjbu-scint 3s ease-in-out infinite}
@keyframes mjbu-scint{0%,100%{opacity:.08}50%{opacity:.35}}
.mjbu-etoile-f{animation:mjbu-scint 2.6s ease-in-out infinite}
.mjbu-bougie{transform-box:fill-box;transform-origin:50% 100%;animation:mjbu-flamme .45s ease-in-out infinite alternate}

/* Pastille d'état : 👀 regarde / 👆 à toi, et les points de la suite */
.mjbu-etat{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 14px;border-radius:999px;background:rgba(13,17,38,.78);border:2px solid var(--trait);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.mjbu-etat.attends{animation:b-pulse .4s ease-out}
.mjbu-etat-ic{font-size:1.35rem;line-height:1}
.mjbu-pas{display:flex;gap:5px;align-items:center}
.mjbu-pas i{width:14px;height:14px;border-radius:50%;background:#2b2f55;border:2px solid var(--trait);transition:background .2s,transform .2s}
.mjbu-pas i.fait{background:var(--c,#fff);border-color:var(--contour);box-shadow:0 0 7px var(--c,#fff);transform:scale(1.12)}

/* Bouton indice */
.mjbu-indice{position:absolute;right:12px;bottom:12px;z-index:3;width:76px;height:76px;padding:0;border-radius:50%;border:3px solid var(--contour);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--encre);font-weight:700;
  background:radial-gradient(circle at 40% 32%,#fff7cf,#ffd36a 45%,#c98a1c);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(255,211,106,.55);transition:transform .08s,opacity .2s}
.mjbu-indice:active{transform:translateY(3px)}
.mjbu-indice span{font-size:1.65rem;line-height:1}
.mjbu-indice small{font-size:.72rem;line-height:1.05}
.mjbu-indice b{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;padding:0 4px;border-radius:13px;background:#ff5b6e;color:#fff;border:2px solid var(--contour);font-size:.9rem;display:grid;place-items:center}
.mjbu-indice:disabled{opacity:.42;filter:grayscale(.7);box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:default}

/* Messages */
.mjbu-annonce{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;max-width:94%;text-align:center;font-family:var(--f-titre);font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.1;color:var(--or-pale);padding:4px 22px 6px;border-radius:999px;background:rgba(13,10,30,.72);border:2px solid rgba(255,227,163,.35);box-shadow:0 6px 20px rgba(0,0,0,.4);text-shadow:0 3px 0 var(--contour),0 0 18px rgba(245,185,69,.6);animation:mjbu-annonce 1.15s ease-out forwards;white-space:nowrap}
@keyframes mjbu-annonce{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.mjbu-flotte{position:absolute;z-index:5;transform:translate(-50%,-50%);font-size:1.6rem;pointer-events:none;animation:mjbu-monte 1s ease-out forwards}
@keyframes mjbu-monte{from{opacity:1;transform:translate(-50%,-50%) scale(.7)}25%{transform:translate(-50%,-80%) scale(1.2)}to{opacity:0;transform:translate(-50%,-180%) scale(1)}}

/* Bulles */
.mjbu-corps{transform-box:fill-box;transform-origin:center;transition:transform .15s ease-out}
.mjbu-ombre{fill:#120a24;opacity:0;transition:opacity .2s;pointer-events:none}
.mjbu-montre .mjbu-bulle:not(.allume) .mjbu-ombre{opacity:.5}
.mjbu-bulle.allume .mjbu-corps{transform:scale(1.17)}
.mjbu-halo{opacity:0;transition:opacity .15s}
.mjbu-bulle.allume .mjbu-halo{opacity:.55}
.mjbu-anneau{fill:none;stroke:transparent;stroke-width:4}
.mjbu-bulle.indice .mjbu-anneau{stroke:#ffe3a3;stroke-dasharray:10 7;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:mjbu-tourne 2.6s linear infinite}
.mjbu-bulle.indice .mjbu-halo{fill:#ffd36a;animation:mjbu-luit 1s ease-in-out infinite}
@keyframes mjbu-luit{0%,100%{opacity:.22}50%{opacity:.7}}
@keyframes mjbu-tourne{to{transform:rotate(360deg)}}
.mjbu-flash{fill:none;stroke:#fff;stroke-width:6;opacity:0;transform-box:fill-box;transform-origin:center}
.mjbu-bulle.tape .mjbu-flash{animation:mjbu-flash .42s ease-out}
.mjbu-bulle.faux .mjbu-flash{stroke:#ff5b6e;animation:mjbu-flash .5s ease-out}
.mjbu-bulle.donne .mjbu-flash{stroke:#ffe3a3;animation:mjbu-flash .5s ease-out}
@keyframes mjbu-flash{from{opacity:.95;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}
.mjbu-bulle.faux .mjbu-tr{animation:mjbu-tremble .42s ease-out}
@keyframes mjbu-tremble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mjbu-bulle.eclate .mjbu-corps{animation:mjbu-eclate .42s ease-out forwards}
@keyframes mjbu-eclate{0%{transform:scale(1);opacity:1}35%{transform:scale(1.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.mjbu-pop-rond{fill:none;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:mjbu-rond .55s ease-out forwards}
.mjbu-goutte{stroke:var(--contour);stroke-width:1.2;animation:mjbu-giclee .6s ease-out forwards}
@keyframes mjbu-giclee{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.mjbu-rond{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:mjbu-rond .6s ease-out forwards}
@keyframes mjbu-rond{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.8)}}
.mjbu-ingr{pointer-events:none}

/* Chaudron */
.mjbu-flamme{transform-box:fill-box;transform-origin:bottom center;stroke:var(--contour);stroke-width:3;animation:mjbu-flamme .5s ease-in-out infinite alternate}
.mjbu-flamme.f1{fill:#e8693c}
.mjbu-flamme.f2{fill:#ffb03a;animation-delay:-.2s}
.mjbu-flamme.f3{fill:#e8693c;animation-delay:-.35s}
@keyframes mjbu-flamme{to{transform:scaleY(.82) scaleX(1.06)}}
.mjbu-braises{fill:#a8391a;stroke:var(--contour);stroke-width:3}
.mjbu-vapeur path{fill:none;stroke:#e6ecff;stroke-width:7;stroke-linecap:round;opacity:0;animation:mjbu-vapeur 3.2s ease-in-out infinite}
.mjbu-vapeur path:nth-child(2){animation-delay:-1.6s}
@keyframes mjbu-vapeur{0%{transform:translateY(12px);opacity:0}45%{opacity:.32}100%{transform:translateY(-34px);opacity:0}}
.mjbu-pb{stroke:var(--contour);stroke-width:1.5;opacity:.9;animation:mjbu-pb 1.2s ease-out forwards}
@keyframes mjbu-pb{to{transform:translateY(-44px);opacity:0}}
.mjbu-etincelle{stroke:var(--contour);stroke-width:1;animation:mjbu-etin 1.3s ease-out forwards;opacity:0}
@keyframes mjbu-etin{0%{opacity:1}100%{opacity:0;translate:var(--dx) var(--dy)}}
.mjbu-fumee{fill:#7d7690;opacity:0;transform-box:fill-box;transform-origin:center;animation:mjbu-fumee 1.7s ease-out forwards}
@keyframes mjbu-fumee{0%{opacity:.75;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-70px) scale(1.6)}}
.mjbu-gagne .mjbu-vapeur path{stroke:#fff4d0}

/* Démo */
.mjbu-demo-svg{width:100%;height:100%;display:block}
.mjbu-main .mjbu-onde{fill:none;stroke:var(--cyan);stroke-width:3;opacity:0}
.mjbu-main.tape .mjbu-onde{animation:mjbu-onde .5s ease-out}
@keyframes mjbu-onde{from{opacity:1;r:6}to{opacity:0;r:26}}
.mjbu-main.tape > g{animation:mjbu-tape .3s ease-out}
@keyframes mjbu-tape{50%{transform:scale(.52) rotate(-12deg)}}

/* ==========================================================
   Mini-jeu « Le chaudron » (préfixe .mjc-)
   ========================================================== */
.mj-chaudron .mj-zone{background:radial-gradient(110% 80% at 50% 85%, #3a2346, #1c1735 70%)}
.mjc{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;-webkit-user-select:none;user-select:none}
.mjc button{font:inherit;color:inherit}
.mjc-haut{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 10px 2px}

/* La zone où la potion doit finir */
.mjc-cible{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:5px 12px;border-radius:14px;background:rgba(0,0,0,.32);border:3px solid var(--c);
  font-weight:700;font-size:.95rem;text-align:center;line-height:1.15;box-shadow:0 0 14px -4px var(--c)}
.mjc-cible-ic{font-size:1.3rem}
.mjc-cible-nom{color:var(--c);font-size:1.2rem;letter-spacing:.04em;text-shadow:0 2px 0 #24182e}
.mjc-cible-nom.ae{background:linear-gradient(90deg,#ff5a5a,#ffb347,#fff35c,#5df08a,#5ab8ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.mjc-pastille{width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid #24182e;flex:none}
.mjc-pastille.ae{background:conic-gradient(#ff5a5a,#ffb347,#fff35c,#5df08a,#5ab8ff,#c77dff,#ff5a5a)}

/* La frise qui défile (sans chiffres) */
.mjc-frise{position:relative;height:60px;border-radius:14px;border:3px solid #24182e;overflow:hidden;--tete:50px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 40px), linear-gradient(#4a3424,#2a1d14);box-shadow:inset 0 5px 12px rgba(0,0,0,.5)}
.mjc-piste{position:absolute;inset:0}
.mjc-fen{position:absolute;left:0;top:10px;height:34px;border-radius:12px;border:3px solid var(--c);box-shadow:0 0 0 2px #24182e;will-change:transform;display:flex;align-items:center;transition:opacity .35s}
.mjc-fen::before{content:'';position:absolute;inset:0;border-radius:9px;background:var(--c);opacity:.42}
.mjc-fen span{position:relative;display:grid;place-items:center;width:34px;height:28px;margin-left:2px;font-size:1.45rem;line-height:1;transition:transform .35s}
.mjc-fen.maintenant{box-shadow:0 0 0 2px #24182e, 0 0 18px var(--c), 0 0 4px #fff inset}
.mjc-fen.maintenant span{animation:mjc-saute .45s ease-in-out infinite alternate}
.mjc-fen.fait{opacity:0}
.mjc-fen.fait span{transform:scale(2)}
.mjc-fen-fin{border-color:#ffd36a;border-style:dashed}
.mjc-fen-fin::before{opacity:.55}
.mjc-fen-fin.ae::before{background:linear-gradient(90deg,#ff5a5a,#ffb347,#fff35c,#5df08a,#5ab8ff,#c77dff)}
.mjc-fen-fin.dedans{box-shadow:0 0 0 2px #24182e, 0 0 22px #ffd36a}
.mjc-tenue{position:absolute;left:4px;right:4px;bottom:3px;height:7px;border-radius:4px;background:#fff6d8;box-shadow:0 0 8px #fff;transform-origin:left center;transform:scaleX(0)}
.mjc-passe{position:absolute;left:0;top:0;bottom:0;width:var(--tete);background:linear-gradient(90deg, rgba(18,10,6,.9), rgba(18,10,6,.55));z-index:2;pointer-events:none}
.mjc-tete{position:absolute;left:var(--tete);top:0;bottom:0;width:4px;margin-left:-2px;background:#ffd36a;box-shadow:0 0 12px #ffd36a;z-index:3;pointer-events:none}
.mjc-tete span{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:1.1rem;filter:drop-shadow(0 2px 0 #24182e)}

/* Les caisses d'ingrédients et les vies */
.mjc-ligne{display:flex;align-items:center;justify-content:center;gap:14px}
.mjc-boites{display:flex;gap:10px;flex-wrap:wrap}
.mjc-boite{position:relative;width:66px;height:58px;padding:0;border-radius:12px;border:3px solid #24182e;touch-action:none;cursor:pointer;
  background:repeating-linear-gradient(0deg, transparent 0 16px, rgba(60,30,10,.35) 16px 18px), linear-gradient(90deg,#dca066,#a8693a);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.3), 0 4px 0 #5e3416, 0 6px 12px rgba(0,0,0,.35);display:grid;place-items:center}
.mjc-boite::before{content:'';position:absolute;left:7px;right:7px;top:6px;height:14px;border-radius:6px;background:var(--c);opacity:.65;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.mjc-boite span{position:relative;font-size:1.9rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mjc-boite b{position:absolute;right:-8px;bottom:-8px;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:#fff6d8;color:#35281b;border:2px solid #24182e;font-size:.8rem;display:grid;place-items:center}
.mjc-boite.appui{animation:mjc-appui .25s ease-out}
.mjc-boite.due{box-shadow:0 0 0 4px #ffd36a, 0 0 20px #ffd36a, 0 4px 0 #5e3416;animation:mjc-saute .4s ease-in-out infinite alternate}
.mjc-boite.vide{filter:grayscale(.8);opacity:.5}
.mjc-vies{display:flex;gap:2px;flex:none;margin-left:auto}
.mjc-boites{margin-left:auto}
.mjc-coeur{width:24px;height:22px;display:inline-block}
.mjc-coeur svg{width:100%;height:100%;display:block;fill:#ff5b6e;stroke:#24182e;stroke-width:2}
.mjc-coeur.perdu svg{fill:#3a3352}
.mjc-coeur.casse{animation:mjc-casse .5s ease-out}

/* La scène */
.mjc-scene{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}
.mjc-svg{flex:0 1 auto;min-width:0;height:100%;width:auto;aspect-ratio:400/380;max-width:calc(100% - 60px);display:block;touch-action:none;overflow:visible;cursor:grab}
.mjc-touille .mjc-svg{cursor:grabbing}
.mjc-liq{fill:#3fcf6a;stroke:rgba(255,255,255,.28);stroke-width:2}
.mjc-ae{opacity:0;transition:opacity .25s}
.mjc-z-arc-en-ciel .mjc-ae{opacity:.62;animation:b-lueur 1s ease-in-out infinite}
.mjc-bl{fill:rgba(255,255,255,.5);stroke:rgba(36,24,46,.55);stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0}
.mjc-z-bleu .mjc-bl:nth-child(4n){animation:mjc-bl-s 2.6s ease-out infinite}
.mjc-z-vert .mjc-bl:nth-child(3n),.mjc-z-arc-en-ciel .mjc-bl:nth-child(3n){animation:mjc-bl-m 1.9s ease-out infinite}
.mjc-z-jaune .mjc-bl:nth-child(2n){animation:mjc-bl-m 1.4s ease-out infinite}
.mjc-z-rouge .mjc-bl{animation:mjc-bl-l 1.2s ease-out infinite}
.mjc-z-bouillant .mjc-bl{animation:mjc-bl-l .7s ease-out infinite;fill:rgba(255,230,200,.7)}
.mjc-z-bouillant .mjc-liq{animation:mjc-frisson .18s linear infinite alternate}
.mjc-givre{opacity:0;pointer-events:none}
.mjc-givre text{fill:#eaf7ff;stroke:#24182e;stroke-width:1}
.mjc-vapeur{opacity:0;pointer-events:none}
.mjc-vapeur path{fill:none;stroke:rgba(238,240,255,.45);stroke-width:9;stroke-linecap:round;animation:mjc-vap 2.6s ease-in-out infinite}
.mjc-vapeur path:nth-child(2){animation-delay:-.9s}
.mjc-vapeur path:nth-child(3){animation-delay:-1.7s}
.mjc-louche-in,.mjc-louche-out,.mjc-givre,.mjc-bulles,.mjc-tour,.mjc-lueur-feu,.mjc-flammes{pointer-events:none}
.mjc-flammes{transform-origin:200px 336px;transition:transform .35s ease-out}
.mjc-lueur-feu{transition:opacity .35s}
.mjc-fl{stroke:#24182e;stroke-width:3;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 100%;animation:mjc-flamme .45s ease-in-out infinite alternate}
.mjc-fl.f0{fill:#ff8a3c}
.mjc-fl.f1{fill:#ffd36a}
.mjc-fl.f2{fill:#ff5a2c}
.mjc-buche,.mjc-tas{cursor:pointer}
.mjc-buche.brule .mjc-ember{animation:b-lueur .7s ease-in-out infinite}
.mjc-plus{transform-box:fill-box;transform-origin:center}
.mjc-indice-bois .mjc-plus{animation:mjc-gonfle .45s ease-in-out infinite alternate}
.mjc-moins{display:none}
.mjc-indice-retire .mjc-buche.brule .mjc-moins{display:inline;animation:b-lueur .5s ease-in-out infinite}
.mjc-indice-retire .mjc-buche > rect:first-child{stroke:#ff3a3a;stroke-width:5}
.mjc[data-buches="6"] .mjc-lueur-feu{animation:b-lueur .4s ease-in-out infinite}
.mjc-fleche{opacity:.55;transform-box:fill-box;transform-origin:center;transition:opacity .2s}
.mjc-fl-ic{opacity:.7;pointer-events:none}
.mjc-indice-chauffe .mjc-chauffe,.mjc-indice-refroidit .mjc-refroidit,.mjc-demo-chauffe .mjc-chauffe,.mjc-demo-refroidit .mjc-refroidit{opacity:1;animation:mjc-gonfle .4s ease-in-out infinite alternate}

/* La jauge des couleurs */
.mjc-jauge{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px 10px 0}
.mjc-j-ic{font-size:1.15rem;line-height:1}
.mjc-j-tube{position:relative;flex:1;width:26px;border-radius:14px;border:3px solid #24182e;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2), 0 0 10px rgba(0,0,0,.4)}
.mjc-j-ae{position:absolute;left:0;right:0;background:linear-gradient(90deg,#ff5a5a,#ffb347,#fff35c,#5df08a,#5ab8ff,#c77dff);border-top:2px solid #fff;border-bottom:2px solid #fff}
.mjc-j-cible{position:absolute;left:-9px;right:-9px;border:3px solid #ffd36a;border-radius:9px;box-shadow:0 0 12px #ffd36a;animation:b-lueur 1.4s ease-in-out infinite}
.mjc-j-cible::after{content:'🎯';position:absolute;left:-20px;top:50%;transform:translateY(-50%);font-size:.85rem}
.mjc-j-curseur{position:absolute;left:-12px;right:-12px;bottom:50%;height:0;z-index:2}
.mjc-j-curseur::before{content:'';position:absolute;left:0;right:0;top:-4px;height:8px;border-radius:4px;background:#fff;border:2px solid #24182e;box-shadow:0 0 8px #fff}
.mjc-j-curseur b{display:none;position:absolute;right:-6px;top:-11px;transform:translateX(100%);padding:0 5px;border-radius:8px;background:#fff6d8;color:#35281b;font-size:.75rem;border:2px solid #24182e}
.mjc-revele .mjc-j-curseur b{display:block}
.mjc-revele .mjc-jauge{width:84px}

/* Petits effets */
.mjc-bulle{position:absolute;left:50%;top:4%;z-index:4;transform:translateX(-50%);padding:5px 12px;border-radius:14px;background:#fff6e6;color:#35281b;border:3px solid #24182e;font-weight:700;white-space:nowrap;pointer-events:none;animation:mjc-bulle .3s ease-out;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.mjc-bulle b{font-size:1.15rem}
.mjc-bulle.ko{background:#ffe0d6}
.mjc-bulle.ae{background:linear-gradient(90deg,#ffd0d0,#fff3b0,#c8f7d4,#cfe6ff,#ecd6ff)}
.mjc-tombe{position:absolute;z-index:4;font-size:2.1rem;pointer-events:none;transform:translate(-50%,-50%)}
.mjc-plouf{position:absolute;width:0;height:0;z-index:4;pointer-events:none}
.mjc-plouf i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#e8f6ff;border:2px solid #24182e;animation:mjc-plouf .6s ease-out forwards}
.mjc-plouf i:nth-child(1){--dx:-34px;--dy:-30px}
.mjc-plouf i:nth-child(2){--dx:-14px;--dy:-44px}
.mjc-plouf i:nth-child(3){--dx:6px;--dy:-48px}
.mjc-plouf i:nth-child(4){--dx:24px;--dy:-38px}
.mjc-plouf i:nth-child(5){--dx:38px;--dy:-22px}
.mjc-main{position:absolute;left:0;top:0;font-size:2.2rem;pointer-events:none;margin:-8px 0 0 -10px;z-index:3;filter:drop-shadow(0 3px 0 #24182e)}

/* Les fins */
.mjc-fin{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.mjc-fin-txt{position:relative;z-index:3;padding:0 12px;text-align:center;font-family:var(--f-titre);font-weight:400;font-size:clamp(1.7rem,7vw,2.6rem);color:#ffe3a3;text-shadow:0 3px 0 #24182e, 0 0 18px rgba(0,0,0,.8);animation:mjc-txt .7s ease-out}
.mjc-fin.gel .mjc-fin-txt{color:#dff4ff}
.mjc-fin.eteint .mjc-fin-txt,.mjc-fin.rate .mjc-fin-txt{color:#c9c6d6}
.mjc-eclair{position:absolute;left:50%;top:45%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side, #fff 0, #ffe08a 25%, #ff7a3c 50%, rgba(255,90,40,0) 75%);animation:mjc-eclair .9s ease-out forwards}
.mjc-debris{position:absolute;left:50%;top:45%}
.mjc-debris i{position:absolute;width:14px;height:10px;border-radius:3px;background:#5e3418;border:2px solid #24182e;animation:mjc-debris 1s ease-out forwards}
.mjc-debris i:nth-child(1){--a:0deg}.mjc-debris i:nth-child(2){--a:40deg;background:#f04a35}.mjc-debris i:nth-child(3){--a:80deg}.mjc-debris i:nth-child(4){--a:120deg;background:#ffd23f}
.mjc-debris i:nth-child(5){--a:160deg}.mjc-debris i:nth-child(6){--a:200deg;background:#f04a35}.mjc-debris i:nth-child(7){--a:240deg}.mjc-debris i:nth-child(8){--a:290deg;background:#ffd23f}.mjc-debris i:nth-child(9){--a:330deg}
.mjc-fumee{position:absolute;left:50%;top:40%;width:46%;aspect-ratio:1;margin-left:-23%;border-radius:50%;background:radial-gradient(closest-side, #5a4e66, rgba(60,52,72,.6) 60%, rgba(60,52,72,0));animation:mjc-fumee 1.8s ease-out forwards}
.mjc-fumee.f2{margin-left:-10%;animation-delay:.25s}
.mjc-fumee.grise{background:radial-gradient(closest-side, #b9b6c6, rgba(160,156,176,.6) 60%, rgba(160,156,176,0))}
.mjc-fin-boum .mjc-svg{animation:mjc-tremble .5s ease-out}
.mjc-fin-boum .mjc-liq{fill:#2a1208!important}
.mjc-glace{position:absolute;left:12%;right:22%;top:28%;height:30%;border-radius:50%;background:radial-gradient(closest-side, rgba(230,248,255,.95), rgba(160,215,255,.7) 70%, rgba(160,215,255,0));animation:mjc-glace 1s ease-out forwards}
.mjc-cristaux{position:absolute;top:30%;font-size:2.2rem;letter-spacing:.4em;animation:mjc-txt .8s ease-out}
.mjc-fin-gel .mjc-liq{fill:#cfeaff!important}
.mjc-fin-gel .mjc-givre{opacity:1!important}
.mjc-fin-eteint .mjc-flammes,.mjc-fin-eteint .mjc-lueur-feu{opacity:0!important;transition:opacity .8s}
.mjc-fin-eteint .mjc-liq{fill:#4a4458!important}
.mjc-fin-rate .mjc-liq{fill:#8d8a99!important}
.mjc-halo-ok{position:absolute;left:50%;top:30%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side, var(--c), rgba(0,0,0,0));opacity:.55;animation:mjc-halo 1.6s ease-out forwards}
.mjc-halo-ok::after{content:'';position:absolute;inset:8%;border-radius:50%;background:repeating-conic-gradient(from 0deg, rgba(255,246,216,.5) 0deg 8deg, transparent 8deg 30deg);-webkit-mask:radial-gradient(closest-side,#000 25%,transparent);mask:radial-gradient(closest-side,#000 25%,transparent);animation:mjc-tourne 10s linear infinite}
.mjc-fiole{position:absolute;left:50%;top:8%;width:min(28%,130px);aspect-ratio:80/110;transform:translateX(-50%);animation:mjc-fiole-monte .7s cubic-bezier(.3,1.4,.5,1)}
.mjc-fiole svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 16px var(--c))}
.mjc-fiole-niv{transform:translateY(100px);animation:mjc-remplit 1.4s .35s ease-out forwards}
.mjc-etoiles{position:absolute;left:50%;top:24%}
.mjc-etoiles i{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff6d8;box-shadow:0 0 12px var(--c), 0 0 4px #fff;animation:mjc-eclat 1.1s 1.1s ease-out forwards;opacity:0}
.mjc-etoiles i:nth-child(1){--a:0deg}.mjc-etoiles i:nth-child(2){--a:30deg}.mjc-etoiles i:nth-child(3){--a:60deg}.mjc-etoiles i:nth-child(4){--a:90deg}
.mjc-etoiles i:nth-child(5){--a:120deg}.mjc-etoiles i:nth-child(6){--a:150deg}.mjc-etoiles i:nth-child(7){--a:180deg}.mjc-etoiles i:nth-child(8){--a:210deg}
.mjc-etoiles i:nth-child(9){--a:240deg}.mjc-etoiles i:nth-child(10){--a:270deg}.mjc-etoiles i:nth-child(11){--a:300deg}.mjc-etoiles i:nth-child(12){--a:330deg}
.mjc-fin.ok .mjc-fin-txt{align-self:end;margin-bottom:9%}

/* Démo */
.mjc-demo{position:absolute;inset:0}
.mjc-demo .mjc-svg{max-width:calc(100% - 50px)}
.mjc-demo .mjc-jauge{padding:4px 6px 4px 0}
.mj-chaudron .mj-demo{height:200px}

@media (max-width:420px){
  .mjc-haut{padding:6px 6px 0;gap:5px}
  .mjc-cible{font-size:.85rem;padding:4px 8px}
  .mjc-frise{height:54px}
  .mjc-fen{top:8px;height:32px}
  .mjc-boite{width:56px;height:50px}
  .mjc-boite span{font-size:1.6rem}
  .mjc-jauge{width:46px;padding-right:6px}
  .mjc-coeur{width:20px;height:18px}
}
@media (max-height:600px){
  .mjc-cible > span:nth-child(2){display:none}
  .mjc-frise{height:48px}
  .mjc-fen{top:6px;height:30px}
  .mjc-boite{height:46px}
}

@keyframes mjc-saute{from{transform:translateY(0)}to{transform:translateY(-3px) scale(1.06)}}
@keyframes mjc-appui{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes mjc-casse{0%{transform:scale(1.6) rotate(-14deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:none}}
@keyframes mjc-bl-s{0%{transform:scale(0);opacity:0}30%{opacity:1}80%{transform:scale(.45);opacity:1}100%{transform:scale(.6);opacity:0}}
@keyframes mjc-bl-m{0%{transform:scale(0);opacity:0}30%{opacity:1}80%{transform:scale(.85);opacity:1}100%{transform:scale(1.05);opacity:0}}
@keyframes mjc-bl-l{0%{transform:scale(0);opacity:0}30%{opacity:1}80%{transform:scale(1.5);opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes mjc-frisson{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes mjc-vap{0%{transform:translateY(12px);opacity:0}40%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes mjc-flamme{from{transform:scale(1,1)}to{transform:scale(.86,1.16)}}
@keyframes mjc-gonfle{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes mjc-bulle{from{opacity:0;transform:translate(-50%,8px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes mjc-plouf{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes mjc-txt{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes mjc-eclair{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
@keyframes mjc-debris{from{transform:rotate(var(--a)) translateX(0) rotate(0);opacity:1}to{transform:rotate(var(--a)) translateX(170px) rotate(300deg);opacity:0}}
@keyframes mjc-fumee{0%{opacity:0;transform:translateY(20px) scale(.4)}30%{opacity:.95}100%{opacity:.85;transform:translateY(-60px) scale(1.4)}}
@keyframes mjc-tremble{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes mjc-glace{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes mjc-fiole-monte{from{opacity:0;transform:translate(-50%,90%) scale(.3)}to{opacity:1;transform:translateX(-50%)}}
@keyframes mjc-halo{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:.6;transform:translate(-50%,-50%) scale(1)}}
@keyframes mjc-tourne{to{transform:rotate(360deg)}}
@keyframes mjc-remplit{to{transform:translateY(18px)}}
@keyframes mjc-eclat{0%{transform:rotate(var(--a)) translateX(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateX(130px) scale(.2);opacity:0}}

/* ==========================================================
   Brumeval v2 — mini-jeux du Barde et du Sage (préfixe .mjb-)
   ========================================================== */
.mjb-jeu{position:relative;flex:1;display:flex;flex-direction:column;gap:12px;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.mjb-barde-fond{background:radial-gradient(120% 70% at 50% 0%, #5a2f4f 0%, #2c1d3f 48%, var(--nuit) 100%)}
.mjb-sage-fond{background:radial-gradient(120% 80% at 50% 0%, #26407a 0%, #1a2550 50%, var(--nuit) 100%)}
.mjb-jeu h3{font-family:var(--f-titre);font-weight:400;color:var(--or-pale);font-size:1.25rem;text-align:center}

/* --- Éléments communs --- */
.mjb-lire{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid rgba(53,40,27,.25);background:rgba(255,255,255,.65);font-size:1.1rem;display:grid;place-items:center;padding:0;color:var(--encre)}
.mjb-lire:active{transform:scale(.92)}
.mjb-ligne-etat{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:28px}
.mjb-consigne-mini{font-size:.95rem;color:var(--or-pale);font-weight:700}
.mjb-jauge{display:flex;align-items:center;gap:5px;margin-left:auto}
.mjb-jauge-ic{font-size:1rem;margin-right:2px}
.mjb-jauge i{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fff3c4, var(--or) 60%, #c2861d);border:2px solid var(--contour);transition:transform .25s, background .25s}
.mjb-jauge i.off{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.25);transform:scale(.75)}
.mjb-jauge.choc{animation:b-tremble .4s}
.mjb-jauge-txt{font-size:.82rem;color:var(--braise);font-weight:700}
.mjb-pastilles{display:flex;gap:7px;flex-wrap:wrap}
.mjb-pastilles i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);transition:all .25s}
.mjb-pastilles i.cur{background:var(--or);border-color:var(--or-pale);box-shadow:0 0 10px var(--or)}
.mjb-pastilles i.ok{background:#5fcf86;border-color:#bff0cc}
.mjb-pastilles i.trouve{background:var(--c-barde);border-color:#fff;box-shadow:0 0 12px var(--c-barde);transform:scale(1.25)}
.mjb-pastilles i.rate{background:var(--braise);border-color:#ffc0a8}
.mjb-pastilles i.note{background:var(--brume);border-color:#fff}
.mjb-gros{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;padding:8px 16px;border:3px solid var(--contour);border-radius:22px;font-size:1.35rem;font-weight:700;color:#fff;
  background:linear-gradient(180deg,#ffa9c6,#e2557f);box-shadow:0 6px 0 #8f2c4f, 0 12px 22px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s, box-shadow .08s;flex:none}
.mjb-gros:active{transform:translateY(4px);box-shadow:0 2px 0 #8f2c4f, 0 6px 12px rgba(0,0,0,.35)}
.mjb-gros:disabled{opacity:.55}
.mjb-sage-fond .mjb-gros{background:linear-gradient(180deg,#ffe2a0,#e9a93a);color:var(--encre);text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 6px 0 #9c6a17, 0 12px 22px rgba(0,0,0,.35)}
.mjb-sage-fond .mjb-gros:active{box-shadow:0 2px 0 #9c6a17}
.mjb-secoue{animation:b-tremble .4s}
.mjb-emoji{line-height:1;display:block;font-size:6.2rem;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}

/* --- Bulle de parole --- */
.mjb-bulle-parole{position:relative;background:linear-gradient(180deg,#fffaf0,#f3e7cb);color:var(--encre);border:3px solid var(--contour);border-radius:22px;padding:14px 16px 12px;
  box-shadow:0 6px 0 rgba(36,24,46,.6), 0 12px 24px rgba(0,0,0,.35);min-height:86px;font-size:1.18rem;font-weight:700;line-height:1.3;transition:border-color .2s, box-shadow .2s}
.mjb-bulle-parole::before{content:"";position:absolute;left:50%;top:-15px;width:24px;height:24px;margin-left:-12px;background:#fffaf0;border-left:3px solid var(--contour);border-top:3px solid var(--contour);transform:rotate(45deg);border-radius:4px 0 0 0}
.mjb-bulle-parole.montre{animation:mjb-bulle .38s cubic-bezier(.3,1.5,.6,1)}
.mjb-bulle-parole.vert{border-color:#2f9e5a;box-shadow:0 0 0 5px rgba(95,207,134,.5), 0 12px 24px rgba(0,0,0,.35)}
.mjb-bulle-parole.rouge{border-color:var(--braise-sombre);box-shadow:0 0 0 5px rgba(232,105,60,.5), 0 12px 24px rgba(0,0,0,.35)}
.mjb-barre{height:7px;border-radius:4px;background:rgba(53,40,27,.14);margin-top:10px;overflow:hidden}
.mjb-barre i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c-barde),var(--or));border-radius:4px}
@keyframes mjb-bulle{from{transform:scale(.7) translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* --- Portrait (ragots) --- */
.mjb-salle{display:flex;flex-direction:column;gap:20px;align-items:stretch}
.mjb-portrait{position:relative;width:min(48vw, 210px);aspect-ratio:1;margin:0 auto;border-radius:50%;flex:none;overflow:hidden;
  background:radial-gradient(circle at 50% 38%, #7b4a72, #2f1c37 72%);border:4px solid var(--contour);box-shadow:0 0 0 3px rgba(255,143,179,.38), 0 10px 26px rgba(0,0,0,.45);transition:box-shadow .3s}
.mjb-portrait.petit{width:min(30vw, 128px)}
.mjb-portrait.petit .mjb-emoji{font-size:3.9rem}

/* --- Repérer le mensonge : seul le visage bouge (aucun mouvement de cadre) --- */
.mjb-mensonge{gap:10px}
.mjb-m-haut{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;flex:none}
.mjb-m-puces{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.mjb-m-puce{position:relative;width:48px;height:48px;border-radius:14px;border:3px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:var(--lune);font-weight:800;font-size:1.05rem;padding:0;display:grid;place-items:center;transition:background .2s, border-color .2s, opacity .2s}
.mjb-m-puce span{position:absolute;right:-9px;top:-10px;font-size:1.1rem;opacity:0;transition:opacity .15s}
.mjb-m-puce.futur{opacity:.35}
.mjb-m-puce.cur{border-color:var(--or);background:rgba(245,185,69,.22);box-shadow:0 0 12px rgba(245,185,69,.55)}
.mjb-m-puce.dite{border-color:rgba(255,227,163,.55)}
.mjb-m-puce.marque{background:linear-gradient(180deg,#ffa9c6,#e2557f);border-color:var(--contour);color:#fff}
.mjb-m-puce.marque span{opacity:1}
.mjb-m-scene{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.mjb-m-visage{position:relative;width:min(88vw, 44vh, 640px);aspect-ratio:1;flex:none;border-radius:30px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%, #7b4a72, #2f1c37 72%);border:4px solid var(--contour);
  box-shadow:0 0 0 3px rgba(255,143,179,.35), 0 0 26px rgba(143,243,255,.16), 0 12px 30px rgba(0,0,0,.5)}
.mjb-m-visage > svg{width:100%;height:100%;display:block}
.mjb-m-bulle{width:100%;max-width:600px;padding-right:60px;min-height:92px}
.mjb-m-bulle .mjb-texte{min-height:2.6em}
.mjb-m-lire{position:absolute;right:9px;top:9px}
.mjb-m-actions{display:flex;flex:none;width:100%;max-width:600px;align-self:center;margin-top:auto}
.mjb-m-actions .mjb-accuse{flex:1;max-width:none;align-self:auto}
.mjb-accuse:disabled{opacity:.42;filter:saturate(.6)}
.mjb-accuse .on,.mjb-accuse[aria-pressed="true"] .off{display:none}
.mjb-accuse[aria-pressed="true"] .on{display:inline}
.mjb-accuse[aria-pressed="true"]{background:linear-gradient(180deg,#ffd6e3,#c9446c);box-shadow:0 2px 0 #8f2c4f, inset 0 0 0 3px rgba(255,255,255,.55)}
/* fin des phrases : la liste à valider */
.mjb-m-verdict{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:680px;align-self:center}
.mjb-m-verdict h3{flex:none}
.mjb-m-liste{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;flex:0 1 auto}
.mjb-m-liste li{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:7px 8px;border-radius:16px;background:linear-gradient(180deg,#fffaf0,#efdfba);color:var(--encre);border:3px solid var(--contour)}
.mjb-m-liste li.marque{background:linear-gradient(180deg,#ffe3ec,#ffbcd0)}
.mjb-m-liste li.rejoue{outline:3px solid var(--cyan);outline-offset:1px}
.mjb-m-num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c-barde);color:var(--contour);font-weight:800}
.mjb-m-liste p{flex:1 1 180px;font-weight:700;font-size:.98rem;line-height:1.22}
.mjb-m-liste .mjb-lire{width:44px;height:44px;margin-left:auto}
.mjb-m-revoir{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #1b86a8;background:linear-gradient(180deg,#d9fcff,var(--cyan-2));font-size:1.2rem;padding:0;display:grid;place-items:center}
.mjb-m-verdict.rejoue .mjb-m-revoir,.mjb-m-verdict.sans-revoir .mjb-m-revoir{opacity:.3;pointer-events:none}
.mjb-m-flair{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #8a6a3a;background:linear-gradient(180deg,#fff3c4,var(--or));font-size:1.2rem;padding:0;display:grid;place-items:center}
.mjb-m-flair:disabled,.mjb-m-verdict.sans-flair .mjb-m-flair,.mjb-m-verdict.rejoue .mjb-m-flair{opacity:.3;pointer-events:none}
.mjb-m-flair-txt{flex:1 1 100%;font-size:.9rem;font-weight:700;color:var(--encre-2);padding-left:38px}
.mjb-m-verdict.rejoue .mjb-m-valider,.mjb-m-verdict.rejoue .mjb-m-choix{opacity:.45;pointer-events:none}
.mjb-m-choix{flex:none;min-width:118px;min-height:48px;border-radius:14px;border:3px solid var(--contour);background:#fff;color:var(--encre-2);font-weight:800;font-size:.95rem;padding:4px 10px}
.mjb-m-choix .on,.mjb-m-choix[aria-pressed="true"] .off{display:none}
.mjb-m-choix[aria-pressed="true"] .on{display:inline}
.mjb-m-choix[aria-pressed="true"]{background:linear-gradient(180deg,#ffa9c6,#e2557f);color:#fff}
.mjb-m-reste{text-align:center;font-size:.9rem;color:var(--brume);flex:none}
/* à la fin : la liste prend la place ; « Revoir » remontre le visage avec la seule phrase rejouée */
.mjb-mensonge.verdict .mjb-m-scene{display:none}
.mjb-mensonge.verdict.rejoue .mjb-m-scene{display:flex;flex:0 0 auto}
.mjb-mensonge.verdict.rejoue .mjb-m-liste li:not(.rejoue),.mjb-mensonge.verdict.rejoue .mjb-m-valider,.mjb-mensonge.verdict.rejoue .mjb-m-reste,.mjb-mensonge.verdict.rejoue .mjb-m-verdict h3{display:none}
.mjb-m-valider{align-self:center;flex:none}
/* repli sans portrait : un emoji */
.mjb-m-emoji{display:grid;place-items:center;width:100%;height:100%;font-size:8rem;transition:transform .25s, filter .6s}
.mjb-m-emoji.regard{transform:translateX(4%)}
.mjb-m-emoji.penche{transform:rotate(7deg)}
.mjb-m-emoji.rouge{filter:drop-shadow(0 -8px 8px rgba(255,90,120,.45))}
.mjb-m-emoji.sueur{filter:drop-shadow(6px -6px 0 rgba(255,236,214,.5))}
/* écran d'aide « Les signes du menteur » */
.mjb-m-aide{position:absolute;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:12px;background:rgba(13,17,38,.92);animation:mjb-m-fondu .25s}
@keyframes mjb-m-fondu{from{opacity:0}to{opacity:1}}
.mjb-m-aide-boite{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-3);background:radial-gradient(120% 70% at 50% 0%, #5a2f4f 0%, #2c1d3f 55%, var(--nuit) 100%);border:2px solid rgba(255,143,179,.45)}
.mjb-m-aide-boite h3{font-family:var(--f-titre);font-weight:400;color:var(--or-pale);font-size:1.45rem;text-align:center}
.mjb-m-aide-boite h4{margin:4px 0 0;font-size:1.02rem;color:#9ff0bd;text-align:center}
.mjb-m-aide-sous{text-align:center;color:var(--brume);font-size:.98rem}
.mjb-m-cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mjb-m-carte{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 10px;border-radius:18px;background:rgba(255,255,255,.07);border:2px solid rgba(255,143,179,.5);text-align:center}
.mjb-m-carte.vrai{border-color:rgba(95,207,134,.55)}
.mjb-m-carte p{font-size:.86rem;font-weight:700;line-height:1.2}
.mjb-m-mini{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:3px solid var(--contour)}
.mjb-m-mini svg{width:100%;height:100%;display:block}
.mjb-m-carte-lire{width:44px;height:44px;margin-top:auto}
.mjb-m-aide-ok{align-self:center}
