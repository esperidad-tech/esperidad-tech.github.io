@media (max-width:420px){ .mjb-m-carte p{font-size:.78rem} }

/* --- Conversation dans l'ordre --- */
.mjb-frise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mjb-slot{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:14px;border:2px dashed rgba(255,255,255,.22);background:rgba(0,0,0,.22);transition:border-color .25s, background .25s}
.mjb-slot .mjb-num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:800;color:var(--lune)}
.mjb-slot p{font-size:.96rem;line-height:1.25;font-weight:700}
.mjb-slot.cur{border-color:var(--or);background:rgba(245,185,69,.1);animation:mjb-respire 1.6s ease-in-out infinite}
.mjb-slot.cur .mjb-num{background:var(--or);color:var(--contour)}
.mjb-slot.plein{border-style:solid;border-color:rgba(255,143,179,.65);background:rgba(255,143,179,.13)}
.mjb-slot.plein .mjb-num{background:var(--c-barde);color:var(--contour)}
.mjb-slot.aide{border-color:rgba(245,185,69,.7)}
.mjb-slot.arrive{animation:mjb-arrive .45s cubic-bezier(.3,1.5,.6,1)}
.mjb-ordre.gagne .mjb-slot{animation:mjb-brille 1.1s ease-out;border-color:#5fcf86}
.mjb-cartes{display:grid;grid-template-columns:1fr;gap:10px}
.mjb-carte{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:18px;background:linear-gradient(180deg,#fffaf0,#efdfba);color:var(--encre);border:3px solid var(--contour);box-shadow:0 5px 0 rgba(36,24,46,.6);font-weight:700;cursor:pointer;min-height:66px;transition:transform .1s}
.mjb-carte:active{transform:translateY(3px)}
.mjb-carte p{flex:1;font-size:1.04rem;line-height:1.25}
.mjb-carte-ic{font-size:1.5rem;flex:none}
.mjb-carte.part{animation:mjb-part .42s forwards;pointer-events:none}
.mjb-carte.faux{background:linear-gradient(180deg,#ffd9cc,#ffb49e)}
@keyframes mjb-respire{0%,100%{box-shadow:0 0 0 0 rgba(245,185,69,.0)}50%{box-shadow:0 0 0 5px rgba(245,185,69,.28)}}
@keyframes mjb-arrive{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
@keyframes mjb-part{to{transform:translateY(-30px) scale(.7);opacity:0}}
@keyframes mjb-brille{0%{box-shadow:0 0 0 0 rgba(95,207,134,.0)}40%{box-shadow:0 0 18px 4px rgba(95,207,134,.75)}100%{box-shadow:0 0 0 0 rgba(95,207,134,0)}}

/* --- Ragots --- */
.mjb-ragots .mjb-salle{gap:18px}
.mjb-ragots .mjb-salle{flex:1;justify-content:center}
.mjb-ragots .mjb-bulle-parole{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-right:62px}
.mjb-ragots .mjb-lire-ragot{position:absolute;right:10px;top:50%;margin-top:-22px}
.mjb-tampon{position:absolute;right:18px;top:-18px;padding:3px 12px;border:4px solid;border-radius:10px;font-weight:800;letter-spacing:.12em;font-size:1.15rem;background:rgba(255,250,240,.95);opacity:0;transform:rotate(-12deg) scale(2.2);pointer-events:none}
.mjb-tampon.montre{animation:mjb-tampon .35s cubic-bezier(.3,1.4,.6,1) forwards}
.mjb-tampon.v{color:#23824a;border-color:#23824a}
.mjb-tampon.f{color:#c2412a;border-color:#c2412a}
.mjb-indice{display:none;font-size:.9rem;color:var(--encre-2);background:rgba(245,185,69,.3);border-radius:10px;padding:4px 10px}
.mjb-indice.montre{display:block;animation:b-apparait .3s}
.mjb-vf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.mjb-vrai{background:linear-gradient(180deg,#98ecb3,#3fae69);box-shadow:0 6px 0 #22703f, 0 12px 22px rgba(0,0,0,.35)}
.mjb-vrai:active{box-shadow:0 2px 0 #22703f}
.mjb-faux{background:linear-gradient(180deg,#ffab93,#e2583c);box-shadow:0 6px 0 #8f2f1a, 0 12px 22px rgba(0,0,0,.35)}
.mjb-faux:active{box-shadow:0 2px 0 #8f2f1a}
.mjb-carnet{align-self:center}
.mjb-recap{animation:b-apparait .35s}
.mjb-recap ul{list-style:none;padding:0;margin:10px 0 16px;display:flex;flex-direction:column;gap:8px}
.mjb-recap li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;animation:b-apparait .35s both}
.mjb-recap li.mauvais{border-color:rgba(232,105,60,.5)}
.mjb-recap p{flex:1;font-size:.98rem;line-height:1.25}
.mjb-recap-v{flex:none;font-weight:800;font-size:.78rem;letter-spacing:.08em;padding:3px 8px;border-radius:7px;border:2px solid}
.mjb-recap-v.v{color:#7ee0a0;border-color:#7ee0a0}
.mjb-recap-v.f{color:#ff9a80;border-color:#ff9a80}
.mjb-recap .mjb-lire{width:38px;height:38px;font-size:.95rem}
.mjb-recap-toi{flex:none;font-size:1.3rem;font-weight:800}
.mjb-recap li.bon .mjb-recap-toi{color:#7ee0a0}
.mjb-recap li.mauvais .mjb-recap-toi{color:#ff9a80}
.mjb-recap .btn{width:100%}
@keyframes mjb-tampon{to{opacity:1;transform:rotate(-12deg) scale(1)}}

/* --- Parchemin du Sage --- */
.mjb-parchemin-feuille{position:relative;background:linear-gradient(180deg,#f8eed6,#e6cf9c);border-radius:8px 16px 10px 18px;padding:16px 10px 12px;border:2px solid #8a6a3a;
  box-shadow:inset 0 0 42px rgba(140,100,40,.32), 0 10px 26px rgba(0,0,0,.4)}
.mjb-message{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 18px}
.mjb-mot{display:flex;gap:3px}
.mjb-case{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 3px;width:44px;border-radius:10px;border:2px solid transparent;background:transparent;transition:background .2s, border-color .2s}
.mjb-case.autre b{border:0}
.mjb-case .mjb-glyphe{width:34px;height:34px}
.mjb-case b{display:block;height:28px;min-width:28px;border-bottom:2px solid rgba(53,40,27,.35);font-family:var(--f-titre);font-weight:400;font-size:1.45rem;color:var(--encre);line-height:28px;text-align:center}
.mjb-case.cur{border-color:var(--cyan-2);background:rgba(63,208,255,.2);box-shadow:0 0 16px rgba(63,208,255,.6);animation:mjb-respire-cyan 1.3s ease-in-out infinite}
.mjb-case.cur .mjb-glyphe path:not(.ombre){stroke:#0b5c86}
.mjb-case.rempli b{border-bottom-color:transparent}
.mjb-case.offert b{color:#8a6a3a}
.mjb-case.arrive b{animation:mjb-encre .5s ease-out}
.mjb-alphabet.gagne .mjb-case b{color:#1a6fa8;text-shadow:0 0 12px rgba(63,208,255,.9)}
.mjb-alphabet.gagne .mjb-parchemin-feuille{animation:mjb-brille-cyan 1.6s ease-out}
.mjb-glyphe{display:block;overflow:visible}
.mjb-glyphe path{fill:none;stroke:var(--encre);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.mjb-glyphe path.ombre{stroke:rgba(53,40,27,.16);stroke-width:5.5}
.mjb-glyphe circle{fill:var(--encre)}
.mjb-cle-titre{text-align:center}
.mjb-cle{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.mjb-touche{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px 3px;border-radius:12px;border:2px solid #8a6a3a;background:linear-gradient(180deg,#f8eed6,#e2c991);color:var(--encre);min-height:62px;font-family:var(--f-titre);font-size:1.05rem;box-shadow:0 3px 0 #8a6a3a}
.mjb-touche:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a3a}
.mjb-touche .mjb-glyphe{width:28px;height:28px}
.mjb-touche.bon{animation:mjb-bon .45s}
.mjb-touche.faux{animation:b-tremble .35s;background:linear-gradient(180deg,#ffd9cc,#ffb49e)}
.mjb-cle-grilles{display:flex;flex-direction:column;gap:10px}
.mjb-schema{display:block;width:100%;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#f8eed6,#e6cf9c);border-radius:12px;border:2px solid #8a6a3a}
.mjb-schema path{fill:none;stroke:var(--encre);stroke-width:3;stroke-linecap:round}
.mjb-schema text{font-family:var(--f-titre);font-size:18px;fill:var(--encre);text-anchor:middle}
.mjb-schema circle{fill:var(--encre)}
.mjb-clavier{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.mjb-touche.lettre{min-height:50px;font-size:1.35rem}
@keyframes mjb-bon{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 18px rgba(63,208,255,.9)}100%{transform:scale(1)}}
@keyframes mjb-encre{from{opacity:0;transform:translateY(-6px) scale(1.4);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes mjb-respire-cyan{0%,100%{box-shadow:0 0 8px rgba(63,208,255,.45)}50%{box-shadow:0 0 20px rgba(63,208,255,.9)}}
@keyframes mjb-brille-cyan{0%{box-shadow:inset 0 0 42px rgba(140,100,40,.32), 0 0 0 rgba(63,208,255,0)}40%{box-shadow:inset 0 0 42px rgba(140,100,40,.32), 0 0 40px rgba(63,208,255,.9)}100%{box-shadow:inset 0 0 42px rgba(140,100,40,.32), 0 10px 26px rgba(0,0,0,.4)}}

/* --- Superposer les plans --- */
.mjb-plans-cadre{position:relative;width:100%;max-width:520px;margin:0 auto;border-radius:16px;overflow:hidden;border:3px solid var(--contour);box-shadow:0 0 0 2px rgba(108,182,255,.35), var(--ombre);flex:none}
.mjb-plans-svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.mjb-plans.tire .mjb-plans-svg{cursor:grabbing}
.mjb-plans .riviere{fill:none;stroke:#2f6aa6;stroke-width:20;stroke-linecap:round}
.mjb-plans .riviere-lum{fill:none;stroke:#86c4f2;stroke-width:3;stroke-dasharray:10 16;opacity:.55;animation:mjb-courant 3s linear infinite}
.mjb-plans .routes path{fill:none;stroke:#b9a37a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.mjb-plans .arbres circle{fill:#1d5a3e;stroke:var(--contour);stroke-width:1.5}
.mjb-plans .arbres circle.lum{fill:#3a8a5f;stroke:none}
.mjb-plans .maisons rect{fill:#d2c2a2;stroke:var(--contour);stroke-width:1.4}
.mjb-plans .maisons path{fill:#94505a;stroke:var(--contour);stroke-width:1.4;stroke-linejoin:round}
.mjb-plans .lieux .eau-bord{fill:#a5aec4;stroke:var(--contour);stroke-width:2}
.mjb-plans .lieux .eau{fill:#72cdf4}
.mjb-plans .lieux .tour{fill:#8676a3;stroke:var(--contour);stroke-width:2}
.mjb-plans .lieux .toit{fill:#584675;stroke:var(--contour);stroke-width:2;stroke-linejoin:round}
.mjb-plans .lieux .cloche{fill:var(--or)}
.mjb-plans .lieux .pierre{fill:#a2a2b2;stroke:var(--contour);stroke-width:2}
.mjb-plans .lieux .trou{fill:#141933}
.mjb-plans .lieux .ailes{stroke:#f3e7cb;stroke-width:3.5;stroke-linecap:round}
.mjb-plans .boussole circle{fill:rgba(0,0,0,.4);stroke:#ffe3a3;stroke-width:1.5}
.mjb-plans .boussole path{fill:#ffe3a3}
.mjb-plans .boussole text{font-size:10px;fill:#ffe3a3;text-anchor:middle;font-weight:700}
.mjb-plans .cible{fill:none;stroke:#ffe3a3;stroke-width:2;stroke-dasharray:4 4;opacity:.6;transition:all .2s}
.mjb-plans .cible.proche{stroke:#6dff9e;opacity:1;stroke-dasharray:none;stroke-width:3}
.mjb-plans .fantome{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-dasharray:7 6;opacity:.7}
.mjb-plans .mjb-parch{transition:opacity .2s}
.mjb-plans .feuille{fill:url(#mjbp-papier);stroke:#8a6a3a;stroke-width:2}
.mjb-plans .marque circle{fill:none;stroke:#6b4a2a;stroke-width:2.2}
.mjb-plans .marque path{stroke:#6b4a2a;stroke-width:3.2;stroke-linecap:round}
.mjb-plans .marque text{font-family:var(--f-main);font-size:16px;font-weight:700;fill:#5a3b1c;text-anchor:middle}
.mjb-plans .marque.proche circle{stroke:#127a3c;stroke-width:3.2}
.mjb-plans .croquis .passage{fill:none;stroke:#6b4a2a;stroke-width:3;stroke-dasharray:3 6;stroke-linecap:round}
.mjb-plans .croquis .titre{font-family:var(--f-main);font-size:21px;font-weight:700;fill:#5a3b1c;text-anchor:middle}
.mjb-plans .rose circle{fill:none;stroke:#6b4a2a;stroke-width:1.5}
.mjb-plans .rose path{fill:#6b4a2a;opacity:.85}
.mjb-plans .rose text{font-family:var(--f-titre);font-size:10px;fill:#5a3b1c;text-anchor:middle}
.mjb-plans .passage-lumiere{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:round;stroke-dasharray:10 9;opacity:0;pointer-events:none}
.mjb-plans .passage-nom{opacity:0;font-family:var(--f-titre);font-size:15px;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:var(--contour);stroke-width:4;pointer-events:none}
.mjb-plans.gagne .mjb-parch{transition:transform .45s ease-out, opacity .2s}
.mjb-plans.gagne .passage-lumiere{opacity:1;animation:mjb-courant .9s linear infinite;filter:drop-shadow(0 0 4px var(--cyan))}
.mjb-plans.gagne .passage-nom{opacity:1;transition:opacity .6s .5s}
.mjb-plans-outils{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.mjb-plans-outils .mjb-jauge{margin-left:0}
.mjb-rond{width:58px;height:58px;border-radius:50%;border:3px solid var(--contour);background:linear-gradient(180deg,#f8eed6,#d9c08c);color:var(--encre);font-size:1.7rem;font-weight:700;box-shadow:0 4px 0 #8a6a3a;display:grid;place-items:center;padding:0}
.mjb-rond:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a3a}
.mjb-opacite{display:flex;align-items:center;gap:6px;font-size:1.4rem}
.mjb-opacite input{width:120px}
@keyframes mjb-courant{to{stroke-dashoffset:-52}}

/* --- Grille de déduction --- */
.mjb-indices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mjb-indices li{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#f8eed6,#e6cf9c);color:var(--encre);border-radius:12px;padding:7px 8px 7px 10px;border:2px solid #8a6a3a;font-weight:700}
.mjb-indices .mjb-num{flex:none;min-width:30px;height:30px;border-radius:50%;background:var(--c-sage);color:var(--contour);display:grid;place-items:center;font-weight:800;border:2px solid var(--contour)}
.mjb-indices p{flex:1;font-size:1rem;line-height:1.25}
.mjb-indices .mjb-lire{width:40px;height:40px}
.mjb-tableau{display:grid;grid-template-columns:minmax(78px,1.3fr) repeat(var(--cols),minmax(46px,1fr));gap:5px;background:rgba(0,0,0,.28);padding:7px;border-radius:14px;border:2px solid var(--trait)}
.mjb-coin{display:grid;place-items:center}
.mjb-coin .mjb-lire{width:40px;height:40px}
.mjb-entete{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;font-weight:700;text-align:center;line-height:1.1;padding:4px 2px;color:var(--or-pale);border-radius:10px;transition:background .2s}
.mjb-entete.ligne{flex-direction:row;justify-content:flex-start;gap:6px;font-size:.95rem;padding-left:4px}
.mjb-entete.faute{background:rgba(232,105,60,.35)}
.mjb-g-ic{font-size:1.65rem;line-height:1}
.mjb-mini-portrait{display:block;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--contour);flex:none}
.mjb-mini-portrait svg{width:100%;height:100%;display:block}
.mjb-cellule{min-height:54px;border-radius:10px;border:2px solid #8a6a3a;background:linear-gradient(180deg,#f8eed6,#e2c991);color:var(--encre);font-size:1.7rem;font-weight:800;display:grid;place-items:center;padding:0;line-height:1}
.mjb-cellule.x{color:#b5432c;background:linear-gradient(180deg,#efe3c8,#d8c393)}
.mjb-cellule.v{color:#137a3e;background:linear-gradient(180deg,#dcf8e2,#a6e2b5);border-color:#2f9e5a}
.mjb-cellule.fixe{box-shadow:inset 0 0 0 3px var(--or)}
.mjb-cellule.faute{background:linear-gradient(180deg,#ffd9cc,#ffb49e)}
.mjb-cellule.pop{animation:mjb-pop .25s}
.mjb-legende{text-align:center;font-size:.9rem;color:var(--brume)}
.mjb-legende b.x{color:#ff9a80;font-size:1.1rem}
.mjb-legende b.v{color:#7ee0a0;font-size:1.1rem}
.mjb-message-grille{font-weight:700;color:var(--or-pale)}
.mjb-grille.gagne .mjb-cellule.v{animation:mjb-brille 1.2s ease-out;box-shadow:0 0 14px rgba(95,207,134,.9)}
@keyframes mjb-pop{50%{transform:scale(1.14)}}

/* --- Runes --- */
.mjb-runes .mjb-defs{position:absolute;width:0;height:0;overflow:hidden}
.mjb-runes-haut{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(100%, 380px);margin:0 auto}
.mjb-modele{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--brume);font-weight:700}
.mjb-modele svg{width:92px;height:92px;border-radius:12px;border:3px solid var(--contour);box-shadow:0 0 0 2px rgba(108,182,255,.45), 0 0 18px rgba(143,243,255,.35)}
.mjb-coups{display:flex;align-items:baseline;gap:6px;font-size:1rem;padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.32);border:2px solid var(--trait);transition:border-color .2s}
.mjb-coups b{font-size:1.7rem;color:var(--or-pale);font-family:var(--f-titre);font-weight:400}
.mjb-coups-ic{font-size:1.2rem}
.mjb-coups.alerte{border-color:var(--braise);animation:b-pulse 1s ease-in-out infinite}
.mjb-runes-grille{display:grid;grid-template-columns:repeat(var(--k),1fr);grid-auto-rows:1fr;gap:5px;width:min(100%, 380px);aspect-ratio:1;margin:0 auto;padding:8px;border-radius:16px;background:#141833;border:3px solid var(--contour);
  box-shadow:inset 0 0 30px rgba(0,0,0,.6), 0 10px 24px rgba(0,0,0,.4);transition:gap .5s, box-shadow .5s;flex:none}
.mjb-tuile{position:relative;border-radius:8px;overflow:hidden;touch-action:none;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.55);background:#262a4d;min-width:0;min-height:0}
.mjb-tuile > svg{display:block;width:100%;height:100%;transition:transform .24s cubic-bezier(.3,1.3,.6,1)}
.mjb-tuile .filigrane{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.32}
.mjb-tuile .filigrane path{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:3 3}
.mjb-tuile.fixe{box-shadow:inset 0 0 0 3px var(--or), 0 3px 0 rgba(0,0,0,.55);cursor:default}
.mjb-tuile .cadenas{position:absolute;right:3px;bottom:1px;font-size:.8rem}
.mjb-tuile.glisse{z-index:5;box-shadow:0 14px 26px rgba(0,0,0,.65), 0 0 0 3px var(--cyan);transition:none}
.mjb-tuile.juste{animation:mjb-juste .55s ease-out}
.mjb-runes.gagne .mjb-runes-grille{gap:0;box-shadow:0 0 34px rgba(143,243,255,.7), inset 0 0 30px rgba(0,0,0,.6)}
.mjb-runes.gagne .mjb-tuile{border-radius:0;box-shadow:none}
.mjb-runes.gagne .mjb-tuile > svg{animation:mjb-rune-vive 1.4s ease-out}
.mjb-runes.eteint .mjb-runes-grille{filter:grayscale(.85) brightness(.55);transition:filter .6s}
.mjb-runes-aide{text-align:center;font-size:.92rem;color:var(--brume)}
@keyframes mjb-juste{0%{box-shadow:0 0 0 0 rgba(143,243,255,0)}40%{box-shadow:0 0 0 4px rgba(143,243,255,.9), 0 0 18px rgba(143,243,255,.8)}100%{box-shadow:0 3px 0 rgba(0,0,0,.55)}}
@keyframes mjb-rune-vive{0%{filter:brightness(1)}40%{filter:brightness(1.7)}100%{filter:brightness(1.15)}}

/* --- Démos (petite main) --- */
.mjb-demo{position:absolute;inset:0;overflow:hidden}
.mjb-main{position:absolute;left:50%;top:96%;font-size:2.1rem;line-height:1;transform:translate(-35%,-8%);transition:left .45s ease, top .45s ease;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));z-index:5;pointer-events:none}
.mjb-main.tape{animation:mjb-tape .35s}
@keyframes mjb-tape{50%{transform:translate(-35%,-8%) scale(.78)}}
.mjb-d-mvisage{position:absolute;left:8px;top:8px;bottom:8px;aspect-ratio:1;border-radius:18px;overflow:hidden;border:3px solid var(--contour);box-shadow:0 0 0 2px rgba(255,143,179,.35)}
.mjb-d-mvisage svg{width:100%;height:100%;display:block}
.mjb-d-mvisage .mjb-m-emoji{font-size:4.4rem}
.mjb-d-mbulle{position:absolute;left:calc(170px - 4px);right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mjb-d-mtexte{background:#fffaf0;color:var(--encre);border:3px solid var(--contour);border-radius:14px;padding:6px 10px;font-weight:700;font-size:.92rem;line-height:1.2}
.mjb-d-mlegende{font-size:.84rem;font-weight:700;color:var(--or-pale);line-height:1.2;min-height:2.4em}
.mjb-demo.vrai .mjb-d-mlegende{color:#9ff0bd}
.mjb-d-maccuse{position:absolute;right:12px;bottom:10px;width:54px;height:54px;border-radius:50%;border:3px solid var(--contour);background:linear-gradient(180deg,#ffa9c6,#e2557f);font-size:1.5rem;padding:0}
.mjb-demo.vu .mjb-d-maccuse{background:linear-gradient(180deg,#98ecb3,#3fae69);box-shadow:0 0 18px #5fcf86}
.mjb-m-aide-btn{position:absolute;left:calc(170px - 4px);bottom:10px;z-index:6;min-height:48px;padding:6px 14px;border-radius:999px;border:2px solid rgba(255,227,163,.7);background:rgba(36,24,46,.85);color:var(--or-pale);font-weight:700;font-size:.95rem}
.mjb-m-aide-btn:active{transform:scale(.96)}
@media (max-width:520px){ .mjb-d-mvisage{bottom:auto;width:100px} .mjb-d-mbulle{left:116px} .mjb-m-aide-btn{left:8px;bottom:8px;min-height:48px;padding:4px 8px;font-size:.82rem;width:100px} .mjb-d-mlegende{padding-right:52px} }
.mjb-d-ordre .mjb-d-slots{position:absolute;left:0;right:0;top:10%;display:flex;justify-content:center;gap:8px}
.mjb-d-slots i{width:56px;height:34px;border-radius:10px;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--brume)}
.mjb-d-slots i.plein{border-style:solid;border-color:var(--c-barde);background:rgba(255,143,179,.25);color:#fff}
.mjb-d-cartes b{position:absolute;top:58%;width:64px;margin-left:-32px;padding:6px 0;text-align:center;border-radius:12px;background:#fffaf0;color:var(--encre);border:3px solid var(--contour);font-size:.95rem;transition:opacity .3s, transform .3s}
.mjb-d-cartes b:nth-child(1){left:20%}.mjb-d-cartes b:nth-child(2){left:50%}.mjb-d-cartes b:nth-child(3){left:80%}
.mjb-d-cartes b.pris{opacity:0;transform:translateY(-30px) scale(.7)}
.mjb-d-ragots .mjb-d-visage{position:absolute;left:8%;top:12%;font-size:3.2rem}
.mjb-d-ragots .mjb-d-bulle{top:10%}
.mjb-d-vf{position:absolute;left:0;right:0;top:62%;display:flex;justify-content:center;gap:30px}
.mjb-d-vf b{width:58px;height:46px;border-radius:14px;display:grid;place-items:center;border:3px solid var(--contour);font-size:1.3rem}
.mjb-d-vf .v{background:#3fae69}.mjb-d-vf .f{background:#e2583c}
.mjb-d-tampon{position:absolute;right:10%;top:6%;padding:2px 10px;border:3px solid #23824a;color:#23824a;background:#fffaf0;border-radius:8px;font-weight:800;opacity:0;transform:rotate(-12deg) scale(2)}
.mjb-demo.vu .mjb-d-tampon{animation:mjb-tampon .35s forwards}
.mjb-d-alpha .mjb-d-msg{position:absolute;left:0;right:0;top:8%;display:flex;justify-content:center;gap:8px}
.mjb-d-msg span{display:flex;flex-direction:column;align-items:center;width:46px;padding:4px;border-radius:10px;background:#f3e7cb}
.mjb-d-msg span.cur{box-shadow:0 0 14px var(--cyan-2);outline:2px solid var(--cyan-2)}
.mjb-d-msg .mjb-glyphe{width:28px;height:28px}
.mjb-d-msg b{height:20px;font-family:var(--f-titre);color:var(--encre);opacity:0}
.mjb-demo.vu .mjb-d-msg span.cur b{opacity:1;transition:opacity .3s}
.mjb-d-cle{position:absolute;left:0;right:0;top:66%;display:flex;justify-content:center;gap:8px}
.mjb-d-cle i{display:flex;flex-direction:column;align-items:center;width:52px;padding:3px;border-radius:10px;background:#e6cf9c;color:var(--encre);font-style:normal;font-family:var(--f-titre);font-size:.9rem;border:2px solid #8a6a3a}
.mjb-d-cle .mjb-glyphe{width:22px;height:22px}
.mjb-demo.vu .mjb-d-cle i[data-l="M"]{box-shadow:0 0 14px var(--cyan-2)}
.mjb-d-plans .mjb-d-carte,.mjb-d-plans .mjb-d-parch{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:10px}
.mjb-d-carte{background:#2b4a3c;border:3px solid var(--contour)}
.mjb-d-carte i{position:absolute;left:30%;top:36%;width:16px;height:16px;border-radius:50%;border:2px dashed #ffe3a3}
.mjb-d-parch{background:rgba(243,231,203,.55);border:2px solid #8a6a3a;transform:translate(42px,28px) rotate(0deg);transition:transform 1.2s ease-in-out}
.mjb-d-parch i{position:absolute;left:30%;top:36%;width:16px;height:16px;border-radius:50%;border:3px solid #6b4a2a}
.mjb-demo.tire .mjb-d-parch{transform:none}
.mjb-demo.vu .mjb-d-carte{box-shadow:0 0 18px var(--cyan)}
.mjb-d-grille{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,44px);grid-auto-rows:40px;gap:4px}
.mjb-d-grille b{display:grid;place-items:center;font-size:1.3rem;font-weight:400}
.mjb-d-grille i{display:grid;place-items:center;border-radius:8px;background:#e6cf9c;color:#b5432c;font-style:normal;font-weight:800;font-size:1.3rem;border:2px solid #8a6a3a}
.mjb-d-grille i.v{color:#137a3e;background:#bfeccb}
.mjb-d-runes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(2,54px);gap:4px}
.mjb-d-runes i{width:54px;height:54px;border-radius:6px;background:#454b78;position:relative;overflow:hidden;transition:transform .3s}
.mjb-d-runes i::after{content:"";position:absolute;width:68px;height:68px;border-radius:50%;border:4px solid #bff9ff;box-shadow:0 0 8px #8ff3ff}
.mjb-d-runes i:nth-child(1)::after{left:20px;top:20px}
.mjb-d-runes i:nth-child(2)::after{right:20px;top:20px}
.mjb-d-runes i:nth-child(3)::after{left:20px;bottom:20px}
.mjb-d-runes i:nth-child(4)::after{right:20px;bottom:20px}
.mjb-d-runes i.tourne{transform:rotate(90deg)}
.mjb-demo.vu .mjb-d-runes i.tourne{transform:rotate(0)}
.mjb-demo.vu .mjb-d-runes{filter:drop-shadow(0 0 10px #8ff3ff)}

/* --- Grands écrans --- */
@media (min-width:640px){
  .mjb-salle{flex-direction:row;align-items:center}
  .mjb-salle .mjb-portrait{margin:0}
  .mjb-salle .mjb-bulle-parole{flex:1}
  .mjb-salle .mjb-bulle-parole::before{left:-15px;top:50%;margin:-12px 0 0;transform:rotate(-45deg)}
  .mjb-cartes{grid-template-columns:1fr 1fr}
  .mjb-gros{max-width:520px;align-self:center}
  .mjb-vf{max-width:520px;width:100%;align-self:center}
}

/* --- Paysage : le visage à gauche, la bulle à droite --- */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .mjb-m-scene{flex-direction:row;gap:30px}
  .mjb-m-visage{width:min(46vw, 62vh, 640px)}

  .mjb-m-bulle::before{left:-15px;top:50%;margin:-12px 0 0;transform:rotate(-45deg)}
}

/* --- Téléphones : tout tenir sans trop défiler --- */

  .mjb-jeu{padding:12px;gap:10px}
  .mjb-slot{min-height:38px;padding:4px 8px}

  .mjb-case{width:38px}
  .mjb-case .mjb-glyphe{width:30px;height:30px}

}
.mjb-entete.ligne span{min-width:0;overflow-wrap:anywhere}

/* --- Tablettes : profiter de la place --- */
@media (min-width:700px) and (min-height:860px){
  .mjb-jeu{padding:22px 28px;gap:18px}
  .mjb-portrait{width:min(34vw, 280px)}
  .mjb-portrait.petit{width:180px}
  .mjb-emoji{font-size:8.6rem}
  .mjb-portrait.petit .mjb-emoji{font-size:5.4rem}
  .mjb-ragots .mjb-salle{margin-top:3vh}
  .mjb-m-visage{width:min(80vw, 48vh, 640px)}
  .mjb-m-bulle{min-height:112px}
  .mjb-m-puce{width:58px;height:58px;font-size:1.25rem}
  .mjb-m-liste p{font-size:1.2rem}
  .mjb-m-choix{min-height:56px;min-width:140px;font-size:1.1rem}
  .mjb-m-aide-boite{padding:24px;gap:16px}
  .mjb-m-carte p{font-size:1rem}
  .mjb-bulle-parole{font-size:1.5rem;padding:20px 24px 16px;min-height:112px}
  .mjb-gros{min-height:82px;font-size:1.65rem;max-width:600px}
  .mjb-vf{max-width:600px}
  .mjb-pastilles i{width:20px;height:20px}
  .mjb-jauge i{width:22px;height:22px}
  .mjb-consigne-mini{font-size:1.15rem}
  .mjb-slot{min-height:58px}
  .mjb-slot p{font-size:1.12rem}
  .mjb-slot .mjb-num{width:38px;height:38px;font-size:1.1rem}
  .mjb-carte{min-height:80px}
  .mjb-carte p{font-size:1.22rem}
  .mjb-parchemin-feuille{padding:24px 18px 18px}
  .mjb-case{width:60px}
  .mjb-case .mjb-glyphe{width:48px;height:48px}
  .mjb-case b{font-size:1.9rem;height:36px;line-height:36px}
  .mjb-cle{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px}
  .mjb-touche{min-height:80px;font-size:1.3rem}
  .mjb-touche .mjb-glyphe{width:40px;height:40px}
  .mjb-touche.lettre{min-height:60px;font-size:1.6rem}
  .mjb-clavier{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
  .mjb-plans-cadre{max-width:700px}
  .mjb-rond{width:70px;height:70px;font-size:2rem}

  .mjb-tableau{max-width:760px;width:100%;margin:0 auto;gap:7px;padding:10px}

  .mjb-entete{font-size:1rem}

}

/* Les mots perdus (Barde) */
.mm{display:flex;flex-direction:column;gap:12px;padding:12px;flex:1;min-height:0;overflow-y:auto}
.mm-parchemin{background:var(--parchemin);color:var(--encre);border-radius:6px 14px 8px 14px;padding:14px 14px 10px;box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 0 40px rgba(140,100,40,.2);display:flex;flex-direction:column;gap:10px}
.mm-ligne{display:flex;gap:8px;align-items:flex-start;font-size:1.08rem;line-height:2.1}
.mm-qui{font-size:1.5rem;line-height:1.4;flex:none}
.mm-trou{display:inline-block;min-width:76px;min-height:38px;margin:0 3px;padding:2px 10px;border-radius:10px;border:2px dashed var(--encre-2);background:rgba(255,255,255,.45);color:var(--encre-2);font:inherit;font-weight:700;line-height:1.5;vertical-align:middle;transition:transform .12s}
.mm-trou.plein{border-style:solid;border-color:var(--laiton);background:#fff6dd;color:var(--encre)}

function resoudre(equip){
  var r = {};
  (equip || []).forEach(function(id){
    var o = OBJ[id]; if(!o || !o[1]) return;
    var s = o[1];
    if(MULTI[s]){ (r[s] = r[s] || []).push(id); return; }
    if(!r[s] || OBJ[r[s]][0] < o[0]) r[s] = id;
  });
  Object.keys(MULTI).forEach(function(s){ if(r[s]){ r[s].sort(function(a, b){ return OBJ[b][0] - OBJ[a][0]; }); r[s] = r[s].slice(0, MULTI[s]); } });

  if(r.ceinture && r.ceinture.indexOf('lanterne_lune') >= 0) r.ceinture = r.ceinture.filter(function(x){ return x !== 'lanterne_sourde'; });
  return r;
}

}

function oeil(K, x, y, d, f){

function sourcils(K, f){

  var sc = f.sourcilsC || K.chev.c[2];

   D'après les essais de Romain dans la salle d'entraînement :
   - les bulles ne changent JAMAIS de place d'un coup. Elles dérivent
     très lentement en ligne droite, rebondissent doucement sur les bords
     et les unes sur les autres. Pas de boucle, pas de téléportation.
     La dérive fait la difficulté : qui répond vite les retrouve presque
     au même endroit, qui réfléchit longtemps les voit se mélanger ;
   - 4 manches façon « Simon » : la même suite s'allonge d'une bulle à
     chaque manche (3, 4, 5 puis 6 bulles au niveau de référence 10) ;
   - 3 vies pour toute la partie. Une erreur coûte une vie, sans montrer
     la réponse et sans recommencer : on reste sur la même bulle et on
     réessaie. Plus de vies : raté ;
   - chaque manche réussie fait tomber de petits ingrédients des bulles
     dans le chaudron, qui change de couleur ; après la 4e manche il
     devient arc-en-ciel.
   Niveau de référence : n = 10 (MJ.CALIBRAGE ramène les enquêtes à 10).
   n = 1…9 : versions plus douces pour régler (moins de bulles, dérive plus
   lente, suite montrée plus lentement, une ou deux vies de plus au début).
   Mods : erreurs (+N vies), zone (bulles plus grosses), lent (dérive plus
   lente, ex. 0.8), temps (+N : dérive un peu plus lente aussi), eclate (N
   bulles inutiles éclatent, une au début des manches 2, 3 et 4), aide (N
   indices : le bouton 💡 fait briller la prochaine bulle à toucher),
   revele (la prochaine bulle brille toujours), facile (géré par le cœur).

  }

  s += '<rect x="' + f2(x0) + '" y="' + f2(F) + '" width="' + f2(vb.w) + '" height="' + f2(y1 - F + 2) + '" fill="' + G('sol') + '"/>';
  var pl = '';
  for(var i = -16; i <= 16; i++){ var xa = C + i * 40 * k, xb = C + i * 58 * k; if(Math.max(xa, xb) > x0 - 60 && Math.min(xa, xb) < x1 + 60) pl += 'M' + f2(xa) + ',' + f2(F) + ' L' + f2(xb) + ',' + f2(y1 + 2) + ' '; }
  for(i = -8; i <= 8; i++){ var yj = F + (y1 - F) * (0.35 + 0.3 * ((i + 8) % 3) / 2), xj = C + i * 50 * k + (i % 2) * 14; pl += 'M' + f2(xj) + ',' + f2(yj) + ' h' + f2(30 * k) + ' '; }

  s += dR(x0 - 4, F - 6 * k, vb.w + 8, 8 * k, 0, G('bS'), 2);

    for(var j = 0; j < 7; j++){ var a = Math.PI * (0.05 + 0.9 * j / 6); s += '<ellipse cx="' + f2(ch.x - Math.cos(a) * hr) + '" cy="' + f2(hy + Math.sin(a) * hr * 0.2) + '" rx="' + f2(9 * ch.k + 3) + '" ry="' + f2(5 * ch.k + 2) + '" fill="#625b80" stroke="' + CONTOUR + '" stroke-width="2"/>'; }

/* ---------- Physique : lignes droites, rebonds doux ---------- */
function ecraser(b, ang, force){ b.sqT = 0; b.sqA = ang; b.sqF = force || 1; }
function remettreVitesse(b, fx, fy){
  var v = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  if(v < b.s * 0.15){ b.vx = fx * b.s; b.vy = fy * b.s; return; }
  b.vx *= b.s / v; b.vy *= b.s / v;
}
/* Fait avancer les bulles de dt secondes dans l'arène A = {x0, y0, x1, y1}.
   Vitesse constante (b.s) : seules les directions changent aux rebonds. */
function bouger(liste, A, dt){
  var i, j, b, o, pen, pousse = 50 * dt;
  for(i = 0; i < liste.length; i++){
    b = liste[i]; if(!b.vivant) continue;
    b.x += b.vx * dt; b.y += b.vy * dt; b.sqT += dt;
    /* bords : on renvoie la bulle ; si l'arène a rapetissé (écran tourné), elle rentre doucement */
    if((pen = A.x0 - (b.x - b.r)) > 0){ if(b.vx < 0){ b.vx = -b.vx; ecraser(b, 0); } if(pen > 1.5) b.x += Math.min(pen, pousse); }
    if((pen = (b.x + b.r) - A.x1) > 0){ if(b.vx > 0){ b.vx = -b.vx; ecraser(b, 0); } if(pen > 1.5) b.x -= Math.min(pen, pousse); }
    if((pen = A.y0 - (b.y - b.r)) > 0){ if(b.vy < 0){ b.vy = -b.vy; ecraser(b, 90); } if(pen > 1.5) b.y += Math.min(pen, pousse); }
    if((pen = (b.y + b.r) - A.y1) > 0){ if(b.vy > 0){ b.vy = -b.vy; ecraser(b, 90); } if(pen > 1.5) b.y -= Math.min(pen, pousse); }
  }
  for(i = 0; i < liste.length; i++){
    b = liste[i]; if(!b.vivant || b.etat !== 'ok') continue;
    for(j = i + 1; j < liste.length; j++){
      o = liste[j]; if(!o.vivant || o.etat !== 'ok') continue;
      var dx = o.x - b.x, dy = o.y - b.y, d = Math.sqrt(dx * dx + dy * dy), mini = b.r + o.r + 3;
      if(d >= mini || d < 0.001) continue;
      var nx = dx / d, ny = dy / d;
      var vb = b.vx * nx + b.vy * ny, vo = o.vx * nx + o.vy * ny;
      if(vb - vo > 0){
        /* choc élastique entre bulles de même masse : on échange les vitesses le long du choc */
        b.vx += (vo - vb) * nx; b.vy += (vo - vb) * ny;
        o.vx += (vb - vo) * nx; o.vy += (vb - vo) * ny;
        remettreVitesse(b, -nx, -ny); remettreVitesse(o, nx, ny);
        /* sécurité : après le choc, elles doivent s'éloigner */
        vb = b.vx * nx + b.vy * ny; vo = o.vx * nx + o.vy * ny;
        if(vb > 0){ b.vx -= 2 * vb * nx; b.vy -= 2 * vb * ny; }
        if(vo < 0){ o.vx -= 2 * vo * nx; o.vy -= 2 * vo * ny; }
        var ang = Math.atan2(ny, nx) * 180 / Math.PI;
        ecraser(b, ang, 0.75); ecraser(o, ang, 0.75);
      }
      var corr = Math.min((mini - d) / 2, 20 * dt);
      b.x -= nx * corr; b.y -= ny * corr; o.x += nx * corr; o.y += ny * corr;
    }
  }
}
/* Position + petit écrasement « boing » juste après un rebond (pas de déplacement). */
function dessinerBulle(b){
  b.el.setAttribute('transform', 'translate(' + f2(b.x) + ',' + f2(b.y) + ')');
  var D = 0.5;
  if(b.sqT < D){
    var u = b.sqT / D, amt = 0.07 * b.sqF * Math.sin(Math.PI * u) * (1 - u * 0.5);
    b.sq.setAttribute('transform', 'rotate(' + f2(b.sqA) + ') scale(' + f2(1 - amt) + ',' + f2(1 + amt * 0.6) + ') rotate(' + f2(-b.sqA) + ')');
    b.sqOn = true;
  } else if(b.sqOn){ b.sq.removeAttribute('transform'); b.sqOn = false; }
}
function nouvelleBulle(i, def, g, r, s){
  var a = (Math.floor(Math.random() * 4) * 90 + U.rand(25, 65)) * Math.PI / 180;
  return {i:i, d:def, el:g, sq:g.querySelector('.mjbu-sq'), x:0, y:0, vx:Math.cos(a) * s, vy:Math.sin(a) * s, s:s, r:r, etat:'ok', vivant:true, sqT:9, sqA:0, sqF:1, sqOn:false};
}
/* Place les bulles sans qu'elles se touchent. */
function placer(liste, A){
  var ecart = 18;
  for(var essai = 0; essai < 60; essai++){
    var ok = true;
    for(var i = 0; i < liste.length && ok; i++){
      var b = liste[i], bon = false;
      for(var k = 0; k < 250 && !bon; k++){
        b.x = U.rand(A.x0 + b.r + 6, Math.max(A.x0 + b.r + 7, A.x1 - b.r - 6));
        b.y = U.rand(A.y0 + b.r + 6, Math.max(A.y0 + b.r + 7, A.y1 - b.r - 6));
        bon = true;
        for(var j = 0; j < i; j++){ var o = liste[j]; if(Math.hypot(o.x - b.x, o.y - b.y) < o.r + b.r + ecart){ bon = false; break; } }
      }
      if(!bon) ok = false;
    }
    if(ok) return;
    ecart = Math.max(3, ecart - 3);
  }
}

/* ---------- Ingrédients qui tombent dans le chaudron ---------- */
function Ingredients(calque, plouf){
  var liste = [];
  return {
    lancer: function(b, x1, y1, fini){
      var g = svgNoeud('g', {'class':'mjbu-ingr'}, calque);
      g.innerHTML = '<g fill="' + b.d.c + '" stroke="' + CONTOUR + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">' + b.d.s + '</g>';
      liste.push({el:g, c:b.d.c, x0:b.x, y0:b.y, x1:x1, y1:y1, cx:(b.x + x1) / 2 + U.rand(-25, 25), cy:Math.min(b.y, y1) - U.rand(35, 70),
        t:0, dur:U.rand(0.8, 0.95), rot:U.rand(0, 360), vr:U.rand(-280, 280), fini:fini});
      g.setAttribute('transform', 'translate(' + f2(b.x) + ',' + f2(b.y) + ') scale(.4)');
    },
    maj: function(dt){
      for(var i = liste.length - 1; i >= 0; i--){
        var it = liste[i]; it.t += dt;
        /* courbe de Bézier quadratique parcourue à vitesse constante = vraie parabole (gravité) */
        var u = Math.min(1, it.t / it.dur), m = 1 - u;
        var x = m * m * it.x0 + 2 * m * u * it.cx + u * u * it.x1, y = m * m * it.y0 + 2 * m * u * it.cy + u * u * it.y1;
        var s = u < 0.15 ? 0.4 + 1.3 * (u / 0.15) : 1.7 - 0.8 * Math.pow((u - 0.15) / 0.85, 2);
        it.el.setAttribute('transform', 'translate(' + f2(x) + ',' + f2(y) + ') rotate(' + f2((it.rot + it.vr * it.t) % 360) + ') scale(' + f2(s) + ')');
        if(u >= 1){
          liste.splice(i, 1);
          if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
          plouf(it.x1, it.y1, it.c);
          if(it.fini) it.fini();
        }
      }
    },
    nombre: function(){ return liste.length; }
  };
}
/* Couleur du liquide (et de sa lueur) qui change en douceur. */
function Liquide(svg){
  var eLiq = svg.querySelector('.mjbu-liquide'), stops = Array.prototype.slice.call(svg.querySelectorAll('.mjbu-lueur-c'));
  var L = {c:hexRgb(LIQ0), de:hexRgb(LIQ0), vers:hexRgb(LIQ0), t:1, dur:1};
  function poser(txt){ eLiq.setAttribute('fill', txt); stops.forEach(function(s){ s.setAttribute('stop-color', txt); }); }
  return {
    teinter: function(hex, dur){ L.de = L.c.slice(); L.vers = hexRgb(hex); L.t = 0; L.dur = dur || 0.9; },
    maj: function(dt){ if(L.t >= 1) return; L.t = Math.min(1, L.t + dt / L.dur); L.c = mixRgb(L.de, L.vers, lisse(L.t)); poser(rgbTxt(L.c)); },
    lueur: function(txt){ stops.forEach(function(s){ s.setAttribute('stop-color', txt); }); },
    couleur: function(){ return rgbTxt(L.c); },
    clair: function(){ return rgbTxt(mixRgb(L.c, [255, 255, 255], 0.45)); }
  };
}
function eclaboussure(calque, x, y, c){
  var g = svgNoeud('g', {transform:'translate(' + f2(x) + ',' + f2(y) + ')'}, calque);
  var s = '<ellipse class="mjbu-rond" rx="16" ry="4" stroke="' + c + '"/>';
  for(var k = 0; k < 6; k++){

  }
  g.innerHTML = s;
  return g;
}

/* ---------- Réglages ---------- */
function reglages(n, mods){
  mods = mods || {};
  var p = {};
  p.bulles = Math.round(courbe(n, {1:4, 3:5, 6:6, 10:7, 12:8}));
  p.manches = 4;
  p.depart = n <= 2 ? 2 : (n >= 12 ? 4 : 3);
  p.longueurs = [0, 1, 2, 3].map(function(k){ return p.depart + k; });
  var tps = fixe(mods.temps || 0, 0, 5);
  p.lent = mods.lent || 1;
  /* dérive en unités de jeu par seconde (l'aire de jeu fait 360 unités de large au téléphone) */
  p.vitesse = courbe(n, {1:2.5, 3:3.6, 6:5, 10:7, 12:8.5}) * p.lent / (1 + 0.05 * tps);
  /* temps entre deux bulles qui s'allument */
  p.intervalle = courbe(n, {1:0.95, 3:0.82, 6:0.66, 10:0.5, 12:0.44});
  p.rayon = courbe(n, {1:40, 3:38, 6:36, 10:34, 12:32}) * (mods.zone || 1);
  p.vies = (n <= 2 ? 5 : (n <= 4 ? 4 : 3)) + Math.max(0, Math.round(mods.erreurs || 0));
  p.erreurs = p.vies - 1;
  p.eclate = fixe(Math.round(mods.eclate || 0), 0, Math.min(3, p.bulles - 3));
  p.aide = Math.max(0, Math.round(mods.aide || 0));
  p.revele = !!mods.revele;
  p.repetitions = n >= 7;   /* la suite peut repasser par une bulle déjà vue (jamais deux fois de suite) */
  var v = p.vitesse;
  var bouge = v < 3 ? 'tout, tout doucement 🐌' : (v < 4.6 ? 'très doucement 🐌' : (v < 7.6 ? 'doucement' : 'un peu plus vite'));
  var iv = p.intervalle;
  var allume = iv >= 0.85 ? 'lentement' : (iv >= 0.7 ? 'tranquillement' : (iv >= 0.58 ? 'normalement' : 'assez vite'));
  p.lignes = [
    {nom:'Les bulles', val:p.bulles + ' bulles'},
    {nom:'À retenir', val:p.longueurs.slice(0, 3).join(', puis ') + ', puis ' + p.longueurs[3] + ' bulles'},
    {nom:'Elles bougent', val:bouge},
    {nom:'Elles s\'allument', val:allume},
    {nom:'Taille des bulles', val:p.rayon >= 39 ? 'grosses' : (p.rayon >= 33 ? 'moyennes' : 'petites')},
    {nom:'Tes vies', val:p.vies + ' ❤️'}
  ];
  if(p.eclate) p.lignes.push({nom:'Une bulle éclate 🫧', val:['', 'à la manche 2', 'aux manches 2 et 3', 'aux manches 2, 3 et 4'][p.eclate]});
  if(p.aide) p.lignes.push({nom:'Indices 💡', val:String(p.aide)});
  if(p.revele) p.lignes.push({nom:'La bonne bulle brille', val:'oui ✨'});
  return p;
}

  Z.bouillant = [Z.rouge[1], 100];

  for(var i = 0; i < pts.length - 1; i++){
    if(h <= pts[i + 1][0]){

function choisirPotion(n){

/* Point de la scène SVG → coordonnées dans un élément (tient compte du cadrage) */
function versEl(E, x, y, el){
  var m = E.svg.getScreenCTM(), r = el.getBoundingClientRect();
  if(!m) return {x:0, y:0};
  var p = E.svg.createSVGPoint(); p.x = x; p.y = y; p = p.matrixTransform(m);
  return {x:p.x - r.left, y:p.y - r.top};
}
/* La louche, recalculée à chaque image à partir de son angle (vraie perspective) */
function dessinerLouche(E, theta){
  var c = Math.cos(theta), s = Math.sin(theta), L = LOUCHE;
  var B = [L.r * c, -2, L.r * s];
  var dir = [L.a * c, L.b, L.a * s];
  var t0 = (L.haut + 2) / (L.L * L.b);
  function pt(t){ return proj(B[0] + dir[0] * L.L * t, B[1] + dir[1] * L.L * t, B[2] + dir[2] * L.L * t); }
  var pB = pt(0), pM = pt(t0), pH = pt(1);
  function quad(p0, p1, w0, w1){
    var dx = p1.x - p0.x, dy = p1.y - p0.y, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
    return [[p0.x + nx * w0, p0.y + ny * w0], [p1.x + nx * w1, p1.y + ny * w1], [p1.x - nx * w1, p1.y - ny * w1], [p0.x - nx * w0, p0.y - ny * w0]];
  }
  function str(q){ return q.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
  var w = function(p, base){ return base * p.s; };
  E.mancheIn.setAttribute('points', str(quad(pB, pM, w(pB, 5.5), w(pM, 6))));
  E.manche.setAttribute('points', str(quad(pM, pH, w(pM, 6), w(pH, 8.5))));
  /* reflet : un filet clair du côté de la lumière (en haut à gauche) */
  var dx = pH.x - pM.x, dy = pH.y - pM.y, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  if(nx > 0 || (nx === 0 && ny > 0)){ nx = -nx; ny = -ny; }
  var r0 = [pM.x + nx * w(pM, 2.5), pM.y + ny * w(pM, 2.5)], r1 = [pH.x + nx * w(pH, 4), pH.y + ny * w(pH, 4)];
  E.reflet.setAttribute('points', str(quad({x:r0[0], y:r0[1]}, {x:r1[0], y:r1[1]}, w(pM, 1.4), w(pH, 2))));
  E.pommeau.setAttribute('cx', pH.x.toFixed(1)); E.pommeau.setAttribute('cy', pH.y.toFixed(1)); E.pommeau.setAttribute('r', (8.5 * pH.s).toFixed(1));
  E.ride.setAttribute('cx', pB.x.toFixed(1)); E.ride.setAttribute('cy', pB.y.toFixed(1)); E.ride.setAttribute('rx', (24 * pB.s).toFixed(1)); E.ride.setAttribute('ry', (24 * pB.s * SINA).toFixed(1));
  E.cuilleron.setAttribute('cx', (pB.x - c * 10 * pB.s).toFixed(1)); E.cuilleron.setAttribute('cy', (pB.y + 3).toFixed(1)); E.cuilleron.setAttribute('rx', (20 * pB.s).toFixed(1)); E.cuilleron.setAttribute('ry', (20 * pB.s * SINA).toFixed(1));
  E.tour.setAttribute('transform', 'translate(' + CX + ',' + CY + ') scale(1,' + SINA + ') rotate(' + (theta * 180 / Math.PI).toFixed(1) + ') translate(' + (-CX) + ',' + (-CY) + ')');
  /* au fond, le manche passe derrière le bord du chaudron (fondu continu selon l'angle) */
  E.bordArriere.setAttribute('opacity', Math.max(0, Math.min(1, -s * 2.5)).toFixed(2));
}

/* La jauge : bandes de couleur, arc-en-ciel, cible */
function preparerJauge(E, Z, nomCible){
  E.jauge.style.background = gradJauge(Z);
  E.jAe.style.bottom = Z['arc-en-ciel'][0] + '%';
  E.jAe.style.height = (Z['arc-en-ciel'][1] - Z['arc-en-ciel'][0]) + '%';
  var b = Z[nomCible] || Z.vert;
  E.jCible.style.bottom = b[0] + '%';
  E.jCible.style.height = (b[1] - b[0]) + '%';
}

/* ==========================================================
   SAGE — l'alphabet secret des fondateurs (pigpen)
   ========================================================== */
var X_CHEMINS = ['M4 4L15 15L26 4', 'M4 4L15 15L4 26', 'M26 4L15 15L26 26', 'M4 26L15 15L26 26'];
function glyphe(l, cls){
  var i = l.charCodeAt(0) - 65, p = '', point = false, cx = 15, cy = 15;
  if(i < 0 || i > 25) return '';
  if(i < 18){
    if(i >= 9){ point = true; i -= 9; }
    var r = Math.floor(i / 3), c = i % 3;
    if(r > 0) p += 'M4 4H26';
    if(r < 2) p += 'M4 26H26';
    if(c > 0) p += 'M4 4V26';
    if(c < 2) p += 'M26 4V26';
  } else {
    i -= 18;
    if(i >= 4){ point = true; i -= 4; }
    p = X_CHEMINS[i]; cx = [15, 8, 22, 15][i]; cy = [8, 15, 15, 22][i];
  }
  return '<svg class="mjb-glyphe ' + (cls || '') + '" viewBox="0 0 30 30" aria-hidden="true"><path class="ombre" d="' + p + '"/><path d="' + p + '"/>' + (point ? '<circle cx="' + cx + '" cy="' + cy + '" r="3"/>' : '') + '</svg>';
}
/* Schéma classique des grilles (niveaux élevés) */
function schemaPigpen(){
  var s = '<svg class="mjb-schema" viewBox="0 0 430 112" role="img" aria-label="La clé en grilles">';
  function lettre(x, y, l, point){ return '<text x="' + x + '" y="' + y + '">' + l + '</text>' + (point ? '<circle cx="' + (x + 10) + '" cy="' + (y - 14) + '" r="2.6"/>' : ''); }
  function grille(ox, debut, point){
    var g = '<path d="M' + (ox + 33.3) + ' 6V106M' + (ox + 66.6) + ' 6V106M' + ox + ' 39.3H' + (ox + 100) + 'M' + ox + ' 72.6H' + (ox + 100) + '"/>';
    for(var k = 0; k < 9; k++){ var r = Math.floor(k / 3), c = k % 3; g += lettre(ox + 16.6 + c * 33.3, 6 + 22.6 + r * 33.3, String.fromCharCode(debut + k), point); }
    return g;
  }
  function croix(ox, debut, point){
    var g = '<path d="M' + (ox + 10) + ' 12L' + (ox + 90) + ' 100M' + (ox + 90) + ' 12L' + (ox + 10) + ' 100"/>';
    var pos = [[50, 38], [24, 63], [76, 63], [50, 92]];
    for(var k = 0; k < 4; k++) g += lettre(ox + pos[k][0], pos[k][1], String.fromCharCode(debut + k), point);
    return g;
  }
  s += grille(4, 65, false) + grille(112, 74, true) + croix(220, 83, false) + croix(326, 87, true);
  return s + '</svg>';
}

/* mods compris : erreurs (+N), aide (N lettres différentes révélées), revele (clé dans l'ordre alphabétique).
   params : message (majuscules, espaces), lettresDonnees (tableau ou chaîne de lettres déjà connues). */
MJ.enregistrer('alphabet', {
  nom:'L\'alphabet secret', role:'sage', ic:'🔣',
  consigne:"Regarde le symbole qui brille. Trouve le même dans la clé et touche-le.",
  reglages: function(n, mods){
    mods = mods || {};
    var erreurs = Math.round(U.parNiveau(n, 6, 1, 0)) + (mods.erreurs || 0);
    var cle = mods.revele ? 'liste' : (n <= 3 ? 'liste' : n <= 6 ? 'melangee' : 'grilles');
    var auto = n <= 5 || !!mods.revele;
    return {erreurs:erreurs, cle:cle, autoRemplir:auto, aide:mods.aide || 0, lignes:[
      {nom:'Erreurs permises', val:String(erreurs)},
      {nom:'La clé', val:cle === 'liste' ? 'dans l\'ordre' : cle === 'melangee' ? 'mélangée' : 'en grilles'},
      {nom:'Symboles pareils', val:auto ? 'remplis tout seuls' : 'un par un'}
    ].concat(mods.aide ? [{nom:'Lettres offertes', val:String(mods.aide)}] : [])};
  },
  demo: function(el){
    return demo(el,
      '<div class="mjb-d-alpha"><div class="mjb-d-msg"><span class="cur">' + glyphe('M') + '<b>M</b></span><span>' + glyphe('I') + '<b></b></span><span>' + glyphe('N') + '<b></b></span></div>' +
      '<div class="mjb-d-cle"><i>' + glyphe('A') + 'A</i><i data-l="M">' + glyphe('M') + 'M</i><i>' + glyphe('S') + 'S</i><i>' + glyphe('E') + 'E</i></div></div>',
      4600, [
        [0, function(c){ c.box.classList.remove('vu'); c.va(50, 96); }],
        [900, function(c){ c.va(40, 80); }],
        [1500, function(c){ c.tape(); c.box.classList.add('vu'); }]
      ]);
  },
  jouer: function(el, p, fin){
    var T = minuteurs();
    var msg = sansAccents(p.message || 'MINUIT AU CLOCHER').toUpperCase().replace(/\s+/g, ' ').trim();
    var cases = msg.split('').map(function(ch){ return {l:ch, lettre:/[A-Z]/.test(ch), rempli:!/[A-Z]/.test(ch)}; });
    var donnees = {};
    String(Array.isArray(p.lettresDonnees) ? p.lettresDonnees.join('') : (p.lettresDonnees || '')).toUpperCase().split('').forEach(function(l){ if(/[A-Z]/.test(l)) donnees[l] = true; });
    var distinctes = []; cases.forEach(function(c){ if(c.lettre && distinctes.indexOf(c.l) < 0 && !donnees[c.l]) distinctes.push(c.l); });
    U.melanger(distinctes).slice(0, Math.min(p.aide || 0, Math.max(0, distinctes.length - 1))).forEach(function(l){ donnees[l] = true; });
    cases.forEach(function(c){ if(c.lettre && donnees[c.l]) { c.rempli = true; c.offert = true; } });
    var erreurs = 0, cur = -1, termine = false;
    // Message découpé en mots
    var html = '', mot = '';
    cases.forEach(function(c, i){
      if(c.l === ' '){ html += '<span class="mjb-mot">' + mot + '</span>'; mot = ''; return; }
      if(!c.lettre){ mot += '<span class="mjb-case autre"><b>' + esc(c.l) + '</b></span>'; return; }
      mot += '<button type="button" class="mjb-case' + (c.rempli ? ' rempli offert' : '') + '" data-i="' + i + '" data-l="' + c.l + '">' + glyphe(c.l) + '<b>' + (c.rempli ? c.l : '') + '</b></button>';
    });
    if(mot) html += '<span class="mjb-mot">' + mot + '</span>';
    var lettres = plage(26).map(function(k){ return String.fromCharCode(65 + k); });
    var cle;
    if(p.cle === 'grilles'){
      cle = '<div class="mjb-cle-grilles">' + schemaPigpen() + '<div class="mjb-clavier">' + lettres.map(function(l){ return '<button type="button" class="mjb-touche lettre" data-l="' + l + '">' + l + '</button>'; }).join('') + '</div></div>';
    } else {
      var ordre = p.cle === 'melangee' ? U.melanger(lettres) : lettres;
      cle = '<div class="mjb-cle">' + ordre.map(function(l){ return '<button type="button" class="mjb-touche" data-l="' + l + '">' + glyphe(l) + '<span>' + l + '</span></button>'; }).join('') + '</div>';
    }
    el.innerHTML =
      '<div class="mjb-jeu mjb-alphabet mjb-sage-fond">' +
        '<div class="mjb-parchemin-feuille"><div class="mjb-message">' + html + '</div></div>' +
        '<div class="mjb-ligne-etat"><span class="mjb-consigne-mini">✨ Quel est ce symbole ?</span>' + jaugeHTML(p.erreurs) + '</div>' +
        '<div class="mjb-cle-titre sur-titre">🔑 La clé des fondateurs</div>' + cle +
      '</div>';
    var root = el.firstChild;
    function caseNode(i){ return root.querySelector('.mjb-case[data-i="' + i + '"]'); }
    function prochaine(depuis){
      for(var j = 0; j < cases.length; j++){ var q = (depuis + j) % cases.length; if(cases[q].lettre && !cases[q].rempli) return q; }
      return -1;
    }
    function choisir(i){
      if(cur >= 0 && caseNode(cur)) caseNode(cur).classList.remove('cur');
      cur = i; root.dataset.cur = i >= 0 ? cases[i].l : '';
      if(i >= 0) caseNode(i).classList.add('cur');
    }
    function remplir(i){
      cases[i].rempli = true;
      var n = caseNode(i); n.classList.remove('cur'); n.classList.add('rempli', 'arrive');
      n.querySelector('b').textContent = cases[i].l;
    }
    function verifierFin(){
      if(cases.every(function(c){ return c.rempli; })){
        termine = true; root.classList.add('gagne'); U.son('magie');
        T.t(function(){ U.lire(msg.toLowerCase()); }, 300);
        T.t(function(){ fin({reussi:true, erreurs:erreurs, message:'Message déchiffré !', detail:'« ' + msg + ' »', message_dechiffre:msg}); }, 2200);
        return true;
      }
      return false;
    }
    root.querySelector('.mjb-message').addEventListener('click', function(e){
      var b = e.target.closest('.mjb-case[data-i]'); if(!b || termine) return;
      var i = +b.dataset.i; if(cases[i].rempli) return;
      U.son('clic'); choisir(i);
    });
    root.addEventListener('click', function(e){
      var t = e.target.closest('.mjb-touche'); if(!t || termine || cur < 0) return;
      var l = t.dataset.l;
      if(l === cases[cur].l){
        U.son('ok');
        t.classList.remove('bon'); void t.offsetWidth; t.classList.add('bon');
        if(p.autoRemplir){ cases.forEach(function(c, i){ if(c.lettre && !c.rempli && c.l === l) remplir(i); }); }
        else remplir(cur);
        if(!verifierFin()) choisir(prochaine(cur + 1));
      } else {
        erreurs++; U.son('ko'); U.vibrer(60);
        t.classList.remove('faux'); void t.offsetWidth; t.classList.add('faux');
        secoue(caseNode(cur));
        majJauge(root, erreurs);
        if(erreurs > (p.erreurs || 0)){ termine = true; T.t(function(){ fin({reussi:false, erreurs:erreurs, message:'Le message reste secret…', detail:'Trop d\'erreurs : l\'encre s\'est brouillée.'}); }, 700); }
      }
    });
    if(!verifierFin()) choisir(prochaine(0));
    return {arreter: function(){ termine = true; T.tout(); }};
  }
});

  }
});

  /* « Ce [soir], tu… » -> morceaux texte / trou */
  var l = [], re = /\[([^\]]+)\]/g, m, i = 0;
  while((m = re.exec(texte))){ if(m.index > i) l.push({t:texte.slice(i, m.index)}); l.push({trou:m[1]}); i = m.index + m[0].length; }
  if(i < texte.length) l.push({t:texte.slice(i)});
  return l;
}

/* ==========================================================
   Brumeval — mini-jeu du Barde : « Les ragots de la taverne »
   Cinq ragots tirés au hasard parmi une centaine (ragots.js),
   racontés par des habitants différents. Le Barde dit s'il y croit.
   On ne lui dit JAMAIS lesquels étaient vrais : seulement combien
   de fois il s'est trompé. Ce qu'il a entendu va dans son carnet.
   params : enquete (numéro), ragots (liste imposée, facultatif)
   mods : erreurs (+N permises), aide (N ragots dont le carnet de ragots connaît la réponse),
          pistes (+N ragots liés à l'enquête)
   Résultat : ragots [{texte, qui, reponse}], erreurs
   ========================================================== */
(function(){
'use strict';
if(!window.MJ) return;
var U = MJ.util;
var NB = 5;
var IC = {grosbec:'🎩', gaspard:'👨‍🍳', melusine:'👩‍🦰', basile:'👨‍🌾', odette:'👵', tim:'🧒', victor:'🧔', anselme:'👴', iris:'👩‍🌾', fortune:'🤠', silas:'💂', farinel:'🧑‍🌾', margot:'👩‍🍳'};
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nomDe(id){ var D = window.DONNEES; return (D && D.PNJ && D.PNJ[id] && D.PNJ[id].court) || id; }
function portrait(id){
  if(window.Persos && Persos.pnj){ try{ var s = Persos.pnj(id, {anime:true}); if(s) return s; }catch(e){} }
  return '<span class="mr-emoji">' + (IC[id] || '🙂') + '</span>';
}

/* Tire cinq ragots : deux pistes de l'enquête au plus, le reste sur la vie du village,
   avec toujours au moins deux vrais et deux faux, et un conteur différent pour chacun. */
function tirer(enq, imposes, pistesEnPlus){
  var B = window.RAGOTS || {liste:[], conteurs:[{id:'margot'}]};
  var choisis;
  if(imposes && imposes.length){
    choisis = imposes.map(function(r){ return {t:r.texte || r.t, v:(r.vrai !== undefined ? r.vrai : r.v) ? 1 : 0, sur:r.sur || []}; }).slice(0, NB);
  } else {
    var pistes = (B.enquete && B.enquete[enq]) || B.liste.filter(function(r){ return r.enq === enq; });
    var village = (B.village || B.liste.filter(function(r){ return !r.enq; })).filter(function(r){ return (r.des || 1) <= enq; });
    for(var essai = 0; essai < 60; essai++){
      var nbP = Math.min(pistes.length, NB - 1, U.randInt(1, 2) + (pistesEnPlus || 0));
      choisis = U.melanger(pistes).slice(0, nbP).concat(U.melanger(village).slice(0, NB - nbP));
      var vrais = choisis.filter(function(r){ return r.v; }).length;
      if(vrais >= 2 && vrais <= NB - 2) break;
    }
    choisis = U.melanger(choisis);
  }
  var dispo = B.conteurs.filter(function(c){ return (c.des || 1) <= enq; }).map(function(c){ return c.id; });
  var pris = {};
  choisis.forEach(function(r){
    var ok = U.melanger(dispo).filter(function(id){ return !pris[id] && (r.sur || []).indexOf(id) < 0; });
    var qui = ok[0] || U.melanger(dispo).filter(function(id){ return (r.sur || []).indexOf(id) < 0; })[0] || 'margot';
    pris[qui] = true; r.qui = qui;
  });
  return choisis;
}
function bilan(erreurs){
  if(!erreurs) return 'Tu as eu le nez fin : tu as trouvé tous les ragots !';
  if(erreurs === 1) return 'Tu t\'es trompé sur un ragot.';
  return 'Tu t\'es trompé ' + erreurs + ' fois.';
}

/* ===== revision.js ===== */
/* ==========================================================
   Brumeval — relire un mini-jeu du Barde après coup.
   Mensonge (les paroles, sans le visage), ragots, mots perdus.
   On peut changer ses propres avis autant qu'on veut, mais on
   n'a JAMAIS la réponse : seulement le bilan (« tu t'es trompé 1 fois »).
   Revision.monter(el, rev, onChange)  — rev est modifié sur place.
   Formats :
     {type:'mensonge', titre, bilan, nom, ic, phrases:[{texte, avis}]}       avis : true = « mensonge ? »
     {type:'ragots', titre, bilan, ragots:[{texte, qui, reponse, avis}]}      avis : true = « j'y crois »
     {type:'mots', titre, bilan, phrases:[{qui, morceaux:[{t}|{trou:1, pose}]}], mots:[…]}
   ========================================================== */
(function(){
'use strict';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function entete(rev, sous){
  return '<div class="rv-tete"><h3>' + esc(rev.titre || 'À revoir') + '</h3>' +
    (rev.bilan ? '<p class="rv-bilan">' + esc(rev.bilan) + '</p>' : '') +
    '<p class="rv-sous">' + sous + '</p></div>';
}
function rendre(el, rev, etat){
  var s = '';
  if(rev.type === 'mensonge'){
    s += entete(rev, (rev.nom ? esc(rev.nom) + ' est parti' : 'Le villageois est parti') + ' : il ne reste que ses paroles. Touche une phrase pour changer d\'avis. Personne ne te dira qui avait raison.');
    s += '<ul class="rv-liste">' + rev.phrases.map(function(p, i){
      var a = p.avis === true ? 'faux' : p.avis === false ? 'vrai' : 'doute';
      return '<li><button type="button" class="rv-item ' + a + '" data-rv-avis="' + i + '"><span class="rv-num">' + (i + 1) + '</span><p>« ' + esc(p.texte) + ' »</p><span class="rv-etiq">' +
        (a === 'faux' ? '🤥 Mensonge ?' : a === 'vrai' ? '🙂 Vrai ?' : '🤔 Je ne sais pas') + '</span></button></li>';
    }).join('') + '</ul>';
  } else if(rev.type === 'ragots'){
    s += entete(rev, 'Voici les ragots que tu as entendus. Touche-les pour changer d\'avis : lesquels t\'ont trompé ? Personne ne te le dira.');
    s += '<ul class="rv-liste">' + rev.ragots.map(function(r, i){
      var a = r.avis === true ? 'vrai' : r.avis === false ? 'faux' : 'doute';
      return '<li><button type="button" class="rv-item ' + a + '" data-rv-avis="' + i + '"><span class="rv-num">' + (IC[r.qui] || '🗣️') + '</span><p><b>' + esc(nomDe(r.qui)) + ' :</b> « ' + esc(r.texte) + ' »' +
        (r.reponse !== undefined && r.reponse !== r.avis ? '<small class="rv-avant">Pendant le jeu, tu ' + (r.reponse ? 'y as cru' : 'n\'y as pas cru') + '.</small>' : '') + '</p><span class="rv-etiq">' +
        (a === 'vrai' ? '👍 J\'y crois' : a === 'faux' ? '👎 Faux ?' : '🤔 Je ne sais pas') + '</span></button></li>';
    }).join('') + '</ul>';
  } else if(rev.type === 'mots'){
    s += entete(rev, 'Voici ce que tu as cru entendre. Touche un mot pour le changer et cherche l\'erreur… Personne ne te dira si c\'est juste.');
    var n = 0;
    s += '<div class="rv-parchemin">' + rev.phrases.map(function(l){
      return '<p class="rv-ligne"><span class="rv-qui">' + esc(l.qui || '💬') + '</span><span>' + l.morceaux.map(function(m){
        if(!m.trou) return esc(m.t);

      }).join('') + '</span></p>';
    }).join('') + '</div>';
    s += '<p class="rv-sous">' + (etat.choisi === null ? 'Touche d\'abord un mot de la phrase.' : 'Choisis le mot que tu veux essayer à la place :') + '</p>';
    s += '<div class="rv-mots">' + (rev.mots || []).map(function(m, i){ return '<button type="button" class="rv-mot" data-rv-mot="' + i + '"' + (etat.choisi === null ? ' disabled' : '') + '>' + esc(m) + '</button>'; }).join('') + '</div>';
  }
  el.innerHTML = '<div class="rv">' + s + '</div>';
}
function trous(rev){
  var l = [];
  rev.phrases.forEach(function(p){ p.morceaux.forEach(function(m){ if(m.trou) l.push(m); }); });
  return l;
}
window.Revision = {
  monter:function(el, rev, onChange){
    if(!el || !rev) return;
    var etat = {choisi:null};
    rendre(el, rev, etat);
    el.onclick = function(ev){
      var a = ev.target.closest('[data-rv-avis]'), t = ev.target.closest('[data-rv-trou]'), m = ev.target.closest('[data-rv-mot]');

        var i = +a.dataset.rvAvis, it = (rev.type === 'ragots' ? rev.ragots : rev.phrases)[i];
        it.avis = it.avis === true ? false : it.avis === false ? null : true;
      } else if(t){
        var k = +t.dataset.rvTrou; etat.choisi = etat.choisi === k ? null : k;
      } else if(m && etat.choisi !== null){
        var tr = trous(rev)[etat.choisi]; if(tr){ if(tr.avant === undefined) tr.avant = tr.pose; tr.pose = rev.mots[+m.dataset.rvMot]; tr.change = tr.pose !== tr.avant; }
        etat.choisi = null;
      } else return;
      try{ if(window.Brume) Brume.son('clic'); }catch(e){}
      rendre(el, rev, etat);
      if(onChange) try{ onChange(rev); }catch(e){}
    };
  }
};
})();

  if(t === 'obj') return E.objets[x].pour;
  if(t === 'info') return E.infos[x].pour;
  if(t === 'pot') return D.POTIONS[x].pour;
  if(t === 'aide') return 'tous';
  return 'tous';
};
M.nomCode = function(id){
  var E = M.E(), p = id.split(':'), t = p[0], x = p[1];
  if(t === 'obj') return {ic:E.objets[x].ic, nom:E.objets[x].nom};
  if(t === 'info') return {ic:E.infos[x].ic, nom:E.infos[x].nom};
  if(t === 'pot') return {ic:D.POTIONS[x].ic, nom:D.POTIONS[x].nom};
  if(t === 'moment') return {ic:D.MOMENTS[E.moments[+x]].ic, nom:D.MOMENTS[E.moments[+x]].nom};
  if(t === 'aide') return {ic:'💡', nom:'Une action en plus'};
  return {ic:'🏆', nom:'Victoire'};
};

/* ---------- Enquête en cours ---------- */
M.E = function(){ var P = M.S.e; return P ? window.ENQUETES[P.id] : null; };
M.P = function(){ return M.S.e; };
M.enqueteNeuve = function(id){
  var E = window.ENQUETES[id];
  return {id:id, etape:'lettre', moment:0, actions:2, vus:{}, recus:{}, objets:{}, carnet:[], notesCarte:{}, conv:{}, pages:{}, analyses:{},
    potions:{}, bues:{}, erreurs:0, raye:[], bonus:{}, usages:{}, chances:0, resolu:false, fin:null, onglet:'carte', protege:false};
};
M.momentId = function(){ var E = M.E(), P = M.P(); return E.moments[Math.min(P.moment, E.moments.length - 1)]; };
/* Ingrédients : rangés dans l'atelier si le module existe, sinon dans un simple sac */
M.ingr = function(){ var S = M.S; if(window.Atelier && S.atelier) return Atelier.compter(S.atelier); return S.ingr || {}; };
M.ajouterIngr = function(i, n){ var S = M.S; if(window.Atelier){ if(!S.atelier) S.atelier = Atelier.etatNeuf(); Atelier.ajouter(S.atelier, i, n); } else S.ingr[i] = (S.ingr[i] || 0) + n; };
/* Pas de choix de difficulté dans le jeu : les mini-jeux suivent le numéro de l'enquête (+2), puis l'équipement et les talents du héros. */
M.decalage = function(){ return 2; };
M.actionsMax = function(){ return 2 + M.fxSomme('actionBonus'); };
M.noter = function(texte, ic, cle){
  var P = M.P(); if(!P || !texte) return;
  if(cle && P.carnet.some(function(n){ return n.cle === cle; })) return;
  if(P.carnet.some(function(n){ return n.t === texte; })) return;
  P.carnet.push({t:texte, ic:ic || '📝', m:P.moment, cle:cle || null});
};
/* Conditions : liste d'alternatives, une seule suffit */
M.besoinOk = function(besoin){
  if(!besoin || !besoin.length) return true;
  return besoin.some(M.uneCondition);
};
M.uneCondition = function(b){
  var P = M.P();
  if(b.code){
    if(b.code.indexOf('pot:') === 0){ var pid = b.code.slice(4); return (P.potions[pid] || 0) > 0; }
    return !!P.recus[b.code];
  }
  if(b.acces) return M.acces(b.acces);
  if(b.talent) return M.S.talents.indexOf(b.talent) >= 0;
  if(b.objet) return M.S.equip.indexOf(b.objet) >= 0;
  if(b.moment) return M.momentId() === b.moment;
  if(b.page) return !!P.pages[b.page];
  if(b.vu) return !!P.vus[b.vu];
  return false;
};
/* Consomme une potion si c'est elle qui a ouvert la condition */
M.consommerBesoin = function(besoin){
  if(!besoin || !besoin.length) return;
  var P = M.P();
  var autre = besoin.some(function(b){ return !(b.code && b.code.indexOf('pot:') === 0) && M.uneCondition(b); });
  if(autre) return;
  besoin.forEach(function(b){
    if(b.code && b.code.indexOf('pot:') === 0){ var pid = b.code.slice(4); if(P.potions[pid] > 0){ P.potions[pid]--; } }
  });
};
M.texteBesoin = function(besoin, role){
  var vus = {}, l = [];
  (besoin || []).forEach(function(b){
    if(b.code){
      var n = M.nomCode(b.code), de = '';
      var t = b.code.split(':')[0];
      if(t === 'pot') de = ' (de l\'Alchimiste)';
      else if(t === 'obj' || t === 'info') de = ' (un code d\'un équipier)';
      l.push({ic:n.ic, nom:n.nom + de});
    } else if(b.acces){
      M.sourcesAcces(b.acces, role || M.role()).forEach(function(x){ if(!vus[x.nom]){ vus[x.nom] = 1; l.push(x); } });
    } else if(b.talent){ var t2 = D.TALENTS[b.talent]; l.push({ic:t2.ic, nom:'Talent ' + t2.nom}); }
    else if(b.objet){ var o = D.OBJETS[b.objet]; l.push({ic:o.ic, nom:o.nom + ' (boutique)'}); }
    else if(b.page){ var E = M.E(), pg = (E.pages || []).filter(function(x){ return x.id === b.page; })[0]; if(pg) l.push({ic:pg.ic, nom:'Ouvrir d\'abord la page « ' + pg.titre + ' »'}); }
  });
  return l;
};
M.adresse = function(maison){ return (window.Carte && Carte.MAISONS && Carte.MAISONS[maison]) ? Carte.MAISONS[maison].adresse : maison; };
M.nomLieu = function(id){
  if(window.Carte && Carte.LIEUX && Carte.LIEUX[id]) return Carte.LIEUX[id].nom;
  if(/^[LFB]\d$/.test(id)) return M.adresse(id);
  return id;
};
M.icLieu = function(id){ return (window.Carte && Carte.LIEUX && Carte.LIEUX[id] && Carte.LIEUX[id].ic) || (/^[LFB]\d$/.test(id) ? '🏠' : '📍'); };
})();

/* ===== salle.js ===== */
/* ==========================================================
   Brumeval — salle d'entraînement : tous les mini-jeux en accès
   direct, avec le choix de la difficulté, pour les régler.
   ========================================================== */
(function(){
'use strict';
var ROLES = [
  {id:'pisteur', nom:'Pisteur', ic:'🏹', c:'var(--c-pisteur)'},
  {id:'alchimiste', nom:'Alchimiste', ic:'⚗️', c:'var(--c-alchimiste)'},
  {id:'barde', nom:'Barde', ic:'🎻', c:'var(--c-barde)'},
  {id:'sage', nom:'Sage', ic:'📜', c:'var(--c-sage)'}
];
var etat = {niveau:3, aides:false, journal:[]};
try{ var t = JSON.parse(localStorage.getItem('brumeval-salle') || 'null'); if(t){ etat.niveau = t.niveau || 3; etat.aides = !!t.aides; etat.journal = t.journal || []; } }catch(e){}
function sauver(){ try{ localStorage.setItem('brumeval-salle', JSON.stringify(etat)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var LEGENDE = {1:'Plus facile que le jeu', 2:'Plus facile que le jeu', 3:'Le niveau de l\'enquête 1', 4:'Le niveau de l\'enquête 2', 5:'Le niveau de l\'enquête 3', 6:'Enquête 4', 7:'Enquête 5', 8:'Enquête 6', 9:'Enquête 7', 10:'Enquête 8'};
/* Jeux retirés du jeu (remplacés) : on ne les montre plus */
var RETIRES = {ordre:1, temperature:1, rythme:1};
var MODS_AIDES = {erreurs:1, zone:1.25, lent:0.85, aide:1, temps:3};
/* Jeux en cours de refonte : visibles mais pas encore jouables */
var EN_TRAVAUX = {};

function rendre(){
  var app = document.getElementById('salle');
  var s = '<header class="sl-tete"><h1>Salle d\'entraînement</h1><p class="sl-sous">Tous les mini-jeux de Brumeval, sans passer par l\'enquête. Le choix de la difficulté sert seulement à régler les jeux : dans le jeu, elle suit le numéro de l\'enquête et l\'équipement du héros.</p></header>';
  s += '<section class="sl-reglages"><div class="sl-niveaux"><span class="sl-etiq">Difficulté</span><div class="sl-boutons">';
  for(var n = 1; n <= 10; n++) s += '<button class="sl-niv' + (etat.niveau === n ? ' on' : '') + '" data-niv="' + n + '">' + n + '</button>';
  s += '</div><p class="sl-legende">' + esc(LEGENDE[etat.niveau] || ('Niveau ' + etat.niveau)) + '</p></div>' +
    '<label class="sl-aides"><input type="checkbox" id="aides"' + (etat.aides ? ' checked' : '') + '> Avec des aides (comme un héros bien équipé)</label></section>';
  ROLES.forEach(function(r){
    var jeux = Object.keys(MJ.TYPES).filter(function(k){ return MJ.TYPES[k].role === r.id && !RETIRES[k]; });
    if(!jeux.length) return;
    s += '<section class="sl-role" style="--c:' + r.c + '"><h2>' + r.ic + ' ' + r.nom + '</h2><div class="sl-jeux">';
    jeux.forEach(function(k){
      var d = MJ.TYPES[k], dernier = etat.journal.filter(function(j){ return j.type === k; }).slice(-1)[0];
      if(EN_TRAVAUX[k]){ s += '<div class="sl-jeu sl-travaux"><span class="sl-jeu-ic">🚧</span><b>' + esc(d.nom || k) + '</b><small>' + esc(EN_TRAVAUX[k]) + '</small></div>'; return; }
      s += '<button class="sl-jeu" data-jeu="' + k + '"><span class="sl-jeu-ic">' + (d.ic || '🎲') + '</span><b>' + esc(d.nom || k) + '</b>' +
        (dernier ? '<small>' + (dernier.ok ? '✔ réussi' : '✖ raté') + ' au niveau ' + dernier.n + '</small>' : '<small>pas encore joué</small>') +
        (MJ.CALIBRAGE && MJ.CALIBRAGE[k] ? '<small class="sl-cal">🎯 Réglé : l\'enquête 1 joue comme ton ancien niveau ' + Math.min(10, 3 + (MJ.CALIBRAGE[k].decalage || 0)) + (MJ.CALIBRAGE[k].mods && MJ.CALIBRAGE[k].mods.fleches ? ', avec une flèche de plus' : '') + (k === 'poursuite' ? ', 5 obstacles pour se rapprocher' : '') + '</small>' : '') + '</button>';
    });
    s += '</div></section>';
  });
  if(etat.journal.length){
    s += '<section class="sl-journal"><h2>Mes parties</h2><ol>' + etat.journal.slice(-12).reverse().map(function(j){
      var d = MJ.TYPES[j.type] || {};
      var k = etat.journal.indexOf(j);
      return '<li>' + (j.ok ? '✔' : '✖') + ' ' + esc(d.nom || j.type) + ' · niveau ' + j.n + (j.aides ? ' · avec aides' : '') + (j.essais > 1 ? ' · ' + j.essais + ' essais' : '') +
        (j.revision ? ' <button class="btn second petit" data-relire="' + k + '">🔁 Relire</button>' : '') + '</li>';
    }).join('') + '</ol><button class="btn second petit" data-effacer="1">Effacer la liste</button></section>';
  }
  app.innerHTML = s;
}
function relire(k){
  var j = etat.journal[k]; if(!j || !j.revision || !window.Revision) return;
  var plein = document.getElementById('sl-plein');
  plein.innerHTML = '<button class="sl-quitter">← Retour à la salle</button><div class="sl-cadre sl-relire"><div class="sl-rv"></div></div>';
  plein.hidden = false; document.body.classList.add('sl-bloque');
  Revision.monter(plein.querySelector('.sl-rv'), j.revision, sauver);
  plein.querySelector('.sl-quitter').onclick = function(){ plein.hidden = true; plein.innerHTML = ''; document.body.classList.remove('sl-bloque'); rendre(); };
}
function jouer(type){
  var plein = document.getElementById('sl-plein');
  plein.innerHTML = '<button class="sl-quitter">← Retour à la salle</button><div class="sl-cadre"></div>';
  plein.hidden = false; document.body.classList.add('sl-bloque');
  var mods = etat.aides ? MODS_AIDES : {};
  var params = MJ.reglages(type, etat.niveau, Object.assign({}, mods));
  var aides = etat.aides ? [{ic:'🎒', nom:'Équipement et talents de héros', effet:'une erreur de plus, zones plus larges, un peu plus lent'}] : [];
  var partie = MJ.lancer(plein.querySelector('.sl-cadre'), type, params, function(res){
    etat.journal.push({type:type, n:etat.niveau, ok:!!res.reussi, aides:etat.aides, essais:res.essais || 1, revision:res.revision || null});
    if(etat.journal.length > 30) etat.journal = etat.journal.slice(-30);
    sauver(); fermer();
  }, {aides:aides, lireAuto:false});
  plein.querySelector('.sl-quitter').onclick = function(){ try{ partie.arreter(); }catch(e){} fermer(); };
  function fermer(){ plein.hidden = true; plein.innerHTML = ''; document.body.classList.remove('sl-bloque'); rendre(); }
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-niv],[data-jeu],[data-effacer],[data-relire]');
  if(!b) return;
  if(b.dataset.niv){ etat.niveau = +b.dataset.niv; sauver(); rendre(); }
  else if(b.dataset.jeu) jouer(b.dataset.jeu);
  else if(b.dataset.relire !== undefined){ relire(+b.dataset.relire); }
  else if(b.dataset.effacer){ etat.journal = []; sauver(); rendre(); }
  try{ if(window.Brume) Brume.son('clic'); }catch(e){}
});
document.addEventListener('change', function(ev){ if(ev.target.id === 'aides'){ etat.aides = ev.target.checked; sauver(); } });
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', rendre); else rendre();
})();

</script>
