<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>L'établi des plantes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@500;700&family=Macondo&display=swap">
<style>
/* L'établi des plantes (enquête 3), refait le 12 novembre sur le modèle de la paillasse d'analyse (src/labo/) : on est penché sur
   l'établi de l'atelier, qui remplit tout l'écran. Tout est dessiné et posé dessus ; la table et le mur prennent le style choisi
   dans l'atelier. Les gros plans (une plante de près) sont des zooms de la même image. Tout se mesure avec --u (un point du dessin, 1200 × 640). */
:root{
  --nuit:#131932; --nuit-2:#1c2447; --nuit-3:#28325e; --trait:#3b4679; --brume:#a6aed8; --lune:#eef0ff;
  --parchemin:#f3e7cb; --parchemin-2:#e8d7ae; --encre:#35281b; --encre-2:#6b5434;
  --or:#f5b945; --mousse:#7cc493; --K:#24182e;
  --f-titre:"Macondo", Georgia, "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-main:"Caveat", "Segoe Script", "Comic Sans MS", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0; height:100%; overflow:hidden}
body{background:#1b1430; color:var(--lune); font-family:var(--f-texte); font-size:17px; line-height:1.45; overscroll-behavior:none}
html, body, body *{touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
.app{position:fixed; inset:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
button{font:inherit; color:inherit}
button:focus-visible{outline:3px solid var(--or); outline-offset:2px}
svg [role="button"]{outline:none}
/* Les réglages de la maquette (la page toute seule), rangés derrière un petit bouton */
.barre-haut{position:absolute; z-index:8; top:max(8px, env(safe-area-inset-top, 0px)); left:max(8px, env(safe-area-inset-left, 0px)); display:grid; justify-items:start; gap:6px}
body.ouvert .barre-haut, body.jeu .barre-haut{display:none}
#bReglages{border:1px solid var(--trait); background:rgba(28,36,71,.82); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--brume); cursor:pointer}
.reglages{display:grid; gap:6px; background:rgba(19,25,50,.94); border:1px solid var(--trait); border-radius:14px; padding:10px; max-width:min(360px, 92vw)}
.reglages .ligne{display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:13px; color:var(--brume)}
.reglages .ligne > span{min-width:58px}
.reglages button{border:1px solid var(--trait); background:var(--nuit-2); padding:5px 10px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--lune); min-height:32px}
.reglages button[aria-pressed="true"]{background:var(--nuit-3); border-color:var(--or)}

/* Le bouton rond du coin : revenir à l'atelier (jaune, avec ✔, quand une potion vient d'être finie) */
.coin-jeu{position:absolute; z-index:8; top:max(8px, env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px))}
body.ouvert .coin-jeu{display:none}
body:not(.jeu) .coin-jeu{display:none}
@media (orientation:portrait) and (max-width:620px){ body.jeu .coin-jeu{display:block!important; z-index:100} }
.fermer{width:50px; height:50px; border-radius:50%; border:3px solid var(--K); background:var(--nuit-3); color:var(--lune); font-size:21px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.35)}
#bQuitter.aller{background:linear-gradient(180deg,#ffe08a,#e8a93a); color:#111; font-weight:800; animation:battreQ 1.3s ease-in-out infinite}
@keyframes battreQ{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 0 rgba(255,211,106,.9)} 50%{box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 11px rgba(255,211,106,0)}}

/* Le bouton 🔊 d'un texte de plus de trois mots */
.b-son{flex:none; pointer-events:auto; display:grid; place-items:center; width:max(38px, calc(46*var(--u))); height:max(38px, calc(46*var(--u))); border-radius:50%; border:2px solid var(--K); background:#fff6d8; font-size:max(16px, calc(22*var(--u))); line-height:1; padding:0; cursor:pointer}

/* L'établi */
.cadre{position:absolute; inset:0; overflow:hidden; background:#1b1430; --u:1px}
.decor, .hud-boite{position:absolute; inset:0; margin:auto; width:calc(1200*var(--u)); height:calc(640*var(--u))}
.decor{transform-origin:50% 50%; transition:transform .55s cubic-bezier(.4,0,.2,1)}
#scene{display:block; position:absolute; inset:0; width:100%; height:100%; overflow:visible}
#scene [data-act]{cursor:pointer}
.calque{position:absolute; inset:0; pointer-events:none}
/* Le rond jaune : ce qu'on peut toucher maintenant */
.rond{fill:none; stroke:#ffd36a; stroke-width:4; opacity:0; pointer-events:none; filter:drop-shadow(0 0 5px rgba(255,211,106,.95))}
@keyframes rond{0%,100%{opacity:.25} 50%{opacity:.95}}
/* rien n'est en route : les plantes cueillies appellent */
body.e-choisir .plante.dispo .rond{opacity:.9; animation:rond 1.4s ease-in-out infinite}
/* les plantes cueillies, pendues à la tringle : on en décroche une */
.pendue{cursor:pointer} .pendue .corps-p, .pendue .corps-p *{pointer-events:none} .pendue .pl-z{fill:transparent; stroke:none}
body.e-choisir .pendue .rond{opacity:.9; animation:rond 1.4s ease-in-out infinite}
body.m-plante .pendue, body.m-plante .potion{pointer-events:none}
/* les sept potions sont prêtes : l'étagère appelle (le code pour le Pisteur) */
#portique.appel .potion .rond{opacity:1; animation:rond 1.1s ease-in-out infinite}
.badge-l{animation:rond 1.4s ease-in-out infinite}
/* une matière est en route : là où elle est posée, l'outil appelle (il bouge) ; quand elle vient d'arriver ou de changer, tous les
   outils s'allument un instant (« invite ») : on peut la porter partout */
body.e-matiere.invite .outil:not(.ici) .rond{opacity:.7; animation:rond 1.1s ease-in-out infinite}
body.e-matiere .outil.ici .rond{opacity:1; stroke-width:5; animation:rond 1.1s ease-in-out infinite}
/* on tient la cruche, une bûche, une allumette… : tous les endroits où la poser s'allument */
body.e-tenir .outil .rond{opacity:.8; animation:rond 1.1s ease-in-out infinite}
.porte.tenu .rond{opacity:1!important; stroke-width:5}
.porte .leve{transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.porte.tenu .leve{transform:translateY(-16px) rotate(-5deg); transform-box:fill-box; transform-origin:50% 100%}
body.ouvert .rond{opacity:0!important; animation:none!important}
body.occupe .rond{animation:none!important}
.non-dispo{filter:grayscale(.9) brightness(.8); opacity:.75}
/* l'outil qui attend qu'on le fasse travailler : il remue (le couteau, le pilon, la vis, la cuillère…) */
.outil.ici .agit{animation:agit 1s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
body.occupe .outil.ici .agit{animation:none}
@keyframes agit{0%,100%{transform:rotate(0) translateY(0)} 30%{transform:rotate(-5deg) translateY(-4px)} 60%{transform:rotate(4deg) translateY(-1px)}}
/* dans le gros plan d'une plante : seules ses trois parties se touchent */
body.m-plante .plante:not(.zoom){opacity:.35; pointer-events:none}
body.m-plante .outil, body.m-plante .porte, body.m-plante #gLivre, body.m-plante #g-sac{pointer-events:none}
.plante .pl-z{fill:transparent; stroke:none; pointer-events:all}
.plante .pl-pa{pointer-events:none; transition:opacity .25s}
.plante .pl-decor{pointer-events:none}
body.m-plante .plante.zoom .pl-pa{pointer-events:auto; cursor:pointer; animation:partie 1.5s ease-in-out infinite}
body.m-plante .plante.zoom .pl-pa:nth-of-type(2){animation-delay:-.5s} body.m-plante .plante.zoom .pl-pa:nth-of-type(3){animation-delay:-1s}
@keyframes partie{0%,100%{filter:drop-shadow(0 0 0 rgba(255,211,106,0))} 50%{filter:drop-shadow(0 0 3px #ffb300) drop-shadow(0 0 1px #ffb300)}}
.plante.choisie .pl-pa.pl-sel{filter:drop-shadow(0 0 3px #ffb300) drop-shadow(0 0 2px #ffb300)}
.plante.choisie.partie-sur-linge .pl-pa:not(.pl-sel), .plante.choisie.partie-sur-linge .pl-decor{opacity:.5}
.plante.choisie .pl-pa.pl-pris{opacity:.1}
.plante.faite .corps{opacity:.4; filter:grayscale(.6)}
.plante .etiq{pointer-events:none}

.flamme{transform-box:fill-box; transform-origin:50% 100%; animation:flamme .9s ease-in-out infinite alternate}
.flamme.f2{animation-duration:.7s; animation-delay:-.3s} .flamme.f3{animation-duration:.8s; animation-delay:-.5s}
@keyframes flamme{from{transform:scaleY(1) skewX(-4deg)} to{transform:scaleY(1.16) skewX(5deg)}}
.vapeur{animation:vapeur 2.8s ease-in-out infinite} .vapeur.v2{animation-delay:-1.4s}
@keyframes vapeur{0%{opacity:0; transform:translateY(8px)} 40%{opacity:.75} 100%{opacity:0; transform:translateY(-22px)}}
.secoue-svg{animation:secoueV .45s; transform-box:fill-box}
@keyframes secoueV{0%,100%{transform:none} 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)}}
.scint{animation:scint 2.4s ease-in-out infinite} .scint.s2{animation-delay:-.8s} .scint.s3{animation-delay:-1.6s}
@keyframes scint{0%,100%{opacity:.15; transform:scale(.7)} 50%{opacity:1; transform:scale(1.1)}}
.scint{transform-box:fill-box; transform-origin:50% 50%}
.balance{transform-box:fill-box; transform-origin:50% 0; animation:balance 5s ease-in-out infinite} .balance.b2{animation-delay:-1.7s; animation-duration:6s} .balance.b3{animation-delay:-3.1s; animation-duration:5.5s}
@keyframes balance{0%,100%{transform:rotate(-2.2deg)} 50%{transform:rotate(2.2deg)}}
.lueur-feu{animation:lueurFeu 1.3s ease-in-out infinite alternate}
@keyframes lueurFeu{from{opacity:.55} to{opacity:.95}}
.potion.pleine .halo-p{animation:haloP 3s ease-in-out infinite}
@keyframes haloP{0%,100%{opacity:.25} 50%{opacity:.7}}
#g-sac.appel .saute{animation:saute 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
#g-sac.appel .rond{opacity:1; animation:rond 1.1s ease-in-out infinite}
@keyframes saute{50%{transform:translateY(-7px) scale(1.04)}}
#gLivre .rond{opacity:.5}
body.e-choisir #gLivre .rond{animation:rond 2.2s ease-in-out infinite}
.poussiere{animation:poussiere 9s linear infinite} .poussiere.p2{animation-delay:-3s; animation-duration:11s} .poussiere.p3{animation-delay:-6s; animation-duration:13s}
@keyframes poussiere{0%{opacity:0; transform:translate(0,0)} 20%{opacity:.7} 80%{opacity:.5} 100%{opacity:0; transform:translate(26px,-60px)}}

/* Les bulles posées sur l'établi : de petites phrases, écrites à la main */
.bulle-o{position:absolute; transform:translate(-50%, calc(-100% - 12px)); background:var(--parchemin); color:var(--encre); border:3px solid var(--K); border-radius:14px; padding:6px 10px; font-family:var(--f-main); font-size:clamp(15px, calc(25*var(--u)), 28px); font-weight:700; line-height:1.15; width:max-content; max-width:min(420px, 46%); text-align:center; pointer-events:none; animation:pop .25s ease-out; z-index:5; box-shadow:0 4px 0 rgba(0,0,0,.3)}
.bulle-o::after{content:""; position:absolute; left:var(--queue, 50%); bottom:-11px; width:16px; height:16px; background:var(--parchemin); border-right:3px solid var(--K); border-bottom:3px solid var(--K); transform:translateX(-50%) rotate(45deg)}
.bulle-o.dessous{transform:translate(-50%, 14px)}
.bulle-o.dessous::after{bottom:auto; top:-11px; border:0; border-left:3px solid var(--K); border-top:3px solid var(--K)}
.bulle-o.avec-son{display:flex; align-items:center; gap:7px; text-align:left}
.bulle-o.oups{background:#ffe9d6}
.bulle-o.oups::after{background:#ffe9d6}
.bulle-o.bien{background:#eef8dc}
.bulle-o.bien::after{background:#eef8dc}
@keyframes pop{from{opacity:0; scale:.8} to{opacity:1; scale:1}}
/* Le petit papier « c'est vrai ! » : une chose vraie, dite quand la potion est finie */
.savoir{position:absolute; display:flex; align-items:flex-start; gap:calc(8*var(--u)); background:var(--parchemin); color:var(--encre); border:max(2px, calc(3.5*var(--u))) solid var(--K); border-radius:calc(14*var(--u)); padding:calc(10*var(--u)) calc(12*var(--u)); font-family:var(--f-main); font-weight:700; font-size:max(15px, calc(25*var(--u))); line-height:1.12; box-shadow:0 calc(5*var(--u)) 0 rgba(0,0,0,.35); z-index:7; cursor:pointer; rotate:-1.2deg; animation:pop3 .35s ease-out; pointer-events:auto}
.savoir .sv-ic{flex:none; font-size:1.05em}
.savoir .sv-t{flex:1; min-width:0}
.savoir .sv-t b{display:block; color:#2f6a3a}
@keyframes pop3{from{opacity:0; scale:.7} to{opacity:1; scale:1}}

/* De près : le nom de la plante, et ce qu'on voit d'elle */
.ruban-p{position:absolute; display:flex; align-items:center; gap:calc(12*var(--u)); background:var(--parchemin); color:var(--encre); border:calc(3.5*var(--u)) solid var(--K); border-radius:calc(14*var(--u)); padding:calc(8*var(--u)) calc(16*var(--u)); font-family:var(--f-main); font-weight:700; font-size:calc(27*var(--u)); line-height:1.1; box-shadow:0 calc(5*var(--u)) 0 rgba(0,0,0,.35); animation:pop3 .35s ease-out}
.ruban-p b{font-family:var(--f-titre); font-weight:400; font-size:calc(36*var(--u)); color:#5e1c2a; white-space:nowrap; flex:none}
.ruban-p span{flex:1; min-width:0}
/* Ce qui se pose par-dessus : le grimoire ouvert, le sac, l'explication */
#hud{position:absolute; inset:0; z-index:6; pointer-events:none}
.hud-boite > *{pointer-events:auto}
.mode-haut{position:absolute; z-index:9; top:max(8px, env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); pointer-events:auto}
.voile-l{position:absolute; inset:-200vmax; background:rgba(14,8,24,.6); animation:fondu .3s ease-out}
@keyframes fondu{from{opacity:0}}
/* Le grimoire : un grand livre ouvert, deux pages */
.livre{position:absolute; left:calc(70*var(--u)); top:calc(24*var(--u)); width:calc(1060*var(--u)); height:calc(596*var(--u)); animation:ouvreLivre .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes ouvreLivre{from{opacity:0; scale:.5 .8; translate:0 calc(60*var(--u))}}
.livre .cuir{position:absolute; inset:calc(40*var(--u)) 0 0 0; background:linear-gradient(180deg,#8a2e3e,#5e1c2a); border:calc(4*var(--u)) solid var(--K); border-radius:calc(18*var(--u)); box-shadow:0 calc(10*var(--u)) 0 rgba(0,0,0,.4)}
.livre .pages{position:absolute; inset:calc(52*var(--u)) calc(14*var(--u)) calc(14*var(--u)); display:grid; grid-template-columns:1fr 1fr}
.livre .page{position:relative; min-width:0; min-height:0; background:linear-gradient(90deg,#f6ecd2,#efe1bd); color:var(--encre); padding:calc(16*var(--u)) calc(22*var(--u)); overflow:hidden; display:flex; flex-direction:column; gap:calc(6*var(--u))}
.livre .page.g{border-radius:calc(10*var(--u)) 0 0 calc(10*var(--u)); border:calc(3*var(--u)) solid var(--K); border-right:0; background:linear-gradient(90deg,#efe1bd,#f6ecd2 70%,#e2d2a8)}
.livre .page.d{border-radius:0 calc(10*var(--u)) calc(10*var(--u)) 0; border:calc(3*var(--u)) solid var(--K); border-left:calc(2*var(--u)) solid #b79f6c; background:linear-gradient(90deg,#e2d2a8,#f6ecd2 30%,#efe1bd)}
.livre h2{margin:0; font-family:var(--f-titre); font-size:calc(34*var(--u)); line-height:1.05; color:#5e1c2a; display:flex; align-items:center; gap:calc(10*var(--u))}
.livre h2 svg{width:calc(40*var(--u)); height:calc(56*var(--u)); flex:none}
.livre h3{margin:0; font-family:var(--f-main); font-size:calc(34*var(--u)); line-height:1; color:#3d5a2a}
.livre p, .livre ol{margin:0; font-family:var(--f-main); font-weight:700; font-size:calc(25*var(--u)); line-height:1.12}
.livre ol{padding-left:calc(30*var(--u))}
.livre ol li{margin-bottom:calc(3*var(--u))}
.livre .lg{display:flex; align-items:flex-start; gap:calc(8*var(--u))}
.livre .lg > :first-child{flex:1; min-width:0}
.livre .lg b{color:#8a2e3e}
.livre .planche-b{flex:1; min-height:0; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 40%,#fffaf0,#efe1bd 75%); border:calc(2.5*var(--u)) solid #b79f6c; border-radius:calc(10*var(--u)); position:relative}
.livre .planche-b svg{width:100%; height:100%; position:absolute; inset:0; padding:calc(6*var(--u))}
.livre .planche-b .pl-z{fill:transparent; stroke:none}
.livre .vrai{background:#e3f0d6; border-radius:calc(10*var(--u)); padding:calc(6*var(--u)) calc(10*var(--u)); font-size:calc(23*var(--u))}
.livre .note{background:#ffe9b8; border-radius:calc(10*var(--u)); padding:calc(5*var(--u)) calc(10*var(--u)); font-size:calc(23*var(--u))}
.livre .pied{margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-family:var(--f-main); font-size:calc(22*var(--u)); color:var(--encre-2)}
.livre .fait-t{color:#2f8a3e; font-family:var(--f-main); font-size:calc(26*var(--u)); font-weight:700}
.livre .b-son{width:max(36px, calc(42*var(--u))); height:max(36px, calc(42*var(--u)))}
.signets{position:absolute; left:calc(40*var(--u)); right:calc(40*var(--u)); top:0; height:calc(43*var(--u)); display:flex; gap:calc(8*var(--u)); justify-content:center}
.signet{flex:1 1 0; max-width:calc(132*var(--u)); min-width:0; border:calc(3*var(--u)) solid var(--K); border-bottom:0; border-radius:calc(10*var(--u)) calc(10*var(--u)) 0 0; background:#d9c9a8; color:var(--encre); font-family:var(--f-main); font-weight:700; font-size:calc(22*var(--u)); line-height:1; cursor:pointer; padding:0 calc(4*var(--u)); display:flex; align-items:center; justify-content:center; gap:calc(5*var(--u)); white-space:nowrap; overflow:hidden; translate:0 calc(7*var(--u)); transition:translate .15s}
.signet i{width:calc(14*var(--u)); height:calc(14*var(--u)); border-radius:50%; border:calc(2*var(--u)) solid var(--K); flex:none}
.signet[aria-pressed="true"]{background:var(--or); translate:0 0}
.signet.fait::after{content:"✓"; color:#2f8a3e}
.tourne-p{position:absolute; top:50%; width:calc(56*var(--u)); height:calc(56*var(--u)); min-width:40px; min-height:40px; translate:0 -50%; border-radius:50%; border:calc(3.5*var(--u)) solid var(--K); background:linear-gradient(180deg,#ffe08a,#e8a93a); color:#111; font-size:calc(26*var(--u)); line-height:1; cursor:pointer; display:grid; place-items:center; padding:0; box-shadow:0 calc(4*var(--u)) 0 rgba(0,0,0,.35); z-index:2}
.tourne-p.prec{left:calc(-30*var(--u))} .tourne-p.suiv{right:calc(-30*var(--u))}
/* Le sac, l'explication : une carte de parchemin */
.carte{position:absolute; left:50%; top:50%; translate:-50% -50%; width:calc(760*var(--u)); max-height:calc(600*var(--u)); background:var(--parchemin); color:var(--encre); border:calc(4*var(--u)) solid var(--K); border-radius:calc(20*var(--u)); padding:calc(18*var(--u)) calc(24*var(--u)); box-shadow:0 calc(8*var(--u)) 0 rgba(0,0,0,.4); font-family:var(--f-main); font-weight:700; text-align:center; animation:pop3 .35s ease-out; display:flex; flex-direction:column; gap:calc(10*var(--u)); align-items:center}
.carte h2{margin:0; font-family:var(--f-titre); font-weight:400; font-size:calc(36*var(--u)); color:#5e1c2a}
.carte p{margin:0; font-size:calc(26*var(--u)); line-height:1.15}
.carte .lg{display:flex; align-items:center; gap:calc(10*var(--u)); text-align:left}
.carte .rang{display:flex; justify-content:center; gap:calc(6*var(--u)); background:#3a2a4a; border-radius:calc(14*var(--u)); padding:calc(10*var(--u)) calc(12*var(--u)) calc(4*var(--u)); align-self:stretch}
.carte .rang span{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; color:#cfc4e2; font-size:calc(20*var(--u)); line-height:1.1; opacity:.6}
.carte .rang span.pleine{color:#fff; opacity:1}
.carte .rang svg{width:calc(64*var(--u)); height:calc(80*var(--u)); overflow:visible}

/* ============ L'établi vivant : ce qu'on touche, ce qui bouge ============

   · on touche une plante du linge : on s'approche (un zoom de la même image), et on touche la partie qu'il faut (feuilles, fleurs, graines…) ;

   · jamais d'échec : un geste qui n'est pas dans la recette donne ce que ça donnerait pour de vrai (une petite phrase), et la matière

/* ---------- Choisir une plante, puis sa partie ---------- */
function lacher(){

/* ---------- Porter la matière d'un endroit à l'autre ---------- */
function ouEst(){ if(S.ou === 'linge' || !S.ou){ var c = centrePlante(S.plante); return {x:c.x, y:c.y}; } return ptFente(S.ou, S.pos === 'sortie' ? 'sortie' : 'entree'); }
function deplacer(o){

  occupe(true); enleverBulle();
  S.ou = null; S.faitIci = false; if(avant === 'presse') S.presseBas = false;
  if(avant === 'linge') majPlantes(); else if(avant) majOutil(avant);
  son('clic');
  voler('<g transform="scale(' + (OU[o].e*1.05).toFixed(2) + ')">' + spriteM(m, 'vol') + '</g>', a, b, 430, 60, function(){
    S.ou = o; S.pos = 'entree'; son(m.f === 'jus' ? 'goutte' : 'pose'); majOutil(o); majPlantes(); occupe(false); garder();

/* ---------- Faire travailler un outil ---------- */
function agir(o){

  /* une marmite ou un alambic où il n'y a ni liquide ni feu : rien ne se passe, on ne perd rien (on n'a pas fini de préparer) */
  occupe(true); enleverBulle();
  var res = ok ? (S.n === r.etapes.length - 1 ? {c:r.coul, f:'jus', fin:true} : {c:e.c, f:e.f}) : null;
  ANIM[o](res, cas, function(){

      var q = ptFente(o, 'entree'); if(/Pouf/.test(t)) nuagePouf(q.x, q.y - 10, '#a88a64', true); else nuagePouf(q.x, q.y - 6, '#e4dcec');

function finir(id, e){
  var r = RE[id], k = S.plante;

/* ============ Le grimoire, le sac, l'explication en images ============
   Le grimoire est posé sur son lutrin, au milieu de l'établi : on le touche, il s'ouvre en grand. Une double page par potion :

   « C'est vrai ! » n'apparaît qu'une fois la potion faite. */
function echap(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var g = '<div class="page g"><h3>' + echap(p.nom) + '</h3><div class="planche-b">' + PLD.plante(r.plante) + '</div>' +

    ligne('<p><b>La recette :</b></p><ol>' + r.recette.map(function(l){ return '<li>' + echap(l) + '</li>'; }).join('') + '</ol>', 'La recette. ' + r.recette.map(function(l, i){ return (i + 1) + ' : ' + l; }).join(' ')) +

/* Le grimoire se remplit tout seul : une page (et son signet) par plante trouvée */

function ouvrirLivre(id){

  /* le livre s'ouvre à la page de ce qu'on prépare ; sinon à une page qui vient de s'écrire ; sinon à la dernière page lue ; sinon à la première potion qui reste à faire */
  var L = connues(), N = nouvellesPages(), ok = function(x){ return x && L.indexOf(x) >= 0 ? x : null; };
  id = ok(id) || ok(S.plante && S.partie ? PL[S.plante].potion : null) || N[0] || ok(S.page) || L.filter(function(x){ return !S.faites[x]; })[0] || L[0] || null;
  S.page = id; if(id) S.pagesVues[id] = 1; son('livre');
  ouvrirMode('livre', livreHTML(id)); majLivre(); garder();
}
function pageLivreVa(id){
  if(S.mode !== 'livre' || !RE[id] || connues().indexOf(id) < 0) return;
  S.page = id; S.pagesVues[id] = 1; son('page'); arreterLecture();
  $('#pagesLivre').innerHTML = pageLivre(id);
  $$('#hudBoite .signet').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.page === id)); });
  majLivre();
}
function tournerPage(d){ var L = connues(), i = L.indexOf(S.page); if(L.length) pageLivreVa(L[(i + d + L.length) % L.length]); }

/* ---------- Les sept potions sont prêtes : le code pour le Pisteur (Romain, 12 novembre, 12 h 45 : plus de sac ; le code n'est donné
   qu'une fois TOUT fait). On le revoit en touchant l'étagère des potions. La nuit, le bouton du chaudron du donjon est ici. ---------- */
function codeHTML(){
  var t = DIT.code, code = '', dj = '', TD = 'Dans le donjon, ton chaudron te suit : le Pisteur y trouvera des plantes rares, à cuisiner pour lui.';
  if(S.sac && S.sac.formes) code = '<div class="code" id="sacCode"><span>Le code pour le Pisteur</span><span class="formes">' + S.sac.formes.map(echap).join('') + '</span>' + bSon('Le code des sept potions, pour le Pisteur.') + '</div>';
  if(S.donjon) dj = ligne('<p>' + echap(TD) + '</p>', TD) + '<button type="button" class="b-jaune" data-donjon="1">🫕 Le chaudron du donjon</button>';
  return '<div class="voile-l" data-fond="1"></div><div class="carte" role="dialog" aria-label="Les sept potions"><h2>🧪 Les sept potions</h2>' +
    '<div class="rang">' + ORDRE.map(function(id){ return '<span class="pleine"><svg viewBox="-32 -84 64 90" aria-hidden="true">' + flacon(id, RE[id].coul) + '</svg>' + echap(RE[id].court) + ' ✓</span>'; }).join('') + '</div>' +
    ligne('<p>' + echap(t) + '</p>', t) + code + dj + '</div>';
}
function ouvrirCode(){
  if(S.occupe || S.mode || !toutesFaites() || !S.sac) return;
  poser(); son('potion');
  ouvrirMode('sac', codeHTML());
  S.sacVu = true; dire('sacVu'); majEtat();
}

/* ---------- Une potion est prête : on la voit en grand, et on apprend ce qui est vrai ---------- */
function ouvrirPrete(id, t, toutes){
  var r = RE[id];
  ouvrirMode('prete', '<div class="voile-l" data-fond="1"></div><div class="carte prete" role="dialog" aria-label="' + echap(r.nom) + ' : la potion est prête">' +
    '<div class="prete-h"><svg class="grand-f" viewBox="-36 -88 72 94" aria-hidden="true"><circle cx="0" cy="-34" r="44" fill="' + G('haloP') + '"/>' + flacon(id, r.coul) + '</svg><div class="prete-t"><h2>' + echap(r.nom) + ' !</h2>' + ligne('<p>' + echap(t) + '</p>', t) + '</div></div>' +
    ligne('<p><b>C\'est vrai !</b> ' + echap(r.vrai) + '</p>', 'C\'est vrai ! ' + r.vrai, 'vrai') +
    (toutes ? ligne('<p>' + echap(DIT.toutes) + '</p>', DIT.toutes, 'note') : '') +
    '<button type="button" class="b-jaune" ' + (toutes ? 'data-suite="code"' : 'data-fond="1"') + '>Continuer</button></div>');
}

/* ---------- L'explication en images, la toute première fois (une fois par héros) : des images, puis un bouton jaune ---------- */
var INTRO_PAS = [
  {t:'Le grimoire s\'écrit tout seul : une page pour chaque plante trouvée. Il dit quelle partie prendre, et quels gestes faire.'},
  {t:'Tes cueillettes sèchent, la tête en bas. Décroche une plante, regarde-la de près, et prends la bonne partie.'},
  {t:'Pose-la sur un outil. Puis fais travailler l\'outil : il hache, il écrase, il presse…'},
  {t:'Le feu ? C\'est toi qui décides. Une bûche : feu doux. Deux bûches : feu fort. Et si tu te trompes, rien n\'est perdu !'}
];
function vignette(i){
  if(i === 0) return '<svg viewBox="-110 -186 220 206" preserveAspectRatio="xMidYMid slice">' + ART.livre().replace('class="rond"', 'class="rond" style="display:none"') + '</svg>';
  if(i === 1) return '<svg viewBox="0 0 260 322" style="background:#f6efdc" class="plante zoom vig-plante">' + PLD.corps('souci') + '</svg>';
  if(i === 2){ var sv = S.partie, m = S.m, ou = S.ou, po = S.pos; S.partie = 'x'; S.m = {f:'feuilles', c:'#62b24c'}; S.ou = 'planche'; S.pos = 'entree'; var a = ART.planche(); S.partie = sv; S.m = m; S.ou = ou; S.pos = po;
    return '<svg viewBox="-128 -92 256 128" preserveAspectRatio="xMidYMid slice" style="background:#d9a066">' + a.replace('class="rond"', 'class="rond" style="display:none"').replace(/ id="[^"]*"/g, '') + '</svg>'; }
  var f = S.feux.marmite, l = S.liq.marmite, sp = S.partie; S.feux.marmite = {b:2, allume:true}; S.liq.marmite = 'eau'; S.partie = null; var b = ART.marmite(); S.feux.marmite = f; S.liq.marmite = l; S.partie = sp;
  return '<svg viewBox="-110 -200 220 236" preserveAspectRatio="xMidYMid slice" style="background:#4a3d68">' + b.replace('class="rond"', 'class="rond" style="display:none"').replace(/ id="[^"]*"/g, '').replace(/ data-act="[^"]*"/g, '') + '</svg>';
}
function introHTML(){
  var h = '<div class="voile-l"></div><div class="carte intro" role="dialog" aria-label="L\'établi des plantes"><h2>🌿 Ton établi des plantes</h2><div class="intro-pas">';
  INTRO_PAS.forEach(function(p, i){ h += '<figure><div class="vig">' + vignette(i) + '</div><figcaption><b>' + (i + 1) + '</b><span>' + echap(p.t) + '</span>' + bSon(p.t) + '</figcaption></figure>'; });
  return h + '</div><button type="button" class="b-jaune" data-intro="1">🌿 À l\'établi !</button></div>';
}
function ouvrirIntro(){ ouvrirMode('intro', introHTML()); $('#modeHaut').hidden = true; }


/* ============ L'établi dans le jeu ============
   Dans le jeu, l'établi s'ouvre dans son propre cadre, par-dessus l'atelier (plantes.js), comme le labo. Le jeu lui donne sa fiche
   (window.ETABLI_CFG) : les plantes cueillies (plantes), les potions déjà faites (faites), ce qui était en route (etat), l'établi et le mur
   choisis dans l'atelier (style), les sons, la nuit (nuit), le code du sac (sac), le chaudron du donjon (donjon), l'explication à montrer (intro).
   L'établi lui répond par de petits messages : « finie » (une potion est prête : le jeu la note, et renvoie « maj » avec le nouveau code du sac),
   « etat » (à garder dans la sauvegarde), « lire » (un bouton 🔊), « stop », « introVue », « sacVu », « donjon », « quitter ».
   Sans fiche : c'est la maquette, toute seule (toutes les plantes sont là), avec ses réglages. */
var CFG = window.ETABLI_CFG || null, JEU = !!(CFG && CFG.jeu);
function dire(type, x){ if(!JEU) return; var m = {etabli:1, type:type}, k; if(x) for(k in x) m[k] = x[k]; try { window.parent.postMessage(m, '*'); } catch(e){} }
function garder(){ dire('etat', {etat:exporter()}); }
/* Jamais de lecture toute seule : seulement quand on touche un 🔊 */
function lire(t){
  if(JEU){ dire('lire', {t:t}); return; }
  try { var u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch(e){}
}
function arreterLecture(){ if(JEU) dire('stop'); else try { window.speechSynthesis.cancel(); } catch(e){} }
/* Le bouton du coin, dans le jeu : ✕ pour revenir à l'atelier ; jaune avec ✔ quand une potion vient d'être finie */
function majQuitter(){ var b = $('#bQuitter'); if(!b) return; var n = S.aDire.length; b.classList.toggle('aller', n > 0); b.textContent = n ? '✔' : '✕'; }
function quitter(){ if(S.occupe) return; if(S.mode) fermerMode(); arreterLecture(); dire('quitter', {etat:exporter(), finies:S.aDire.slice()}); S.aDire = []; majQuitter(); }

/* ---------- Les doigts ---------- */
var clic = {pris:false};
document.addEventListener('click', function(){ clic.pris = false; }, true);
$('#scene').addEventListener('click', function(e){
  if(S.occupe) return;
  clic.pris = true;
  /* de près : on touche une des trois parties de la plante ; à côté, on recule */
  if(S.mode === 'plante'){
    var pa = e.target.closest('.pl-pa'), pl = pa && pa.closest('.plante');
    if(pa && pl && pl.dataset.k === S.plante) prendre(pa.getAttribute('data-pa')); else fermerMode();
    return;
  }
  if(S.mode) return;
  var g = e.target.closest('[data-act]');
  if(!g){ poser(); enleverBulle(); return; }
  var a = g.dataset.act;
  if(a === 'plante') choisirPlante(g.dataset.k);
  else if(a === 'outil') toucherOutil(g.dataset.o);
  else if(a === 'foyer') toucherFoyer(g.dataset.o);
  else if(a === 'porte') tenir(g.dataset.h);
  else if(a === 'livre') ouvrirLivre();
  else if(a === 'pendue') decrocher(g.dataset.k);
  else if(a === 'potion') toucherPotion(g.dataset.id);
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ if(S.mode && S.mode !== 'intro') return fermerMode(); if(JEU && !S.mode) return quitter(); }
  if(S.mode === 'livre' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return tournerPage(e.key === 'ArrowLeft' ? -1 : 1);
  if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('svg [role="button"]')){ e.preventDefault(); e.target.closest('svg [role="button"]').dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
document.addEventListener('click', function(e){
  var b;
  if(clic.pris) return;
  if((b = e.target.closest('[data-lire]'))){ lire(b.dataset.lire); return; }
  if(e.target.closest('#bFermer')){ arreterLecture(); return fermerMode(); }
  if(e.target.closest('#bQuitter')) return quitter();
  if((b = e.target.closest('[data-page]'))) return pageLivreVa(b.dataset.page);
  if((b = e.target.closest('[data-tourne]'))) return tournerPage(+b.dataset.tourne);
  if(e.target.closest('[data-intro]')){ son('clic'); arreterLecture(); S.mode = 'intro'; fermerMode(); dire('introVue'); return; }
  if(e.target.closest('[data-donjon]')){ son('clic'); fermerMode(); dire('donjon', {etat:exporter()}); return; }
  if(e.target.closest('[data-suite]')){ arreterLecture(); fermerMode(); if(toutesFaites() && S.sac) ouvrirCode(); return; }   /* après la septième potion : le code */
  if(e.target.closest('[data-fond]')){ arreterLecture(); return fermerMode(); }
  if(e.target.closest('#bReglages')){ var pn = $('#reglages'); pn.hidden = !pn.hidden; son('clic'); return; }
  if(e.target.closest('#bRecommencer')){ demarrer(); return; }
  if(e.target.closest('#bNuit')){ S.nuit = !S.nuit; S.donjon = S.nuit; $('#bNuit').setAttribute('aria-pressed', String(S.nuit)); majEtat(); son('clic'); return; }
  if(e.target.closest('#bSon')){ SON.actif = !SON.actif; try { localStorage.setItem('brumeval-etabli-son', SON.actif ? 'oui' : 'non'); } catch(err){} majStyles(); son('clic'); return; }
  if((b = e.target.closest('[data-style]'))){ var cle = b.dataset.style; ST[cle] = (ST[cle] + 1) % (cle.slice(-1) === 'F' ? 5 : THEMES.length); try { localStorage.setItem('brumeval-etabli-style', JSON.stringify(ST)); } catch(err){} majStyles(); dessinerScene(); majEtat(); son('clic'); return; }
  /* un toucher à côté, dans un gros plan : on recule */
  if(S.mode === 'plante' && !e.target.closest('#hudBoite, #modeHaut')) fermerMode();
});
function majStyles(){
  $('#bSon').textContent = SON.actif ? '🔈 Sons' : '🔇 Sons'; $('#bSon').setAttribute('aria-pressed', String(SON.actif));
  $('#stPaF').textContent = FORMES_PA[ST.paF]; $('#stPaT').textContent = THEMES[ST.paT].nom; $('#stMurF').textContent = FORMES_MUR[ST.murF]; $('#stMurT').textContent = THEMES[ST.murT].nom;
}
/* Tout se mesure avec la même unité : --u = la taille d'un point du dessin à l'écran */
function mesure(){ var c = $('#cadre'); c.style.setProperty('--u', Math.min(c.clientWidth/1200, c.clientHeight/640) + 'px'); }
window.addEventListener('resize', mesure);
/* Jamais de zoom par accident (comme dans le jeu) */
(function(){
  var bloquer = function(e){ if(e.cancelable) e.preventDefault(); };
  if('ongesturestart' in window || 'GestureEvent' in window){
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){ document.addEventListener(t, bloquer, {passive:false}); });
    document.addEventListener('touchmove', function(e){ if(e.touches && e.touches.length > 1) bloquer(e); }, {passive:false});
  }
  document.addEventListener('wheel', function(e){ if(e.ctrlKey) bloquer(e); }, {passive:false});
})();

/* ---------- La fiche du jeu ---------- */
if(!JEU){ try { var stE = JSON.parse(localStorage.getItem('brumeval-etabli-style') || 'null'); if(stE) for(var cleE in ST) if(typeof stE[cleE] === 'number') ST[cleE] = stE[cleE]; } catch(e){} }
if(CFG && CFG.style) for(var kS in ST) if(typeof CFG.style[kS] === 'number') ST[kS] = CFG.style[kS];
if(JEU){ SON.actif = CFG.son !== false; document.body.classList.add('jeu'); }
if(CFG && CFG.vite){ reduit = true; document.documentElement.classList.add('vite'); }   /* (les robots d'essai : tout va d'un coup) */
function appliquerFiche(c){
  if(!c) return;
  if(c.plantes && typeof c.plantes === 'object'){ S.dispo = {}; ORDRE_PL.forEach(function(k){ S.dispo[k] = c.plantes[k] > 0 ? c.plantes[k] : 0; }); }
  if(Array.isArray(c.faites)){ S.faites = {}; c.faites.forEach(function(id){ if(RE[id]) S.faites[id] = 1; }); }
  if('nuit' in c) S.nuit = !!c.nuit;
  if('sac' in c) S.sac = c.sac && Array.isArray(c.sac.formes) ? {formes:c.sac.formes.slice(0, 4)} : null;
  if('donjon' in c) S.donjon = !!c.donjon;
}
function demarrer(){
  if(S && S.mode){ S.occupe = false; fermerMode(); }
  neuf();
  if(CFG){ appliquerFiche(CFG); if(CFG.sacVu) S.sacVu = true; importer(CFG.etat); }
  else{ ORDRE_PL.forEach(function(k){ S.dispo[k] = 1; }); S.sac = {formes:['🌙', '⭐', '🔥']}; }   /* (la maquette : tout est cueilli, et un code pour voir) */
  camera(600, 320, 1); mesure(); majStyles(); dessinerScene(); majEtat(); majQuitter();
}
demarrer();
/* le jeu répond (une potion vient d'être notée : le code du sac a changé) */
window.addEventListener('message', function(e){
  var m = e.data; if(!m || m.etabli !== 1 || e.source !== window.parent) return;
  if(m.type === 'maj'){ appliquerFiche(m); majEtat(); if(S.mode === 'sac'){ $('#hudBoite').innerHTML = codeHTML(); } }
});
if(CFG && CFG.intro) ouvrirIntro();
/* (pour les robots d'essai) */
window.__etabli = {etat:function(){ return S; }, exporter:exporter, libre:function(){ return !S.occupe; }, recettes:RE, plantes:PL, quitter:quitter, style:ST, son:SON, sons:SONS,
  texte:function(){ var b = $('#calque .bulle-o span'); return b ? b.textContent : ''; },
  /* boucler une potion d'un coup, sans les gestes */
  finir:function(id){ var r = RE[id]; if(!r || S.faites[id]) return false; S.plante = r.plante; S.partie = r.partie; S.n = r.etapes.length - 1; finir(id, r.etapes[r.etapes.length - 1]); return true; }};
dire('pret');
})();

</script>
