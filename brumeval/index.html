<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Les Enquêteurs de Brumeval : un jeu d'enquête coopératif à quatre écrans. Retrouvez la Lanterne d'Or volée !">
<meta name="theme-color" content="#1c2447">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brumeval">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Les Enquêteurs de Brumeval</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@500;700&family=Macondo&display=swap">
<style>
:root{
  /* Mise en page : appli plein écran. En-tête du héros collé en haut, scène au centre, onglets en bas.
     L'histoire s'écrit sur des cartes en parchemin posées sur la nuit de Brumeval, éclairée par l'or des lanternes. */
  --nuit:#131932;
  --nuit-2:#1c2447;
  --nuit-3:#28325e;
  --trait:#3b4679;
  --brume:#a6aed8;
  --lune:#eef0ff;
  --parchemin:#f3e7cb;
  --encre:#35281b;
  --encre-2:#6b5434;
  --or:#f5b945;
  --or-pale:#ffe3a3;
  --laiton:#b8862e;
  --braise:#e8693c;
  --braise-sombre:#a8391a;
  --mousse:#7cc493;
  --violet:#9d6ee3;
  --g-bleu:#4b84e6;
  --g-jaune:#f3d03e;
  --g-rouge:#e24c4c;
  --g-vert:#52c05e;
  --sol:#1b2c36;
  --lisiere:#11231f;
  --sapin:#1c4235;
  --sapin-2:#14342a;
  --riviere:#27507f;
  --route:#4a4560;
  --mur:#3c3453;
  --toit:#5d3a4c;
  --terre:#4a3826;
  --trace-seche:#ab895d;
  --fissure:#6e5434;
  --trace-fraiche:#1f140b;
  --f-titre:"Macondo", "Georgia", "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nuit);color:var(--lune);font-family:var(--f-texte);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.bloque{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nuit-2)}
.ciel{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 22px 34px, var(--lune), transparent),
    radial-gradient(1px 1px at 140px 86px, var(--lune), transparent),
    radial-gradient(1.2px 1.2px at 200px 20px, var(--or-pale), transparent),
    radial-gradient(1px 1px at 80px 160px, var(--lune), transparent),
    radial-gradient(1.6px 1.6px at 180px 200px, var(--lune), transparent),
    radial-gradient(1px 1px at 40px 220px, var(--brume), transparent);
  background-size:240px 240px;opacity:.55}
#app{position:relative;z-index:1;min-height:100%}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem, 6.5vw, 2.8rem);color:var(--or-pale)}
h2{font-size:1.6rem;color:var(--or-pale)}
h3{font-size:1.25rem;color:var(--lune)}
p{margin:0}
ul,ol{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.pile{display:flex;flex-direction:column;gap:14px}
.pile-serree{display:flex;flex-direction:column;gap:6px;min-width:0}
.rangee{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.doux{color:var(--brume)}
.petit{font-size:.88rem}
.centre{text-align:center}
.sur-titre{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--or);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 24px;border-radius:999px;border:0;background:var(--or);color:var(--encre);font-weight:700;font-size:1.05rem;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.second{background:transparent;color:var(--lune);border:2px solid var(--trait)}
.btn.petit{min-height:42px;padding:6px 16px;font-size:.95rem}
.btn.grand{font-size:1.2rem;min-height:60px}
.lire{align-self:flex-start;border:0;background:rgba(238,240,255,.12);color:inherit;border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:700;min-height:38px}

.parchemin{background:var(--parchemin);color:var(--encre);border-radius:6px 12px 8px 14px;padding:20px 18px;box-shadow:0 12px 34px rgba(0,0,0,.4), inset 0 0 44px rgba(140,100,40,.2)}
.parchemin h2,.parchemin h3{color:var(--encre)}
.parchemin .doux{color:var(--encre-2)}
.parchemin .lire{background:rgba(53,40,27,.1)}
.panneau{background:var(--nuit-2);border:1px solid var(--trait);border-radius:16px;padding:16px}

/* Accueil */
.titre-jeu{display:flex;align-items:center;gap:14px;padding-top:22px}
.lanterne{width:84px;height:auto;flex:none;overflow:visible}
.halo{fill:var(--or);opacity:.18;animation:vacille 3.2s ease-in-out infinite}
.lt-anse{fill:none;stroke:var(--laiton);stroke-width:3}
.lt-metal{fill:var(--laiton)}
.lt-verre{fill:var(--or-pale)}
.lt-barre{stroke:var(--laiton);stroke-width:2}
.lt-flamme{fill:var(--braise);transform-origin:40px 62px;animation:flamme 1.3s ease-in-out infinite alternate}
@keyframes vacille{0%,100%{opacity:.14}50%{opacity:.32}}
@keyframes flamme{from{transform:scale(1,1)}to{transform:scale(.88,1.1)}}
.etiquette{font-weight:700;font-size:.95rem;color:var(--brume)}
.champ{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:12px;border:2px solid var(--trait);background:var(--nuit);color:var(--lune)}
.champ::placeholder{color:var(--brume);opacity:.7}
.puces{display:flex;gap:8px;flex-wrap:wrap}
.puce{border-radius:999px;border:2px solid var(--trait);background:transparent;padding:8px 18px;font-weight:700;min-height:46px}
.puce[aria-pressed="true"],.avatars button[aria-pressed="true"]{border-color:var(--or);background:rgba(245,185,69,.16);color:var(--or-pale)}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.avatars button{aspect-ratio:1;max-width:100%;font-size:1.9rem;border-radius:14px;border:2px solid var(--trait);background:var(--nuit-3);display:grid;place-items:center;padding:0}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.role{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:2px solid var(--trait);background:var(--nuit-3)}
.role[aria-pressed="true"]{border-color:var(--or);background:rgba(245,185,69,.12)}
.role .ri{font-size:2.3rem;line-height:1}
.role b{font-family:var(--f-titre);font-weight:400;font-size:1.3rem;color:var(--or-pale)}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--or);font-weight:700}
.conseil{border:1px dashed var(--trait);border-radius:12px;padding:12px 14px;color:var(--brume);font-size:.95rem}

/* Intro */
.lettre-entete{font-style:italic;color:var(--encre-2);font-size:.95rem}
.signature{font-family:var(--f-titre);font-size:1.2rem;text-align:right}
.regles{padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.regles li::marker{color:var(--or)}

/* En-tête de jeu */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nuit-2);border-bottom:1px solid var(--trait)}
.entete .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--nuit-3);border:2px solid var(--or);flex:none}
.heros-info{flex:1;min-width:0}
.heros-nom{font-family:var(--f-titre);font-size:1.35rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--or-pale)}
.heros-classe{font-size:.85rem;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:10px;border-radius:99px;background:var(--nuit);margin-top:6px;overflow:hidden;border:1px solid var(--trait)}
.xp>span{display:block;height:100%;background:linear-gradient(90deg,var(--braise),var(--or));border-radius:99px;transition:width .6s}
.icone-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--trait);background:transparent;font-size:22px;flex:none;display:grid;place-items:center;padding:0}
main{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px))}
.accueil{padding-bottom:40px}
.mission{display:flex;gap:10px;align-items:center;border:1px dashed rgba(245,185,69,.45);border-radius:12px;padding:8px 14px;font-size:.92rem;color:var(--or-pale)}
.mission.resolue{border-color:var(--mousse);color:var(--mousse)}

/* Onglets */
.onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nuit-2);border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom,0px)}
.onglets .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.onglet{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--brume);min-height:58px;min-width:0}
.onglet .oi{font-size:1.5rem;line-height:1}
.onglet[aria-current="page"]{background:var(--nuit-3);color:var(--or-pale)}

/* Carte du village */
.carte{position:relative;width:100%;max-width:100%;aspect-ratio:6/5;border-radius:18px;overflow:hidden;border:1px solid var(--trait)}
.carte svg{position:absolute;inset:0;width:100%;height:100%}
.sol{fill:var(--sol)}.lisiere{fill:var(--lisiere)}.sapin{fill:var(--sapin)}.sapin-2{fill:var(--sapin-2)}
.riviere{fill:none;stroke:var(--riviere);stroke-width:16;stroke-linecap:round}
.riviere-reflet{fill:none;stroke:var(--brume);stroke-width:1.5;stroke-dasharray:6 10;opacity:.5}
.route{fill:none;stroke:var(--route);stroke-width:8;stroke-linecap:round}
.mur{fill:var(--mur)}.toit{fill:var(--toit)}.fen{fill:var(--or)}.astre{fill:var(--lune)}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.pin-rond{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--parchemin);border:3px solid var(--or);box-shadow:0 0 0 6px rgba(245,185,69,.18),0 8px 16px rgba(0,0,0,.45)}
.pin-nom{background:var(--nuit);color:var(--lune);border-radius:99px;padding:2px 10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.pin.ferme .pin-rond{filter:grayscale(1) brightness(.75);border-color:var(--brume);box-shadow:0 8px 16px rgba(0,0,0,.45)}
.badge{position:absolute;top:-6px;right:-8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--nuit);border:2px solid var(--brume);filter:none}
.badge.ok{background:var(--mousse);border-color:var(--mousse);color:var(--nuit);font-weight:700}

/* Lieux, tuiles */
.retour{align-self:flex-start;border:0;background:transparent;color:var(--or-pale);font-weight:700;padding:6px 0;min-height:44px}
.titre-lieu{display:flex;align-items:center;gap:12px}
.gros-ic{font-size:2.8rem;line-height:1}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tuile{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--trait);background:var(--nuit-2);min-height:66px;min-width:0}
.tuile .ti{font-size:1.9rem;line-height:1;flex:none}
.tuile.vu{border-color:rgba(124,196,147,.7)}
.tuile.vu::after{content:"✓";margin-left:auto;color:var(--mousse);font-weight:700}

/* Fenêtre de dialogue */
.voile{position:fixed;inset:0;z-index:40;background:rgba(6,8,22,.78);display:flex;align-items:flex-end;justify-content:center;padding:max(12px, env(safe-area-inset-top,0px)) max(10px, env(safe-area-inset-right,0px)) 0 max(10px, env(safe-area-inset-left,0px))}
.feuille{width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));background:var(--parchemin);color:var(--encre);box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:monte .25s ease-out}
.feuille h2,.feuille h3{color:var(--encre)}
.feuille .doux{color:var(--encre-2)}
.feuille .lire{background:rgba(53,40,27,.1)}
.feuille .btn.second{color:var(--encre);border-color:var(--encre-2)}
.feuille .rate{color:var(--braise-sombre)}
@keyframes monte{from{transform:translateY(30px)}to{transform:none}}
@media (min-width:640px){.voile{align-items:center;padding-bottom:20px}.feuille{border-radius:18px;padding-bottom:22px}}

/* Objet trouvé */
.objet{display:flex;gap:14px;align-items:center;background:var(--nuit);color:var(--lune);border-radius:14px;padding:14px;border:2px solid var(--or)}
.objet .oi{font-size:2.6rem;line-height:1;flex:none}
.objet-titre{font-family:var(--f-titre);font-size:1.15rem;color:var(--or-pale)}
.code-affiche{display:flex;gap:12px;flex-wrap:wrap}
.cs{display:inline-flex;flex-direction:column;align-items:center;min-width:56px}
.ce{font-size:2.1rem;line-height:1.15}
.cn{font-size:.75rem;color:var(--brume)}
.rate{color:var(--braise);font-weight:700}
.reussi{background:rgba(124,196,147,.22);border-radius:12px;padding:12px 14px}
.reponses{display:flex;gap:10px;flex-wrap:wrap}
.reponses .btn{min-width:64px;font-size:1.3rem}

/* Traces */
.traces-svg{width:100%;max-width:300px;height:auto;align-self:center;border-radius:12px}
.terre{fill:var(--terre)}
.grille{stroke:var(--or-pale);stroke-opacity:.28;stroke-width:1;fill:none}
.trace-seche{fill:var(--trace-seche)}
.fissure{fill:none;stroke:var(--fissure);stroke-width:1.6;stroke-linecap:round}
.trace-fraiche{fill:var(--trace-fraiche)}
.reflet{fill:var(--lune);opacity:.2}
.traces-legende{fill:var(--parchemin);font-family:var(--f-texte);font-size:12px;font-weight:700;text-anchor:middle}

/* Codes */
.slots{display:flex;gap:12px;justify-content:center}
.slot{width:80px;height:80px;border-radius:18px;border:2px dashed var(--trait);display:grid;place-items:center;font-size:2.5rem;background:var(--nuit-2)}
.slot.plein{border-style:solid;border-color:var(--or)}
.clavier{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;margin:0 auto;width:100%}
.touche{border:1px solid var(--trait);background:var(--nuit-2);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px}
.touche .te{font-size:2.1rem;line-height:1.1}
.touche .tn{font-size:.8rem;color:var(--brume)}
.touche:active{background:var(--nuit-3)}
.retour-code{border-radius:12px;padding:12px 14px;border:1px solid var(--braise);color:var(--lune)}

/* Labo */
.chaudron{width:200px;max-width:100%;margin:0 auto}
.chaudron svg{width:100%;height:auto;display:block}
.pot{fill:#0d0f1c}
.rebord{fill:#262a40}
.ombre{fill:#000;opacity:.35}
.gouttes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:24px;align-items:center}
.goutte{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:inline-block;border:1.5px solid rgba(0,0,0,.3);flex:none}
.fioles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fiole{border:1px solid var(--trait);background:var(--nuit-3);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;font-weight:700;min-height:92px}
.verre{width:30px;height:46px;border-radius:7px 7px 15px 15px;border:2px solid var(--lune);position:relative;overflow:hidden}
.verre::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--c)}
.analyse-anim{font-size:4rem;text-align:center;animation:secoue .5s ease-in-out infinite alternate}
@keyframes secoue{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-8px)}}
.potion-ok{display:flex;gap:14px;align-items:center}
.potion-ok .gros-ic{filter:drop-shadow(0 0 12px var(--violet))}

/* Villageois */
.portrait{flex-direction:row}
.portrait .ti{font-size:2.4rem}
.bulle{background:var(--parchemin);color:var(--encre);border-radius:16px 16px 16px 4px;padding:14px 16px}
.bulle .lire{background:rgba(53,40,27,.1)}
.question-posee{font-size:.88rem;color:var(--brume);margin-bottom:6px;font-weight:700}
.q-btn{text-align:left;border:2px dashed var(--or);background:transparent;color:var(--or-pale);border-radius:14px;padding:12px 16px;font-weight:700;min-height:52px}
.q-btn.special{border-style:solid;background:rgba(245,185,69,.12)}

/* Grand Livre */
.segments{display:flex;gap:6px;flex-wrap:wrap}
.segments button{border:1px solid var(--trait);background:var(--nuit-2);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--brume);min-height:46px}
.segments button[aria-selected="true"]{background:var(--or);color:var(--encre);border-color:var(--or)}
.habitant{display:flex;gap:12px;align-items:flex-start;padding-top:12px;border-top:1px dashed rgba(53,40,27,.3)}
.hic{font-size:2.1rem;line-height:1;flex:none}
.carreaux{display:inline-flex;gap:3px;vertical-align:middle;margin-inline:4px}
.carreaux i{width:13px;height:13px;border:1.5px solid var(--encre);display:inline-block;background:rgba(53,40,27,.14)}
.recette{border-top:1px dashed rgba(53,40,27,.3);padding-top:12px}
.recette:first-of-type{border-top:0;padding-top:0}
.page-vide{min-height:220px;display:grid;place-items:center;text-align:center;background:linear-gradient(115deg,var(--parchemin) 30%,#fff7e3 50%,var(--parchemin) 70%);background-size:300% 100%;animation:reflet 4s linear infinite}
@keyframes reflet{from{background-position:100% 0}to{background-position:-100% 0}}
.carte-foret{width:100%;max-width:420px;height:auto;align-self:center;filter:drop-shadow(0 0 6px rgba(157,110,227,.45));animation:apparait 1.6s ease-out}
@keyframes apparait{from{filter:blur(5px) drop-shadow(0 0 14px rgba(157,110,227,.9))}to{filter:blur(0) drop-shadow(0 0 6px rgba(157,110,227,.45))}}
.chemin{fill:none;stroke:var(--violet);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 6}
.encre-ligne{fill:none;stroke:var(--encre);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.encre-plein{fill:var(--encre)}
.etiq{font-family:var(--f-titre);font-size:15px;fill:var(--violet);text-anchor:middle}
.choix{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.choix button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:2px solid var(--trait);background:var(--nuit-2);font-weight:700;min-height:88px;font-size:.95rem}
.choix .ci{font-size:1.9rem;line-height:1}
.choix button[aria-pressed="true"]{border-color:var(--or);background:rgba(245,185,69,.16);color:var(--or-pale)}

/* Carnet, pouvoir */
.notes{padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
.notes li::marker{color:var(--or);font-weight:700}
.note-code{margin-top:4px;font-size:.9rem;color:var(--or-pale)}
.note-code span{font-size:1.4rem;letter-spacing:.15em}

  var n = etatNeuf();

  n.heros = o.heros || null; n.xp = +o.xp || 0; n.gagne = o.gagne || {}; n.son = o.son !== false;

function niveau(xp){
  var n = 1;
  for(var i=1;i<SEUILS.length;i++){ if(xp >= SEUILS[i]) n = i+1; }
  var bas = SEUILS[n-1], haut = SEUILS[n] || (bas + 400);
  return {n:n, pct:Math.max(0, Math.min(100, Math.round((xp-bas)/(haut-bas)*100))), prochain:haut};
}
function lireCode(seq, role, e){
  var k = seq.join('-');
  if(k === FINAL.join('-')) return {type:'final'};
  var o = CODE_INDEX[k];
  if(!o) return {type:'rien'};
  if(o.pour !== role) return {type:'autre'};
  if(e.codes[o.id]) return {type:'deja', id:o.id};
  return {type:'nouveau', id:o.id};
}

function finir(){
  var e = S.e1;
  if(e.resolu) return null;
  e.resolu = true;
  var nAvant = niveau(S.xp).n, gain = 0;
  if(!S.gagne['fin-e1']){
    S.gagne['fin-e1'] = true;
    gain = S.heros.role === 'sage' ? Math.max(40, 80 - 10*(e.rate||0)) : 60;
    S.xp += gain;
    if(S.xp < SEUILS[1]){ gain += SEUILS[1] - S.xp; S.xp = SEUILS[1]; }
  }
  var nApres = niveau(S.xp).n;
  return {gain:gain, monte:nApres > nAvant, n:nApres};
}

function son(type){
  if(!S.son) return;

    notes.forEach(function(f,i){
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i*0.11;

    });
  }catch(err){}
}

function act(a, el){

      S.heros = {nom:UI.crea.nom.trim(), genre:UI.crea.genre, avatar:UI.crea.avatar, role:UI.crea.role};
      sauver(); haut(); render(); break;
    case 'commencer':
      e.intro = true; UI.onglet = 'role';
      if(S.heros.role === 'sage'){ e.vu['s.habitants'] = true; gagner('s.habitants', 10); noter('s.habitants', NOTE_HABITANTS); }
      sauver(); haut(); render(); break;
    case 'onglet': UI.onglet = d.v; UI.retourCode = null; haut(); render(); break;
    case 'lieu':
      if(!lieuOuvert(d.id)){ UI.modal = {type:'info', titre:LIEUX[d.id].ic + ' ' + LIEUX[d.id].nom, t:LIEUX[d.id].verrou}; render(); return; }
      e.lieu = d.id; sauver(); haut(); render(); break;
    case 'carte': e.lieu = null; sauver(); haut(); render(); break;
    case 'point': ouvrirPoint(d.l, d.p); break;
    case 'mesure':
      if(+d.v === 3){
        e.mesure = true; UI.mauvaiseMesure = false; gagner('p.mesure', 15);
        noter('p.mesure', 'Mairie : les traces fraîches de cette nuit mesurent 3 carreaux. Les vieilles traces de boue sèche en mesurent 5.'); son('oui');
      } else { UI.mauvaiseMesure = true; son('non'); }
      sauver(); render(); break;
    case 'fermer': fermer(); break;
    case 'lire': lire(UI.lectures[+d.i]); break;
    case 'goutte':
      if(e.chaudron.length >= 8){ UI.rate = 'Le chaudron est plein ! Remue-le ou vide-le.'; }
      else { e.chaudron.push(d.c); UI.rate = null; son('goutte'); }
      sauver(); render(); break;
    case 'vider': e.chaudron = []; UI.rate = null; sauver(); render(); break;
    case 'remuer': remuer(); break;
    case 'voir-analyse': UI.modal = {type:'analyse', id:d.id, pret:true}; render(); break;
    case 'villageois': e.villageois = d.id; sauver(); haut(); render(); break;
    case 'villageois-retour': e.villageois = null; sauver(); haut(); render(); break;
    case 'question': poser(d.k); break;
    case 'page':
      e.page = d.id; UI.confirmer = false; UI.retourAcc = null;
      if(d.id === 'recettes'){ e.vu['s.recettes'] = true; gagner('s.recettes', 5); noter('s.recettes', "Grand Livre : la recette de la potion révélatrice (2 bleues, 1 jaune, 3 rouges) sert à lire l'encre invisible."); }
      sauver(); render(); break;
    case 'qui': e.qui = d.id; UI.confirmer = false; UI.retourAcc = null; sauver(); render(); break;
    case 'ou': e.ou = d.id; UI.confirmer = false; UI.retourAcc = null; sauver(); render(); break;
    case 'accuser': UI.confirmer = true; render(); break;
    case 'accuser-non': UI.confirmer = false; render(); break;
    case 'accuser-oui': accuser(); break;
    case 'sym': if(UI.saisie.length < 3){ UI.saisie.push(d.v); UI.retourCode = null; render(); } break;
    case 'effacer': UI.saisie.pop(); UI.retourCode = null; render(); break;
    case 'valider': if(S.enquete === 2) valider2(); else valider(); break;
    case 'pouvoir': utiliserPouvoir(); break;
    case 'reglages': UI.modal = {type:'reglages'}; UI.confirmR = null; render(); break;
    case 'son': S.son = !S.son; sauver(); render(); break;
    case 'confirmR': UI.confirmR = d.v; render(); break;
    case 'confirmR-non': UI.confirmR = null; render(); break;
    case 'recommencer-oui':
      if(S.enquete === 2){ S.e2 = enquete2Neuve(); S.e2.etape = S.spe ? 'marchand' : 'spe'; }
      else S.e1 = enqueteNeuve();
      UI.modal = null; UI.confirmR = null; UI.onglet = 'role'; UI.saisie = []; UI.retourAcc = null; UI.rate = null;
      sauver(); haut(); render(); break;
    case 'heros-oui':
      S = etatNeuf(); UI.modal = null; UI.confirmR = null; UI.onglet = 'role'; UI.saisie = []; UI.crea = {nom:'',genre:'m',avatar:'🦊',role:null};
      sauver(); haut(); render(); break;
    case 'revoir-fin': UI.fin = null; UI.modal = {type:(S.enquete === 2 ? 'fin2' : 'fin')}; render(); break;
    default: if(S.e2 || a === 'vers-e2') act2(a, el);
  }
}


/* ================= ENQUÊTE N°2 : règles ================= */
function enqueteCourante(){ return S.enquete === 2 && S.e2 ? S.e2 : S.e1; }
function speInfo(){
  if(!S.spe || !S.heros) return null;
  var l = SPES[S.heros.role] || [];
  for(var i=0;i<l.length;i++){ if(l[i].id === S.spe) return l[i]; }
  return null;
}
function nomSpe(sp){ return S.heros.genre === 'f' ? sp.f : sp.m; }
function trouverArticle(id){
  var r = null;
  Object.keys(MARCHAND).forEach(function(k){ MARCHAND[k].forEach(function(a){ if(a.id === id) r = a; }); });
  return r;
}
function aObjet(id){
  var a = trouverArticle(id);
  return S.sac.indexOf(id) >= 0 && !(a && a.usage && S.e2 && S.e2.consomme[id]);
}
function chargesSpe(){
  if(!S.spe || !S.e2) return 0;
  return Math.max(0, (niveau(S.xp).n >= 3 ? 3 : 2) - S.e2.pouvoirs);
}
function lieuBloque2(id){
  var l = LIEUX2[id], e = S.e2;
  if(l.obstacle && !e.obstacles[l.obstacle]) return l.obstacle;
  if(l.poursuite && !e.obstacles.poursuite) return 'poursuite';
  return null;
}
function pointsVisibles2(id){
  return LIEUX2[id].points.filter(function(p){
    if(p.besoin && !aObjet(p.besoin)) return false;
    if(p.id === 'pirate' && !S.e2.obstacles.poursuite) return false;
    return true;
  });
}
function resultatEscalier(){ return S.e2.obstacles.poursuite === 'echec' ? ESCALIER.rate : ESCALIER.reussi; }
function questionsDispo2(id){
  return VILLAGEOIS2[id].q.map(function(q,i){ return Object.assign({k:'b2.'+id+'.'+i}, q); })
    .filter(function(q){ return !q.besoin || aObjet(q.besoin); });
}
function infoCode(o, titre){ return {nom:o.nom || o.n, ic:o.ic, code:o.code, pour:o.pour}; }

function indice2(role, e){
  var v = e.vu, o = e.obstacles;
  if(role === 'pisteur'){
    if(!v['p2.mairie.porte']) return 'Commence par la porte de la mairie : des traces partent de là.';
    if(!o.sombre) return "La ruelle des Brumes est trop sombre. Il te faut de la lumière : une lanterne, la Vision de nuit… ou une potion de lumière de l'Alchimiste. Elle a besoin de champignons lumineux : ils sont dans la forêt !";
    if(!v['p2.ruelle.mur']) return 'Fouille la ruelle des Brumes : quelque chose est coincé dans le vieux mur.';
    if(!o.poursuite) return "Monte au clocher, et sois prêt à courir très vite ! Sans bottes ni pouvoir, demande d'abord une potion de rapidité à l'Alchimiste (avec le trèfle de la forêt).";
    if(!(v['p2.lavoir.brume'] && v['p2.jardin.pensees'] && v['p2.foret.trefle'] && v['p2.foret.champignons'])) return "L'Alchimiste a besoin d'ingrédients : la brume du lavoir, les pensées du jardin d'Iris, les champignons et le trèfle de la forêt.";
    return 'Raconte au Sage tout ce que tu as vu : la taille des traces, et ce qui s\'est passé au clocher.';
  }
  if(role === 'alchimiste'){
    if(!Object.keys(e.ingr).length && !e.codes.lettre) return "Demande au Pisteur de te rapporter des ingrédients, et au Sage le code de la lettre du Corbeau pour l'analyser.";
    if(!e.codes.lettre) return 'Le Sage a les lettres du Corbeau. Demande-lui le code pour en analyser une.';
    if(!e.potionsFaites.invisibilite && !e.potionsFaites.lumiere && !e.potionsFaites.rapidite) return "Demande à l'équipe qui a besoin d'une potion : le Pisteur pour voir dans le noir ou courir vite, le Barde pour écouter en cachette.";
    if(!e.codes.craie) return 'Le Pisteur va trouver un objet dans la ruelle des Brumes. Demande-lui le code !';
    if(!e.codes.de && !e.codes.plume2) return 'Au clocher, le Pisteur va récupérer un objet de la silhouette. Il faudra l\'analyser !';
    return 'Raconte tes analyses : la craie, la lavande… et ce que tu as découvert sur l\'objet du clocher.';
  }
  if(role === 'barde'){
    if(!o.ecoute) return "Iris a vu deux personnes parler au lavoir. Pour les écouter sans être vu : un cornet acoustique, le pouvoir Pas de velours, ou une potion d'invisibilité de l'Alchimiste.";
    if(!v['b2.anselme.2']) return 'Le Sage a besoin d\'une clé pour ouvrir ses archives. Demande à Anselme, le sonneur de cloches.';
    if(!v['b2.iris.1'] || !v['b2.melusine.1']) return 'Demande à Iris et à Mélusine qui achète de la lavande. Compare bien leurs réponses !';
    return 'Raconte tout au Sage : qui ment, qui a des dettes, et ce que tu as entendu au lavoir.';
  }
  if(!e.livreOk) return 'Compare les lettres du Corbeau avec le Livre d\'or. Regarde bien les points sur les i !';
  if(!o.archives) return 'Pour lire la lettre secrète, il faut ouvrir les archives : la Mémoire des anciens, la clé des archives… ou demande au Barde d\'aller voir Anselme, le sonneur.';
  if(!e.dechiffre) return "Avec l'alphabet secret, décode la lettre symbole par symbole. Écris les lettres une par une.";
  if(e.rate >= 2) return 'Le coupable fait des ronds sur les i, a de petits pieds de 3 carreaux, coud très bien… et a menti au Barde.';
  return 'Pour le piège : QUI fait des ronds sur les i, a de petits pieds et coud beaucoup ? Écoute aussi ce que le Barde a appris. OÙ : relis la lettre secrète.';
}

function finir2(){
  var e = S.e2;
  if(e.resolu) return null;
  e.resolu = true;
  var nAvant = niveau(S.xp).n, gain = 0, or = 0;
  if(!S.gagne['fin-e2']){
    S.gagne['fin-e2'] = true;
    gain = S.heros.role === 'sage' ? Math.max(50, 100 - 10*(e.rate||0)) : 80;
    or = S.heros.role === 'sage' ? Math.max(15, 30 - 5*(e.rate||0)) : 30;
    S.xp += gain; S.or += or;
    if(S.xp < SEUILS[2]){ gain += SEUILS[2] - S.xp; S.xp = SEUILS[2]; }
  }
  var nApres = niveau(S.xp).n;
  return {gain:gain, or:or, monte:nApres > nAvant, n:nApres};
}

function ecrire(txt, pt){
  return esc(txt).replace(/i/g, '<span class="i-sans">ı<span class="pt pt-' + pt + '"></span></span>');
}
function glyphe(l, taille){
  var i = l.charCodeAt(0) - 65, s = taille || 34, p = '', point = false, cx = 15, cy = 15;
  if(i < 18){
    if(i >= 9){ point = true; i -= 9; }
    var r = Math.floor(i/3), c = i % 3;
    if(r > 0) p += 'M4 4H26';
    if(r < 2) p += 'M4 26H26';
    if(c > 0) p += 'M4 4V26';
    if(c < 2) p += 'M26 4V26';
  } else {
    i -= 18;
    if(i >= 4){ point = true; i -= 4; }
    p = ['M4 4L15 15L26 4','M4 4L15 15L4 26','M26 4L15 15L26 26','M4 26L15 15L26 26'][i];
    cx = [15,8,22,15][i]; cy = [8,15,15,22][i];
  }
  return '<svg class="glyphe" viewBox="0 0 30 30" width="' + s + '" height="' + s + '" aria-hidden="true"><path d="' + p + '"/>' + (point ? '<circle cx="' + cx + '" cy="' + cy + '" r="2.8"/>' : '') + '</svg>';
}
function messageChiffre(){
  return '<div class="message-chiffre" role="img" aria-label="Une lettre écrite avec des symboles secrets">' +
    MESSAGE_SECRET.split(' ').map(function(mot){ return '<span class="mot">' + mot.split('').map(function(l){ return glyphe(l, 36); }).join('') + '</span>'; }).join('') + '</div>';
}
function cleAlphabet(){
  var h = '';
  for(var i=0;i<26;i++){ var l = String.fromCharCode(65+i); h += '<div>' + glyphe(l, 30) + '<span>' + l + '</span></div>'; }
  return '<div class="cle-alpha">' + h + '</div>';
}
function svgVillage2(){
  var arbres = '';
  for(var i=0;i<12;i++){
    var x = 8 + i*12.5, y = 24 + (i%2)*16 + (i*7)%6 - (i > 8 ? 0 : 0);
    if(x > 150) continue;
    arbres += '<polygon class="' + (i%3 ? 'sapin' : 'sapin-2') + '" points="' + x + ',' + (y-20) + ' ' + (x-10) + ',' + (y+6) + ' ' + (x+10) + ',' + (y+6) + '"/>';

    routes += '<path class="route" d="M' + hub[0] + ' ' + hub[1] + ' Q ' + mx.toFixed(0) + ' ' + my.toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + '"/>';

      S.enquete = 2; if(!S.e2) S.e2 = enquete2Neuve(); UI.onglet = 'role'; UI.saisie = []; UI.retourCode = null;
      sauver(); haut(); render(); break;
    case 'lettre2-ok':
      if(!S.gagne['or-e1']){ S.gagne['or-e1'] = true; S.or += 40; toast('+40 pièces d\'or'); }
      e.etape = S.spe ? 'marchand' : 'spe'; sauver(); haut(); render(); break;
    case 'spe-choix': UI.speChoix = d.v; render(); break;
    case 'spe-ok': if(UI.speChoix || S.spe){ S.spe = UI.speChoix || S.spe; e.etape = 'marchand'; son('magie'); sauver(); haut(); render(); } break;
    case 'spe-changer': UI.speChoix = S.spe; e.etape = 'spe'; sauver(); haut(); render(); break;
    case 'acheter': { var art = trouverArticle(d.id); if(art && S.or >= art.prix && S.sac.indexOf(art.id) < 0){ S.or -= art.prix; S.sac.push(art.id); son('oui'); sauver(); render(); } break; }
    case 'rendre': { var ar = trouverArticle(d.id), i = S.sac.indexOf(d.id); if(ar && i >= 0){ S.sac.splice(i,1); S.or += ar.prix; sauver(); render(); } break; }
    case 'commencer2':
      e.etape = 'jeu'; UI.onglet = 'role';
      if(S.heros.role === 'sage'){ e.vu['s2.habitants'] = true; gagner('s2.habitants', 10); noter('s2.habitants', NOTE_HABITANTS2); }
      sauver(); haut(); render(); break;
    case 'lieu2': e.lieu = d.id; sauver(); haut(); render(); break;
    case 'carte2': e.lieu = null; sauver(); haut(); render(); break;
    case 'point2': ouvrirPoint2(d.l, d.p); break;
    case 'obstacle': resoudreObstacle(d.id, d.via); break;
    case 'brasser': UI.modal = nouveauJeu(d.id, d.via); render(); break;
    case 'mg-tap': tapRythme(); break;
    case 'mg-montrer': montrerBulles(); break;
    case 'mg-bulle': tapBulle(+d.v); break;
    case 'mg-fiole': {
      var m = UI.modal; if(!m || m.jeu !== 'couleurs') break;
      var j = m.choix.indexOf(d.v);
      if(j >= 0) m.choix.splice(j,1); else { m.choix.push(d.v); if(m.choix.length > 2) m.choix.shift(); }
      m.msg = ''; render(); break;
    }
    case 'mg-melanger': melangerCouleurs(); break;
    case 'voir-analyse2': UI.modal = {type:'analyse2', id:d.id, pret:true}; render(); break;
    case 'profond':
      if(chargesSpe() > 0 && !e.profond[d.id]){ e.pouvoirs++; e.profond[d.id] = true; gagner('a2.pr.' + d.id, 10); noter('a2.pr.' + d.id, ANALYSES2[d.id].np); son('magie'); sauver(); render(); }
      break;
    case 'villageois2': e.villageois = d.id; sauver(); haut(); render(); break;
    case 'villageois2-retour': e.villageois = null; sauver(); haut(); render(); break;
    case 'question2': {
      var parts = d.k.split('.'), v = VILLAGEOIS2[parts[1]], q = v.q[+parts[2]];
      if(!e.vu[d.k]){
        e.vu[d.k] = true; gagner(d.k, q.obj || q.besoin ? 15 : 10);
        noter(d.k, q.note, q.obj ? OBJETS2[q.obj] : null);
        if(q.mensonge && aObjet('clochette')) noter(d.k + '.m', 'Mensonge ! ' + v.nom + ' a menti en disant : « ' + q.a + ' »');
        son(q.mensonge && aObjet('clochette') ? 'non' : 'oui');
      }
      sauver(); render(); break;
    }
    case 'verite': {
      var pv = d.k.split('.'), vv = VILLAGEOIS2[pv[1]], qv = vv.q[+pv[2]];
      if(e.vrai[d.k]) break;
      if(d.via === 'spe'){ if(chargesSpe() <= 0) break; e.pouvoirs++; }
      else { if(!(e.potions.verite > 0)) break; e.potions.verite--; }
      e.vrai[d.k] = true;
      if(qv.mensonge){ gagner('b2.v.' + d.k, 15); noter(d.k + '.v', vv.nom + ' a avoué : ' + qv.vrai.replace(/[«»]/g, '').trim()); son('magie'); }
      else son('oui');
      sauver(); render(); break;
    }
    case 'page2': e.page = d.id; UI.confirmer = false; UI.retourAcc = null; UI.retourLivre = null; UI.retourDecode = null; sauver(); render(); break;
    case 'signe': e.signes[d.id] = !e.signes[d.id]; UI.retourLivre = null; sauver(); render(); break;
    case 'verifier-i': {
      var choisis = Object.keys(e.signes).filter(function(k){ return e.signes[k]; }).sort().join(',');
      if(choisis === 'fortune,melusine'){
        e.livreOk = true; gagner('s2.livre', 20);
        noter('s2.livre', "Livre d'or : seuls Mélusine et Fortuné font des petits ronds sur les i, comme le Corbeau. Anselme n'a écrit aucun i.");
        son('oui');
      } else { UI.retourLivre = 'Pas tout à fait… Regarde les i un par un, dans chaque mot et chaque signature.'; son('non'); }
      sauver(); render(); break;
    }
    case 'dechiffrer': {
      var t = (UI.decode || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z]/g, '');
      if(t.indexOf('MINUIT') >= 0 && t.indexOf('CLOCHER') >= 0){
        e.dechiffre = true; UI.retourDecode = null; gagner('s2.decode', 20); noter('s2.decode', 'Lettre secrète déchiffrée : MINUIT AU CLOCHER.'); son('oui');
      } else { UI.retourDecode = 'Ce n\'est pas encore ça. Prends les symboles un par un, et cherche-les dans l\'alphabet.'; son('non'); }
      sauver(); render(); break;
    }
    case 'longuevue':
      e.longuevue = true; gagner('s2.longuevue', 10);
      noter('s2.longuevue', "Longue-vue : la nuit, quelqu'un coud une cape noire à plumes dans l'atelier de couture."); son('oui');
      sauver(); render(); break;
    case 'eliminer':
      if(e.elimines) break;
      if(d.via === 'spe'){ if(chargesSpe() <= 0) break; e.pouvoirs++; }
      else { if(!aObjet('boule')) break; e.consomme.boule = true; }
      e.elimines = true; if(e.qui === 'iris' || e.qui === 'victor') e.qui = null;
      noter('s2.elim', 'Iris et Victor sont innocents.'); son('magie'); sauver(); render(); break;
    case 'qui2': e.qui = d.id; UI.confirmer = false; UI.retourAcc = null; sauver(); render(); break;
    case 'ou2': e.ou = d.id; UI.confirmer = false; UI.retourAcc = null; sauver(); render(); break;
    case 'accuser2-oui': {
      var bonQui = e.qui === 'melusine', bonOu = e.ou === 'clocher';
      UI.confirmer = false;
      if(bonQui && bonOu){ UI.retourAcc = null; declencherFin2(); return; }
      e.rate = (e.rate || 0) + 1; son('non');
      UI.retourAcc = bonQui ? "Vous attendez toute la nuit… personne ne vient ! Vous aviez peut-être la bonne personne, mais pas le bon endroit."
        : bonOu ? "Vous attendez au bon endroit… mais la personne que vous surveillez dort tranquillement chez elle !"
        : "Vous attendez toute la nuit… et il ne se passe rien. Revérifiez vos indices !";
      sauver(); render(); return;
    }
  }
}

/* ---------- Affichage ---------- */
var app = document.getElementById('app');
function render(){
  UI.lectures = [];
  var h;
  if(!S.heros) h = vueCreation();
  else if(S.enquete === 2 && S.e2.etape !== 'jeu') h = vuePrep2();
  else if(S.enquete !== 2 && !S.e1.intro) h = vueIntro();
  else h = vueJeu();
  if(UI.modal) h += vueModal();
  app.innerHTML = h;
  document.body.classList.toggle('bloque', !!UI.modal);
  if(UI.modal && UI.modal.type === 'mg' && UI.modal.jeu === 'rythme' && !UI.modal.ok && !boucleActive){ boucleActive = true; requestAnimationFrame(boucleRythme); }
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.act === 'voile'){
    if(ev.target === b && !(UI.modal && (UI.modal.type === 'analyse' || UI.modal.type === 'analyse2') && !UI.modal.pret) && !(UI.modal && UI.modal.type === 'mg' && !UI.modal.ok)) fermer();
    return;
  }
  act(b.dataset.act, b);
});
app.addEventListener('input', function(ev){
  if(ev.target.id === 'decode'){ UI.decode = ev.target.value; return; }
  if(ev.target.id !== 'nom-heros') return;
  UI.crea.nom = ev.target.value;
  var b = app.querySelector('[data-act="creer"]');
  if(b) b.disabled = !(UI.crea.nom.trim() && UI.crea.role);
});
document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && UI.modal) fermer(); });

function demarrer(data){
  if(data && data.S) S = fusion(data.S);
  render();
}
try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {S:S}; }); }catch(err){}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(demarrer);
else demarrer((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
