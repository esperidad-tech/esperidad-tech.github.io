<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07050b">
<title>Le plan du Sage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Macondo&display=swap" rel="stylesheet">
<style>
/* commun.css — ce qui est commun aux pages du Sage et de l'Alchimiste (donjon de Brumeval).
   Même style que la salle d'essai (essai/src/jeu.css) et que le jeu (src/base.css) : nuit sombre, crème, or, contour #24182e.
   Rapidité (RAPIDITE.md) : tout ce qui bouge bouge en transform / opacity ; aucun filtre vivant. */
:root{
  --nuit:#07050b; --nuit-2:#120d1c; --nuit-3:#1c1530; --encre:#24182e; --or:#ffd23f; --or-pale:#ffe3a3; --creme:#f3e7cb; --brun:#5a4630;
  --parchemin:#ecdcb4; --encre-plan:#3b2414; --rouge-plan:#8e2e1c; --cyan:#8ff3ff; --cyan-2:#3fd0ff;
  --c-pisteur:#5fcf86; --c-alchimiste:#b48cff; --c-sage:#6cb6ff;
  --f-titre:"Macondo", "Georgia", "Times New Roman", serif;
  --f-texte:"Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --bas:max(10px, env(safe-area-inset-bottom, 0px));
  --gauche:max(12px, env(safe-area-inset-left, 0px));
  --droite:max(12px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--nuit);overscroll-behavior:none}
body{font-family:var(--f-texte);font-size:17px;line-height:1.35;color:#fff4e0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;margin:0}
img,svg{-webkit-user-drag:none}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;line-height:1.1;margin:0;color:var(--or-pale)}
p{margin:0}
@media (max-height:520px){ body{font-size:15px} }

/* ---------- les boutons ---------- */
/* la règle de Romain : un bouton pour ALLER / LANCER / VALIDER est JAUNE, texte NOIR ; les autres sont sombres */
.aller{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;min-width:54px;padding:8px 26px;border-radius:999px;
  background:linear-gradient(180deg,#ffe48a,#ffd23f 55%,#e8a93a);color:#111;font-weight:800;font-size:19px;border:3px solid var(--encre);
  box-shadow:0 4px 0 #b07a1c, 0 8px 18px rgba(0,0,0,.45);position:relative;text-align:center;line-height:1.1}
.aller:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a1c, 0 4px 10px rgba(0,0,0,.35)}
.aller:disabled{background:linear-gradient(180deg,#6a5e48,#4a4232);color:#2a2418;box-shadow:0 3px 0 #2a2418;cursor:default}
.sombre{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:6px 18px;border-radius:999px;
  background:rgba(16,11,24,.9);border:2px solid #6a5438;color:#efe2c4;font-weight:700;font-size:16px;line-height:1.1;text-align:center}
.sombre:active{transform:translateY(2px)}
.lire{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(36,24,46,.12);font-size:20px;flex:none;line-height:1}
.lire:active{transform:scale(.92)}
.sur-nuit .lire,.lire.clair{background:rgba(255,244,224,.1)}
/* le rond jaune qui guide (comme le tutoriel du jeu), seulement en transform / opacity */
.guide{animation:flotte 1.6s ease-in-out infinite}
.guide::before{content:'';position:absolute;inset:-7px;border-radius:inherit;border:4px solid var(--or);pointer-events:none;
  box-shadow:0 0 0 3px rgba(36,24,46,.55), 0 0 16px 5px rgba(255,210,63,.7), inset 0 0 10px rgba(255,210,63,.45);animation:pulse 1.3s ease-in-out infinite}
.guide::after{content:'';position:absolute;inset:-7px;border-radius:inherit;border:3px solid var(--or);opacity:0;pointer-events:none;animation:onde 1.3s ease-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes onde{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.28,1.5);opacity:0}}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- le texte raconté (toujours avec son 🔊) ---------- */
.dit{display:flex;align-items:center;gap:8px}
.dit>span{flex:1;min-width:0}
.bulle{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:16px;background:rgba(243,231,203,.97);color:#35281b;
  border:3px solid var(--encre);box-shadow:0 4px 0 rgba(0,0,0,.45);font-weight:700;font-size:16px;line-height:1.28;min-height:56px}
.bulle>span{flex:1;min-width:0}
.bulle.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
@media (max-height:520px){ .bulle{font-size:14.5px;min-height:50px;padding:4px 4px 4px 12px} }

/* ---------- la tablette debout ---------- */
#tourne{position:fixed;inset:0;z-index:200;background:#0b0810;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#tourne p{font-family:var(--f-titre);font-size:28px;line-height:1.2;color:var(--or-pale);max-width:420px;margin:0;text-shadow:0 2px 0 var(--encre)}
#tourne .dit{flex-direction:column}
.tn-tablette{width:70px;height:104px;border:5px solid var(--or-pale);border-radius:12px;position:relative;animation:tn-tourne 2.4s ease-in-out infinite}
.tn-tablette i{position:absolute;left:50%;bottom:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--or-pale)}
@keyframes tn-tourne{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#tourne .lire{background:var(--creme);color:var(--encre)}

/* ---------- les fenêtres ---------- */
.voile{position:fixed;inset:0;z-index:100;background:rgba(5,3,9,.72);display:flex;align-items:center;justify-content:center;
  padding:max(10px, env(safe-area-inset-top, 0px)) var(--droite) var(--bas) var(--gauche);animation:voile .2s ease-out}
@keyframes voile{from{opacity:0}to{opacity:1}}
.fen{position:relative;width:min(760px, 100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:22px;
  background:linear-gradient(180deg,#221a30,#140f1e);border:3px solid #5a4630;box-shadow:0 0 0 2px var(--encre), 0 18px 50px rgba(0,0,0,.6);
  padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px;animation:fen .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fen{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.fen h2{font-size:26px;text-shadow:0 2px 0 var(--encre)}
.fen .titre{display:flex;align-items:center;gap:10px;padding-right:52px;min-height:48px}
.fen .titre h2{flex:1}
.fen .fermer{position:absolute;right:10px;top:10px;width:48px;height:48px;border-radius:50%;background:rgba(255,244,224,.08);border:2px solid #5a4630;font-size:22px;display:grid;place-items:center}
.fen .rangee{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.fen.parch{background:linear-gradient(180deg,#f3e7cb,#e3cf9f);color:#35281b;border-color:#8a6a3a}
.fen.parch h2{color:#3b2414;text-shadow:none}
.fen.parch .fermer{background:rgba(36,24,46,.08);border-color:#8a6a3a;color:#35281b}
@media (max-height:520px){ .fen{padding:12px 14px;gap:8px;border-radius:18px} .fen h2{font-size:21px} }

/* ---------- le pavé des codes (12 symboles, comme l'onglet Code du jeu) ---------- */
.pave-fen{width:min(820px, 100%)}
.pave-corps{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 22px;align-items:center}
.pave-gauche{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:300px}
.saisie{display:flex;gap:10px}
.case{width:clamp(56px, 11vh, 80px);height:clamp(56px, 11vh, 80px);border-radius:16px;border:3px dashed #5a4a6e;display:grid;place-items:center;font-size:clamp(30px, 6vh, 42px);background:rgba(0,0,0,.25)}
.case.pleine{border-style:solid;border-color:var(--or);background:var(--creme);animation:pop .25s}
.pave{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px}
.pave button{min-height:clamp(52px, 10vh, 76px);border-radius:16px;border:2px solid #4a3d64;background:linear-gradient(180deg,#2a2140,#1a1428);font-size:clamp(28px, 5.4vh, 38px);
  display:grid;place-items:center;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.pave button:active{transform:scale(.94);background:#3a2e58}
.pave-msg{min-height:56px}
.pave-msg .bulle.ko{background:#ffe0d6;border-color:#6a1e14}
@media (max-width:640px), (max-height:430px){ .pave-corps{grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:8px 14px} .pave-gauche{gap:8px} .pave{gap:6px} .pave-expl{font-size:14px} }

/* ---------- le code en grand (pages du Sage, recettes de l'Alchimiste) ---------- */
.code-grand{display:flex;gap:10px;justify-content:center}
.code-grand b{width:clamp(58px, 12vh, 86px);height:clamp(58px, 12vh, 86px);border-radius:16px;display:grid;place-items:center;font-size:clamp(32px, 7vh, 48px);
  background:#fffaf0;border:3px solid var(--encre);box-shadow:0 4px 0 rgba(0,0,0,.35);font-weight:400}

/* ---------- les petits boutons discrets (recommencer) ---------- */
.discret{min-width:48px;min-height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(16,11,24,.6);border:2px solid rgba(106,84,56,.6);color:#cdbf9f;opacity:.75}

/* ---------- les étincelles (transform / opacity seulement) ---------- */
.etin{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0,#bff9ff 35%,rgba(143,243,255,0) 70%)}
.etin.or{background:radial-gradient(circle,#fff 0,#ffe08a 35%,rgba(255,210,63,0) 70%)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* sage.css — la tablette du Sage : le plan des Fondateurs sur une vieille table, le Grand Livre, la rune */
/* ---------- la table et le plan ---------- */
#table{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,.65) 100%),
    repeating-linear-gradient(91deg, rgba(255,210,150,.035) 0 2px, rgba(0,0,0,0) 2px 9px, rgba(0,0,0,.05) 9px 11px, rgba(0,0,0,0) 11px 23px),
    linear-gradient(180deg,#2a1a14,#1a100c 60%,#140c0a)}
#table.glisse{cursor:grabbing}
#couche{position:absolute;left:0;top:0;width:1727px;height:971px;transform-origin:0 0;will-change:transform}
#couche .plan-svg{position:absolute;left:0;top:0;display:block;overflow:visible}
#couche canvas.encre{position:absolute;pointer-events:none}
#couche .coin{position:absolute}
#couche .coin svg{display:block;width:100%;height:100%;overflow:visible}
/* la rune qu'on promène : une lueur et le signe, au-dessus du doigt */
#curseur{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5}
#curseur::before{content:'';position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,254,255,.55) 0,rgba(143,243,255,.35) 30%,rgba(95,224,240,.12) 60%,rgba(95,224,240,0) 72%)}
#curseur i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(191,249,255,.8);
  box-shadow:0 0 0 2px rgba(36,24,46,.5);animation:rune-tourne 3s linear infinite}
#curseur i::after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#e8fdff;font-size:22px;text-shadow:0 0 6px #5fe8ff}
@keyframes rune-tourne{to{transform:rotate(360deg)}}

/* ---------- la barre d'outils (à droite) ---------- */
#barre{position:fixed;right:var(--droite);top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;z-index:20;pointer-events:none}
#barre>*{pointer-events:auto}
.outil{position:relative;width:76px;min-height:72px;border-radius:20px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(180deg,rgba(40,30,58,.94),rgba(20,14,30,.94));border:2px solid #6a5438;box-shadow:0 0 0 2px var(--encre),0 6px 16px rgba(0,0,0,.5);color:#f3e7cb}
.outil .ic{font-size:30px;line-height:1.05}
.outil small{font-size:12.5px;font-weight:700;line-height:1.1;text-align:center}
.outil:active{transform:translateY(2px)}
.outil.aller{background:linear-gradient(180deg,#ffe48a,#ffd23f 55%,#e8a93a);color:#111;border:3px solid var(--encre);box-shadow:0 4px 0 #b07a1c, 0 8px 18px rgba(0,0,0,.45);min-width:0;padding:6px 4px 5px;border-radius:20px;gap:2px;font-size:inherit}
.outil.on{border-color:var(--or);background:linear-gradient(180deg,#3a2c54,#22183a)}
.outil .badge{position:absolute;right:-6px;top:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--creme);color:#35281b;border:2px solid var(--encre);font-size:14px;font-weight:800;display:grid;place-items:center}
.zooms{display:flex;flex-direction:column;gap:8px}
.zooms button{width:52px;height:48px;border-radius:14px;background:rgba(16,11,24,.86);border:2px solid #6a5438;font-size:24px;font-weight:800;color:#f3e7cb;line-height:1}
#b-nouveau{margin-top:4px}

/* ---------- la grille de l'alphabet secret, posée sur la table ---------- */
.carte-grille{position:fixed;top:max(10px, env(safe-area-inset-top, 0px));right:calc(var(--droite) + 92px);width:300px;z-index:15;pointer-events:none;
  background:linear-gradient(180deg,#f3e7cb,#e0c992);border:3px solid #8a6a3a;border-radius:6px 14px 8px 12px;box-shadow:0 0 0 2px var(--encre),0 10px 24px rgba(0,0,0,.55);padding:7px 9px 8px;transform:rotate(1.2deg)}
.carte-grille h3{font-size:17px;color:#3b2414;margin:0 0 4px;text-align:center}
.cle-svg{display:block;width:100%;height:auto}
.cle-svg path{fill:none;stroke:#3b2414;stroke-width:3;stroke-linecap:round}
.cle-svg text{font-family:var(--f-titre);font-size:19px;fill:#3b2414;text-anchor:middle}
.cle-svg circle{fill:#8e2e1c}

/* ---------- en bas : la rune et le conteur ---------- */
#bas{position:fixed;left:var(--gauche);bottom:var(--bas);right:calc(var(--droite) + 92px);display:flex;align-items:flex-end;gap:12px;z-index:20;pointer-events:none}
#bas>*{pointer-events:auto}
#rune{position:relative;flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:32px;touch-action:none;
  background:radial-gradient(circle at 50% 40%,#3a8aa0,#123040 70%);border:3px solid var(--encre);box-shadow:0 0 0 2px #9ff4ff,0 0 18px rgba(95,232,255,.6),0 6px 14px rgba(0,0,0,.5)}
#rune.prise{opacity:.35}
#rune[hidden]{display:none}
.scene-img.rune-img i{width:96px;height:96px;border-radius:38% 46% 42% 50%;background:radial-gradient(circle at 40% 35%,#8fa6c0,#3a4a66 70%);border:2px solid #24304a;box-shadow:0 0 34px rgba(127,240,255,.85);
  display:grid;place-items:center;font-style:normal;font-size:52px;color:#bff9ff;text-shadow:0 0 12px #7ff0ff}
#rune small{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#bff9ff;text-shadow:0 1px 0 #000;white-space:nowrap}
#bulle{max-width:640px}

/* ---------- le Grand Livre ---------- */
.livre .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.page{position:relative;min-height:178px;border-radius:6px 14px 10px 6px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(160deg,#fffaf0,#efe2c2);border:2px solid #8a6a3a;box-shadow:0 4px 0 rgba(0,0,0,.25),inset -6px 0 10px rgba(140,100,40,.18);color:#35281b}
.page b{font-family:var(--f-titre);font-weight:400;font-size:19px;line-height:1.1}
.page small{font-size:13px;color:#6b5434}
.page.blanche i{font-style:normal;font-size:40px;color:#c8a860;opacity:.55;margin-top:auto;animation:scintille 2.4s ease-in-out infinite}
@keyframes scintille{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.8;transform:scale(1.05)}}
.page.ecrite{background:linear-gradient(160deg,#f7f0ff,#e3dcf2)}
.page.ecrite .code-grand{gap:5px;margin-top:auto}
.page.ecrite .code-grand b{width:42px;height:42px;font-size:24px;border-radius:10px;border-width:2px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.page.guide::before,.page.guide::after{border-radius:10px}
.livre-note{border-top:2px dashed rgba(107,84,52,.45);padding-top:8px;font-weight:700}
.livre .dit,.page-fen .dit,.scene.parch .dit,.loupe .dit{color:#35281b}
/* une page qui s'écrit à l'encre magique */
.grande-page{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 6px 4px;overflow:hidden}
.grande-page h2{font-size:30px}
.grande-page .num{color:#6b5434;font-weight:700}
.grande-page .tache{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(63,208,255,.35),rgba(63,208,255,.12) 40%,rgba(63,208,255,0) 65%)}
.grande-page.ecrit .tache{animation:tache 1.6s ease-out forwards}
@keyframes tache{0%{transform:scale(.1);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:.5}}
.runes-vol{position:absolute;left:50%;top:44%;width:0;height:0;pointer-events:none}
.runes-vol i{position:absolute;font-style:normal;font-size:26px;color:#1f7ad0;opacity:0;text-shadow:0 0 6px rgba(143,243,255,.8)}
.grande-page.ecrit .runes-vol i{animation:rune-vole 1.5s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i) * .08s)}
@keyframes rune-vole{0%{transform:rotate(calc(var(--i) * 60deg)) translateX(140px) rotate(0);opacity:0}30%{opacity:1}100%{transform:rotate(calc(var(--i) * 60deg + 200deg)) translateX(0) rotate(180deg);opacity:0}}
.grande-page.ecrit h2,.grande-page.ecrit .num{animation:apparait .6s .9s both}
.grande-page.ecrit .code-grand b{animation:code-pop .5s both}
.grande-page.ecrit .code-grand b:nth-child(1){animation-delay:1.1s}
.grande-page.ecrit .code-grand b:nth-child(2){animation-delay:1.35s}
.grande-page.ecrit .code-grand b:nth-child(3){animation-delay:1.6s}
.grande-page.ecrit .dit,.grande-page.ecrit .rangee{animation:apparait .5s 1.9s both}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes code-pop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:none}}

/* ---------- la loupe d'une note codée ---------- */
.loupe{width:min(860px,100%)}
.loupe-corps{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.loupe-mots{display:flex;flex-direction:column;gap:8px;align-items:center}
.loupe-ligne{display:flex;gap:4px}
.loupe-esp{width:22px}
.loupe-l{position:relative;width:48px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;border-radius:10px}
.loupe-l .glyphes{width:40px;height:40px}
.loupe-l b{width:44px;height:44px;border-radius:10px;border:2px dashed #8a6a3a;background:rgba(255,255,255,.4);display:grid;place-items:center;font-family:var(--f-titre);font-weight:400;font-size:26px;color:#1f3a6a}
.loupe-l.choisi b{border:3px solid var(--or);background:#fffaf0;box-shadow:0 0 0 2px var(--encre)}
.loupe-cle{width:300px;max-width:100%;background:rgba(255,250,240,.6);border:2px solid #8a6a3a;border-radius:10px;padding:5px}
.clavier{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}

.clavier button:active{transform:translateY(2px)}

.loupe-msg{min-height:0}

.bete-vignette img{display:block;width:100%;height:auto;aspect-ratio:560/440;object-fit:contain;border-radius:6px}
.bete-vignette b{font-family:var(--f-titre);font-weight:400;font-size:15px;line-height:1.1;text-align:center}

.bete-fen{width:min(980px,100%)}
.bete-page{display:flex;gap:16px;align-items:flex-start}

.bete-img{flex:none;width:min(40%,360px);display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:0}

.bete-recit{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.bete-intro{font-style:italic;color:#5a4326}
.recit{border-left:3px solid rgba(138,106,58,.6);padding:2px 0 2px 12px}

}

/* ---------- les petites scènes ---------- */
.scene .scene-img{height:150px;display:grid;place-items:center}

.scene-img.dechiree i{clip-path:polygon(0 30%, 18% 22%, 30% 30%, 46% 12%, 60% 20%, 76% 6%, 100% 0, 100% 100%, 0 100%)}
.scene-img.blanche i{background:linear-gradient(160deg,#fffdf6,#f1e7cf);width:96px;box-shadow:0 0 0 2px #8a6a3a,0 0 30px rgba(255,240,200,.9)}
@keyframes flotte-page{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(3deg)}}

.odette-txt{flex:1;display:flex;flex-direction:column;gap:8px}

.odette-txt .l1{animation-delay:.2s}.odette-txt .l2{animation-delay:1.2s}.odette-txt .l3{animation-delay:2.4s}.odette-txt .l4{animation-delay:3.4s}

@media (max-height:520px), (max-width:700px){
  .odette .porte{width:140px;height:140px}.odette .porte svg{width:140px;height:140px}.odette .moustache{width:84px;height:70px}.odette .moustache svg{width:84px;height:70px}

  .loupe-l b{width:44px;height:44px;font-size:22px}
  .loupe-l .glyphes{width:32px;height:32px}
}

<body>
<div id="table"><div id="couche"></div><div id="curseur" hidden><i></i></div></div>
<div id="grille" class="carte-grille" hidden><h3>🔤 L'alphabet secret</h3><div class="cle"></div></div>
<nav id="barre" aria-label="Les outils du Sage">

</nav>
<div id="bas"><button type="button" id="rune" aria-label="La rune de lumière"><span aria-hidden="true">✨</span><small>Rune</small></button><div id="bulle" class="bulle"></div></div>

<div id="tourne" hidden>
  <div class="tn-tablette"><i></i></div>
  <p class="dit"><span>Tourne ta tablette, l'aventure se joue en large !</span><button type="button" class="lire" data-lire="Tourne ta tablette, l'aventure se joue en large !" aria-label="Écouter">🔊</button></p>
</div>
<script>
/* ===== donjon-codes.js ===== */
/* Les codes du prototype du donjon (CONCEPTION-DONJON.md §9) : un seul tableau, partagé par les trois pages
   (le donjon sur la tablette du Pisteur, donjon-sage.html, donjon-alchimiste.html).
   Les 12 symboles et leur ordre sont ceux du jeu (jeu/src/donnees.js : D.SYM, D.ORDRE_SYM).
   Chaque code ne marche qu'une fois (la page qui le reçoit s'en souvient).
   Ces codes ne valent que dans ces pages d'essai : ils ne touchent pas aux codes des enquêtes (gelés pour E1 et E2). */
(function(global){
'use strict';
var SYM = {
  lune:{e:'🌙', n:'Lune'}, etoile:{e:'⭐', n:'Étoile'}, soleil:{e:'☀️', n:'Soleil'},
  cle:{e:'🔑', n:'Clé'}, champi:{e:'🍄', n:'Champignon'}, poisson:{e:'🐟', n:'Poisson'},
  arbre:{e:'🌳', n:'Arbre'}, cloche:{e:'🔔', n:'Cloche'}, chapeau:{e:'🎩', n:'Chapeau'},
  coeur:{e:'❤️', n:'Cœur'}, flamme:{e:'🔥', n:'Flamme'}, chat:{e:'🐱', n:'Chat'}
};
var ORDRE = ['lune','etoile','soleil','cle','champi','poisson','arbre','cloche','chapeau','coeur','flamme','chat'];

/* de : la tablette qui AFFICHE le code ; a : la tablette où on le TAPE */
var CODES = {
  /* les pages blanches du Grand Livre (le Sage les affiche, le Pisteur les tape hors combat : sauvegarde) */
  'sauve:1':        {code:['lune','cle','arbre'],        de:'sage',       a:'pisteur',    nom:'Page blanche n° 1'},
  'sauve:2':        {code:['etoile','cloche','poisson'], de:'sage',       a:'pisteur',    nom:'Page blanche n° 2'},
  'sauve:3':        {code:['soleil','chapeau','champi'], de:'sage',       a:'pisteur',    nom:'Page blanche n° 3'},
  'sauve:4':        {code:['coeur','lune','flamme'],     de:'sage',       a:'pisteur',    nom:'Page blanche trouvée'},
  /* les plantes rares : le Pisteur les trouve, l'Alchimiste les cuisine au chaudron */
  'plante:givre':   {code:['poisson','lune','etoile'],   de:'pisteur',    a:'alchimiste', nom:'Fleur de givre'},
  'plante:lumiere': {code:['arbre','soleil','cloche'],   de:'pisteur',    a:'alchimiste', nom:'Herbes lumineuses'},
  /* les recettes sorties du chaudron : l'Alchimiste les affiche, le Pisteur les tape au feu de camp (ou hors combat) */
  'recette:givre':  {code:['champi','coeur','cle'],      de:'alchimiste', a:'pisteur',    nom:'Recette : Givre'},
  'recette:baumelum':{code:['chat','arbre','lune'],      de:'alchimiste', a:'pisteur',    nom:'Recette : Baume lumineux'},
  /* la rune de lumière du Sage : le Pisteur la trouve au fond du puits (sans elle, pas d'encre invisible sur le plan) */
  'rune:lumiere':   {code:['flamme','etoile','cle'],     de:'pisteur',    a:'sage',       nom:'La rune de lumière'},
  /* les trouvailles pour le Sage */
  'page:dechiree':  {code:['cle','flamme','poisson'],    de:'pisteur',    a:'sage',       nom:'La page déchirée du plan'},
  'page:blanche':   {code:['cloche','chat','soleil'],    de:'pisteur',    a:'sage',       nom:'Une page blanche'},
  'porte:odette':   {code:['chapeau','lune','coeur'],    de:'pisteur',    a:'sage',       nom:'Odette est derrière la porte'},
  /* le carnet de l'aventurier, trouvé à l'entrée du donjon (Romain, 11 novembre) : c'est lui que le Sage feuillette */
  'carnet:aventurier': {code:['chapeau','arbre','poisson'], de:'pisteur', a:'sage', nom:'Le carnet de l’aventurier'},
  /* l'étude des monstres (Romain, 10 novembre) : le Sage étudie un monstre en combat, son code entre dans le journal du
     Pisteur ; tapé sur la tablette du Sage, il décolle la page de ce monstre dans le carnet de l'aventurier */
  'etude:rat':         {code:['chat','champi','etoile'],    de:'pisteur', a:'sage', nom:'Étude : le rat d’égout'},
  'etude:ratcuir':     {code:['cle','chapeau','flamme'],    de:'pisteur', a:'sage', nom:'Étude : le rat cuirassé'},
  'etude:chauvesouris':{code:['lune','cloche','champi'],    de:'pisteur', a:'sage', nom:'Étude : la chauve-souris de la brume'},
  'etude:feufollet':   {code:['flamme','soleil','lune'],    de:'pisteur', a:'sage', nom:'Étude : le feu follet'},
  'etude:araignee':    {code:['arbre','chat','coeur'],      de:'pisteur', a:'sage', nom:'Étude : l’araignée des caves'},
  'etude:tetard':      {code:['poisson','chapeau','etoile'],de:'pisteur', a:'sage', nom:'Étude : le têtard du puits'},
  'etude:roirats':     {code:['coeur','chat','cloche'],     de:'pisteur', a:'sage', nom:'Étude : le Roi des rats'},
  'etude:gardien':     {code:['cloche','cle','soleil'],     de:'pisteur', a:'sage', nom:'Étude : le Gardien de rouille'},
  'etude:bourbe':      {code:['poisson','soleil','chapeau'],de:'pisteur', a:'sage', nom:'Étude : Bourbe'},
  /* la fin du donjon, pour le Barde */
  'leo:attrape':    {code:['etoile','arbre','flamme'],   de:'pisteur',    a:'barde',      nom:'Léo attrapé'}
};

var parCode = {};
Object.keys(CODES).forEach(function(id){ parCode[CODES[id].code.join('-')] = id; });

global.DONJON_CODES = {
  SYM:SYM, ORDRE:ORDRE, CODES:CODES,
  /* le code (tableau de 3 symboles) d'un id */
  code:function(id){ return CODES[id] ? CODES[id].code.slice() : null; },
  /* l'id d'une suite tapée, si elle est valable sur cette tablette (sinon null) */
  lire:function(seq, tablette){ var id = parCode[seq.join('-')]; return id && (!tablette || CODES[id].a === tablette) ? id : null; },
  /* le code en emojis, pour l'affichage */
  emojis:function(id){ return CODES[id] ? CODES[id].code.map(function(k){ return SYM[k].e; }).join(' ') : ''; }
};
})(typeof window !== 'undefined' ? window : this);

/* ===== moteur/src/donnees.js ===== */
/* donnees.js — LES TABLEAUX du donjon du puits (Les Enquêteurs de Brumeval, enquête 3).
   Aucun calcul ici, aucun affichage : seulement ce que regles.js lit. Mode d'emploi : moteur/REGLES.md.
   Dans la page : window.DonjonDonnees. Dans Node : require('./donnees.js').

   Les chiffres de la salle des rats (héros, rat d'égout, gestes, recettes de l'essai) sont ceux que Romain a validés
   dans jeu/donjon/essai/src/jeu.js : ON NE LES CHANGE PAS. Les autres chiffres sortent de la simulation
   (moteur/equilibre.js, rapport dans moteur/equilibre.md) et sont reportés dans CONCEPTION-DONJON.md.

   ---------------------------------------------------------------------------------------------------------------
   LES RÉACTIONS D'UN MONSTRE (sa « machine à états »)
   reactions[coup] = une liste de règles ; la PREMIÈRE dont la condition est vraie s'applique.
   Sans règle (ou sans règle vraie), c'est la réaction ordinaire du coup (regles.js, « _ordinaire »).
     coup    : lumiere, bruit, nuage, feu, huile, colle, givre, acide, louche (le coup de louche lui-même, sur la bête
               de devant), bouclier (son attaque tombe sur un bouclier de runes), chatouille (Bourbe seulement)
     si      : {avec:[états qu'il doit tous avoir], sans:[états qu'il ne doit pas avoir], un:[au moins un de ceux-là]}
               « ouvert » compte comme un état (son point faible est ouvert).
     fait    : la suite de ce qui se passe :
               ['etat', nom, durée]      il prend cet état. Durée : 1 = jusqu'à la fin du tour des monstres de ce tour ;
                                          2 = jusqu'à la fin du tour suivant ; 3 = encore un de plus ; 'fin' = jusqu'à la fin
                                          du combat ; 'geste' = jusqu'au premier geste des héros du tour suivant.
               ['retire', nom]           il perd cet état
               ['ouvre', durée, par]     son point faible s'ouvre (même durées)
               ['ferme']                 son point faible se referme
               ['special', nom]          un moment propre à la bête (special(nom) du module animé)
               ['gagne', n]              il gagne n PV (et n PV max)
               ['naissent', type, n]     n petites bêtes arrivent devant lui
               ['riposte', attaque, qui] il frappe tout de suite (« alchimiste », ou « auteur » : celui qui a fait le geste)
               ['mot', texte]            deux mots à montrer au-dessus de la bête
               (un état dont le nom commence par « _ » est une note des règles : il ne s'affiche pas)
     defaut  : true = la réaction ordinaire du coup s'applique AUSSI (dégâts, brûlure…)
     piege   : true = c'est un piège : ça le renforce (pour les tests, la simulation et le Grand Livre)
   --------------------------------------------------------------------------------------------------------------- */
(function(global){
'use strict';
var D = {};

/* ===================================================================== 1. LES HÉROS (essai : ne pas changer) */
D.HEROS = {
  sage:{nom:'Sage', le:'le Sage', Le:'Le Sage', du:'du Sage', pv:90, gestes:['oeil', 'rune', 'bouclier'], sac:null},
  alchimiste:{nom:'Alchimiste', le:'l\'Alchimiste', Le:'L\'Alchimiste', du:'de l\'Alchimiste', pv:100, gestes:['louche', 'herbes'], sac:'potion'},
  pisteur:{nom:'Pisteur', le:'le Pisteur', Le:'Le Pisteur', du:'du Pisteur', pv:120, gestes:['fleche', 'dague'], sac:'fleche', objets:['fleches-normales']}
};
D.ORDRE = ['sage', 'alchimiste', 'pisteur'];           /* de gauche à droite à l'écran */
D.EXPOSES = ['pisteur', 'alchimiste', 'sage'];         /* du plus exposé (devant) au moins exposé */
D.VISEE = {pisteur:6, alchimiste:2.5, sage:1.5};       /* les monstres visent plutôt celui de devant (60 %, 25 %, 15 %) */

/* ===================================================================== 2. LES GESTES
   vise : 'bete' (un monstre), 'devant' (les bêtes à portée de main), 'heros' (un ami debout), 'salle' (pas de cible) */
D.GESTES = {
  /* Romain, 11 novembre (9 h 26) : depuis que tout le carnet de l'aventurier est ouvert, « Étudier » ne sert plus. À sa place,
     la rune de l'œil : le Sage voit, pour ce tour ET le suivant, qui chaque monstre va frapper et combien. Sans elle, on ne
     sait pas qui sera frappé. */
  oeil:{ic:'👁️', nom:'Rune de l\'œil', d:'qui sera frappé ?', vise:'salle'},
  rune:{ic:'✨', nom:'Rune de lumière', d:'une vive lumière', vise:'bete'},
  bouclier:{ic:'🛡️', nom:'Bouclier de runes', d:'protège un ami', vise:'heros'},
  louche:{ic:'🥄', nom:'Coup de louche', d:'un grand BONG', vise:'salle'},
  herbes:{ic:'🌿', nom:'Herbes', d:'soigne un peu', vise:'heros'},
  fleche:{ic:'🏹', nom:'Flèche', d:'ce qui vole', vise:'bete'},
  dague:{ic:'🗡️', nom:'Coup de dague', d:'celui de devant', vise:'devant'},
  chatouiller:{ic:'🪶', nom:'Chatouiller', d:'guili-guili !', vise:'salle'}
};

/* ===================================================================== 3. LES RECETTES (les potions de l'Alchimiste)
   Romain, 10 novembre (17 h 47 et 17 h 56) : plus de sac de 3 recettes à choisir (« un peu trop compliqué »). L'Alchimiste a
   TOUTES les potions qu'il a réussi à créer pendant ses missions (partie.recettes). S'il lui en manque une, il reste un
   chemin plus long, en deux étapes, écrit en énigme dans le Grand Livre du Sage (D.LIVRE, la dernière ligne).
   vise : 'bete', 'salle', 'heros' (un ami debout), 'sol' (un ami au sol), 'equipe' (tout le monde, pas de cible)
   fleche : le Pisteur peut y tremper une flèche. pouvoir : le nom du coup que reçoit le monstre. */
D.RECETTES = {
  feu:{petit:'Feu', nom:'Fiole de feu', d:'brûle un monstre', long:'Elle brûle un monstre.', vise:'bete', fleche:true, pouvoir:'feu', coul:'#ff7a2a'},
  fumigene:{nom:'Fumigène', d:'un gros nuage', long:'Un gros nuage, dans toute la salle.', vise:'salle', fleche:false, pouvoir:'nuage', coul:'#aab4d2'},
  /* (libere : lancée sur un ami pris dans une toile, elle le libère tout de suite — Romain, 11 novembre : « il y a toujours un contre ») */
  huile:{nom:'Huile', d:'ça glisse !', long:'Ça glisse, ça glisse… Et sur un ami pris dans une toile, elle le libère.', vise:'bete', fleche:true, pouvoir:'huile', coul:'#f2b630', libere:'entoile'},
  colle:{nom:'Colle', d:'pattes collées', long:'Les pattes restent collées au sol.', vise:'bete', fleche:true, pouvoir:'colle', coul:'#ece4d0'},
  acide:{nom:'Acide', d:'ronge le fer', long:'Il ronge le fer et la rouille.', vise:'bete', fleche:true, pouvoir:'acide', coul:'#9be04a'},
  baume:{nom:'Baume', d:'soigne beaucoup', long:'Il soigne beaucoup un ami.', vise:'heros', fleche:false, soin:40, coul:'#5fd08a'},
  coeur:{petit:'Cœur', nom:'Cœur vaillant', d:'relève un ami', long:'Il relève un ami tombé au sol.', vise:'sol', fleche:false, releve:40, coul:'#ff5a7a'},
  /* celles qu'on gagne au chaudron de l'Alchimiste (codes recette:givre et recette:baumelum) */
  givre:{nom:'Givre', d:'gèle tout', long:'Un froid qui gèle tout ce qu\'il touche.', vise:'bete', fleche:true, pouvoir:'givre', coul:'#bff4ff', gagnee:true},
  baumelum:{petit:'Lumineux', nom:'Baume lumineux', d:'soigne tout le monde', long:'Il soigne un peu toute l\'équipe.', vise:'equipe', fleche:false, soinEquipe:15, coul:'#7affc0', gagnee:true}
};
D.RECETTES_DEPART = ['feu', 'fumigene', 'huile', 'colle', 'acide', 'baume', 'coeur'];
D.ORDRE_RECETTES = ['feu', 'fumigene', 'huile', 'colle', 'acide', 'baume', 'coeur', 'givre', 'baumelum'];

/* ===================================================================== 4. LES CHIFFRES COMMUNS */
D.CHIFFRES = {
  places:2,                                /* places d'objet par héros */
  /* le critique du Pisteur sur un point faible ouvert, selon le rang de la bête.
     Romain, 11 novembre (9 h 16, 9 h 26, 13 h 53) : « on ne chasse pas des oiseaux avec une dague ». LA DAGUE fait les gros
     dégâts, mais ne touche que le monstre de devant (et ceux qui sont tombés devant). L'ARC ne fait un gros critique que sur
     ce qui vole, pend à un fil ou nage (hauteur:true dans D.MONSTRES) : « fleche ». Sur ce qui marche par terre, son critique
     est « quatre fois plus petit » que celui de la dague : « sol ». (Une flèche spéciale, sur le monstre pour lequel elle est

    var o = amp * (.65 * Math.sin(t * fr[0] + ph[0]) + .35 * Math.sin(t * fr[1] + ph[1]));
    return [p[0] + ty / l * o, p[1] - tx / l * o];

}

/* l'encre « pleine » de chaque note (avec la bonne police), et ce qui en est déjà révélé */
function peindreEncre(){
  NOTES_ENCRE.forEach(function(n){
    var px = n.pleine.getContext('2d'); PS.encre(px, n, RES);
    /* les cases qui contiennent de l'encre (pour savoir quand la note est assez révélée) */
    var d = null; try{ d = px.getImageData(0, 0, n.pleine.width, n.pleine.height).data; }catch(e){}
    n.casesEncre = [];

      if(!d){ n.casesEncre.push(j * n.nx + i); continue; }
      var x0 = Math.floor(i * CELL * RES), y0 = Math.floor(j * CELL * RES), x1 = Math.min(n.pleine.width, Math.floor((i + 1) * CELL * RES)), y1 = Math.min(n.pleine.height, Math.floor((j + 1) * CELL * RES)), ok = false;
      for(var y = y0; y < y1 && !ok; y += 3) for(var x = x0; x < x1 && !ok; x += 3) if(d[(y * n.pleine.width + x) * 4 + 3] > 60) ok = true;

/* la rune passe en (wx, wy), rayon wr (en unités) : l'encre apparaît là, et reste */
function reveler(wx, wy, wr){
  var trouve = null;
  NOTES_ENCRE.forEach(function(n){
    var b = n.boite;
    if(wx + wr < b.x || wx - wr > b.x + b.w || wy + wr < b.y || wy - wr > b.y + b.h || S.encreFinie[n.id]) return;
    var x = n.vis.getContext('2d');

/* ======================================================================
   Glisser et zoomer (un seul transform sur la couche)

var Z = {z:.5, tx:0, ty:0, zMin:.3, zMax:2.4};

  if(r && r.width) BARRE = Math.max(0, window.innerWidth - r.left) + 6; if(rb && rb.height) BAS = Math.max(0, window.innerHeight - rb.top) + 4;
  var g = q('#grille'); HAUT = g && !g.hidden ? g.getBoundingClientRect().bottom + 8 : 0; }
function dims(){ var r = table.getBoundingClientRect(); return {w:r.width, h:r.height}; }

var raf = 0;
function poser(){ raf = 0; couche.style.transform = 'translate3d(' + Math.round(Z.tx * 10) / 10 + 'px,' + Math.round(Z.ty * 10) / 10 + 'px,0) scale(' + Math.round(Z.z * 10000) / 10000 + ')'; }

var tNet = 0;

function gestes(){

/* ======================================================================
   Toucher le plan : lire un nom, ouvrir une note codée…
   ====================================================================== */
var NOMS_SIGNES = {etoile:'une étoile', lune:'une lune', oeil:'un œil', gueule:'une gueule de crapaud'};
function dans(p, x, y, w, h){ return p.x >= x - w / 2 && p.x <= x + w / 2 && p.y >= y - h / 2 && p.y <= y + h / 2; }
function toucherPlan(p){
  var coinOk = !!S.codes['page:dechiree'];
  if(!coinOk && U.dansPoly(PS.bordCoin, p.x, p.y)){ conte('Un morceau du plan a été arraché… Où peut-il bien se cacher ?'); return; }
  for(var i = 0; i < P.notes.length; i++){
    var n = P.notes[i];
    if(n.type === 'code'){
      var t = 12 * PS.K1, lw = Math.max.apply(null, n.lignes.map(function(m){ return PS.largeurCode(m, t); })) + 40, hh = (n.lignes.length - 1) * t * 1.45 + t + 40;
      if(dans(p, n.x, n.y, Math.max(lw, 110), Math.max(hh, 90))){ PG.son('page'); loupe(n); return; }
    } else if(n.type === 'encre' && S.encreFinie[n.id] && dans(p, n.x, n.y, 300, 80)){ conte('L’encre invisible dit : « ' + n.lignes.join(' ') + ' ».'); return; }
    else if(n.type === 'coin' && coinOk && dans(p, n.x, n.y, 300, 70)){ conte('Une note à l’encre rouge : « ' + n.lignes.join(' ') + ' »'); return; }
  }
  if(dans(p, P.titre.x, P.titre.y + 15, 380, 110)){ conte('« ' + P.titre.t + ' », ' + P.titre.sous + '.'); return; }
  for(var k = 0; k < P.signes.length; k++){
    var sg = P.signes[k];
    if(Math.hypot(p.x - sg.x, p.y - sg.y) < Math.max(26, sg.t * .9)){ conte(sg.porte ? 'Sur cette porte, un signe gravé : ' + NOMS_SIGNES[sg.s] + '.' : 'Pas de nom ici, juste un signe : ' + NOMS_SIGNES[sg.s] + '.'); return; }
  }
  var id = C.lieuEn(p.x, p.y);
  if(id === 'galerie' || (!id && U.dansPoly(U.contourTrait(U.lissePts(C.VIEUX), 50), p.x, p.y))){ conte('C’est écrit : « La grande galerie ». Sur ce vieux plan, elle va jusqu’à la grotte de givre.'); return; }
  if(id){
    var nom = P.noms.filter(function(m){ return m.lieu === id && (!m.coin || coinOk); })[0];
    if(nom){ conte('C’est écrit : « ' + nom.l.join(' ').replace(/\s+/g, ' ') + ' ».'); return; }
    var sg2 = P.signes.filter(function(m){ return m.lieu === id && !m.porte; })[0];
    if(sg2){ conte('Pas de nom ici, juste un signe : ' + NOMS_SIGNES[sg2.s] + '.'); return; }
    if(id === 'egouts'){ conte('Un couloir qui tourne, qui tourne… Les Fondateurs aimaient les détours.'); return; }
    if(id === 'dalles'){ conte('Un couloir pavé de dalles claires et sombres. Un petit crâne rouge… et une note codée, juste à côté.'); return; }
    if(id === 'porte4' && coinOk){ conte('Une grande porte ronde, avec quatre signes gravés.' + (S.codes['porte:odette'] ? ' Odette est juste derrière.' : '')); return; }
  }
}

    '<div class="loupe-msg"></div>';

  var reponse = n.lignes.join('').replace(/ /g, '').split(''), saisie = [];
  if(S.lues[n.id]) saisie = reponse.slice();
  function maj(){
    qa('[data-case]', f).forEach(function(b){ var i = +b.getAttribute('data-case'); b.textContent = saisie[i] || ''; });
    qa('.loupe-l', f).forEach(function(b){ b.classList.toggle('choisi', +b.getAttribute('data-i') === sel && !S.lues[n.id]); });
  }
  function verifier(){
    var m = q('.loupe-msg', f);
    if(saisie.filter(Boolean).length < reponse.length){ m.innerHTML = ''; return; }
    if(saisie.join('') === reponse.join('')){
      S.lues[n.id] = true; garder(); majTraductions(); PG.son('ok');
      m.innerHTML = PG.bulle('Bravo ! Le message dit : « ' + n.dit + ' ».');
      conte('Déchiffré : « ' + n.dit + ' ». Le crayon l’a noté sur le plan.');
    } else { PG.son('ko'); m.innerHTML = PG.bulle('Hmm… ça ne veut rien dire. Regarde encore la grille.', 'ko'); }
  }
  f.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b || S.lues[n.id]) return;
    if(b.classList.contains('loupe-l')){ sel = +b.getAttribute('data-i'); PG.son('tic'); maj(); return; }
    if(b.hasAttribute('data-l')){
      var l = b.getAttribute('data-l'); PG.son('tic');
      if(!l){ saisie[sel] = ''; maj(); q('.loupe-msg', f).innerHTML = ''; return; }
      saisie[sel] = l; if(sel < reponse.length - 1) sel++; maj(); verifier();
    }
  });
  maj();
}

/* ======================================================================
   Le Grand Livre et ses pages blanches
   ====================================================================== */
function nbPages(){ return 3 + (S.codes['page:blanche'] ? 1 : 0); }
function pagesLibres(){ var n = 0; for(var i = 1; i <= nbPages(); i++) if(!S.pages[i]) n++; return n; }
function majBadge(){ var b = q('#b-livre .badge'); if(b) b.textContent = pagesLibres(); }
function livre(guide){
  var html = '<div class="titre"><h2>📖 Le Grand Livre</h2></div>' +
    dit('Chaque page blanche peut garder un sort de sauvegarde. Le Pisteur le tape quand l’équipe est au calme, jamais pendant un combat.', 'livre-expl') +
    '<div class="pages">';
  for(var i = 1; i <= nbPages(); i++){
    var id = 'sauve:' + i, nom = i === 4 ? 'La page trouvée' : 'Page n° ' + i;
    if(S.pages[i]) html += '<button type="button" class="page ecrite" data-voir="' + i + '"><b>Sort de sauvegarde</b><small>' + nom + '</small>' + PG.codeGrand(id) + '</button>';
    else html += '<button type="button" class="page blanche" data-page="' + i + '"><b>Page blanche</b><small>' + nom + '</small><i aria-hidden="true">✦</i></button>';
  }
  html += '</div>';
  /* le carnet de l'aventurier (trouvé par le Pisteur à l'entrée du donjon) : une page par monstre */
  var betes = monstresEtudies();                        /* (tout le carnet dès qu'il est là : Romain, 11 novembre) */
  html += '<div class="livre-betes"><h3>📓 Le vieux carnet</h3>' +
    (betes.length ? '<div class="betes">' + betes.map(function(m){ return '<button type="button" class="bete-vignette" data-bete="' + m + '"><img src="' + PORTRAITS + m + '.webp" alt="" loading="lazy"><b>' + esc(DD.MONSTRES[m].nom) + '</b></button>'; }).join('') + '</div>'
      : dit('Pas encore de carnet. On raconte qu’un aventurier a laissé le sien à l’entrée du donjon… Si le Pisteur le trouve, il te montrera un code.')) + '</div>';
  if(S.codes['porte:odette']) html += '<div class="livre-note">' + dit('Noté de ta main : Odette est vivante, derrière la porte aux quatre signes.') + '</div>';
  var w = PG.fenetre(html, {classe:'livre parch'}), f = w.el;
  if(guide) PG.guider(f.querySelector('[data-page="' + guide + '"]'));
  f.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-page')){ PG.son('page'); var n = +b.getAttribute('data-page'); w.fermer(); utiliser(n); }
    else if(b.hasAttribute('data-voir')){ PG.son('page'); var n2 = +b.getAttribute('data-voir'); w.fermer(); voirPage(n2, false); }
    else if(b.hasAttribute('data-bete')){ PG.son('page'); var m = b.getAttribute('data-bete'); w.fermer(); pageMonstre(m, false); }
  });
}

/* ======================================================================
   Les monstres étudiés (Romain, 10 et 11 novembre) : « le code, il le tape sur sa tablette, et là il voit apparaître l'image
   de l'ennemi ». Pas d'énigmes à questions : le journal d'un aventurier (son récit, ses déboires), et des monstres « dessinés
   à la main, comme dans un carnet ». Les pages sont dans moteur/src/donnees.js (D.LIVRE) ; les croquis dans pages/portraits/
   (fabriqués par pages/croquis/seuls.py puis croquis.py, à partir des monstres du bestiaire).
   ====================================================================== */
var PORTRAITS = /donjon-sage\.html/.test(location.pathname) ? 'pages/portraits/' : 'i/portrait-';
/* Romain, 11 novembre (8 h 45) : « qu'il y ait toutes les pages débloquées dès le début », sans pages collées. Dès que le Sage
   a le carnet, il le feuillette en entier ; un code d'étude l'ouvre tout droit à la page du monstre. (Sans le carnet, seules
   les pages ouvertes par un code d'étude sont là.) */
function monstresEtudies(){ return Object.keys(DD.LIVRE).filter(function(m){ return !!S.codes['carnet:aventurier'] || !!S.codes['etude:' + m]; }); }
/* la page d'un monstre : le croquis de l'aventurier et son récit (un 🔊 par paragraphe). Pas de titres, pas de questions. */
function pageMonstre(m, nouveau){
  var M = DD.MONSTRES[m], L = DD.LIVRE[m] || [];
  var html = '<div class="titre"><h2>' + esc(M.nom) + '</h2>' + PG.lireBtn(M.nom) + '</div>' +
    '<div class="bete-page"><div class="bete-img"><img src="' + PORTRAITS + m + '.webp" alt=""><small>Carnet d’un aventurier</small></div>' +
    '<div class="bete-recit">' +
      (nouveau ? dit('Le carnet s’ouvre à la bonne page : c’est bien ce monstre-là. L’aventurier raconte ce qui lui est arrivé. À toi de voir ce que ça vous apprend.', 'bete-intro') : '') +
      L.map(function(t){ return '<div class="recit">' + dit(t) + '</div>'; }).join('') +
    '</div></div>' +
    '<div class="rangee"><button type="button" class="aller" data-fen-fermer>' + (nouveau ? 'C’est noté' : 'Refermer la page') + '</button></div>';
  var w = PG.fenetre(html, {classe:'bete-fen parch', surFermer:nouveau ? null : function(){ livre(); }});
  if(nouveau){ PG.son('page'); PG.guider(w.el.querySelector('.aller')); }
  return w;
}
function utiliser(n){
  PG.confirmer({titre:'Utiliser cette page ?', texte:'Le sort ne s’écrit qu’une fois. Le Pisteur tapera son code quand l’équipe sera hors combat.', oui:'Oui, j’écris le sort', non:'Non'}).then(function(oui){
    if(!oui){ livre(); return; }
    S.pages[n] = true; garder(); majBadge();
    voirPage(n, true);
  });
}
function voirPage(n, ecrire){
  var id = 'sauve:' + n;
  var html = '<div class="grande-page' + (ecrire ? ' ecrit' : '') + '">' +
    '<div class="tache" aria-hidden="true"></div>' +
    '<div class="runes-vol" aria-hidden="true">' + ['ᚱ', 'ᛟ', 'ᚨ', 'ᛉ', 'ᚷ', 'ᛞ'].map(function(r, i){ return '<i style="--i:' + i + '">' + r + '</i>'; }).join('') + '</div>' +
    '<h2>Sort de sauvegarde</h2><p class="num">' + (n === 4 ? 'La page trouvée' : 'Page n° ' + n) + '</p>' + PG.codeGrand(id) +
    dit('Montre ce code au Pisteur. Il le tape quand l’équipe est hors combat, et le Grand Livre se souvient de tout.', 'page-expl') +
    '<div class="rangee"><button type="button" class="aller" data-fen-fermer>C’est noté</button></div></div>';
  var w = PG.fenetre(html, {classe:'page-fen parch', surFermer:function(){ livre(); }});
  if(ecrire){ PG.son('magie'); var r = w.el.getBoundingClientRect(); PG.etincelles(w.el, r.width / 2, r.height * .45, 26, {dist:150, duree:1200}); }
  PG.guider(w.el.querySelector('.aller'));
}

/* ======================================================================
   Les codes (pour le Sage) et leurs petites scènes
   ====================================================================== */
function unCode(){
  PG.pave({tablette:'sage', titre:'📥 Un code', texte:'Le Pisteur a trouvé quelque chose pour toi ? Tape les trois symboles qu’il te montre.',
    deja:function(id){ return !!S.codes[id]; },
    recevoir:function(id){ S.codes[id] = true; garder(); scene(id); }});
}
function scene(id){
  if(id.indexOf('etude:') === 0){
    var m = id.slice(6);
    pageMonstre(m, true);
    conte('Le carnet de l’aventurier, à la page : ' + DD.MONSTRES[m].nom + '. Tu la retrouveras dans ton Grand Livre.');
  } else if(id === 'carnet:aventurier'){
    /* le carnet trouvé à l'entrée du donjon : il entre dans le Grand Livre */
    var wc = PG.fenetre('<div class="titre"><h2>📓 Un vieux carnet</h2></div>' +
      dit('Un vieux carnet, trouvé à l’entrée du donjon. Quelqu’un est passé par ici avant vous : un aventurier, qui a tout noté.') +
      dit('Chaque monstre qu’il a croisé a sa page. Tu peux le feuilleter quand tu veux, dans ton Grand Livre.') +
      '<div class="rangee"><button type="button" class="aller" data-fen-fermer>Je le garde</button></div>', {classe:'scene parch'});
    PG.son('page'); PG.guider(wc.el.querySelector('.aller'));
    conte('Le carnet de l’aventurier est rangé dans ton Grand Livre. Feuillette-le : chaque monstre y a sa page.');
  } else if(id === 'rune:lumiere'){
    var wr = PG.fenetre('<div class="titre"><h2>✨ La rune de lumière</h2>' + PG.lireBtn('La rune de lumière') + '</div>' + '<div class="scene-img rune-img" aria-hidden="true"><i>ᛉ</i></div>' +
      dit('Le Pisteur l’a trouvée parmi les éboulis : une pierre gravée, tiède comme un petit soleil. Promène-la sur ton plan : elle réveille l’encre que les Fondateurs ont cachée.', 'scene-txt') +
      '<div class="rangee"><button type="button" class="aller" data-fen-fermer>Prendre la rune</button></div>', {classe:'scene parch', surFermer:function(){
        majRune(true); mesurerBords(); PG.guider(runeEl);
        conte('Ta rune de lumière est là, en bas. Promène-la doucement sur le vieux papier…');
      }});
    PG.guider(wr.el.querySelector('.aller'));
  } else if(id === 'page:dechiree'){
    var w = PG.fenetre('<div class="titre"><h2>📜 La page déchirée</h2></div>' + '<div class="scene-img dechiree" aria-hidden="true"><i></i></div>' +
      dit('Le Pisteur a trouvé le morceau perdu de ton plan, dans la bibliothèque engloutie. Les bords se recollent tout seuls…', 'scene-txt') +
      '<div class="rangee"><button type="button" class="aller" data-fen-fermer>Recoller le morceau</button></div>', {classe:'scene parch', surFermer:function(){
        majCoin(true); majOdette(); majBadge();
        setTimeout(function(){ centrerSur(2200, 1220, Math.max(zoomFit() * 1.6, .7)); }, 200);
        conte('Le grand bassin… et une note à l’encre rouge, sur Bourbe !');
      }});
    PG.guider(w.el.querySelector('.aller'));
  } else if(id === 'page:blanche'){
    majBadge();
    var w2 = PG.fenetre('<div class="titre"><h2>✨ Une page blanche</h2></div>' + '<div class="scene-img blanche" aria-hidden="true"><i></i></div>' +
      dit('Le Pisteur l’a trouvée en fouillant. Elle se glisse dans ton Grand Livre : une sauvegarde de plus !', 'scene-txt') +
      '<div class="rangee"><button type="button" class="aller" data-ouvrir>Ouvrir le Grand Livre</button></div>', {classe:'scene parch'});
    w2.el.querySelector('[data-ouvrir]').addEventListener('click', function(){ PG.son('page'); w2.fermer(); livre(4); });
    PG.guider(w2.el.querySelector('.aller'));
  } else if(id === 'porte:odette'){
    majOdette();
    var w3 = PG.fenetre('<div class="titre"><h2>🗝️ La porte aux quatre signes</h2>' + PG.lireBtn('La porte aux quatre signes', 'clair') + '</div>' +
      '<div class="odette"><div class="porte" aria-hidden="true">' + portePierre() + '<div class="moustache">' + chat() + '</div></div>' +
      '<div class="odette-txt">' +
        dit('Moustache gratte le bas de la grande porte, et il miaule.', 'l1 sur-nuit') +
        '<div class="voix l2">' + dit('« Moustache ? Mon gros gris, c’est toi ? »', 'sur-nuit') + '</div>' +
        '<div class="voix l3">' + dit('« Oh, mon tout doux… Je suis là. Je suis là. »', 'sur-nuit') + '</div>' +
        dit('C’est la voix d’Odette ! Elle est vivante, juste derrière la porte. Mais la porte ne s’ouvre pas.', 'l4 sur-nuit') +
      '</div></div>' +
      '<div class="rangee"><button type="button" class="aller" data-fen-fermer>Le noter dans le Grand Livre</button></div>', {classe:'scene sombre-fen'});
    PG.guider(w3.el.querySelector('.aller'));
    conte('Odette est vivante, derrière la porte aux quatre signes. Ton Grand Livre l’a noté.');
  }
}
function portePierre(){
  var s = '<svg viewBox="0 0 200 200" width="200" height="200"><defs><radialGradient id="pp" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#7a7090"/><stop offset="1" stop-color="#3a3250"/></radialGradient>' +
    '<radialGradient id="pl" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>' +
    '<rect x="0" y="0" width="200" height="200" fill="#1a1426"/>';
  for(var i = 0; i < 6; i++) for(var j = 0; j < 6; j++) s += '<rect x="' + (j * 34 - (i % 2) * 17) + '" y="' + (i * 34) + '" width="32" height="32" rx="3" fill="#2a2238" stroke="#120c1a" stroke-width="2"/>';
  s += '<circle cx="100" cy="104" r="80" fill="#000" opacity=".4"/><circle cx="100" cy="100" r="80" fill="url(#pp)" stroke="#24182e" stroke-width="5"/><circle cx="100" cy="100" r="64" fill="none" stroke="#3a3250" stroke-width="3"/>' +
    '<path d="M36 100 H164 M100 36 V164" stroke="#3a3250" stroke-width="3"/>';
  var c = '#bff9ff';
  s += '<g transform="translate(70 70) scale(1.6)"><path d="' + C.SIGNES.oeil + '" fill="none" stroke="' + c + '" stroke-width="2"/></g>' +
    '<g transform="translate(130 70)"><path d="M-12 -4 H12 Q 12 12 0 12 Q -12 12 -12 -4 Z M-5 -9 q2 -4 0 -8 M4 -9 q2 -4 0 -8" fill="none" stroke="' + c + '" stroke-width="3" stroke-linecap="round"/></g>' +
    '<g transform="translate(70 130)"><path d="M-10 -12 Q -13 9 0 12 Q 13 9 10 -12 M-4 -6 V9 M4 -6 V9" fill="none" stroke="' + c + '" stroke-width="3" stroke-linecap="round"/></g>' +
    '<g transform="translate(130 130) scale(1.6)"><path d="' + C.SIGNES.etoile + '" fill="none" stroke="' + c + '" stroke-width="2"/></g>';
  s += '<rect x="40" y="186" width="120" height="14" fill="url(#pl)"/></svg>';
  return s;
}
function chat(){
  return '<svg viewBox="0 0 120 100" width="120" height="100"><g stroke="#24182e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">' +
    '<path d="M14 88 C 6 70 18 44 44 42 C 66 40 82 52 84 72 L 86 88 Z" fill="#8a8a96"/>' +
    '<path d="M24 60 q8 -6 14 0 M28 72 q8 -6 14 0" fill="none" stroke="#5a5a66" stroke-width="2.5"/>' +
    '<path d="M14 84 C 0 80 -2 60 8 56" fill="none" stroke="#8a8a96" stroke-width="7"/>' +
    '<circle cx="80" cy="44" r="18" fill="#9a9aa6"/><path d="M66 34 L 64 18 L 76 28 Z M88 28 L 98 18 L 96 34 Z" fill="#9a9aa6"/>' +
    '<g class="patte"><path d="M84 62 C 96 56 106 52 110 40" fill="none" stroke="#8a8a96" stroke-width="9"/><circle cx="110" cy="38" r="6" fill="#9a9aa6"/></g>' +
    '</g><circle cx="74" cy="44" r="2.4" fill="#24182e"/><circle cx="86" cy="44" r="2.4" fill="#24182e"/><path d="M78 50 l2 2 l2 -2" fill="none" stroke="#24182e" stroke-width="1.6"/></svg>';
}

/* ======================================================================
   La grille de l'alphabet secret (la carte posée sur la table)
   ====================================================================== */
function majGrille(){
  var g = q('#grille'), b = q('#b-grille');
  g.hidden = !S.grille; b.classList.toggle('on', !!S.grille);
}

/* ======================================================================
   Le départ
   ====================================================================== */
function recommencer(){
  PG.confirmer({titre:'Recommencer une partie ?', texte:'Tout ce qui est sur cette tablette sera effacé : les pages écrites, l’encre révélée et les codes reçus.', oui:'Oui, on recommence', non:'Non'}).then(function(oui){
    if(!oui) return;
    mem.effacer(); S = neuf(); location.reload();
  });
}
function demarrer(){
  S = mem.lire(null); if(!S || S.v !== 1) S = neuf();
  if(S.grille === null) S.grille = window.innerWidth >= 900;
  PG.orientation();
  table = q('#table'); couche = q('#couche'); runeEl = q('#rune'); curseur = q('#curseur'); bulleEl = q('#bulle');
  q('#grille .cle').innerHTML = PS.cle();
  window.SAGE = {monstre:pageMonstre, etat:function(){ return S; }, zoom:function(){ return {z:Z.z, tx:Z.tx, ty:Z.ty, fit:zoomFit(), pv:PV}; }, reveler:reveler, notes:NOTES_ENCRE, versMonde:versMonde, zoomer:zoomer, centrerSur:centrerSur};
  construirePlan();
  majGrille();
  mesurerBords();
  Z.z = zoomFit(); borner(); poser();
  gestes(); rune(); majRune(false);
  majBadge(); majGrille();
  q('#b-livre').addEventListener('click', function(){ PG.son('page'); livre(); });
  q('#b-code').addEventListener('click', function(){ PG.son('tic'); unCode(); });
  q('#b-grille').addEventListener('click', function(){ PG.son('tic'); S.grille = !S.grille; garder(); majGrille(); mesurerBords(); borner(); poser(); });
  q('#b-plus').addEventListener('click', function(){ var d = dims(); zoomer(Z.z * 1.45, (d.w - BARRE) / 2, (d.h - BAS) / 2, true); });
  q('#b-moins').addEventListener('click', function(){ var d = dims(); zoomer(Z.z / 1.45, (d.w - BARRE) / 2, (d.h - BAS) / 2, true); });
  q('#b-nouveau').addEventListener('click', recommencer);
  window.addEventListener('resize', function(){ mesurerBords(); var f0 = zoomFit(); if(Z.z < f0) Z.z = f0; Z.zMin = Math.min(.3, f0); borner(); poser(); });
  Z.zMin = Math.min(.3, zoomFit());
  if(S.debut && !S.codes['rune:lumiere']){ conte('Le vieux plan des Fondateurs ! Il glisse sous ton doigt, et il s’approche à deux doigts. Ils y ont laissé des notes, dans leur drôle d’alphabet…'); S.debut = false; garder(); }
  else conte('Le plan des Fondateurs t’attend. Le Grand Livre aussi.');
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer); else demarrer();
})();

</script>
