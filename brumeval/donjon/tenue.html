body.pret #sc{opacity:1}

<script>

/* ===== ../heros-vues/src/hv-base.js ===== */
/* ==========================================================
   Les héros « en volume » — 1 sur 5 : LES OUTILS (Romain, 23 novembre : « comme avec Mimi le chat, mais plus joli,
   avec plus de transition entre le moment où elle est tournée à 90 degrés et le moment où elle est de face »).

   L'IDÉE (la même que pour Mimi, mimi-vues.js) : le héros n'est pas une image qu'on retourne ni des dessins faits à part.
   C'est UN SEUL pantin, décrit en volume, et son dessin est RECALCULÉ pour l'angle voulu. Donc autant de vues qu'on veut
   entre la face et le profil, et toutes se tiennent entre elles.

   COMMENT UN VOLUME EST DÉCRIT
   - Un volume (la tête, la chevelure, le buste…) est une pile de « coupes » : à chaque hauteur y, sa tranche vue de dessus.
     Une coupe = {a : la demi-largeur, zm : là où elle est la plus large (z : vers le nez), cf : l'épaisseur vers l'avant,
     cb : vers l'arrière, pf / pb : sa rondeur (2 : un ovale ; plus grand : plus carrée)}.
   - On regarde toujours à l'horizontale ; le héros tourne sur lui-même d'un angle psi (0 : de face ; 90 : de profil, il regarde
     à droite ; -90 : à gauche ; 180 : de dos). Un point (x, z) du héros tombe à l'écran en X = x·cos(psi) + z·sin(psi).
   - Le contour d'un volume : à chaque hauteur, son bord gauche et son bord droit (bords()). C'est exact, pas une image écrasée.
   - Ce qui est dessiné SUR un volume (les yeux, la frange, la boucle de ceinture…) est donné comme on le voit de face, puis
     « posé » sur le volume (leve()) : en tournant, il glisse, se resserre, puis passe derrière le bord.
   Les mesures sont celles des héros d'aujourd'hui (persos.js) : cadre 300 × 440, le sol à y = 414, le trait #24182e.
   ========================================================== */
(function(G){

/* jusqu'où va la coupe dans la direction (dx, dz) */
function appui(S, dx, dz){ return S.zm * dz + (dz >= 0 ? N(S.a * dx, S.cf * dz, S.qf) : N(S.a * dx, S.cb * dz, S.qb)); }
/* une vue : l'angle psi (degrés) */

     de profil (0), elle redevient ronde (l'œil s'enroule sur le côté). On passe de l'un à l'autre en douceur : c'est la triche

    if(cache(vol.a(P[i][1], V.w), P[i][0], V)){ if(run.length > 1) R.push(run); run = []; }
    else run.push(P[i]);

  var L = [], y;
  for(y = y0; y <= y1; y++) L.push(f(y));
  var vol = {y0:y0, y1:y1, L:L};
  /* la coupe à la hauteur y ; w (0 … 1, V.w) : la part de « carrure » gardée (1 : celle du volume ; 0 : toute ronde) */

    var k = borne(y - y0, 0, y1 - y0), i = Math.min(L.length - 2, Math.floor(k)), t = k - i, A = L[i], B = L[i + 1] || A;

/* ==========================================================
   Les héros « en volume » — 3 sur 5 : LES CHEVEUX.
   La chevelure est un volume posé autour de la tête (HV.COIFFE), un peu plus gros qu'elle. Une coiffure dit :
   - zone : jusqu'où les cheveux descendent sur le tour de la tête, à chaque hauteur (la ligne des cheveux : le front, la tempe,
     le tour de l'oreille, la nuque) ;
   - frange : le bord de la frange, comme on le voit de face (le même tracé que dans persos.js), posé sur le volume ;
   - meches : des mèches libres, données dans l'espace (devant l'oreille, sur l'épaule…) ;
   - queue : une queue de cheval, une chaîne de points dans l'espace (elle suit la tête avec un peu de retard) ;
   - fils : les séparations des mèches (de face, et sur le côté et l'arrière de la tête).
   À chaque vue on dessine deux masses : celle de derrière (tout le volume des cheveux, avant le visage) et celle de devant
   (la calotte qu'on voit + la frange + les mèches, après le visage).

/* ---------- Une jambe : où sont ses os ----------

   P.pointeG / pointeD (degrés) : 0, le pied à plat ; 50, sur la pointe (le talon levé) ; 90, les orteils repliés sous un genou à terre.

/* son dessin : la cuisse, puis la botte d'un seul tenant (le genou, le mollet, la cheville, le talon, le pied) */

     botte ») : jambe droite, la botte monte jusqu'au genou et le couvre (comme avant) ; jambe pliée, elle s'arrête sous le genou,

      PC('M' + Q(0.74, 12.2) + ' L ' + Q(0.74, -12.2) + ' L ' + Q(0.84, -11.8) + ' L ' + Q(0.84, 11.8) + ' Z', '#4a2a14', 1.3);
    if(Math.abs(V.c) > 0.25) s += '<rect x="-3.8" y="-4.4" width="7.6" height="8.8" rx="1.6" fill="' + K.u('or') + '" stroke="' + O + '" stroke-width="1.1" transform="translate(' + Q(0.79, -cote * 3.5 * V.c) + ') rotate(' + f1(Math.atan2(uy, ux) / RAD - 90) + ')"/>';

      couture('M' + f1(kc[0] - 9) + ' ' + f1(kc[1] + 6) + ' Q ' + f1(kc[0]) + ' ' + f1(kc[1] + 9) + ' ' + f1(kc[0] + 9) + ' ' + f1(kc[1] + 6), 0.5);

/* ---------- Le carquois : en travers du dos, il dépasse derrière SON épaule gauche ; il suit la poitrine ---------- */

/* ==========================================================
   HV.corps(K, h, V, P) → les morceaux, à ranger par le pantin : {derriere, jambes, cou(…), torse, devant, tete…}
   P : la pose (hv-pantin.js, HV.POSES.repos en donne toutes les clés).

HV.corps = function(K, h, V, P){
  P = P || {};

function Pw(d, f, w, x){ return '<path d="' + d + '" fill="' + f + '" stroke="' + O + '" stroke-width="' + w + '" stroke-linejoin="round" stroke-linecap="round"' + (x || '') + '/>'; }
/* une variante d'équipement, cachée au départ */
function V(nom, contenu){ return '<g data-eq="' + nom + '" style="display:none">' + contenu + '</g>'; }
/* un petit hasard qui donne toujours la même suite (les dessins restent les mêmes d'une fois sur l'autre) */
function graine(s){ return function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
/* un croissant de lune : le disque (cx, cy, R) moins le disque (cx + ox, cy + oy, r) */
function croissant(cx, cy, R, ox, oy, r){
  var d = Math.hypot(ox, oy) || 1, a = (R * R - r * r + d * d) / (2 * d), h = Math.sqrt(Math.max(0, R * R - a * a));
  var ux = ox / d, uy = oy / d, px = cx + a * ux, py = cy + a * uy;
  var i1 = [px - h * uy, py + h * ux], i2 = [px + h * uy, py - h * ux];
  return 'M' + r1(i1[0]) + ' ' + r1(i1[1]) + ' A ' + R + ' ' + R + ' 0 1 1 ' + r1(i2[0]) + ' ' + r1(i2[1]) + ' A ' + r + ' ' + r + ' 0 ' + (d < a ? 1 : 0) + ' 0 ' + r1(i1[0]) + ' ' + r1(i1[1]) + ' Z';
}
function coeurD(x, y, r){
  return 'M' + r1(x) + ' ' + r1(y + r) + ' C ' + r1(x - r * 1.7) + ' ' + r1(y - r * .1) + ' ' + r1(x - r * .95) + ' ' + r1(y - r * 1.45) + ' ' + r1(x) + ' ' + r1(y - r * .45) +
    ' C ' + r1(x + r * .95) + ' ' + r1(y - r * 1.45) + ' ' + r1(x + r * 1.7) + ' ' + r1(y - r * .1) + ' ' + r1(x) + ' ' + r1(y + r) + ' Z';
}
/* une étoile à 4 branches (scintillement fixe, dessiné) */
function eclat4(x, y, r, c){ return F('M' + x + ' ' + (y - r) + ' Q ' + (x + r * .16) + ' ' + (y - r * .16) + ' ' + (x + r) + ' ' + y + ' Q ' + (x + r * .16) + ' ' + (y + r * .16) + ' ' + x + ' ' + (y + r) + ' Q ' + (x - r * .16) + ' ' + (y + r * .16) + ' ' + (x - r) + ' ' + y + ' Q ' + (x - r * .16) + ' ' + (y - r * .16) + ' ' + x + ' ' + (y - r) + ' Z', c); }

/* ============ les calques des réactions (posés à la demande dans une pièce) ============ */
/* les normales d'une ligne de points (vers le « haut » quand la ligne va de gauche à droite) */
function normales(p){
  return p.map(function(q, i){ var a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dy / l, -dx / l]; });
}
/* une ligne de points plus serrée (chaque segment coupé en n) */
function affiner(p, n){ var r = []; for(var i = 0; i < p.length - 1; i++) for(var k = 0; k < n; k++) r.push(lerp(p[i], p[i + 1], k / n)); r.push(p[p.length - 1]); return r; }
/* une croûte de givre posée sur une ligne : piquants dessus, glaçons dessous */
function croute(pts, ep, s){
  var R = graine(s || 7), p = affiner(pts, 3), n = normales(p), haut = [], bas = [], glac = '', i;
  for(i = 0; i < p.length; i++){
    var pic = i % 2 ? ep * (.5 + R() * .5) : ep * (.05 + R() * .15);
    haut.push([p[i][0] + n[i][0] * (ep * .45 + pic), p[i][1] + n[i][1] * (ep * .45 + pic)]);
    bas.unshift([p[i][0] - n[i][0] * ep * (.5 + R() * .2), p[i][1] - n[i][1] * ep * (.5 + R() * .2)]);
  }
  for(i = 1; i < p.length - 1; i += 2 + (R() < .5 ? 1 : 0)){
    var l = ep * (.9 + R() * 1.3), b0 = [p[i][0] - n[i][0] * ep * .5, p[i][1] - n[i][1] * ep * .5];
    glac += 'M' + r1(b0[0] - 2.2) + ' ' + r1(b0[1]) + ' L ' + r1(b0[0] - n[i][0] * l) + ' ' + r1(b0[1] - n[i][1] * l) + ' L ' + r1(b0[0] + 2.2) + ' ' + r1(b0[1]) + ' Z ';
  }
  var forme = 'M' + haut.concat(bas).map(function(q){ return r1(q[0]) + ' ' + r1(q[1]); }).join(' L ') + ' Z';
  var reflet = 'M' + haut.slice(1, -1).map(function(q, k){ var j = k + 1; return r1(q[0] - n[j][0] * ep * .45) + ' ' + r1(q[1] - n[j][1] * ep * .45); }).join(' L ');
  return Pw(glac, '#dff6ff', 1.4) + Pw(forme, '#e8f8ff', 1.8) + F(forme, '#bfe8ff', ' opacity=".35"') + L(reflet, '#ffffff', 1.4, ' opacity=".9"');
}
/* le givre d'un héros (calques : épaules, capuche, bras proche), en unités du dessin */
function givreDessin(role){
  var ep = role === 'sage' ? [[90, 99], [102, 93.5], [116, 90], [130, 89.5], [143, 91.5], [154, 97.5], [160, 104]] : [[78, 101], [90, 106], [104, 110], [120, 111], [135, 108.5], [149, 103.5], [162, 97]];
  var tete = [[92, 8], [101, 4], [113, -1], [126, -1.5], [139, 1.5], [150, 9], [157, 21], [161, 34]];
  var s = croute(ep, 7, 11) + eclat4(ep[1][0], ep[1][1] - 12, 4, '#ffffff') + eclat4(ep[5][0] + 2, ep[5][1] - 11, 3.4, '#ffffff');
  return {epaules:s + '<circle cx="' + ep[3][0] + '" cy="' + (ep[3][1] - 2) + '" r="3" fill="#ffffff" opacity=".8"/>',
    tete:croute(tete, 6.5, 23) + eclat4(118, -10, 4.6, '#ffffff') + eclat4(152, 4, 3.2, '#e8f8ff'),
    bras:croute([[97, 112], [101, 105.5], [108, 102.5], [115, 104.5], [119, 110.5]], 6, 31)};

/* une coulée de bave gluante sur une ligne : bourrelets dessus, gouttes qui pendent dessous ; renvoie aussi le bout des gouttes */
function coulee(pts, ep, s, nGouttes){
  var R = graine(s || 5), p = affiner(pts, 2), n = normales(p), haut = [], bas = [], gouttes = [], i;
  for(i = 0; i < p.length; i++){
    var b = ep * (.35 + R() * .45);
    haut.push([p[i][0] + n[i][0] * b, p[i][1] + n[i][1] * b]);
    bas.push([p[i][0] - n[i][0] * ep * (.45 + R() * .25), p[i][1] - n[i][1] * ep * (.45 + R() * .25)]);
  }
  /* des gouttes qui pendent : on les insère dans le bord du dessous */
  var bord = [], pas = Math.max(2, Math.floor(p.length / (nGouttes || 3)));
  for(i = 0; i < bas.length; i++){

/* un gant ouvert (doigts écartés), au repos les doigts pointent vers le bas */
function gantOuvert(d, x, y, c){
  var s = '';
  [[-26, 10], [-6, 12.5], [14, 11.5], [32, 9]].forEach(function(f){ s += '<g transform="rotate(' + f[0] + ' ' + x + ' ' + y + ')">' + seg(x, y + 4, y + 4 + f[1], 5, 4.2, d.gh(c)) + '</g>'; });
  s += '<g transform="rotate(-78 ' + x + ' ' + y + ')">' + seg(x, y + 2, y + 12, 5.6, 4.6, d.gh(c)) + '</g>';
  return s + main(d, x, y, 8.5, c);
}
/* une fiole tenue droite au-dessus du poing (hx, hy) ; id pour changer sa couleur */
function fioleTenue(d, hx, hy, id, coul, k){
  k = k || 1;
  var t = function(p){ return T(p.replace(/(-?\d+(?:\.\d+)?)/g, function(v){ return +v * k; }), hx, hy); };
  d.defs.push('<radialGradient id="' + id + 'h"><stop offset="0" stop-color="#fff6c0" stop-opacity=".9"/><stop offset=".4" stop-color="' + coul + '" stop-opacity=".55"/><stop offset="1" stop-color="' + coul + '" stop-opacity="0"/></radialGradient>');
  return '<g data-fiole="' + id + '">' +
    '<circle data-halo cx="' + hx + '" cy="' + (hy - 20 * k) + '" r="' + (30 * k) + '" fill="url(#' + id + 'h)" opacity=".7"/>' +
    P(t('M-6 -38 L 6 -38 L 6 -30 C 18 -26 20 -10 10 -4 C 4 0 -4 0 -10 -4 C -20 -10 -18 -26 -6 -30 Z'), '#dff4ff', ' fill-opacity=".38"') +

    '<g data-bulles></g>' +
    L(t('M-10 -26 Q -8 -31 -2 -32'), '#fff', 2.4 * k, ' opacity=".85"') + C(hx + 8 * k, hy - 12 * k, 1.6 * k, '#fff', ' opacity=".6"') +

}

/* ============ le Barde (Romain, 19 novembre, 12 h 36 : « la tenue de combat du barde […] tu as mon go ») ============
   Pour la fenêtre de sa tenue de combat (jeu/src/descente.js, tenue.html) : il n'entre pas (encore) dans le donjon, il n'a donc ni
   arme ni geste de combat — seulement sa garde, sa joie, sa course. Sa tenue, cousue par Mélusine : un pourpoint rouge à galons d'or,
   un gilet de cuir, une petite cape, un chapeau à plume ; son luth en bandoulière dans le dos, et son tambourin à la main.
   Pas de capuche : ses cheveux se voient sous le chapeau (dessous : la même coiffure que dans l'écran de création). */
function chapeau(d, cx, cy, feutre, or, plume){
  /* la plume, derrière (elle part de la couronne vers l'arrière) */
  var s = P(T('M-10 -50 C -30 -74 -60 -78 -76 -64 C -60 -66 -40 -62 -24 -48 Z', cx, cy), d.g(plume)) +
    L(T('M-12 -50 C -32 -68 -54 -72 -70 -66', cx, cy), sombre(plume, .35), 1.6) +
    L(T('M-30 -62 L -34 -68 M-42 -66 L -46 -72 M-54 -68 L -57 -74 M-30 -60 L -32 -54 M-44 -64 L -46 -58', cx, cy), clair(plume, .5), 1.4, ' opacity=".85"');   /* (T décale chaque paire : jamais de « l » relatif) */
  /* la couronne, le bord (un peu penché), le galon */
  s += P(T('M-26 -34 C -28 -50 -16 -62 2 -62 C 20 -62 28 -50 26 -34 Z', cx, cy), d.g(feutre)) +
    L(T('M-24 -40 C -10 -44 10 -44 26 -40', cx, cy), O, 7) + L(T('M-24 -40 C -10 -44 10 -44 26 -40', cx, cy), or, 4) +
    P(T('M-46 -30 C -30 -40 30 -42 48 -30 C 34 -22 -32 -20 -46 -30 Z', cx, cy), d.g(sombre(feutre, .15))) +
    L(T('M-40 -30 C -22 -36 26 -37 42 -30', cx, cy), clair(feutre, .35), 1.4, ' opacity=".6"') +
    C(cx - 6, cy - 42, 3.4, or, ' stroke="' + O + '" stroke-width="1.6"');
  return s;
}
/* les cheveux du dessus de la tête et de l'arrière (sous le chapeau : la capuche les cachait chez les autres héros) */
function cheveuxBarde(d, cx, cy, ch){
  return P(T('M30 -26 C 22 -44 -20 -48 -36 -28 C -46 -14 -44 10 -34 28 L -20 26 C -26 6 -26 -12 -16 -20 C 0 -30 18 -30 30 -24 Z', cx, cy), d.g(ch[1])) +
